blueprint:
  name: Passion Wave Rotaryknob - Dynamic Targets
  description: >
    Lets Home Assistant show all available media_player and light entities as
    normal pickers, then writes the selected targets into the persistent
    Rotaryknob ESPHome text entities. Use a Music Assistant capable media
    player if playlist, radio or podcast browsing should be available. The
    automation also relays the selected media player's state, title, artist and
    cover URL to the device so the UI can reflect dynamic media targets.
  domain: automation
  source_url: https://github.com/Passion-Wave/Passion-Wave-rotaryknob/blob/main/home_assistant/blueprints/automation/passion_wave/rotaryknob_device_defaults.yaml
  author: Passion Wave
  homeassistant:
    min_version: "2024.10.0"
  input:
    knob_device:
      name: Rotaryknob device
      description: Select the ESPHome device created by the Passion Wave Rotaryknob firmware.
      selector:
        device:
          integration: esphome
    media_target:
      name: Media target
      description: >
        Home Assistant automatically lists all media_player entities. Select
        the player that the Rotaryknob should control. For playlists, radio and
        podcasts, choose a player that Music Assistant can control.
      selector:
        entity:
          domain: media_player
    light_slot_1:
      name: Light slot 1
      description: Home Assistant automatically lists all light entities.
      selector:
        entity:
          domain: light
    light_slot_2:
      name: Light slot 2
      description: Home Assistant automatically lists all light entities.
      selector:
        entity:
          domain: light
    light_slot_3:
      name: Light slot 3
      description: Home Assistant automatically lists all light entities.
      selector:
        entity:
          domain: light
    light_slot_4:
      name: Light slot 4
      description: Home Assistant automatically lists all light entities.
      selector:
        entity:
          domain: light

mode: restart

triggers:
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  - trigger: state
    entity_id: !input media_target

variables:
  knob_device: !input knob_device
  media_target: !input media_target
  light_slot_1: !input light_slot_1
  light_slot_2: !input light_slot_2
  light_slot_3: !input light_slot_3
  light_slot_4: !input light_slot_4
  knob_entities: "{{ device_entities(knob_device) }}"
  media_entity_text: "{{ knob_entities | select('search', 'media_entity_id') | list | first | default('', true) }}"
  media_label_text: "{{ knob_entities | select('search', 'media_label') | list | first | default('', true) }}"
  media_runtime_state_text: "{{ knob_entities | select('search', 'media_runtime_state') | list | first | default('', true) }}"
  media_runtime_title_text: "{{ knob_entities | select('search', 'media_runtime_title') | list | first | default('', true) }}"
  media_runtime_artist_text: "{{ knob_entities | select('search', 'media_runtime_artist') | list | first | default('', true) }}"
  media_runtime_cover_url_text: "{{ knob_entities | select('search', 'media_runtime_cover_url') | list | first | default('', true) }}"
  light_slot_1_entity_text: "{{ knob_entities | select('search', 'light_slot_1_entity_id') | list | first | default('', true) }}"
  light_slot_1_label_text: "{{ knob_entities | select('search', 'light_slot_1_label') | list | first | default('', true) }}"
  light_slot_2_entity_text: "{{ knob_entities | select('search', 'light_slot_2_entity_id') | list | first | default('', true) }}"
  light_slot_2_label_text: "{{ knob_entities | select('search', 'light_slot_2_label') | list | first | default('', true) }}"
  light_slot_3_entity_text: "{{ knob_entities | select('search', 'light_slot_3_entity_id') | list | first | default('', true) }}"
  light_slot_3_label_text: "{{ knob_entities | select('search', 'light_slot_3_label') | list | first | default('', true) }}"
  light_slot_4_entity_text: "{{ knob_entities | select('search', 'light_slot_4_entity_id') | list | first | default('', true) }}"
  light_slot_4_label_text: "{{ knob_entities | select('search', 'light_slot_4_label') | list | first | default('', true) }}"
  media_label: "{{ state_attr(media_target, 'friendly_name') or media_target }}"
  light_slot_1_label: "{{ state_attr(light_slot_1, 'friendly_name') or light_slot_1 }}"
  light_slot_2_label: "{{ state_attr(light_slot_2, 'friendly_name') or light_slot_2 }}"
  light_slot_3_label: "{{ state_attr(light_slot_3, 'friendly_name') or light_slot_3 }}"
  light_slot_4_label: "{{ state_attr(light_slot_4, 'friendly_name') or light_slot_4 }}"
  media_runtime_state: "{{ states(media_target)[:32] }}"
  media_runtime_title: "{{ (state_attr(media_target, 'media_title') or '')[:160] }}"
  media_runtime_artist: "{{ (state_attr(media_target, 'media_artist') or state_attr(media_target, 'media_album_artist') or '')[:160] }}"
  media_runtime_cover_url: "{{ (state_attr(media_target, 'entity_picture') or state_attr(media_target, 'entity_picture_local') or state_attr(media_target, 'media_image_url') or '')[:255] }}"

actions:
  - if:
      - condition: template
        value_template: "{{ media_entity_text != '' }}"
    then:
      - action: text.set_value
        target:
          entity_id: "{{ media_entity_text }}"
        data:
          value: "{{ media_target }}"
  - if:
      - condition: template
        value_template: "{{ media_label_text != '' }}"
    then:
      - action: text.set_value
        target:
          entity_id: "{{ media_label_text }}"
        data:
          value: "{{ media_label }}"
  - if:
      - condition: template
        value_template: "{{ media_runtime_state_text != '' }}"
    then:
      - action: text.set_value
        target:
          entity_id: "{{ media_runtime_state_text }}"
        data:
          value: "{{ media_runtime_state }}"
  - if:
      - condition: template
        value_template: "{{ media_runtime_title_text != '' }}"
    then:
      - action: text.set_value
        target:
          entity_id: "{{ media_runtime_title_text }}"
        data:
          value: "{{ media_runtime_title }}"
  - if:
      - condition: template
        value_template: "{{ media_runtime_artist_text != '' }}"
    then:
      - action: text.set_value
        target:
          entity_id: "{{ media_runtime_artist_text }}"
        data:
          value: "{{ media_runtime_artist }}"
  - if:
      - condition: template
        value_template: "{{ media_runtime_cover_url_text != '' }}"
    then:
      - action: text.set_value
        target:
          entity_id: "{{ media_runtime_cover_url_text }}"
        data:
          value: "{{ media_runtime_cover_url }}"
  - if:
      - condition: template
        value_template: "{{ light_slot_1_entity_text != '' }}"
    then:
      - action: text.set_value
        target:
          entity_id: "{{ light_slot_1_entity_text }}"
        data:
          value: "{{ light_slot_1 }}"
  - if:
      - condition: template
        value_template: "{{ light_slot_1_label_text != '' }}"
    then:
      - action: text.set_value
        target:
          entity_id: "{{ light_slot_1_label_text }}"
        data:
          value: "{{ light_slot_1_label }}"
  - if:
      - condition: template
        value_template: "{{ light_slot_2_entity_text != '' }}"
    then:
      - action: text.set_value
        target:
          entity_id: "{{ light_slot_2_entity_text }}"
        data:
          value: "{{ light_slot_2 }}"
  - if:
      - condition: template
        value_template: "{{ light_slot_2_label_text != '' }}"
    then:
      - action: text.set_value
        target:
          entity_id: "{{ light_slot_2_label_text }}"
        data:
          value: "{{ light_slot_2_label }}"
  - if:
      - condition: template
        value_template: "{{ light_slot_3_entity_text != '' }}"
    then:
      - action: text.set_value
        target:
          entity_id: "{{ light_slot_3_entity_text }}"
        data:
          value: "{{ light_slot_3 }}"
  - if:
      - condition: template
        value_template: "{{ light_slot_3_label_text != '' }}"
    then:
      - action: text.set_value
        target:
          entity_id: "{{ light_slot_3_label_text }}"
        data:
          value: "{{ light_slot_3_label }}"
  - if:
      - condition: template
        value_template: "{{ light_slot_4_entity_text != '' }}"
    then:
      - action: text.set_value
        target:
          entity_id: "{{ light_slot_4_entity_text }}"
        data:
          value: "{{ light_slot_4 }}"
  - if:
      - condition: template
        value_template: "{{ light_slot_4_label_text != '' }}"
    then:
      - action: text.set_value
        target:
          entity_id: "{{ light_slot_4_label_text }}"
        data:
          value: "{{ light_slot_4_label }}"
