name: Bug report
description: Report a reproducible Passion Wave firmware, installer, or integration problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Browser installer
        - ESP32-S3 display and controls
        - ESP32 Home Assistant bridge
        - Home Assistant integration
        - Website or documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Passion Wave version
      placeholder: "For example: 2.1.1"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Add relevant logs, browser/OS, Home Assistant version, and screenshots. Remove passwords, keys, addresses, and other private data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, encryption keys, tokens, private IP addresses, and personal data.
          required: true
