name: Public dual-MCU firmware

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/esphome/esphome:2026.7.0
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked secrets
        run: test ! -e esphome/secrets.yaml
      - name: Validate, compile and assemble public release
        env:
          ESPHOME_COMMAND: esphome
        run: tools/build-public-release.sh release/public
      - uses: actions/upload-artifact@v4
        with:
          name: passion-wave-dual-mcu-factory
          path: release/public/
          if-no-files-found: error
