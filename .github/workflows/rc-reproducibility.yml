name: RC two-runner reproducibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-repro-${{ github.sha }}
  cancel-in-progress: false

jobs:
  clean-build:
    name: Clean build ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require RC source
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$' VERSION
      - name: Fingerprint tracked firmware inputs
        id: firmware-inputs
        run: >-
          echo "hash=$(git ls-files -s -- esphome custom_components assets tools VERSION |
          git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .esphome
            .esphome_cache
          key: rc-platformio-${{ runner.os }}-linux-amd64-a018bf33-${{ steps.firmware-inputs.outputs.hash }}
          restore-keys: rc-platformio-${{ runner.os }}-linux-amd64-a018bf33-
      - name: Build from clean OID with deterministic epoch
        run: |
          test ! -e esphome/.esphome
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            CCACHE_DISABLE=1 tools/build-public-release.sh "${{ runner.temp }}/public"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rc-clean-${{ matrix.run }}
          path: ${{ runner.temp }}/public/
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: clean-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rc-clean-a
          path: a
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rc-clean-b
          path: b
      - name: Require 4/4 bit-identical payloads
        run: |
          cmp a/SHA256SUMS b/SHA256SUMS
          cmp a/sbom.cdx.json b/sbom.cdx.json
          (cd a && sha256sum -c SHA256SUMS)
          (cd b && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("a/build-metadata.json").read_text())
          b = json.loads(Path("b/build-metadata.json").read_text())
          assert a["source_oid"] == b["source_oid"]
          assert a["source_dirty"] is False and b["source_dirty"] is False
          assert a["source_date_epoch"] == b["source_date_epoch"]
          assert a["toolchain"] == b["toolchain"]
          assert a["artifacts"] == b["artifacts"]
          PY
