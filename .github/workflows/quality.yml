name: Firmware and integration quality

on:
  pull_request:
    paths:
      - "**/*.md"
      - "AGENTS.md"
      - "custom_components/**"
      - "tests/**"
      - "esphome/**"
      - "assets/**"
      - "tools/**"
      - "VERSION"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "esphome/**"
      - "assets/**"
      - "tools/**"
      - "VERSION"

permissions:
  contents: read

concurrency:
  group: firmware-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git --redact --no-banner
      - run: python3 tools/validate-docs-local.py
      - run: tools/test-release-atomicity.sh
      - run: tools/test-example-secrets-fixture.sh
      - run: tools/test-workflow-cache-keys.sh
      - run: tools/test-cold-cache-scheduling.sh
      - run: tools/test-esphome-cache-contract.sh
      - run: tools/test-public-source-date-epoch.sh
      - name: Fingerprint tracked firmware inputs
        id: firmware-inputs
        run: >-
          echo "hash=$(git ls-files -s -- esphome custom_components assets tools VERSION |
          git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .esphome
            .esphome_cache
          key: esphome-fast-${{ runner.os }}-linux-amd64-a018bf33-${{ steps.firmware-inputs.outputs.hash }}
          restore-keys: esphome-fast-${{ runner.os }}-linux-amd64-a018bf33-
      - name: Run affected code gate; skip docs-only changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then BASE_SHA="HEAD^"; fi
          if git diff --quiet "${BASE_SHA}" HEAD -- custom_components tests esphome assets tools VERSION .github/workflows; then
            echo "Docs-only change: no ESPHome compile required."
            exit 0
          fi
          tools/fast-check.sh --scope all --log-dir .release-pipeline/logs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: firmware-fast-failure-${{ github.sha }}
          path: .release-pipeline/logs/
          if-no-files-found: ignore
          retention-days: 7
