  # The production actions already use this direct HA service -> subscribed
  # state path. Measuring the request button itself avoids adding an
  # automation that the real light/media path does not contain.
  - platform: homeassistant
    id: latency_request_state
    entity_id: ${latency_request_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!id(latency_probe_pending)) return;
            const uint32_t elapsed_us =
              micros() - id(latency_probe_started_us);
            const uint32_t sequence = id(latency_probe_sequence);
            id(latency_probe_pending) = false;
            dual_mcu::link.send_pair_u32(
              dual_mcu::MessageType::LATENCY_RESULT, sequence, elapsed_us, 0);
            id(bridge_latency_ha_roundtrip_sensor).publish_state(
              elapsed_us / 1000.0f);

