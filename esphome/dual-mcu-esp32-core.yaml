button:
  - platform: template
    name: "Ping S3"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(last_ping_token) = millis();
          dual_mcu::link.send_u32(dual_mcu::MessageType::PING, id(last_ping_token));

  - platform: template
    name: "Reset Encoder Counters"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(esp32_ec2_count) = 0;
          id(received_s3_ec1_count) = 0;
          id(s3_reported_ec2_count) = 0;
          dual_mcu::link.reset_stats();
          id(esp32_encoder_count_sensor).publish_state(0);
          id(s3_encoder_count_sensor).publish_state(0);
          id(encoder_difference_sensor).publish_state(0);
          dual_mcu::link.send(dual_mcu::MessageType::RESET_COUNTERS);

script:
  - id: confirm_bridge_play_ready
    mode: single
    then:
      - lambda: |-
          if (!id(bridge_play_pending)) return;
          const uint32_t elapsed_us =
            micros() - id(bridge_play_started_us);
          const uint8_t response[] = {
            id(bridge_play_pending_kind),
            static_cast<uint8_t>(id(bridge_play_pending_index) & 0xFF),
            static_cast<uint8_t>((id(bridge_play_pending_index) >> 8) & 0xFF),
            0,
          };
          id(bridge_play_pending) = false;
          dual_mcu::link.send(
            dual_mcu::MessageType::MEDIA_LIBRARY_PLAY_RESULT,
            response, sizeof(response));
          id(bridge_ma_player_ready_latency_sensor).publish_state(
            elapsed_us / 1000.0f);

  - id: run_latency_ha_probe
    mode: single
    then:
      - homeassistant.service:
          service: input_button.press
          data:
            entity_id: ${latency_request_entity}

  - id: send_bridge_wled_presets
    mode: restart
    then:
      - lambda: |-
          id(bridge_wled_preset_generation)++;
          const uint8_t generation = id(bridge_wled_preset_generation);
          const auto &options = id(bridge_wled_preset_options);
          const size_t count = std::min(
            options.size(), static_cast<size_t>(dual_mcu::WLED_PRESET_MAX_ITEMS));
          uint8_t selected = 0xFF;
          for (size_t index = 0; index < count; index++) {
            dual_mcu::link.send_wled_preset_item(
              0, generation, static_cast<uint8_t>(index), options[index]);
            if (options[index] == id(bridge_wled_preset_selected_name))
              selected = static_cast<uint8_t>(index);
          }
          dual_mcu::link.send_wled_preset_meta(
            0, generation, static_cast<uint8_t>(count), selected);

  - id: cache_bridge_library
    mode: queued
    parameters:
      kind: int
      payload: string
    then:
      - lambda: |-
          if (kind < 1 || kind > 3 || payload.size() > 12288) return;
          DynamicJsonDocument doc(12288);
          if (deserializeJson(doc, payload)) {
            id(bridge_library_proxy_status).publish_state("JSON-Fehler");
            return;
          }
          JsonArray items = doc.as<JsonArray>();
          if (items.isNull()) items = doc["items"].as<JsonArray>();
          if (items.isNull()) items = doc["playlists"].as<JsonArray>();
          if (items.isNull()) {
            id(bridge_library_proxy_status).publish_state("Liste fehlt");
            return;
          }
          std::vector<dual_mcu::LibraryEntry> entries;
          entries.reserve(std::min<size_t>(items.size(), dual_mcu::LIBRARY_MAX_ENTRIES));
          const char *fallback_type = kind == 1 ? "playlist" : kind == 2 ? "radio" : "podcast";
          int fallback_index = 1;
          for (JsonObject item : items) {
            if (entries.size() >= dual_mcu::LIBRARY_MAX_ENTRIES) break;
            dual_mcu::LibraryEntry entry;
            const char *name = item["name"] | item["title"] | "";
            const char *uri = item["uri"] | item["id"] | item["url"] | "";
            const char *item_id = item["item_id"] | item["playlist_item_id"] | "";
            const char *media_type = item["media_type"] | item["type"] | fallback_type;
            entry.name = name == nullptr || name[0] == '\0'
              ? std::string("Eintrag ") + std::to_string(fallback_index) : name;
            entry.uri = uri == nullptr ? "" : uri;
            entry.item_id = item_id == nullptr ? "" : item_id;
            entry.media_type = media_type == nullptr || media_type[0] == '\0'
              ? fallback_type : media_type;
            entries.push_back(std::move(entry));
            fallback_index++;
          }
          const auto library_kind = static_cast<dual_mcu::LibraryKind>(kind);
          if (!dual_mcu::library_server.set(library_kind, entries)) {
            id(bridge_library_proxy_status).publish_state("Cache zu groß");
            return;
          }
          if (kind == static_cast<int>(dual_mcu::LibraryKind::PLAYLISTS)) {
            // The retained compact list is available immediately after a
            // cold boot. Expose it as a complete page as well, so the S3 does
            // not need to wait for a fresh HA service call before showing the
            // playlist picker.
            dual_mcu::library_server.set_page(
              dual_mcu::LibraryKind::PLAYLIST_PAGE, entries, 0,
              static_cast<uint16_t>(entries.size()), false);
          }
          id(bridge_library_proxy_status).publish_state(
            std::string("Cache ") + std::to_string(kind) + ": " +
            std::to_string(entries.size()) + " Einträge");
          const uint8_t changed[] = {static_cast<uint8_t>(kind)};
          dual_mcu::link.send(dual_mcu::MessageType::LIBRARY_CHANGED,
                              changed, sizeof(changed));
          if (kind == static_cast<int>(dual_mcu::LibraryKind::PLAYLISTS)) {
            const uint8_t page_changed[] = {
              static_cast<uint8_t>(dual_mcu::LibraryKind::PLAYLIST_PAGE)};
            dual_mcu::link.send(dual_mcu::MessageType::LIBRARY_CHANGED,
                                page_changed, sizeof(page_changed));
          }

  - id: cache_bridge_library_page
    mode: queued
    parameters:
      kind: int
      payload: string
    then:
      - lambda: |-
          if ((kind != 4 && kind != 5) || payload.size() > 12288) return;
          DynamicJsonDocument doc(12288);
          if (deserializeJson(doc, payload) || !doc.is<JsonObject>()) {
            id(bridge_library_proxy_status).publish_state("Paging JSON-Fehler");
            return;
          }
          const std::string request_id = doc["request_id"] | "";
          if (request_id.empty()) return;
          if (kind == 5) {
            if (id(bridge_pending_track_request_id).empty() ||
                request_id != id(bridge_pending_track_request_id)) {
              id(bridge_library_proxy_status).publish_state(
                "Veraltete Titelliste verworfen");
              return;
            }
          } else if (request_id.rfind("${s3_device_name}", 0) != 0) {
            return;
          }
          JsonArray items = kind == 4 ? doc["items"].as<JsonArray>()
                                      : doc["tracks"].as<JsonArray>();
          if (items.isNull() && kind == 4) items = doc["playlists"].as<JsonArray>();
          if (items.isNull() && kind == 5) items = doc["items"].as<JsonArray>();
          if (items.isNull()) {
            id(bridge_library_proxy_status).publish_state("Paging Liste fehlt");
            return;
          }
          const int raw_offset = doc["offset"] | 0;
          const int raw_total = doc["total"] | 0;
          if (raw_offset < 0 || raw_offset > 65535 || raw_total < 0) return;
          std::vector<dual_mcu::LibraryEntry> entries;
          entries.reserve(std::min<size_t>(items.size(), dual_mcu::LIBRARY_MAX_ENTRIES));
          int fallback_index = raw_offset + 1;
          for (JsonObject item : items) {
            if (entries.size() >= dual_mcu::LIBRARY_MAX_ENTRIES) break;
            dual_mcu::LibraryEntry entry;
            const char *name = item["name"] | item["title"] | "";
            const char *uri = item["uri"] | item["id"] | item["url"] | "";
            entry.name = name == nullptr || name[0] == '\0'
              ? std::string(kind == 4 ? "Eintrag " : "Titel ") +
                  std::to_string(fallback_index) : name;
            entry.uri = uri == nullptr ? "" : uri;
            if (kind == 4) {
              const char *item_id = item["item_id"] | item["playlist_item_id"] | "";
              const char *media_type = item["media_type"] | item["type"] | "playlist";
              entry.item_id = item_id == nullptr ? "" : item_id;
              entry.media_type = media_type == nullptr || media_type[0] == '\0'
                ? "playlist" : media_type;
            } else {
              const char *artist = item["artist"] | "";
              entry.item_id = artist == nullptr ? "" : artist;
              entry.media_type = "track";
            }
            entries.push_back(std::move(entry));
            fallback_index++;
          }
          const bool has_more = doc["has_more"] | false;
          const uint16_t total = static_cast<uint16_t>(
            std::min(raw_total, 65535));
          const auto library_kind = static_cast<dual_mcu::LibraryKind>(kind);
          if (!dual_mcu::library_server.set_page(
                library_kind, entries, static_cast<uint16_t>(raw_offset),
                total, has_more,
                kind == 5 ? id(bridge_pending_track_generation) : 0)) {
            id(bridge_library_proxy_status).publish_state("Paging Reihenfolge ungültig");
            return;
          }
          if (kind == 5) id(bridge_pending_track_request_id).clear();
          // The S3 asks for the compact legacy playlist list first during
          // boot. Music Assistant now supplies the same data as page kind 4.
          // Mirror page zero into kind 1 so the initial request cannot starve
          // the newer paged request indefinitely.
          if (kind == 4 && raw_offset == 0) {
            if (!dual_mcu::library_server.set(
                  dual_mcu::LibraryKind::PLAYLISTS, entries)) {
              id(bridge_library_proxy_status).publish_state(
                "Playlist-Bootstrap zu groß");
              return;
            }
          }
          id(bridge_library_proxy_status).publish_state(
            std::string(kind == 4 ? "Playlist-Seite " : "Track-Seite ") +
            std::to_string(raw_offset) + ": " +
            std::to_string(entries.size()) + " Einträge");
          const uint8_t changed[] = {static_cast<uint8_t>(kind)};
          dual_mcu::link.send(dual_mcu::MessageType::LIBRARY_CHANGED,
                              changed, sizeof(changed));
          if (kind == 4 && raw_offset == 0) {
            const uint8_t bootstrap_changed[] = {
              static_cast<uint8_t>(dual_mcu::LibraryKind::PLAYLISTS)};
            dual_mcu::link.send(dual_mcu::MessageType::LIBRARY_CHANGED,
                                bootstrap_changed,
                                sizeof(bootstrap_changed));
          }

  - id: resolve_bridge_media_cover_url
    mode: restart
    then:
      - lambda: |-
          auto tune_proxy = [](std::string url) -> std::string {
            if (url.find("/imageproxy") == std::string::npos) return url;
            auto set_query_value = [](std::string &target,
                                      const std::string &key,
                                      const std::string &value) {
              const std::string needle = key + "=";
              const size_t query = target.find('?');
              size_t pos = query == std::string::npos
                ? std::string::npos : target.find(needle, query + 1);
              if (pos == std::string::npos) {
                target += target.find('?') == std::string::npos ? "?" : "&";
                target += needle + value;
                return;
              }
              const size_t start = pos + needle.size();
              size_t end = target.find('&', start);
              if (end == std::string::npos) end = target.size();
              target.replace(start, end - start, value);
            };
            set_query_value(url, "size", "256");
            set_query_value(url, "fmt", "jpg");
            return url;
          };
          auto normalize = [&](const std::string &picture) -> std::string {
            if (picture.empty() || picture == "unknown" ||
                picture == "unavailable") return "";
            std::string url;
            if (picture.rfind("http://", 0) == 0 ||
                picture.rfind("https://", 0) == 0) {
              url = picture;
            } else if (picture[0] == '/') {
              url = std::string("${ha_base_url}") + picture;
            } else {
              url = std::string("${ha_base_url}/") + picture;
            }
            url = tune_proxy(url);
            return url.size() <= dual_mcu::MEDIA_COVER_URL_MAX_LENGTH
              ? url : "";
          };

          std::string source = id(bridge_media_entity_picture);
          if (source.empty()) source = id(bridge_media_entity_picture_local);
          if (source.empty()) source = id(bridge_media_image_url);
          const std::string resolved = normalize(source);
          if (resolved == id(bridge_media_cover_url)) return;
          id(bridge_media_cover_url) = resolved;
          if (dual_mcu::cover_url_sender.queue(resolved)) {
            id(bridge_media_cover_proxy_status).publish_state(
              resolved.empty() ? "Sende leeres Cover" : "Übertragung läuft");
          } else {
            id(bridge_media_cover_proxy_status).publish_state("URL zu lang");
          }

  - id: fetch_bridge_forecast
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(bridge_api_connected);'
          then:
            - script.stop: fetch_bridge_forecast
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${ha_weather}
            type: daily
          capture_response: true
          on_success:
            - lambda: |-
                JsonObjectConst root = response["response"].as<JsonObjectConst>();
                if (root.isNull()) root = response["service_response"].as<JsonObjectConst>();
                if (root.isNull()) root = response;
                JsonObjectConst weather = root["${ha_weather}"].as<JsonObjectConst>();
                if (weather.isNull() && root.containsKey("forecast")) weather = root;
                JsonArrayConst forecasts = weather["forecast"].as<JsonArrayConst>();
                if (forecasts.isNull() || forecasts.size() == 0) return;

                auto read_float = [](JsonVariantConst value, float fallback) -> float {
                  if (value.isNull()) return fallback;
                  if (value.is<float>() || value.is<double>() || value.is<int>()) return value.as<float>();
                  const char *text = value.as<const char *>();
                  if (text == nullptr || text[0] == '\0') return fallback;
                  char *end = nullptr;
                  const float parsed = strtof(text, &end);
                  return end != text ? parsed : fallback;
                };

                auto &state = dual_mcu::bridge_forecast_cache;
                state.daily_valid_mask = 0;
                std::string condition_diagnostics;
                const size_t count = std::min<size_t>(5, forecasts.size());
                for (size_t index = 0; index < count; index++) {
                  JsonObjectConst forecast = forecasts[index].as<JsonObjectConst>();
                  const float minimum = read_float(forecast["templow"], -10.0f);
                  const float maximum = read_float(forecast["temperature"], 40.0f);
                  const char *condition = forecast["condition"].as<const char *>();
                  state.daily_min_tenths[index] = static_cast<int16_t>(
                    std::clamp(static_cast<int>(lroundf(minimum * 10.0f)), -32768, 32767));
                  state.daily_max_tenths[index] = static_cast<int16_t>(
                    std::clamp(static_cast<int>(lroundf(maximum * 10.0f)), -32768, 32767));
                  const std::string condition_value = condition == nullptr ? "" : condition;
                  state.daily_condition[index] = dual_mcu::weather_condition_code(condition_value);
                  if (state.daily_condition[index] ==
                      static_cast<uint8_t>(dual_mcu::WeatherCondition::UNKNOWN)) {
                    ESP_LOGW("dual_mcu_forecast", "Unbekannter Tages-Forecast[%u]: '%s'",
                             static_cast<unsigned>(index), condition_value.c_str());
                  }
                  if (!condition_diagnostics.empty()) condition_diagnostics += " | ";
                  condition_diagnostics += std::to_string(index);
                  condition_diagnostics += ":";
                  condition_diagnostics += condition_value.empty() ? "unknown" : condition_value;
                  state.daily_valid_mask |= static_cast<uint8_t>(1U << index);
                  if (index == 0) {
                    float probability = read_float(forecast["precipitation_probability"], -1.0f);
                    if (probability < 0.0f) {
                      probability = read_float(forecast["precipitation"], 0.0f) > 0.01f ? 80.0f : 0.0f;
                    }
                    state.precipitation_probability = static_cast<uint8_t>(
                      std::clamp(static_cast<int>(lroundf(probability)), 0, 100));
                  }
                }
                id(bridge_daily_forecast_text).publish_state(condition_diagnostics);
                ESP_LOGI("dual_mcu_forecast", "Tageszustände: %s", condition_diagnostics.c_str());
                dual_mcu::link.send_weather_forecast(state);
            - script.execute: fetch_bridge_hourly_forecast
          on_error:
            - script.execute: fetch_bridge_hourly_forecast

  - id: fetch_bridge_hourly_forecast
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(bridge_api_connected);'
          then:
            - script.stop: fetch_bridge_hourly_forecast
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${ha_weather}
            type: hourly
          capture_response: true
          on_success:
            - lambda: |-
                auto now = id(bridge_time).now();
                if (!now.is_valid()) return;
                JsonObjectConst root = response["response"].as<JsonObjectConst>();
                if (root.isNull()) root = response["service_response"].as<JsonObjectConst>();
                if (root.isNull()) root = response;
                JsonObjectConst weather = root["${ha_weather}"].as<JsonObjectConst>();
                if (weather.isNull() && root.containsKey("forecast")) weather = root;
                JsonArrayConst forecasts = weather["forecast"].as<JsonArrayConst>();
                if (forecasts.isNull() || forecasts.size() == 0) return;

                auto read_float = [](JsonVariantConst value, float fallback) -> float {
                  if (value.isNull()) return fallback;
                  if (value.is<float>() || value.is<double>() || value.is<int>()) return value.as<float>();
                  const char *text = value.as<const char *>();
                  if (text == nullptr || text[0] == '\0') return fallback;
                  char *end = nullptr;
                  const float parsed = strtof(text, &end);
                  return end != text ? parsed : fallback;
                };
                auto forecast_epoch = [](const char *datetime) -> time_t {
                  if (datetime == nullptr || datetime[0] == '\0') return static_cast<time_t>(0);
                  int year = 0, month = 0, day = 0, hour = 0, minute = 0;
                  if (sscanf(datetime, "%d-%d-%dT%d:%d", &year, &month, &day, &hour, &minute) != 5) {
                    return static_cast<time_t>(0);
                  }
                  struct tm value = {};
                  value.tm_year = year - 1900;
                  value.tm_mon = month - 1;
                  value.tm_mday = day;
                  value.tm_hour = hour;
                  value.tm_min = minute;
                  value.tm_isdst = -1;
                  return mktime(&value);
                };
                auto normalized_condition = [](const std::string &condition, float probability,
                                               float precipitation) -> std::string {
                  if (condition == "lightning" || condition == "lightning-rainy" ||
                      condition == "exceptional") return condition;
                  if (condition == "rainy" || condition == "pouring" || condition == "hail" ||
                      condition == "snowy-rainy" || precipitation > 0.01f || probability >= 55.0f) {
                    return "rainy";
                  }
                  return condition.empty() ? "partlycloudy" : condition;
                };

                auto &state = dual_mcu::bridge_forecast_cache;
                state.hourly_valid_mask = 0;
                const time_t now_epoch = static_cast<time_t>(now.timestamp);
                const time_t day_start = now_epoch - now.hour * 3600 - now.minute * 60 - now.second;
                const time_t targets[4] = {day_start + 8 * 3600, day_start + 13 * 3600,
                                           day_start + 19 * 3600, day_start + 23 * 3600};
                int best_distance[4] = {86400, 86400, 86400, 86400};
                const bool raining_now = id(bridge_weather_condition) == "rainy" ||
                                         id(bridge_weather_condition) == "pouring" ||
                                         id(bridge_weather_condition) == "lightning-rainy" ||
                                         id(bridge_weather_condition) == "hail";
                int eta_minutes = raining_now ? 0 : -1;

                for (JsonObjectConst forecast : forecasts) {
                  const time_t entry_epoch = forecast_epoch(forecast["datetime"].as<const char *>());
                  if (entry_epoch == static_cast<time_t>(0)) continue;
                  const float probability = read_float(forecast["precipitation_probability"], -1.0f);
                  const float precipitation = read_float(forecast["precipitation"], 0.0f);
                  const char *condition_text = forecast["condition"].as<const char *>();
                  const std::string condition = normalized_condition(
                    condition_text == nullptr ? "" : condition_text, probability, precipitation);
                  const float temperature = read_float(forecast["temperature"], 0.0f);
                  for (size_t slot = 0; slot < 4; slot++) {
                    const int distance = static_cast<int>(labs(static_cast<long>(
                      difftime(entry_epoch, targets[slot]))));
                    if (distance < best_distance[slot]) {
                      best_distance[slot] = distance;
                      state.hourly_temperature_tenths[slot] = static_cast<int16_t>(
                        std::clamp(static_cast<int>(lroundf(temperature * 10.0f)), -32768, 32767));
                      state.hourly_condition[slot] = dual_mcu::weather_condition_code(condition);
                      state.hourly_valid_mask |= static_cast<uint8_t>(1U << slot);
                    }
                  }
                  if (!raining_now && eta_minutes < 0) {
                    int minutes = static_cast<int>(lroundf(difftime(entry_epoch, now_epoch) / 60.0f));
                    if (minutes >= -15) {
                      if (minutes < 0) minutes = 0;
                      const bool wet = condition == "rainy" || condition == "pouring" ||
                                       condition == "lightning-rainy" || condition == "hail" ||
                                       precipitation > 0.01f || probability >= 30.0f;
                      if (wet) {
                        eta_minutes = minutes;
                        if (probability >= 0.0f) {
                          state.precipitation_probability = static_cast<uint8_t>(
                            std::clamp(static_cast<int>(lroundf(probability)), 0, 100));
                        }
                      }
                    }
                  }
                }
                state.rain_minutes = static_cast<int16_t>(std::clamp(eta_minutes, -1, 32767));
                dual_mcu::link.send_weather_forecast(state);

  - id: send_bridge_weather_state
    mode: restart
    then:
      - lambda: |-
          dual_mcu::WeatherState weather;
          weather.temperature_valid = id(bridge_weather_temperature_valid);
          weather.humidity_valid = id(bridge_weather_humidity_valid);
          weather.wind_valid = id(bridge_weather_wind_valid);
          weather.precipitation_valid = id(bridge_weather_precipitation_valid);
          weather.temperature_tenths = static_cast<int16_t>(id(bridge_weather_temperature_tenths));
          weather.humidity_pct = static_cast<uint8_t>(id(bridge_weather_humidity_pct));
          weather.wind_tenths = static_cast<uint16_t>(id(bridge_weather_wind_tenths));
