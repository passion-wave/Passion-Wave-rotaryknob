binary_sensor:
  - platform: template
    id: dual_mcu_link_connected
    name: "S3 Link Connected"
    device_class: connectivity
    entity_category: diagnostic

  - platform: template
    id: bridge_s3_external_power_sensor
    name: "S3 External Power via Bridge"
    device_class: plug

  - platform: template
    id: bridge_s3_time_acknowledged
    name: "S3 Time Sync Acknowledged"
    device_class: connectivity
    entity_category: diagnostic

  - platform: homeassistant
    id: bridge_radar_raining_state
    entity_id: binary_sensor.rain_warner_raining
    internal: true
    on_state:
      then:
        - lambda: |-
            id(bridge_radar_raining) = x;
            id(send_bridge_radar_meta).execute();

sensor:
  - platform: template
    id: bridge_s3_battery_percentage_sensor
    name: "S3 Battery Percentage via Bridge"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: bridge_s3_battery_voltage_sensor
    name: "S3 Battery Voltage via Bridge"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: bridge_s3_time_ack_age_sensor
    name: "S3 Time Sync Acknowledgement Age"
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic

  - platform: template
    id: bridge_action_count_sensor
    name: "ESP32 HA Bridge Actions"
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: never
    entity_category: diagnostic

  - platform: template
    id: esp32_encoder_count_sensor
    name: "ESP32 EC2 Encoder Count"
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic

  - platform: template
    id: s3_encoder_count_sensor
    name: "S3 EC1 Encoder Count"
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic

  - platform: template
    id: encoder_difference_sensor
    name: "Encoder Count Difference"
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic

  - platform: template
    id: s3_uptime_sensor
    name: "S3 Uptime"
    unit_of_measurement: s
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    update_interval: never
    entity_category: diagnostic

  - platform: template
    id: link_ping_sensor
    name: "S3 Link Ping"
    unit_of_measurement: ms
    device_class: duration
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    entity_category: diagnostic

  - platform: template
    id: protocol_error_sensor
    name: "UART Protocol Errors"
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: never
    entity_category: diagnostic

  - platform: template
    id: encoder_overflow_sensor
    name: "Encoder Queue Overflows"
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: never
    entity_category: diagnostic

  - platform: wifi_signal
    name: "ESP32 WiFi Signal"
    update_interval: 30s
    entity_category: diagnostic

  - platform: uptime
    name: "ESP32 Uptime"
    update_interval: 30s
    entity_category: diagnostic

  - platform: template
    id: bridge_latency_ha_roundtrip_sensor
    name: "ESP32 HA Latency Round Trip"
    unit_of_measurement: ms
    device_class: duration
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    entity_category: diagnostic

  - platform: template
    id: bridge_ma_service_latency_sensor
    name: "Music Assistant Service Completion"
    unit_of_measurement: ms
    device_class: duration
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    entity_category: diagnostic

  - platform: template
    id: bridge_ma_player_ready_latency_sensor
    name: "Music Assistant Player Ready"
    unit_of_measurement: ms
    device_class: duration
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    entity_category: diagnostic

  - platform: homeassistant
    id: bridge_ha_volume
    entity_id: ${ha_player}
    attribute: volume_level
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            const int confirmed_pct =
              std::clamp(static_cast<int>(lroundf(x * 100.0f)), 0, 100);
            id(bridge_media_volume_pct) = confirmed_pct;
            if (id(volume_command_pending) &&
                confirmed_pct == id(volume_command_target_pct)) {
              const uint32_t sequence = id(volume_command_sequence);
              const uint32_t elapsed_us =
                micros() - id(volume_command_started_us);
              id(volume_command_pending) = false;
              dual_mcu::link.send_pair_u32(
                dual_mcu::MessageType::VOLUME_RESULT,
                sequence, elapsed_us, 0);
            }
            id(send_bridge_media_state).execute();

  - platform: homeassistant
    id: bridge_ha_media_position
    entity_id: ${ha_player}
    attribute: media_position
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            id(bridge_media_position_seconds) = static_cast<uint32_t>(std::max(0.0f, roundf(x)));
            id(send_bridge_media_state).execute();

  - platform: homeassistant
    id: bridge_ha_media_duration
    entity_id: ${ha_player}
    attribute: media_duration
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            id(bridge_media_duration_seconds) = static_cast<uint32_t>(std::max(0.0f, roundf(x)));
            id(send_bridge_media_state).execute();

  - platform: homeassistant
    id: bridge_weather_temperature
    entity_id: ${ha_weather}
    attribute: temperature
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            id(bridge_weather_temperature_tenths) = std::clamp(static_cast<int>(lroundf(x * 10.0f)), -32768, 32767);
            id(bridge_weather_temperature_valid) = true;
            id(send_bridge_weather_state).execute();

  - platform: homeassistant
    id: bridge_weather_humidity
    entity_id: ${ha_weather}
    attribute: humidity
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            id(bridge_weather_humidity_pct) = std::clamp(static_cast<int>(lroundf(x)), 0, 100);
            id(bridge_weather_humidity_valid) = true;
            id(send_bridge_weather_state).execute();

  - platform: homeassistant
    id: bridge_weather_wind
    entity_id: ${ha_weather}
    attribute: wind_speed
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            id(bridge_weather_wind_tenths) = std::clamp(static_cast<int>(lroundf(x * 10.0f)), 0, 65535);
            id(bridge_weather_wind_valid) = true;
            id(send_bridge_weather_state).execute();

  - platform: homeassistant
    id: bridge_weather_precipitation
    entity_id: ${ha_weather}
    attribute: precipitation_probability
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            id(bridge_weather_precipitation_pct) =
              std::clamp(static_cast<int>(lroundf(x)), 0, 100);
            id(bridge_weather_precipitation_valid) = true;
            id(send_bridge_weather_state).execute();

  - platform: homeassistant
    id: bridge_radar_eta
    entity_id: sensor.rain_warner_rain_starts_in
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) {
              id(bridge_radar_eta_valid) = false;
              id(send_bridge_radar_meta).execute();
              return;
            }
            id(bridge_radar_eta_minutes) =
              std::clamp(static_cast<int>(lroundf(x)), 0, 32767);
            id(bridge_radar_eta_valid) = true;
            id(send_bridge_radar_meta).execute();

  - platform: homeassistant
    id: bridge_radar_motion_dr_state
    entity_id: camera.radar_image
    attribute: motion_dr_per_min
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) {
              id(bridge_radar_motion_valid) = false;
              id(send_bridge_radar_meta).execute();
              return;
            }
            id(bridge_radar_motion_dr) = x;
            id(bridge_radar_motion_valid) = true;
            id(send_bridge_radar_meta).execute();

  - platform: homeassistant
    id: bridge_radar_motion_dc_state
    entity_id: camera.radar_image
    attribute: motion_dc_per_min
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) {
              id(bridge_radar_motion_valid) = false;
              id(send_bridge_radar_meta).execute();
              return;
            }
            id(bridge_radar_motion_dc) = x;
            id(bridge_radar_motion_valid) = true;
            id(send_bridge_radar_meta).execute();

  - platform: homeassistant
    id: bridge_radar_motion_speed_state
    entity_id: camera.radar_image
    attribute: motion_speed_kmh
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) {
              id(bridge_radar_motion_speed) = 0.0f;
              id(bridge_radar_motion_valid) = false;
              id(send_bridge_radar_meta).execute();
              return;
            }
            id(bridge_radar_motion_speed) = std::max(0.0f, x);
            id(send_bridge_radar_meta).execute();

  - platform: homeassistant
    id: bridge_light_1_brightness_state
    entity_id: ${light_1_entity}
    attribute: brightness
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            id(bridge_light_1_brightness) = std::clamp(static_cast<int>(lroundf(x * 100.0f / 255.0f)), 0, 100);
            const uint8_t payload[] = {0, static_cast<uint8_t>(id(bridge_light_1_on)), static_cast<uint8_t>(id(bridge_light_1_brightness))};
            dual_mcu::link.send(dual_mcu::MessageType::LIGHT_STATE, payload, sizeof(payload));

  - platform: homeassistant
    id: bridge_light_1_color_temp_state
    entity_id: ${light_1_entity}
    attribute: color_temp_kelvin
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            id(bridge_light_1_color_temp) =
              std::clamp(static_cast<int>(lroundf(x)), 1000, 10000);
            const uint16_t kelvin = static_cast<uint16_t>(id(bridge_light_1_color_temp));
            const uint8_t payload[] = {
              0, 0x01, static_cast<uint8_t>(kelvin & 0xFF),
              static_cast<uint8_t>((kelvin >> 8) & 0xFF), 0, 0, 0};
            dual_mcu::link.send(
              dual_mcu::MessageType::LIGHT_DETAIL_STATE, payload, sizeof(payload));

  - platform: homeassistant
    id: bridge_light_2_brightness_state
    entity_id: ${light_2_entity}
    attribute: brightness
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            id(bridge_light_2_brightness) = std::clamp(static_cast<int>(lroundf(x * 100.0f / 255.0f)), 0, 100);
