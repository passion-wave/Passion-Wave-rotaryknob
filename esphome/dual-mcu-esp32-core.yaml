binary_sensor:
  - platform: template
    id: dual_mcu_link_connected
    name: "S3 Link Connected"
    device_class: connectivity
    entity_category: diagnostic
    disabled_by_default: true

  - platform: template
    id: bridge_s3_external_power_sensor
    name: "S3 External Power via Bridge"
    device_class: plug

  - platform: template
    id: bridge_s3_time_acknowledged
    name: "S3 Time Sync Acknowledged"
    device_class: connectivity
    entity_category: diagnostic
    disabled_by_default: true

  - platform: homeassistant
    id: bridge_radar_raining_state
    entity_id: binary_sensor.rain_warner_raining
    internal: true
    on_state:
      then:
        - lambda: |-
            id(bridge_radar_raining) = x;
            id(send_bridge_radar_meta).execute();

sensor:
  - platform: template
    id: bridge_playlist_cache_entries_sensor
    name: "ESP32 Playlist Cache Entries"
    accuracy_decimals: 0
    update_interval: 2s
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return static_cast<float>(dual_mcu::library_server.lookup_count(
        dual_mcu::LibraryKind::PLAYLIST_PAGE));

  - platform: template
    id: bridge_track_cache_entries_sensor
    name: "ESP32 Track Cache Entries"
    accuracy_decimals: 0
    update_interval: 2s
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return static_cast<float>(dual_mcu::library_server.lookup_count(
        dual_mcu::LibraryKind::PLAYLIST_TRACKS));

  - platform: template
    id: bridge_s3_battery_percentage_sensor
    name: "S3 Battery Percentage via Bridge"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
