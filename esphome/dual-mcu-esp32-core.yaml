  name: "passion-wave-rotary-test-esp32"
  friendly_name: "Passion Wave Rotaryknob Test ESP32"
  # Native Music Assistant counterpart of the Sonos entity
  # media_player.unnamed_room (same RINCON unique ID).
  ha_player: "media_player.roam_2"
  light_1_entity: "light.buero_monitor_wled"
  wled_preset_entity: "select.buero_monitor_wled_preset"
  light_2_entity: "light.passion_wave_light_2"
  light_3_entity: "light.passion_wave_light_3"
  light_4_entity: "light.passion_wave_light_4"
  light_4_preset_select: "select.passion_wave_wled_preset"
  ha_weather: "weather.forecast_home"
  ha_base_url: "http://homeassistant.local:8123"
  rain_radar_image_url: "http://homeassistant.local:8123/local/passion-wave/radar.jpg"
  photo_image_url_0: "http://homeassistant.local:8123/local/passion-wave/photo-0.jpg"
  photo_image_url_1: "http://homeassistant.local:8123/local/passion-wave/photo-1.jpg"
  photo_image_url_2: "http://homeassistant.local:8123/local/passion-wave/photo-2.jpg"
  house_floorplan_image_url: "http://homeassistant.local:8123/local/passion-wave/floorplan.png"
  playlist_json_sensor: "passion_wave/media/playlists"
  radio_json_sensor: "passion_wave/media/radios"
  podcast_json_sensor: "passion_wave/media/podcasts"
  playlist_page_json_sensor: "passion_wave/media/playlists/state"
  playlist_tracks_json_sensor: "passion_wave/media/playlist_tracks/state"
  playlist_request_topic: "passion_wave/media/playlists/request"
  playlist_tracks_request_topic: "passion_wave/media/playlist_tracks/request"
  floorplan_revision_topic: "passion_wave/floorplan/revision"
  s3_device_name: "passion-wave-rotary-test-s3"
  latency_request_entity: "input_button.passion_wave_latency_request"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  min_version: 2026.7.0
  includes:
    - dual_mcu_link.h
    - dual_mcu_encoder.h
    - dual_mcu_radar_proxy.h
    - dual_mcu_library_proxy.h
  project:
    name: "passion-wave.rotaryknob-test-esp32"
    version: "2.0.0"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          dual_mcu::link.setup(id(inter_mcu_uart));
          dual_mcu::radar_server.setup();
          const bool encoder_ready = dual_mcu::encoder.setup(GPIO_NUM_22, GPIO_NUM_19);
          id(coprocessor_status).publish_state(encoder_ready ? "Warte auf S3" : "Encoder-Setup fehlgeschlagen");
          id(bridge_action_count_sensor).publish_state(0);
          id(bridge_last_action_text).publish_state("keine");
          const uint8_t role[] = {'E', '3', '2'};
          dual_mcu::link.send(dual_mcu::MessageType::HELLO, role, sizeof(role));

esp32:
  board: esp32dev
  flash_size: 4MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

logger:
  level: INFO

mqtt:
  id: bridge_mqtt_client
  broker: "homeassistant.local"
  username: ""
  password: ""
  discovery: false
  reboot_timeout: 0s
  log_topic: null

api:
  id: esp32_api
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "Passion Wave Dual MCU Fallback"
    password: "passion-wave"

captive_portal:

safe_mode:
  num_attempts: 10
  boot_is_good_after: 60s
  reboot_timeout: 10min

uart:
  id: inter_mcu_uart
  tx_pin: GPIO23
  rx_pin: GPIO18
  baud_rate: 2000000
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

