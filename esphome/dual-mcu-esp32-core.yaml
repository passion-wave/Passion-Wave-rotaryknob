  - id: refresh_bridge_light_detail
    mode: queued
    max_runs: 4
    parameters:
      slot: int
      entity: std::string
    then:
      - if:
          condition:
            lambda: |-
              if (slot < 0 || slot >= 4 || entity.rfind("light.", 0) != 0)
                return false;
              for (char c : entity) {
                const bool valid =
                  std::isalnum(static_cast<unsigned char>(c)) ||
                  c == '_' || c == '.';
                if (!valid) return false;
              }
              return id(bridge_api_connected) &&
                     (id(bridge_light_detail_resolved_mask) &
                      (1U << static_cast<uint8_t>(slot))) == 0;
          then:
            - script.execute:
                id: publish_bridge_light_catalog_request
                slot: !lambda 'return slot;'
                entity: !lambda 'return entity;'
          else:
            - lambda: |-
                if (slot < 0 || slot >= 4 || !id(bridge_api_connected)) return;
                id(bridge_light_detail_resolved_mask) |=
                  static_cast<uint8_t>(1U << static_cast<uint8_t>(slot));

  - id: cache_bridge_light_detail
    mode: queued
    max_runs: 4
    parameters:
      slot: int
      payload: string
    then:
      - lambda: |-
          if (slot < 0 || slot >= 4 || payload.size() > 12288) return;
          DynamicJsonDocument doc(12288);
          if (deserializeJson(doc, payload)) return;
          JsonObjectConst catalog = doc.as<JsonObjectConst>();
          const char *kind_text = catalog["kind"] | "";
          const char *target = catalog["target"] | "";
          const char *entity_id = catalog["entity_id"] | "";
          if (strcmp(kind_text, "retry") == 0) {
            id(bridge_light_detail_resolved_mask) &=
              static_cast<uint8_t>(~(1U << static_cast<uint8_t>(slot)));
            id(bridge_light_detail_retry_due_ms) = millis() + 2000UL;
            return;
          }
          uint8_t kind = strcmp(kind_text, "wled") == 0 ? 1 :
                         strcmp(kind_text, "hue") == 0 ? 2 : 0;
          auto &labels = id(bridge_light_detail_labels)[slot];
          auto &commands = id(bridge_light_detail_commands)[slot];
          labels.clear();
          commands.clear();
          JsonArrayConst items = catalog["items"].as<JsonArrayConst>();
          if (!items.isNull()) {
            for (JsonObjectConst item : items) {
              if (labels.size() >= dual_mcu::LIGHT_DETAIL_MAX_ITEMS) break;
              const char *label = item["label"] | "";
              const char *command = item["command"] | "";
              if (label[0] == '\0' || command[0] == '\0') continue;
              labels.emplace_back(label);
              commands.emplace_back(command);
            }
          }
          if (labels.empty()) kind = 0;
          id(bridge_light_detail_kinds)[slot] = kind;
          id(bridge_light_detail_targets)[slot] = target;
          id(bridge_light_detail_entities)[slot] = entity_id;
          id(bridge_light_detail_selected)[slot] = -1;
          const char *selected = catalog["selected"] | "";
          for (size_t index = 0;
               selected[0] != '\0' && index < commands.size(); index++) {
            if (commands[index] == selected) {
              id(bridge_light_detail_selected)[slot] =
                static_cast<int>(index);
              break;
            }
          }
          id(bridge_light_detail_resolved_mask) |=
            static_cast<uint8_t>(1U << static_cast<uint8_t>(slot));
          if ((id(bridge_light_detail_resolved_mask) & 0x0F) == 0x0F)
            id(bridge_light_detail_retry_due_ms) = 0;
      - script.execute:
          id: send_bridge_light_detail_catalog
          slot: !lambda 'return slot;'

  - id: send_bridge_light_detail_catalog
    mode: queued
    max_runs: 8
    parameters:
      slot: int
    then:
      - lambda: |-
          if (slot < 0 || slot >= 4) return;
          id(bridge_light_detail_generations)[slot]++;
      - repeat:
          count: !lambda |-
            if (slot < 0 || slot >= 4) return 0;
            return static_cast<int>(std::min(
              id(bridge_light_detail_labels)[slot].size(),
              dual_mcu::LIGHT_DETAIL_MAX_ITEMS));
          then:
            - lambda: |-
                const size_t index = iteration;
                dual_mcu::link.send_light_detail_item(
                  static_cast<uint8_t>(slot),
                  id(bridge_light_detail_generations)[slot],
                  static_cast<uint8_t>(index),
                  id(bridge_light_detail_labels)[slot][index]);
            # Yield between records. Three full 27-scene Hue catalogs otherwise
            # exceed the S3's bounded receive queue during a reconnect snapshot.
            # Encoder/action records can be serviced between every label.
            - delay: 8ms
      - lambda: |-
          if (slot < 0 || slot >= 4) return;
          const auto &labels = id(bridge_light_detail_labels)[slot];
          const size_t count = std::min(
            labels.size(), dual_mcu::LIGHT_DETAIL_MAX_ITEMS);
          dual_mcu::link.send_light_detail_meta(
            static_cast<uint8_t>(slot),
            id(bridge_light_detail_generations)[slot],
            id(bridge_light_detail_kinds)[slot],
            static_cast<uint8_t>(count),
            id(bridge_light_detail_selected)[slot],
            dual_mcu::Link::fnv1a(
              id(bridge_light_detail_entities)[slot]));
          std::string status;
          for (int index = 0; index < 4; index++) {
            if (!status.empty()) status += " · ";
            status += "S" + std::to_string(index + 1) + ":";
            const uint8_t kind = id(bridge_light_detail_kinds)[index];
            status += kind == 1 ? "W" : kind == 2 ? "H" : "-";
            status += std::to_string(
              id(bridge_light_detail_labels)[index].size());
          }
          id(bridge_light_detail_status).publish_state(status);

  - id: activate_bridge_light_detail
