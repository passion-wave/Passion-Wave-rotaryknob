    id: passion_wave_firmware_update
    name: "Firmware"
    source: "${firmware_update_manifest_url}"
    update_interval: 6h

safe_mode:
  num_attempts: 10
  boot_is_good_after: 60s
  reboot_timeout: 10min

uart:
  id: inter_mcu_uart
  tx_pin: GPIO23
  rx_pin: GPIO18
  baud_rate: 2000000
  data_bits: 8
  parity: NONE
  stop_bits: 1
  # Absorb a complete paced state group even if Home Assistant callbacks and
  # an S3 response briefly overlap. Control frames are still dequeued first.
  rx_buffer_size: 4096

time:
  - platform: homeassistant
    id: bridge_time
    timezone: Europe/Berlin

