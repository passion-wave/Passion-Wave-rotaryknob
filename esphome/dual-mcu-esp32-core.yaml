esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  min_version: 2026.7.0
  includes:
    - dual_mcu_link.h
    - dual_mcu_encoder.h
    - dual_mcu_radar_proxy.h
    - dual_mcu_library_proxy.h
    - responsive_power_policy.h
  project:
    name: "passion-wave.rotaryknob-test-esp32"
    version: "3.0.0-beta.15"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          dual_mcu::link.setup(id(inter_mcu_uart));
          dual_mcu::radar_server.setup();
          const bool encoder_ready = dual_mcu::encoder.setup(GPIO_NUM_22, GPIO_NUM_19);
          id(coprocessor_status).publish_state(encoder_ready ? "Warte auf S3" : "Encoder-Setup fehlgeschlagen");
          id(bridge_action_count_sensor).publish_state(0);
          id(bridge_last_action_text).publish_state("keine");
          const uint8_t role[] = {'E', '3', '2'};
          dual_mcu::link.send(dual_mcu::MessageType::HELLO, role, sizeof(role));

esp32:
  board: esp32dev
  flash_size: 4MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  id: esp32_api
  reboot_timeout: 0s
  # Command envelopes are sparse and latency-sensitive. Send them immediately
  # instead of holding each UI action in ESPHome's default 100 ms batch.
  batch_delay: 0ms
  actions:
    - action: support_diagnostics_on
      then:
        - lambda: |-
            id(support_diagnostics_enabled) = true;
            id(last_stats_publish_ms) = 0;
            ESP_LOGW("support", "diagnostics enabled");
    - action: support_diagnostics_off
      then:
        - lambda: |-
            id(support_diagnostics_enabled) = false;
            ESP_LOGW("support", "diagnostics disabled");
    - action: passion_wave_receive_library
      variables:
        kind: int
        payload: string
      then:
        - if:
            condition:
              lambda: 'return kind >= 1 && kind <= 3;'
            then:
              - script.execute:
                  id: cache_bridge_library
                  kind: !lambda 'return kind;'
                  payload: !lambda 'return payload;'
            else:
              - script.execute:
                  id: cache_bridge_library_page
                  kind: !lambda 'return kind;'
                  payload: !lambda 'return payload;'
    - action: passion_wave_receive_forecast
      variables:
        period: string
        entity: string
        payload: string
      then:
        - if:
            condition:
              lambda: 'return period == "daily";'
            then:
              - script.execute:
                  id: cache_bridge_daily_forecast
                  entity: !lambda 'return entity;'
                  payload: !lambda 'return payload;'
        - if:
            condition:
              lambda: 'return period == "hourly";'
            then:
              - script.execute:
                  id: cache_bridge_hourly_forecast
                  entity: !lambda 'return entity;'
                  payload: !lambda 'return payload;'
    - action: passion_wave_receive_light_catalog
      variables:
        slot: int
        payload: string
      then:
        - script.execute:
            id: cache_bridge_light_detail
            slot: !lambda 'return slot;'
            payload: !lambda 'return payload;'
    - action: passion_wave_receive_light_state
      variables:
        slot: int
        is_on: bool
        brightness: int
      then:
        - lambda: |-
            if (slot < 0 || slot >= 4) return;
            const int safe_brightness = std::clamp<int32_t>(
              brightness, 0, 100);
            bool *states[] = {
              &id(bridge_light_1_on), &id(bridge_light_2_on),
              &id(bridge_light_3_on), &id(bridge_light_4_on)};
            int *levels[] = {
              &id(bridge_light_1_brightness),
              &id(bridge_light_2_brightness),
              &id(bridge_light_3_brightness),
              &id(bridge_light_4_brightness)};
            *states[slot] = is_on;
            *levels[slot] = safe_brightness;
            const uint8_t state[] = {
              static_cast<uint8_t>(slot),
              static_cast<uint8_t>(is_on ? 1 : 0),
              static_cast<uint8_t>(safe_brightness)};
            dual_mcu::link.send(
              dual_mcu::MessageType::LIGHT_STATE,
              state, sizeof(state));
    - action: passion_wave_receive_runtime_state
      variables:
        session: int
        sequence: int
        payload: string
      then:
        - lambda: |-
            if (session <= 0 || sequence <= 0 || payload.size() > 2048) return;
            DynamicJsonDocument doc(2048);
            if (deserializeJson(doc, payload)) return;
            JsonObjectConst root = doc.as<JsonObjectConst>();
            JsonArrayConst lights = root["lights"].as<JsonArrayConst>();
            if (lights.isNull() || lights.size() != 4) return;
            id(bridge_runtime_session) = static_cast<uint32_t>(session);
            id(bridge_runtime_sequence) = static_cast<uint32_t>(sequence);
            id(bridge_runtime_authoritative) = true;
            id(bridge_media_state) =
              std::clamp(root["state"].as<int>(), 0, 4);
            id(bridge_media_volume_pct) =
              std::clamp(root["volume"].as<int>(), 0, 100);
            if (id(volume_command_pending) &&
                id(bridge_media_volume_pct) ==
                  id(volume_command_target_pct)) {
              const uint32_t elapsed_us =
                micros() - id(volume_command_started_us);
              id(volume_command_pending) = false;
              dual_mcu::link.send_pair_u32(
                dual_mcu::MessageType::VOLUME_RESULT,
                id(volume_command_sequence), elapsed_us, 0);
            }
            id(bridge_media_position_seconds) =
              static_cast<uint32_t>(std::max(root["position"].as<int>(), 0));
            id(bridge_media_duration_seconds) =
              static_cast<uint32_t>(std::max(root["duration"].as<int>(), 0));
            id(bridge_media_shuffle) = root["shuffle"] | false;
            id(bridge_media_repeat_one) = root["repeat_one"] | false;
            // The published beta.12 integration did not include presentation
            // strings in this action. Preserve S3 values during a staged
            // update; the consolidated integration carries these keys,
            // including intentional empty strings.
            const char *title = root["title"].is<const char *>()
              ? root["title"].as<const char *>() : nullptr;
            const char *artist = root["artist"].is<const char *>()
              ? root["artist"].as<const char *>() : nullptr;
            const char *friendly_name =
              root["friendly_name"].is<const char *>()
                ? root["friendly_name"].as<const char *>() : nullptr;
            if (title != nullptr || artist != nullptr ||
                friendly_name != nullptr)
              id(bridge_media_presentation_authoritative) = true;
            if (title != nullptr) {
              id(bridge_media_title) = title;
              dual_mcu::link.send_media_text(
                dual_mcu::MediaTextField::TITLE, id(bridge_media_title));
            }
            if (artist != nullptr) {
              id(bridge_media_artist) = artist;
              dual_mcu::link.send_media_text(
                dual_mcu::MediaTextField::ARTIST, id(bridge_media_artist));
            }
            if (friendly_name != nullptr) {
              id(bridge_media_friendly_name) = friendly_name;
              dual_mcu::link.send_media_text(
                dual_mcu::MediaTextField::FRIENDLY_NAME,
                id(bridge_media_friendly_name));
            }
            const char *cover_url = root["cover_url"] | "";
            id(bridge_media_entity_picture) = cover_url == nullptr ? "" : cover_url;
            id(bridge_media_cover_url_status).publish_state(
              std::string("raw=") +
              std::to_string(id(bridge_media_entity_picture).size()) +
              (id(bridge_media_entity_picture).rfind("http", 0) == 0
                 ? " http" : " invalid"));
            bool *states[] = {
              &id(bridge_light_1_on), &id(bridge_light_2_on),
              &id(bridge_light_3_on), &id(bridge_light_4_on)};
            int *levels[] = {
              &id(bridge_light_1_brightness),
              &id(bridge_light_2_brightness),
              &id(bridge_light_3_brightness),
              &id(bridge_light_4_brightness)};
            for (size_t slot = 0; slot < 4; slot++) {
              JsonObjectConst light = lights[slot].as<JsonObjectConst>();
              *states[slot] = light["on"] | false;
              *levels[slot] = std::clamp(light["brightness"].as<int>(), 0, 100);
            }
            id(bridge_runtime_status).publish_state(
              "R" + std::to_string(id(bridge_runtime_session)) + ":" +
              std::to_string(id(bridge_runtime_sequence)) + " V" +
              std::to_string(id(bridge_media_volume_pct)) + " L" +
              std::to_string(id(bridge_light_1_on)) +
              std::to_string(id(bridge_light_2_on)) +
              std::to_string(id(bridge_light_3_on)) +
              std::to_string(id(bridge_light_4_on)));
        - script.execute: send_bridge_runtime_state
        - script.execute: resolve_bridge_media_cover_url
    - action: passion_wave_complete_media
      variables:
        kind: int
        index: int
        result: int
      then:
        - lambda: |-
            if (!id(bridge_play_pending) ||
                id(bridge_play_pending_kind) != kind ||
                id(bridge_play_pending_index) != index)
              return;
            const uint8_t response[] = {
              static_cast<uint8_t>(kind),
              static_cast<uint8_t>(index & 0xFF),
              static_cast<uint8_t>((index >> 8) & 0xFF),
              static_cast<uint8_t>(
                std::clamp<int32_t>(result, 0, 255)),
            };
            id(bridge_play_pending) = false;
            dual_mcu::link.send(
              dual_mcu::MessageType::MEDIA_LIBRARY_PLAY_RESULT,
              response, sizeof(response));

