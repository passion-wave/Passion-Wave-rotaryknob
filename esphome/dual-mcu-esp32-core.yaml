script:
  # Device-to-HA commands are ordinary ESPHome state publications. The
  # PassionWave integration validates and executes them, so the ESPHome
  # administrator permission for Home Assistant actions is not required.
  - id: publish_bridge_ha_command
    mode: queued
    max_runs: 16
    parameters:
      kind: int
      value: int
      entity: string
      option: string
    then:
      - lambda: |-
          DynamicJsonDocument doc(512);
          doc["v"] = 1;
          doc["seq"] = ++id(bridge_command_sequence);
          doc["type"] = option.empty() ? "ha_action" : "ha_text_action";
          doc["kind"] = kind;
          doc["value"] = value;
          doc["entity"] = entity;
          if (!option.empty()) doc["option"] = option;
          std::string encoded;
          serializeJson(doc, encoded);
          if (encoded.size() <= 255) {
            id(bridge_command_envelope).publish_state(encoded);
          } else {
            id(bridge_last_action_text).publish_state(
              "Command verworfen: Nutzlast zu lang");
          }

  - id: publish_bridge_library_request
    mode: queued
    max_runs: 8
    parameters:
      kind: int
      offset: int
      limit: int
      playlist_id: string
      context: int
    then:
      - lambda: |-
          DynamicJsonDocument doc(768);
          doc["v"] = 1;
          doc["seq"] = ++id(bridge_command_sequence);
          doc["type"] = "library";
          doc["kind"] = kind;
          doc["offset"] = offset;
          doc["limit"] = limit;
          if (!playlist_id.empty()) doc["playlist_id"] = playlist_id;
          if (context != 0) doc["context"] = context;
          const std::string request_id =
            App.get_name() + std::string("-") +
            std::to_string(id(bridge_command_sequence));
          doc["request_id"] = request_id;
          if (kind == 5) {
            id(bridge_pending_track_request_id) = request_id;
            id(bridge_pending_track_generation) =
              static_cast<uint16_t>(std::clamp(context, 0, 65535));
          }
          std::string encoded;
          serializeJson(doc, encoded);
          if (encoded.size() <= 255) {
            id(bridge_command_envelope).publish_state(encoded);
          } else {
            id(bridge_library_proxy_status).publish_state(
              "Bibliotheksanfrage zu lang");
          }

  - id: publish_bridge_forecast_request
    mode: restart
    then:
      - lambda: |-
          DynamicJsonDocument doc(256);
          doc["v"] = 1;
          doc["seq"] = ++id(bridge_command_sequence);
          doc["type"] = "forecast";
          doc["entity"] = "${ha_weather}";
          std::string encoded;
          serializeJson(doc, encoded);
          id(bridge_command_envelope).publish_state(encoded);

  - id: publish_bridge_light_catalog_request
    mode: queued
    max_runs: 4
    parameters:
      slot: int
      entity: string
    then:
      - lambda: |-
          DynamicJsonDocument doc(384);
          doc["v"] = 1;
          doc["seq"] = ++id(bridge_command_sequence);
          doc["type"] = "light_catalog";
          doc["slot"] = slot;
          doc["entity"] = entity;
          std::string encoded;
          serializeJson(doc, encoded);
          if (encoded.size() <= 255)
            id(bridge_command_envelope).publish_state(encoded);

  - id: publish_bridge_play_request
    mode: restart
    parameters:
      kind: int
      index: int
      uri: string
      media_type: string
    then:
      - lambda: |-
          DynamicJsonDocument doc(768);
          doc["v"] = 1;
          doc["seq"] = ++id(bridge_command_sequence);
          doc["type"] = "play_media";
          doc["kind"] = kind;
          doc["index"] = index;
          doc["uri"] = uri;
          doc["media_type"] = media_type;
          std::string encoded;
          serializeJson(doc, encoded);
          if (encoded.size() <= 255) {
            id(bridge_command_envelope).publish_state(encoded);
          } else {
            id(bridge_play_pending) = false;
            id(bridge_last_action_text).publish_state(
              "Wiedergabe verworfen: URI zu lang");
            const uint8_t response[] = {
              static_cast<uint8_t>(kind),
              static_cast<uint8_t>(index & 0xFF),
              static_cast<uint8_t>((index >> 8) & 0xFF),
              4,
            };
            dual_mcu::link.send(
              dual_mcu::MessageType::MEDIA_LIBRARY_PLAY_RESULT,
              response, sizeof(response));
          }

