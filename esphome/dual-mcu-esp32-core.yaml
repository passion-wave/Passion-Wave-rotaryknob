  - id: cache_bridge_library
    mode: queued
    parameters:
      kind: int
      payload: string
    then:
      - lambda: |-
          if (kind < 1 || kind > 3 || payload.size() > 12288) return;
          DynamicJsonDocument doc(12288);
          if (deserializeJson(doc, payload)) {
            id(bridge_library_proxy_status).publish_state("JSON-Fehler");
            return;
          }
          JsonArray items = doc.as<JsonArray>();
          if (items.isNull()) items = doc["items"].as<JsonArray>();
          if (items.isNull()) items = doc["playlists"].as<JsonArray>();
          if (items.isNull()) {
            id(bridge_library_proxy_status).publish_state("Liste fehlt");
            return;
          }
          std::vector<dual_mcu::LibraryEntry> entries;
          entries.reserve(std::min<size_t>(items.size(), dual_mcu::LIBRARY_MAX_ENTRIES));
          const char *fallback_type = kind == 1 ? "playlist" : kind == 2 ? "radio" : "podcast";
          int fallback_index = 1;
          for (JsonObject item : items) {
            if (entries.size() >= dual_mcu::LIBRARY_MAX_ENTRIES) break;
            dual_mcu::LibraryEntry entry;
            const char *name = item["name"] | item["title"] | "";
            const char *uri = item["uri"] | item["id"] | item["url"] | "";
            const char *item_id = item["item_id"] | item["playlist_item_id"] | "";
            const char *media_type = item["media_type"] | item["type"] | fallback_type;
            entry.name = name == nullptr || name[0] == '\0'
              ? std::string("Eintrag ") + std::to_string(fallback_index) : name;
            entry.uri = uri == nullptr ? "" : uri;
            entry.item_id = item_id == nullptr ? "" : item_id;
            entry.media_type = media_type == nullptr || media_type[0] == '\0'
              ? fallback_type : media_type;
            entries.push_back(std::move(entry));
            fallback_index++;
          }
          const auto library_kind = static_cast<dual_mcu::LibraryKind>(kind);
          if (!dual_mcu::library_server.set(library_kind, entries)) {
            id(bridge_library_proxy_status).publish_state("Cache zu groß");
            return;
          }
          id(bridge_library_proxy_status).publish_state(
            std::string("Cache ") + std::to_string(kind) + ": " +
            std::to_string(entries.size()) + " Einträge");
          const uint8_t changed[] = {static_cast<uint8_t>(kind)};
          dual_mcu::link.send(dual_mcu::MessageType::LIBRARY_CHANGED,
                              changed, sizeof(changed));

  - id: cache_bridge_library_page
    mode: queued
    parameters:
      kind: int
      payload: string
    then:
      - lambda: |-
          if ((kind != 4 && kind != 5) || payload.size() > 12288) return;
          DynamicJsonDocument doc(12288);
          if (deserializeJson(doc, payload) || !doc.is<JsonObject>()) {
            id(bridge_library_proxy_status).publish_state("Paging JSON-Fehler");
            return;
          }
          const std::string request_id = doc["request_id"] | "";
          if (request_id.empty()) return;
          if (kind == 5) {
            if (id(bridge_pending_track_request_id).empty() ||
                request_id != id(bridge_pending_track_request_id)) {
              id(bridge_library_proxy_status).publish_state(
                "Veraltete Titelliste verworfen");
              return;
            }
          } else if (request_id.rfind(App.get_name(), 0) != 0) {
            return;
          }
          JsonArray items = kind == 4 ? doc["items"].as<JsonArray>()
                                      : doc["tracks"].as<JsonArray>();
          if (items.isNull() && kind == 4) items = doc["playlists"].as<JsonArray>();
          if (items.isNull() && kind == 5) items = doc["items"].as<JsonArray>();
          if (items.isNull()) {
            id(bridge_library_proxy_status).publish_state("Paging Liste fehlt");
            return;
          }
          const int raw_offset = doc["offset"] | 0;
          const int raw_total = doc["total"] | 0;
          if (raw_offset < 0 || raw_offset > 65535 || raw_total < 0) return;
          std::vector<dual_mcu::LibraryEntry> entries;
          entries.reserve(std::min<size_t>(items.size(), dual_mcu::LIBRARY_MAX_ENTRIES));
          int fallback_index = raw_offset + 1;
          for (JsonObject item : items) {
            if (entries.size() >= dual_mcu::LIBRARY_MAX_ENTRIES) break;
            dual_mcu::LibraryEntry entry;
            const char *name = item["name"] | item["title"] | "";
            const char *uri = item["uri"] | item["id"] | item["url"] | "";
            entry.name = name == nullptr || name[0] == '\0'
              ? std::string(kind == 4 ? "Eintrag " : "Titel ") +
                  std::to_string(fallback_index) : name;
            entry.uri = uri == nullptr ? "" : uri;
            if (kind == 4) {
              const char *item_id = item["item_id"] | item["playlist_item_id"] | "";
              const char *media_type = item["media_type"] | item["type"] | "playlist";
              entry.item_id = item_id == nullptr ? "" : item_id;
              entry.media_type = media_type == nullptr || media_type[0] == '\0'
                ? "playlist" : media_type;
            } else {
              const char *artist = item["artist"] | "";
              entry.item_id = artist == nullptr ? "" : artist;
              entry.media_type = "track";
            }
            entries.push_back(std::move(entry));
            fallback_index++;
          }
          const bool has_more = doc["has_more"] | false;
          const uint16_t total = static_cast<uint16_t>(
            std::min(raw_total, 65535));
          const auto library_kind = static_cast<dual_mcu::LibraryKind>(kind);
          if (!dual_mcu::library_server.set_page(
                library_kind, entries, static_cast<uint16_t>(raw_offset),
                total, has_more,
                kind == 5 ? id(bridge_pending_track_generation) : 0)) {
            id(bridge_library_proxy_status).publish_state("Paging Reihenfolge ungültig");
            return;
          }
          if (kind == 5) id(bridge_pending_track_request_id).clear();
          id(bridge_library_proxy_status).publish_state(
            std::string(kind == 4 ? "Playlist-Seite " : "Track-Seite ") +
            std::to_string(raw_offset) + ": " +
            std::to_string(entries.size()) + " Einträge");
          const uint8_t changed[] = {static_cast<uint8_t>(kind)};
          dual_mcu::link.send(dual_mcu::MessageType::LIBRARY_CHANGED,
                              changed, sizeof(changed));

  - id: resolve_bridge_media_cover_url
    mode: restart
    then:
      - lambda: |-
          auto tune_proxy = [](std::string url) -> std::string {
            if (url.find("/imageproxy") == std::string::npos) return url;
            auto set_query_value = [](std::string &target,
                                      const std::string &key,
                                      const std::string &value) {
              const std::string needle = key + "=";
              const size_t query = target.find('?');
              size_t pos = query == std::string::npos
                ? std::string::npos : target.find(needle, query + 1);
              if (pos == std::string::npos) {
                target += target.find('?') == std::string::npos ? "?" : "&";
                target += needle + value;
                return;
              }
              const size_t start = pos + needle.size();
              size_t end = target.find('&', start);
              if (end == std::string::npos) end = target.size();
              target.replace(start, end - start, value);
            };
            set_query_value(url, "size", "256");
            set_query_value(url, "fmt", "jpg");
            return url;
          };
          auto normalize = [&](const std::string &picture) -> std::string {
            if (picture.empty() || picture == "unknown" ||
                picture == "unavailable") return "";
            std::string url;
            if (picture.rfind("http://", 0) == 0 ||
                picture.rfind("https://", 0) == 0) {
              url = picture;
            } else if (picture[0] == '/') {
              url = std::string("${ha_base_url}") + picture;
            } else {
              url = std::string("${ha_base_url}/") + picture;
            }
            url = tune_proxy(url);
            return url.size() <= dual_mcu::MEDIA_COVER_URL_MAX_LENGTH
              ? url : "";
          };

          const std::string resolved = normalize(
            id(bridge_media_entity_picture));
          id(bridge_media_cover_url_status).publish_state(
            std::string("resolved=") + std::to_string(resolved.size()) +
            (resolved.rfind("http", 0) == 0 ? " http" : " invalid"));
          if (resolved == id(bridge_media_cover_url)) return;
          id(bridge_media_cover_url) = resolved;
          if (dual_mcu::cover_url_sender.queue(resolved)) {
            id(bridge_media_cover_proxy_status).publish_state(
              resolved.empty() ? "Sende leeres Cover" : "Übertragung läuft");
          } else {
            id(bridge_media_cover_proxy_status).publish_state("URL zu lang");
          }

  - id: cache_bridge_daily_forecast
    mode: restart
    parameters:
      entity: string
      payload: string
    then:
      - lambda: |-
          if (entity.rfind("weather.", 0) != 0 || payload.size() > 16384)
            return;
          DynamicJsonDocument doc(16384);
          if (deserializeJson(doc, payload)) return;
          JsonArrayConst forecasts = doc["forecast"].as<JsonArrayConst>();
          if (forecasts.isNull() || forecasts.size() == 0) return;
          id(bridge_forecast_received) = true;
          auto read_float = [](JsonVariantConst value, float fallback) -> float {
            if (value.isNull()) return fallback;
            if (value.is<float>() || value.is<double>() || value.is<int>())
              return value.as<float>();
            const char *text = value.as<const char *>();
            if (text == nullptr || text[0] == '\0') return fallback;
            char *end = nullptr;
            const float parsed = strtof(text, &end);
            return end != text ? parsed : fallback;
          };
          auto &state = dual_mcu::bridge_forecast_cache;
          state.daily_valid_mask = 0;
          std::string diagnostics;
          const size_t count = std::min<size_t>(5, forecasts.size());
          for (size_t index = 0; index < count; index++) {
            JsonObjectConst forecast = forecasts[index].as<JsonObjectConst>();
            const float minimum = read_float(forecast["templow"], -10.0f);
            const float maximum = read_float(forecast["temperature"], 40.0f);
            const char *condition = forecast["condition"] | "";
            state.daily_min_tenths[index] = static_cast<int16_t>(
              std::clamp(static_cast<int>(lroundf(minimum * 10.0f)),
                         -32768, 32767));
            state.daily_max_tenths[index] = static_cast<int16_t>(
              std::clamp(static_cast<int>(lroundf(maximum * 10.0f)),
                         -32768, 32767));
            state.daily_condition[index] =
              dual_mcu::weather_condition_code(condition);
            state.daily_valid_mask |= static_cast<uint8_t>(1U << index);
            if (!diagnostics.empty()) diagnostics += " | ";
            diagnostics += std::to_string(index) + ":" + condition;
            if (index == 0) {
              float probability =
                read_float(forecast["precipitation_probability"], -1.0f);
              if (probability < 0.0f)
                probability =
                  read_float(forecast["precipitation"], 0.0f) > 0.01f
                    ? 80.0f : 0.0f;
              state.precipitation_probability = static_cast<uint8_t>(
                std::clamp(static_cast<int>(lroundf(probability)), 0, 100));
            }
          }
          id(bridge_daily_forecast_text).publish_state(diagnostics);
          dual_mcu::link.send_weather_forecast(state);

  - id: cache_bridge_hourly_forecast
    mode: restart
    parameters:
      entity: string
      payload: string
    then:
      - lambda: |-
          if (entity.rfind("weather.", 0) != 0 || payload.size() > 24576)
            return;
          auto now = id(bridge_time).now();
          if (!now.is_valid()) return;
          DynamicJsonDocument doc(24576);
          if (deserializeJson(doc, payload)) return;
          JsonArrayConst forecasts = doc["forecast"].as<JsonArrayConst>();
          if (forecasts.isNull() || forecasts.size() == 0) return;
          auto read_float = [](JsonVariantConst value, float fallback) -> float {
            if (value.isNull()) return fallback;
            if (value.is<float>() || value.is<double>() || value.is<int>())
              return value.as<float>();
            const char *text = value.as<const char *>();
            if (text == nullptr || text[0] == '\0') return fallback;
            char *end = nullptr;
            const float parsed = strtof(text, &end);
            return end != text ? parsed : fallback;
          };
          auto forecast_epoch = [](const char *datetime) -> time_t {
            if (datetime == nullptr || datetime[0] == '\0')
              return static_cast<time_t>(0);
            int year = 0, month = 0, day = 0, hour = 0, minute = 0;
            if (sscanf(datetime, "%d-%d-%dT%d:%d", &year, &month, &day,
                       &hour, &minute) != 5)
              return static_cast<time_t>(0);
            struct tm value = {};
            value.tm_year = year - 1900;
            value.tm_mon = month - 1;
            value.tm_mday = day;
            value.tm_hour = hour;
            value.tm_min = minute;
            value.tm_isdst = -1;
            return mktime(&value);
          };
          auto normalized_condition = [](const std::string &condition,
                                         float probability,
                                         float precipitation) {
            if (condition == "lightning" ||
                condition == "lightning-rainy" ||
                condition == "exceptional")
              return condition;
            if (condition == "rainy" || condition == "pouring" ||
                condition == "hail" || condition == "snowy-rainy" ||
                precipitation > 0.01f || probability >= 55.0f)
              return std::string("rainy");
            return condition.empty() ? std::string("partlycloudy") : condition;
          };
          auto &state = dual_mcu::bridge_forecast_cache;
          state.hourly_valid_mask = 0;
          const time_t now_epoch = static_cast<time_t>(now.timestamp);
          const time_t day_start =
            now_epoch - now.hour * 3600 - now.minute * 60 - now.second;
          const time_t targets[4] = {
            day_start + 8 * 3600, day_start + 13 * 3600,
            day_start + 19 * 3600, day_start + 23 * 3600};
          int best_distance[4] = {86400, 86400, 86400, 86400};
          const bool raining_now =
            id(bridge_weather_condition) == "rainy" ||
            id(bridge_weather_condition) == "pouring" ||
            id(bridge_weather_condition) == "lightning-rainy" ||
            id(bridge_weather_condition) == "hail";
          int eta_minutes = raining_now ? 0 : -1;
          for (JsonObjectConst forecast : forecasts) {
            const time_t entry_epoch =
              forecast_epoch(forecast["datetime"].as<const char *>());
            if (entry_epoch == static_cast<time_t>(0)) continue;
            const float probability =
              read_float(forecast["precipitation_probability"], -1.0f);
            const float precipitation =
              read_float(forecast["precipitation"], 0.0f);
            const char *condition_text = forecast["condition"] | "";
            const std::string condition = normalized_condition(
              condition_text, probability, precipitation);
            const float temperature =
              read_float(forecast["temperature"], 0.0f);
            for (size_t slot = 0; slot < 4; slot++) {
              const int distance = static_cast<int>(labs(static_cast<long>(
                difftime(entry_epoch, targets[slot]))));
              if (distance < best_distance[slot]) {
                best_distance[slot] = distance;
                state.hourly_temperature_tenths[slot] =
                  static_cast<int16_t>(std::clamp(
                    static_cast<int>(lroundf(temperature * 10.0f)),
                    -32768, 32767));
                state.hourly_condition[slot] =
                  dual_mcu::weather_condition_code(condition);
                state.hourly_valid_mask |=
                  static_cast<uint8_t>(1U << slot);
              }
            }
            if (!raining_now && eta_minutes < 0) {
              int minutes = static_cast<int>(
                lroundf(difftime(entry_epoch, now_epoch) / 60.0f));
              if (minutes >= -15) {
                if (minutes < 0) minutes = 0;
                const bool wet =
                  condition == "rainy" || condition == "pouring" ||
                  condition == "lightning-rainy" || condition == "hail" ||
                  precipitation > 0.01f || probability >= 30.0f;
                if (wet) eta_minutes = minutes;
              }
            }
          }
          state.rain_minutes = static_cast<int16_t>(
            std::clamp(eta_minutes, -1, 32767));
          dual_mcu::link.send_weather_forecast(state);

  - id: fetch_bridge_forecast
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(bridge_api_connected);'
          then:
            - script.stop: fetch_bridge_forecast
      - script.execute: publish_bridge_forecast_request
      - script.stop: fetch_bridge_forecast

  - id: send_bridge_weather_state
    mode: restart
    then:
      - lambda: |-
          dual_mcu::WeatherState weather;
          weather.temperature_valid = id(bridge_weather_temperature_valid);
          weather.humidity_valid = id(bridge_weather_humidity_valid);
          weather.wind_valid = id(bridge_weather_wind_valid);
          weather.precipitation_valid = id(bridge_weather_precipitation_valid);
          weather.temperature_tenths = static_cast<int16_t>(id(bridge_weather_temperature_tenths));
          weather.humidity_pct = static_cast<uint8_t>(id(bridge_weather_humidity_pct));
          weather.wind_tenths = static_cast<uint16_t>(id(bridge_weather_wind_tenths));
          weather.precipitation_probability =
            static_cast<uint8_t>(id(bridge_weather_precipitation_pct));
          dual_mcu::link.send_weather_state(weather);

  - id: send_bridge_radar_meta
    mode: restart
    then:
      - lambda: |-
          dual_mcu::RadarMeta radar;
          radar.eta_valid = id(bridge_radar_eta_valid);
          radar.eta_minutes = static_cast<int16_t>(
            std::clamp(id(bridge_radar_eta_minutes), 0, 32767));
          radar.raining = id(bridge_radar_raining);
          const float dr = id(bridge_radar_motion_dr);
          const float dc = id(bridge_radar_motion_dc);
          const float speed = id(bridge_radar_motion_speed);
          const float vector_length = sqrtf(dr * dr + dc * dc);
          radar.direction_valid =
            id(bridge_radar_motion_valid) && speed >= 2.0f &&
            vector_length > 0.0001f;
          radar.speed_valid = radar.direction_valid;
          if (radar.direction_valid) {
            // Rain Warner reports the movement vector. Users need the
            // opposite bearing: the direction the rain is coming from.
            float bearing = atan2f(-dc, -dr) * 180.0f / static_cast<float>(M_PI);
            if (bearing < 0.0f) bearing += 360.0f;
            radar.direction_tenths = static_cast<uint16_t>(
              std::clamp(static_cast<int>(lroundf(bearing * 10.0f)), 0, 3599));
            radar.speed_tenths = static_cast<uint16_t>(
              std::clamp(static_cast<int>(lroundf(speed * 10.0f)), 0, 65535));
          }
          dual_mcu::link.send_radar_meta(radar);

  - id: send_bridge_media_state
    mode: restart
    then:
      - lambda: |-
          dual_mcu::MediaState media;
          media.state = static_cast<uint8_t>(std::clamp(id(bridge_media_state), 0, 4));
          media.volume_pct = static_cast<uint8_t>(std::clamp(id(bridge_media_volume_pct), 0, 100));
          media.shuffle = id(bridge_media_shuffle);
          media.repeat_one = id(bridge_media_repeat_one);
          media.position_seconds = id(bridge_media_position_seconds);
          media.duration_seconds = id(bridge_media_duration_seconds);
          dual_mcu::link.send_media_state(media);

  - id: send_bridge_runtime_state
    mode: restart
    then:
      - lambda: |-
          if (!id(bridge_runtime_authoritative)) return;
          dual_mcu::RuntimeState state;
          state.session = id(bridge_runtime_session);
          state.sequence = id(bridge_runtime_sequence);
          state.media.state = static_cast<uint8_t>(
            std::clamp(id(bridge_media_state), 0, 4));
          state.media.volume_pct = static_cast<uint8_t>(
            std::clamp(id(bridge_media_volume_pct), 0, 100));
          state.media.shuffle = id(bridge_media_shuffle);
          state.media.repeat_one = id(bridge_media_repeat_one);
          state.media.position_seconds = id(bridge_media_position_seconds);
          state.media.duration_seconds = id(bridge_media_duration_seconds);
          const bool light_on[] = {
            id(bridge_light_1_on), id(bridge_light_2_on),
            id(bridge_light_3_on), id(bridge_light_4_on)};
          const int brightness[] = {
            id(bridge_light_1_brightness), id(bridge_light_2_brightness),
            id(bridge_light_3_brightness), id(bridge_light_4_brightness)};
          for (size_t slot = 0; slot < 4; slot++) {
            state.light_on[slot] = light_on[slot];
            state.light_brightness[slot] = static_cast<uint8_t>(
              std::clamp(brightness[slot], 0, 100));
          }
          dual_mcu::link.send_runtime_state(state);

  - id: execute_bridge_volume
    # Latest value wins: rapid encoder detents never queue obsolete volume.
    mode: restart
    parameters:
      value: int
    then:
      - script.execute:
          id: publish_bridge_ha_command
          kind: !lambda |-
            return static_cast<int>(dual_mcu::HAAction::MEDIA_VOLUME);
          value: !lambda 'return value;'
          entity: ""
          option: ""

  - id: send_bridge_snapshot
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return dual_mcu::radar_server.busy();'
          then:
            # A reconnect snapshot must start with BRIDGE_STATUS. Previously
            # returning from only the following lambda skipped that status but
            # still ran the catalog scripts below, so the S3 correctly rejected
            # their unadvertised capability. Retry the whole snapshot instead.
            - delay: 250ms
            - script.execute: send_bridge_snapshot
            - script.stop: send_bridge_snapshot
      - lambda: |-
          const uint8_t status[] = {
            static_cast<uint8_t>(id(bridge_api_connected) ? 0xFF : 0x7E),
            static_cast<uint8_t>(
              // bit 0: paged library requests, bit 1: light details
              id(bridge_api_connected) ? 0x03 : 0x00),
          };
          dual_mcu::link.send(dual_mcu::MessageType::BRIDGE_STATUS, status, sizeof(status));
          dual_mcu::MediaState media;
          media.state = static_cast<uint8_t>(std::clamp(id(bridge_media_state), 0, 4));
          media.volume_pct = static_cast<uint8_t>(std::clamp(id(bridge_media_volume_pct), 0, 100));
          media.shuffle = id(bridge_media_shuffle);
          media.repeat_one = id(bridge_media_repeat_one);
          media.position_seconds = id(bridge_media_position_seconds);
          media.duration_seconds = id(bridge_media_duration_seconds);
          dual_mcu::link.send_media_state(media);
          if (id(bridge_runtime_authoritative)) {
            dual_mcu::RuntimeState runtime;
            runtime.session = id(bridge_runtime_session);
            runtime.sequence = id(bridge_runtime_sequence);
            runtime.media = media;
            const bool runtime_light_on[] = {
              id(bridge_light_1_on), id(bridge_light_2_on),
              id(bridge_light_3_on), id(bridge_light_4_on)};
            const int runtime_brightness[] = {
              id(bridge_light_1_brightness), id(bridge_light_2_brightness),
              id(bridge_light_3_brightness), id(bridge_light_4_brightness)};
            for (size_t slot = 0; slot < 4; slot++) {
              runtime.light_on[slot] = runtime_light_on[slot];
              runtime.light_brightness[slot] = static_cast<uint8_t>(
                std::clamp(runtime_brightness[slot], 0, 100));
            }
            dual_mcu::link.send_runtime_state(runtime);
          }
          if (id(bridge_media_presentation_authoritative)) {
            dual_mcu::link.send_media_text(
              dual_mcu::MediaTextField::TITLE, id(bridge_media_title));
            dual_mcu::link.send_media_text(
              dual_mcu::MediaTextField::ARTIST, id(bridge_media_artist));
          }
      - delay: 8ms
      - lambda: |-
          if (id(bridge_media_presentation_authoritative)) {
            dual_mcu::link.send_media_text(
              dual_mcu::MediaTextField::FRIENDLY_NAME,
              id(bridge_media_friendly_name));
          }
          dual_mcu::cover_url_sender.queue(id(bridge_media_cover_url));
          id(bridge_media_cover_proxy_status).publish_state(
            id(bridge_media_cover_url).empty()
              ? "Snapshot ohne Cover" : "Snapshot-Übertragung");
      - delay: 8ms
      - lambda: |-
          dual_mcu::WeatherState weather;
          weather.temperature_valid = id(bridge_weather_temperature_valid);
          weather.humidity_valid = id(bridge_weather_humidity_valid);
          weather.wind_valid = id(bridge_weather_wind_valid);
          weather.precipitation_valid = id(bridge_weather_precipitation_valid);
          weather.temperature_tenths = static_cast<int16_t>(id(bridge_weather_temperature_tenths));
          weather.humidity_pct = static_cast<uint8_t>(id(bridge_weather_humidity_pct));
          weather.wind_tenths = static_cast<uint16_t>(id(bridge_weather_wind_tenths));
          weather.precipitation_probability =
            static_cast<uint8_t>(id(bridge_weather_precipitation_pct));
          dual_mcu::link.send_weather_state(weather);
          dual_mcu::link.send_weather_text(dual_mcu::WeatherTextField::CONDITION, id(bridge_weather_condition));
          dual_mcu::link.send_weather_text(dual_mcu::WeatherTextField::LOCATION, id(bridge_weather_location));
          if (dual_mcu::bridge_forecast_cache.daily_valid_mask != 0 ||
              dual_mcu::bridge_forecast_cache.hourly_valid_mask != 0) {
            dual_mcu::link.send_weather_forecast(dual_mcu::bridge_forecast_cache);
          }
      - delay: 8ms
      - lambda: |-
          dual_mcu::RadarMeta radar;
          radar.eta_valid = id(bridge_radar_eta_valid);
          radar.eta_minutes = static_cast<int16_t>(
            std::clamp(id(bridge_radar_eta_minutes), 0, 32767));
          radar.raining = id(bridge_radar_raining);
          const float dr = id(bridge_radar_motion_dr);
          const float dc = id(bridge_radar_motion_dc);
          const float speed = id(bridge_radar_motion_speed);
          const float vector_length = sqrtf(dr * dr + dc * dc);
          radar.direction_valid =
            id(bridge_radar_motion_valid) && speed >= 2.0f &&
            vector_length > 0.0001f;
          radar.speed_valid = radar.direction_valid;
          if (radar.direction_valid) {
            float bearing = atan2f(-dc, -dr) * 180.0f / static_cast<float>(M_PI);
            if (bearing < 0.0f) bearing += 360.0f;
            radar.direction_tenths = static_cast<uint16_t>(
              std::clamp(static_cast<int>(lroundf(bearing * 10.0f)), 0, 3599));
            radar.speed_tenths = static_cast<uint16_t>(
              std::clamp(static_cast<int>(lroundf(speed * 10.0f)), 0, 65535));
          }
          dual_mcu::link.send_radar_meta(radar);
      - delay: 8ms
      - lambda: |-
          const bool light_on[] = {id(bridge_light_1_on), id(bridge_light_2_on),
                                   id(bridge_light_3_on), id(bridge_light_4_on)};
          const int brightness[] = {id(bridge_light_1_brightness), id(bridge_light_2_brightness),
                                    id(bridge_light_3_brightness), id(bridge_light_4_brightness)};
          for (uint8_t slot = 0; slot < 4; slot++) {
            const uint8_t light[] = {
              slot, static_cast<uint8_t>(light_on[slot] ? 0x01 : 0x00),
              static_cast<uint8_t>(std::clamp(brightness[slot], 0, 100))};
            dual_mcu::link.send(dual_mcu::MessageType::LIGHT_STATE, light, sizeof(light));
          }
          const uint16_t light_1_kelvin =
            static_cast<uint16_t>(std::clamp(id(bridge_light_1_color_temp), 1000, 10000));
          const uint8_t light_1_detail[] = {
            0, 0x01, static_cast<uint8_t>(light_1_kelvin & 0xFF),
            static_cast<uint8_t>((light_1_kelvin >> 8) & 0xFF), 0, 0, 0};
          dual_mcu::link.send(
            dual_mcu::MessageType::LIGHT_DETAIL_STATE,
            light_1_detail, sizeof(light_1_detail));
          const uint8_t light_4_detail[] = {
            3, 0x02, 0, 0,
            static_cast<uint8_t>(std::clamp(id(bridge_light_4_rgb_red), 0, 255)),
            static_cast<uint8_t>(std::clamp(id(bridge_light_4_rgb_green), 0, 255)),
            static_cast<uint8_t>(std::clamp(id(bridge_light_4_rgb_blue), 0, 255))};
          dual_mcu::link.send(
            dual_mcu::MessageType::LIGHT_DETAIL_STATE,
            light_4_detail, sizeof(light_4_detail));
          id(bridge_last_snapshot_ms) = millis();
      - script.execute: send_bridge_wled_presets
      - script.wait: send_bridge_wled_presets
      - script.execute:
          id: send_bridge_light_detail_catalog
          slot: 0
      - script.execute:
          id: send_bridge_light_detail_catalog
          slot: 1
      - script.execute:
          id: send_bridge_light_detail_catalog
          slot: 2
      - script.execute:
          id: send_bridge_light_detail_catalog
          slot: 3

  - id: execute_bridge_action
    mode: queued
    max_runs: 8
    parameters:
      kind: int
      value: int
      entity: std::string
    then:
      - if:
          condition:
            lambda: |-
              return kind ==
                       static_cast<int>(dual_mcu::HAAction::WLED_PRESET) &&
                     value >= 0 &&
                     value < static_cast<int>(
                       id(bridge_wled_preset_options).size());
          then:
            - script.execute:
                id: publish_bridge_ha_command
                kind: !lambda 'return kind;'
                value: !lambda 'return value;'
                entity: !lambda 'return entity;'
                option: !lambda |-
                  return id(bridge_wled_preset_options)[value];
            - script.stop: execute_bridge_action
      - script.execute:
          id: publish_bridge_ha_command
          kind: !lambda 'return kind;'
          value: !lambda 'return value;'
          entity: !lambda 'return entity;'
          option: ""

  - id: execute_bridge_text_action
    mode: queued
    max_runs: 4
    parameters:
      kind: int
      entity: std::string
      value: std::string
    then:
      - script.execute:
          id: publish_bridge_ha_command
          kind: !lambda 'return kind;'
          value: '0'
          entity: !lambda 'return entity;'
