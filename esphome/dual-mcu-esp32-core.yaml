  - id: send_bridge_snapshot
    mode: restart
    then:
      - lambda: |-
          if (dual_mcu::radar_server.busy()) return;
          const uint8_t status[] = {
            static_cast<uint8_t>(id(bridge_api_connected) ? 0xFF : 0x7E),
            static_cast<uint8_t>(id(bridge_mqtt_client).is_connected() ? 0x01 : 0x00),
          };
          dual_mcu::link.send(dual_mcu::MessageType::BRIDGE_STATUS, status, sizeof(status));
          dual_mcu::MediaState media;
          media.state = static_cast<uint8_t>(std::clamp(id(bridge_media_state), 0, 4));
          media.volume_pct = static_cast<uint8_t>(std::clamp(id(bridge_media_volume_pct), 0, 100));
          media.shuffle = id(bridge_media_shuffle);
          media.repeat_one = id(bridge_media_repeat_one);
          media.position_seconds = id(bridge_media_position_seconds);
          media.duration_seconds = id(bridge_media_duration_seconds);
          dual_mcu::link.send_media_state(media);
          dual_mcu::link.send_media_text(dual_mcu::MediaTextField::TITLE, id(bridge_media_title));
          dual_mcu::link.send_media_text(dual_mcu::MediaTextField::ARTIST, id(bridge_media_artist));
          dual_mcu::link.send_media_text(
            dual_mcu::MediaTextField::FRIENDLY_NAME,
            id(bridge_media_friendly_name));
          dual_mcu::link.send_media_text(
            dual_mcu::MediaTextField::ALBUM_ARTIST,
            id(bridge_media_album_artist));
          dual_mcu::cover_url_sender.queue(id(bridge_media_cover_url));
          id(bridge_media_cover_proxy_status).publish_state(
            id(bridge_media_cover_url).empty()
              ? "Snapshot ohne Cover" : "Snapshot-Übertragung");
          dual_mcu::WeatherState weather;
          weather.temperature_valid = id(bridge_weather_temperature_valid);
          weather.humidity_valid = id(bridge_weather_humidity_valid);
          weather.wind_valid = id(bridge_weather_wind_valid);
          weather.precipitation_valid = id(bridge_weather_precipitation_valid);
          weather.temperature_tenths = static_cast<int16_t>(id(bridge_weather_temperature_tenths));
          weather.humidity_pct = static_cast<uint8_t>(id(bridge_weather_humidity_pct));
          weather.wind_tenths = static_cast<uint16_t>(id(bridge_weather_wind_tenths));
          weather.precipitation_probability =
            static_cast<uint8_t>(id(bridge_weather_precipitation_pct));
          dual_mcu::link.send_weather_state(weather);
          dual_mcu::link.send_weather_text(dual_mcu::WeatherTextField::CONDITION, id(bridge_weather_condition));
          dual_mcu::link.send_weather_text(dual_mcu::WeatherTextField::LOCATION, id(bridge_weather_location));
          if (dual_mcu::bridge_forecast_cache.daily_valid_mask != 0 ||
              dual_mcu::bridge_forecast_cache.hourly_valid_mask != 0) {
            dual_mcu::link.send_weather_forecast(dual_mcu::bridge_forecast_cache);
          }
          dual_mcu::RadarMeta radar;
          radar.eta_valid = id(bridge_radar_eta_valid);
          radar.eta_minutes = static_cast<int16_t>(
            std::clamp(id(bridge_radar_eta_minutes), 0, 32767));
          radar.raining = id(bridge_radar_raining);
          const float dr = id(bridge_radar_motion_dr);
          const float dc = id(bridge_radar_motion_dc);
          const float speed = id(bridge_radar_motion_speed);
          const float vector_length = sqrtf(dr * dr + dc * dc);
          radar.direction_valid =
            id(bridge_radar_motion_valid) && speed >= 2.0f &&
            vector_length > 0.0001f;
          radar.speed_valid = radar.direction_valid;
          if (radar.direction_valid) {
            float bearing = atan2f(-dc, -dr) * 180.0f / static_cast<float>(M_PI);
            if (bearing < 0.0f) bearing += 360.0f;
            radar.direction_tenths = static_cast<uint16_t>(
              std::clamp(static_cast<int>(lroundf(bearing * 10.0f)), 0, 3599));
            radar.speed_tenths = static_cast<uint16_t>(
              std::clamp(static_cast<int>(lroundf(speed * 10.0f)), 0, 65535));
          }
          dual_mcu::link.send_radar_meta(radar);
          const bool light_on[] = {id(bridge_light_1_on), id(bridge_light_2_on),
                                   id(bridge_light_3_on), id(bridge_light_4_on)};
          const int brightness[] = {id(bridge_light_1_brightness), id(bridge_light_2_brightness),
                                    id(bridge_light_3_brightness), id(bridge_light_4_brightness)};
          for (uint8_t slot = 0; slot < 4; slot++) {
            const uint8_t light[] = {
              slot, static_cast<uint8_t>(light_on[slot] ? 0x01 : 0x00),
              static_cast<uint8_t>(std::clamp(brightness[slot], 0, 100))};
            dual_mcu::link.send(dual_mcu::MessageType::LIGHT_STATE, light, sizeof(light));
          }
          const uint16_t light_1_kelvin =
            static_cast<uint16_t>(std::clamp(id(bridge_light_1_color_temp), 1000, 10000));
          const uint8_t light_1_detail[] = {
            0, 0x01, static_cast<uint8_t>(light_1_kelvin & 0xFF),
            static_cast<uint8_t>((light_1_kelvin >> 8) & 0xFF), 0, 0, 0};
          dual_mcu::link.send(
            dual_mcu::MessageType::LIGHT_DETAIL_STATE,
            light_1_detail, sizeof(light_1_detail));
          const uint8_t light_4_detail[] = {
            3, 0x02, 0, 0,
            static_cast<uint8_t>(std::clamp(id(bridge_light_4_rgb_red), 0, 255)),
            static_cast<uint8_t>(std::clamp(id(bridge_light_4_rgb_green), 0, 255)),
            static_cast<uint8_t>(std::clamp(id(bridge_light_4_rgb_blue), 0, 255))};
          dual_mcu::link.send(
            dual_mcu::MessageType::LIGHT_DETAIL_STATE,
            light_4_detail, sizeof(light_4_detail));
          const size_t legacy_preset_length = std::min(
            id(bridge_light_4_preset_name).size(), dual_mcu::MAX_PAYLOAD - 1);
          uint8_t legacy_preset[dual_mcu::MAX_PAYLOAD]{};
          legacy_preset[0] = 3;
          if (legacy_preset_length > 0)
            memcpy(&legacy_preset[1], id(bridge_light_4_preset_name).data(),
                   legacy_preset_length);
          dual_mcu::link.send(
            dual_mcu::MessageType::LIGHT_PRESET_TEXT, legacy_preset,
            static_cast<uint8_t>(legacy_preset_length + 1));
          id(bridge_wled_preset_generation)++;
          const uint8_t preset_generation = id(bridge_wled_preset_generation);
          const auto &preset_options = id(bridge_wled_preset_options);
          const size_t preset_count = std::min(
            preset_options.size(), static_cast<size_t>(dual_mcu::WLED_PRESET_MAX_ITEMS));
          uint8_t selected_preset = 0xFF;
          for (size_t index = 0; index < preset_count; index++) {
            dual_mcu::link.send_wled_preset_item(
              0, preset_generation, static_cast<uint8_t>(index), preset_options[index]);
            if (preset_options[index] == id(bridge_wled_preset_selected_name))
              selected_preset = static_cast<uint8_t>(index);
          }
          dual_mcu::link.send_wled_preset_meta(
            0, preset_generation, static_cast<uint8_t>(preset_count), selected_preset);
          id(bridge_last_snapshot_ms) = millis();

  - id: execute_bridge_action
    mode: queued
    max_runs: 8
    parameters:
      kind: int
      value: int
      entity: std::string
    then:
      - if:
          condition:
            lambda: 'return kind == static_cast<int>(dual_mcu::HAAction::MEDIA_PREVIOUS);'
          then:
            - homeassistant.service:
                service: media_player.media_previous_track
                data_template:
                  entity_id: !lambda 'return entity;'
      - if:
          condition:
            lambda: 'return kind == static_cast<int>(dual_mcu::HAAction::MEDIA_PLAY_PAUSE);'
          then:
            - homeassistant.service:
                service: media_player.media_play_pause
                data_template:
                  entity_id: !lambda 'return entity;'
      - if:
          condition:
            lambda: 'return kind == static_cast<int>(dual_mcu::HAAction::MEDIA_NEXT);'
          then:
            - homeassistant.service:
                service: media_player.media_next_track
                data_template:
                  entity_id: !lambda 'return entity;'
      - if:
          condition:
            lambda: 'return kind == static_cast<int>(dual_mcu::HAAction::MEDIA_VOLUME);'
          then:
            - homeassistant.service:
                service: media_player.volume_set
                data_template:
                  entity_id: !lambda 'return entity;'
                  volume_level: !lambda 'return to_string(value / 100.0f);'
      - if:
          condition:
            lambda: 'return kind == static_cast<int>(dual_mcu::HAAction::MEDIA_SHUFFLE);'
          then:
            - homeassistant.service:
                service: media_player.shuffle_set
                data_template:
                  entity_id: !lambda 'return entity;'
                  shuffle: !lambda 'return value != 0 ? "true" : "false";'
      - if:
          condition:
            lambda: 'return kind == static_cast<int>(dual_mcu::HAAction::MEDIA_REPEAT_ONE);'
          then:
            - homeassistant.service:
                service: media_player.repeat_set
                data_template:
                  entity_id: !lambda 'return entity;'
                  repeat: !lambda 'return value != 0 ? "one" : "off";'
      - if:
          condition:
            lambda: 'return kind == static_cast<int>(dual_mcu::HAAction::LIGHT_OFF);'
          then:
            - homeassistant.service:
                service: light.turn_off
                data_template:
                  entity_id: !lambda 'return entity;'
      - if:
          condition:
            lambda: 'return kind == static_cast<int>(dual_mcu::HAAction::LIGHT_ON) || kind == static_cast<int>(dual_mcu::HAAction::LIGHT_BRIGHTNESS);'
          then:
            - homeassistant.service:
                service: light.turn_on
                data:
                  transition: "0.15"
                data_template:
                  entity_id: !lambda 'return entity;'
                  brightness_pct: !lambda 'return to_string(std::clamp(value, 1, 100));'
      - if:
          condition:
            lambda: |-
              return kind == static_cast<int>(dual_mcu::HAAction::WLED_PRESET) &&
                     entity == "${wled_preset_entity}" && value >= 0 &&
                     value < static_cast<int>(id(bridge_wled_preset_options).size());
          then:
            - homeassistant.service:
                service: select.select_option
                data_template:
                  entity_id: !lambda 'return entity;'
                  option: !lambda 'return id(bridge_wled_preset_options)[value];'

  - id: execute_bridge_play_media
    # A new user choice supersedes an older unresolved choice. Queuing these
    # actions made the latest tap wait behind obsolete Music Assistant calls.
    mode: restart
    parameters:
      kind: int
      index: int
      uri: std::string
      media_type: std::string
      name: std::string
    then:
      - homeassistant.action:
          action: music_assistant.play_media
          data:
            # ESPHome 2026.7 homeassistant.action has no target: schema.
            # Keep the stable HA entity_id in action data for compatibility.
            entity_id: '${ha_player}'
          data_template:
            media_id: !lambda 'return uri;'
            media_type: !lambda 'return media_type;'
            enqueue: !lambda |-
              return (kind == static_cast<int>(dual_mcu::LibraryKind::PLAYLISTS) ||
                      kind == static_cast<int>(dual_mcu::LibraryKind::PLAYLIST_PAGE))
                ? "replace" : "play";
          on_success:
            - lambda: |-
                id(bridge_ma_service_latency_sensor).publish_state(
                  (micros() - id(bridge_play_started_us)) / 1000.0f);
                id(bridge_last_action_text).publish_state(
                  std::string("play_ok:") + std::to_string(kind) + ":" +
                  std::to_string(index) + ":" + name);
                // A playlist resolves to its first track, so the player's
                // media_content_id can never equal the requested playlist
                // URI. Successful completion of Music Assistant's awaited
                // play_media action confirms that the replacement queue was
                // built and avoids an otherwise guaranteed 8 s timeout.
                if ((kind == static_cast<int>(dual_mcu::LibraryKind::PLAYLISTS) ||
                     kind == static_cast<int>(dual_mcu::LibraryKind::PLAYLIST_PAGE)) &&
                    id(bridge_play_pending) &&
                    id(bridge_play_pending_kind) == kind &&
                    id(bridge_play_pending_index) == index)
                  id(confirm_bridge_play_ready).execute();
          on_error:
            - lambda: |-
                id(bridge_play_pending) = false;
                id(bridge_last_action_text).publish_state(
                  std::string("play_error:") + std::to_string(kind) + ":" +
                  std::to_string(index) + ":" + error);
                const uint8_t response[] = {
                  static_cast<uint8_t>(kind),
                  static_cast<uint8_t>(index & 0xFF),
                  static_cast<uint8_t>((index >> 8) & 0xFF),
                  5,
                };
                dual_mcu::link.send(dual_mcu::MessageType::MEDIA_LIBRARY_PLAY_RESULT,
                                    response, sizeof(response));

interval:
  - interval: 1ms
    then:
      - lambda: |-
          int8_t delta = 0;
          int32_t accumulated = 0;
          while (dual_mcu::encoder.pop(&delta)) accumulated += delta;
          if (accumulated != 0) {
            id(esp32_ec2_count) += accumulated;
            dual_mcu::link.send_i32(dual_mcu::MessageType::ENCODER_DELTA, accumulated);
          }

          dual_mcu::link.poll();
          dual_mcu::Frame frame;
          while (dual_mcu::link.pop_priority(&frame)) {
            switch (frame.type) {
              case dual_mcu::MessageType::HELLO:
                id(last_s3_heartbeat_ms) = millis();
                // A rebooted peer cannot acknowledge a transfer ID from its
                // previous session. Keep the caches, but abandon the frozen
                // in-flight snapshot before accepting new requests.
                dual_mcu::library_server.reset_transfer();
                if (!id(dual_mcu_link_connected).state)
                  id(dual_mcu_link_connected).publish_state(true);
                if (id(coprocessor_status).state != "S3 verbunden")
                  id(coprocessor_status).publish_state("S3 verbunden");
                id(send_bridge_snapshot).execute();
                break;
              case dual_mcu::MessageType::HEARTBEAT:
                if (!id(dual_mcu_link_connected).state)
                  id(coprocessor_status).publish_state("S3 verbunden");
                id(last_s3_heartbeat_ms) = millis();
                if (!id(dual_mcu_link_connected).state)
                  id(dual_mcu_link_connected).publish_state(true);
                if (frame.length == 4) {
                  id(received_s3_uptime_ms) = dual_mcu::Link::read_u32(frame.payload.data());
                }
                break;
              case dual_mcu::MessageType::DEVICE_STATUS:
                if (frame.length == 4 && frame.payload[0] <= 100) {
                  id(bridge_s3_battery_pct) = frame.payload[0];
                  id(bridge_s3_external_power) =
                    (frame.payload[1] & 0x01) != 0;
                  id(bridge_s3_battery_percentage_sensor).publish_state(
                    id(bridge_s3_battery_pct));
                  id(bridge_s3_external_power_sensor).publish_state(
                    id(bridge_s3_external_power));
                  const uint16_t millivolts =
                    static_cast<uint16_t>(frame.payload[2]) |
                    (static_cast<uint16_t>(frame.payload[3]) << 8);
                  if (millivolts != 0xFFFF)
                    id(bridge_s3_battery_voltage_sensor).publish_state(
                      millivolts / 1000.0f);
                }
                break;
              case dual_mcu::MessageType::TIME_STATE:
                if (frame.length == 4 &&
                    dual_mcu::Link::read_u32(frame.payload.data()) ==
                      id(bridge_last_time_epoch)) {
                  id(bridge_last_time_ack_ms) = millis();
                  if (!id(bridge_s3_time_acknowledged).state)
                    id(bridge_s3_time_acknowledged).publish_state(true);
                  id(bridge_s3_time_ack_age_sensor).publish_state(0);
                }
                break;
              case dual_mcu::MessageType::ENCODER_DIAG:
                if (frame.length == 8) {
                  id(received_s3_ec1_count) = dual_mcu::Link::read_i32(&frame.payload[0]);
                  id(s3_reported_ec2_count) = dual_mcu::Link::read_i32(&frame.payload[4]);
                }
                break;
              case dual_mcu::MessageType::PING:
                dual_mcu::link.send(dual_mcu::MessageType::PONG,
                                    frame.payload.data(), frame.length);
                break;
              case dual_mcu::MessageType::PONG:
                if (frame.length == 4) {
                  const uint32_t token = dual_mcu::Link::read_u32(frame.payload.data());
                  id(link_ping_sensor).publish_state(static_cast<float>(millis() - token));
                }
                break;
              case dual_mcu::MessageType::LATENCY_PROBE:
                if (frame.length == 4) {
                  const uint32_t sequence =
                    dual_mcu::Link::read_u32(frame.payload.data());
                  dual_mcu::link.send_u32(
                    dual_mcu::MessageType::LATENCY_BRIDGE_ACK, sequence);
                  if (!id(bridge_api_connected)) {
                    dual_mcu::link.send_pair_u32(
                      dual_mcu::MessageType::LATENCY_RESULT, sequence, 0, 1);
                  } else if (id(latency_probe_pending)) {
                    dual_mcu::link.send_pair_u32(
                      dual_mcu::MessageType::LATENCY_RESULT, sequence, 0, 2);
                  } else {
                    id(latency_probe_sequence) = sequence;
                    id(latency_probe_started_us) = micros();
                    id(latency_probe_pending) = true;
                    id(run_latency_ha_probe).execute();
                  }
                }
                break;
              case dual_mcu::MessageType::VOLUME_SET:
                if (frame.length == 5) {
                  const uint32_t sequence =
                    dual_mcu::Link::read_u32(&frame.payload[0]);
                  const uint8_t target =
                    std::min<uint8_t>(frame.payload[4], 100);
                  // Receipt acknowledgement is emitted before HA work.
                  dual_mcu::link.send_pair_u32(
                    dual_mcu::MessageType::VOLUME_BRIDGE_ACK,
                    sequence, 0, id(bridge_api_connected) ? 0 : 1);
                  if (!id(bridge_api_connected)) {
                    dual_mcu::link.send_pair_u32(
                      dual_mcu::MessageType::VOLUME_RESULT,
                      sequence, 0, 1);
                    break;
                  }
                  id(volume_command_sequence) = sequence;
                  id(volume_command_target_pct) = target;
                  id(volume_command_started_us) = micros();
                  id(volume_command_pending) = true;
                  id(bridge_action_count)++;
                  // Do not publish diagnostics on the same API connection
                  // before volume_set. The 1 s stats block publishes the
                  // aggregate counter without delaying user control.
                  id(execute_bridge_volume).execute(target);
                }
                break;
              case dual_mcu::MessageType::SNAPSHOT_REQUEST:
                id(send_bridge_snapshot).execute();
                break;
              case dual_mcu::MessageType::HA_ACTION:
                if (frame.length >= 3 && id(bridge_api_connected)) {
                  const int kind = frame.payload[0];
                  const int value = frame.payload[1];
                  const std::string entity = dual_mcu::Link::read_string(
                    &frame.payload[2], frame.length - 2);
                  if (!entity.empty()) {
                    id(bridge_action_count)++;
                    id(bridge_action_count_sensor).publish_state(id(bridge_action_count));
                    id(bridge_last_action_text).publish_state(
                      std::to_string(kind) + ":" + entity + "=" + std::to_string(value));
                    id(execute_bridge_action).execute(kind, value, entity);
                  }
                }
                break;
              case dual_mcu::MessageType::MEDIA_LIBRARY_PLAY:
                if (frame.length == 3) {
                  const uint8_t kind = frame.payload[0];
                  const uint16_t index = static_cast<uint16_t>(frame.payload[1]) |
                                         (static_cast<uint16_t>(frame.payload[2]) << 8);
                  uint8_t result = 1;
                  dual_mcu::LibraryEntry entry;
                  if (!id(bridge_api_connected)) {
                    result = 2;
                  } else if (!dual_mcu::library_server.entry(
                               static_cast<dual_mcu::LibraryKind>(kind), index, &entry)) {
                    result = 3;
                  } else if (entry.uri.empty()) {
                    result = 4;
                  } else {
                    std::string media_type = entry.media_type;
                    if (kind == static_cast<uint8_t>(dual_mcu::LibraryKind::PLAYLIST_TRACKS))
                      media_type = "track";
                    if (media_type.empty())
                      media_type = kind == static_cast<uint8_t>(dual_mcu::LibraryKind::RADIOS)
                        ? "radio" : kind == static_cast<uint8_t>(dual_mcu::LibraryKind::PODCASTS)
                        ? "podcast" : "track";
                    id(bridge_action_count)++;
                    id(bridge_action_count_sensor).publish_state(id(bridge_action_count));
                    id(bridge_last_action_text).publish_state(
                      std::string("play:") + std::to_string(kind) + ":" +
                      std::to_string(index) + ":" + entry.name);
                    // Acknowledge queue admission immediately. The S3 keeps
                    // its modal progress state until the final HA callback
                    // reports success (0) or failure (5).
                    const uint8_t accepted[] = {
                      kind,
                      static_cast<uint8_t>(index & 0xFF),
                      static_cast<uint8_t>((index >> 8) & 0xFF),
                      0x7F,
                    };
                    dual_mcu::link.send(
                      dual_mcu::MessageType::MEDIA_LIBRARY_PLAY_RESULT,
                      accepted, sizeof(accepted));
                    id(bridge_play_pending) = true;
                    id(bridge_play_started_us) = micros();
                    id(bridge_play_pending_kind) = kind;
                    id(bridge_play_pending_index) = index;
                    id(bridge_play_expected_uri) = entry.uri;
                    id(execute_bridge_play_media).execute(
                      kind, index, entry.uri, media_type, entry.name);
                    result = 0;
                  }
                  if (result != 0) {
                    const uint8_t response[] = {
                      kind,
                      static_cast<uint8_t>(index & 0xFF),
                      static_cast<uint8_t>((index >> 8) & 0xFF),
                      result,
                    };
                    dual_mcu::link.send(dual_mcu::MessageType::MEDIA_LIBRARY_PLAY_RESULT,
                                        response, sizeof(response));
                  }
                }
                break;
              case dual_mcu::MessageType::LIBRARY_PAGE_FETCH:
                if (frame.length == 6 || frame.length == 8) {
                  const uint8_t kind = frame.payload[0];
                  const uint16_t offset = static_cast<uint16_t>(frame.payload[1]) |
                                          (static_cast<uint16_t>(frame.payload[2]) << 8);
                  const uint8_t limit = frame.payload[3];
                  const uint16_t playlist_index =
                    static_cast<uint16_t>(frame.payload[4]) |
                    (static_cast<uint16_t>(frame.payload[5]) << 8);
                  const uint16_t context = frame.length == 8
                    ? static_cast<uint16_t>(frame.payload[6]) |
                        (static_cast<uint16_t>(frame.payload[7]) << 8)
                    : 0;
                  uint8_t result = 1;
                  std::string payload;
                  std::string request_id;
                  if ((kind == 4 || kind == 5) && limit > 0 && limit <= 64) {
                    if (!id(bridge_mqtt_client).is_connected()) {
                      result = 2;
                    } else {
                      DynamicJsonDocument doc(384);
                      request_id = std::string("${s3_device_name}-uart-") +
                                   std::to_string(kind) + "-" +
                                   std::to_string(context) + "-" +
                                   std::to_string(millis());
                      doc["request_id"] = request_id;
                      doc["device"] = "${s3_device_name}";
                      doc["offset"] = offset;
                      doc["limit"] = limit;
                      if (kind == 4) {
                        doc["media_type"] = "playlist";
                        serializeJson(doc, payload);
                        result = id(bridge_mqtt_client).publish(
                          "${playlist_request_topic}", payload) ? 0 : 5;
                      } else {
                        dual_mcu::LibraryEntry playlist;
                        bool found = dual_mcu::library_server.entry(
                          dual_mcu::LibraryKind::PLAYLIST_PAGE,
                          playlist_index, &playlist);
                        if (!found) {
                          found = dual_mcu::library_server.entry(
                            dual_mcu::LibraryKind::PLAYLISTS,
                            playlist_index, &playlist);
                        }
                        if (!found) {
                          result = 3;
                        } else if (playlist.uri.empty() && playlist.item_id.empty()) {
                          result = 4;
                        } else {
                          id(bridge_pending_track_request_id) = request_id;
                          id(bridge_pending_track_generation) = context;
                          doc["playlist_id"] = playlist.uri;
                          doc["playlist_item_id"] = playlist.item_id;
                          doc["generation"] = context;
                          serializeJson(doc, payload);
                          result = id(bridge_mqtt_client).publish(
                            "${playlist_tracks_request_topic}", payload) ? 0 : 5;
                          if (result != 0)
                            id(bridge_pending_track_request_id).clear();
                        }
                      }
                    }
                  }
                  const uint8_t response[] = {kind, result};
                  dual_mcu::link.send(
                    dual_mcu::MessageType::LIBRARY_PAGE_FETCH_RESULT,
                    response, sizeof(response));
                  id(bridge_library_proxy_status).publish_state(
                    result == 0
                      ? std::string(kind == 4 ? "Playlist" : "Track") +
                          "-Anfrage MQTT: offset=" + std::to_string(offset) +
                          " gen=" + std::to_string(context) +
                          " playlist=" + std::to_string(playlist_index)
                      : std::string("Paging-Anfrage Fehler ") +
                          std::to_string(result) + " kind=" + std::to_string(kind));
                }
                break;
              case dual_mcu::MessageType::RADAR_REQUEST: {
                const auto kind = frame.length >= 3
                  ? static_cast<dual_mcu::AssetKind>(frame.payload[0])
                  : dual_mcu::AssetKind::RADAR;
                const bool force = frame.length >= 3
                  ? (frame.payload[1] & 0x01) != 0
                  : frame.length >= 1 && (frame.payload[0] & 0x01) != 0;
                const uint8_t argument = frame.length >= 3
                  ? frame.payload[2]
                  : (frame.length >= 2 ? frame.payload[1] : 1);
                std::string url;
                if (kind == dual_mcu::AssetKind::RADAR) {
                  const uint8_t zoom = std::min<uint8_t>(argument, 2);
                  url = std::string("/local/scrollwheel/rain_radar_z") +
                        std::to_string(zoom) + ".jpg";
                } else if (kind == dual_mcu::AssetKind::MEDIA_COVER) {
                  url = id(bridge_media_cover_url);
                  // Music Assistant's image proxy rejects 128px for this
                  // provider (HTTP 400); 256px is the smallest supported
                  // source and cuts the original 512px payload by about 69%.
                  if (url.find("/imageproxy") != std::string::npos) {
                    const std::string needle = "size=";
                    const size_t query = url.find('?');
                    const size_t pos = query == std::string::npos
                      ? std::string::npos : url.find(needle, query + 1);
                    const std::string desired_size = "256";
                    if (pos == std::string::npos) {
                      url += url.find('?') == std::string::npos ? "?" : "&";
                      url += needle + desired_size;
                    } else {
                      const size_t start = pos + needle.size();
                      size_t end = url.find('&', start);
                      if (end == std::string::npos) end = url.size();
                      url.replace(start, end - start, desired_size);
                    }
                  }
                } else if (kind == dual_mcu::AssetKind::PHOTO) {
                  const char *photos[] = {
                    "${photo_image_url_0}", "${photo_image_url_1}",
                    "${photo_image_url_2}"};
                  url = photos[std::min<uint8_t>(argument, 2)];
                } else if (kind == dual_mcu::AssetKind::HOUSE) {
                  url = "${house_floorplan_image_url}";
                }
                while (!url.empty() && isspace(static_cast<unsigned char>(url.front()))) url.erase(url.begin());
                while (!url.empty() && isspace(static_cast<unsigned char>(url.back()))) url.pop_back();
                if (!url.empty() && url[0] == '/') {
                  std::string base = "${ha_base_url}";
                  while (!base.empty() && base.back() == '/') base.pop_back();
                  url = base + url;
                }
                if (kind == dual_mcu::AssetKind::RADAR &&
                    (url.empty() || url == "unknown" || url == "unavailable"))
                  url = id(bridge_radar_image_path);
                if (force && !url.empty()) {
                  const char separator = url.find('?') == std::string::npos ? '?' : '&';
                  url += separator;
                  url += "proxy_force=";
                  url += std::to_string(millis());
                }
                if (url.rfind("http://", 0) != 0 && url.rfind("https://", 0) != 0) {
                  id(bridge_radar_proxy_status).publish_state(
                    std::string("Ungültige Asset-URL: ") +
                    dual_mcu::asset_kind_name(kind));
                  const uint8_t error[] = {0, 0, 11};
                  dual_mcu::link.send(dual_mcu::MessageType::RADAR_ERROR, error, sizeof(error));
                } else if (dual_mcu::radar_server.start(url)) {
                  id(bridge_radar_proxy_status).publish_state(
                    std::string("Übertragung: ") +
                    dual_mcu::asset_kind_name(kind));
                } else {
                  id(bridge_radar_proxy_status).publish_state("Asset-Proxy beschäftigt");
                  const uint8_t error[] = {0, 0, 12};
                  dual_mcu::link.send(dual_mcu::MessageType::RADAR_ERROR, error, sizeof(error));
                }
                break;
              }
              case dual_mcu::MessageType::RADAR_ACK:
                if (dual_mcu::radar_server.acknowledge(frame) &&
                    !dual_mcu::radar_server.busy())
                  id(bridge_radar_proxy_status).publish_state("Bereit");
                break;
              case dual_mcu::MessageType::LIBRARY_REQUEST:
                if (dual_mcu::library_server.handle_request(dual_mcu::link, frame))
                  id(bridge_library_proxy_status).publish_state("Übertragung läuft");
                break;
              case dual_mcu::MessageType::LIBRARY_ACK:
                if (dual_mcu::library_server.acknowledge(frame) &&
                    !dual_mcu::library_server.busy()) {
                  const auto completed = dual_mcu::library_server.current_kind();
                  if (completed == dual_mcu::LibraryKind::PLAYLIST_PAGE) {
                    id(bridge_library_proxy_status).publish_state(
                      std::string("Playlist-Seite übertragen: ") +
                      std::to_string(dual_mcu::library_server.count(completed)));
                  } else if (completed == dual_mcu::LibraryKind::PLAYLIST_TRACKS) {
                    id(bridge_library_proxy_status).publish_state(
                      std::string("Track-Seite übertragen: ") +
                      std::to_string(dual_mcu::library_server.count(completed)));
                  } else {
                    id(bridge_library_proxy_status).publish_state(
                      std::string("P ") + std::to_string(dual_mcu::library_server.count(dual_mcu::LibraryKind::PLAYLISTS)) +
                      " · R " + std::to_string(dual_mcu::library_server.count(dual_mcu::LibraryKind::RADIOS)) +
                      " · O " + std::to_string(dual_mcu::library_server.count(dual_mcu::LibraryKind::PODCASTS)));
                  }
                }
                break;
              case dual_mcu::MessageType::LIBRARY_CLIENT_STATUS:
                if (frame.length == 4) {
                  const uint8_t kind = frame.payload[0];
                  const uint16_t count =
                    static_cast<uint16_t>(frame.payload[1]) |
                    (static_cast<uint16_t>(frame.payload[2]) << 8);
                  const uint8_t result = frame.payload[3];
                  id(bridge_library_proxy_status).publish_state(
                    result == 0
                      ? std::string("S3 bestätigt Liste ") +
                          std::to_string(kind) + ": " +
                          std::to_string(count) + " Einträge"
                      : std::string("S3 Listenfehler ") +
                          std::to_string(kind) + ": " +
                          std::to_string(result));
                }
                break;
              case dual_mcu::MessageType::MEDIA_COVER_URL_ACK: {
                uint8_t result = 0xFF;
                if (dual_mcu::cover_url_sender.acknowledge(frame, &result)) {
                  id(bridge_media_cover_proxy_status).publish_state(
                    result == 0 ? "S3 hat Cover-URL übernommen"
                                : "S3 meldet URL-Fehler");
                }
                break;
              }
              default:
                break;
            }
          }

          // One bulk frame every 4 ms caps radar traffic at roughly 10 kB/s.
          // Encoder, action and state frames above always go first. Together
          // with the receiver queue this also tolerates short LVGL stalls.
          // Cover URLs use the same cooperative rule: at most one short frame
          // after all latency-sensitive input and action frames.
          dual_mcu::cover_url_sender.poll_send(dual_mcu::link);
          static uint32_t last_radar_frame_ms = 0;
          const bool radar_was_busy = dual_mcu::radar_server.busy();
          if (millis() - last_radar_frame_ms >= 4 &&
              dual_mcu::radar_server.poll_send(dual_mcu::link)) {
            last_radar_frame_ms = millis();
          }
          if (radar_was_busy && !dual_mcu::radar_server.busy())
            id(bridge_radar_proxy_status).publish_state("Bereit");
          if (!dual_mcu::radar_server.busy())
            dual_mcu::library_server.poll_send(dual_mcu::link);

          if (id(latency_probe_pending) &&
              micros() - id(latency_probe_started_us) > 1900000U) {
            const uint32_t sequence = id(latency_probe_sequence);
            const uint32_t elapsed_us =
              micros() - id(latency_probe_started_us);
            id(latency_probe_pending) = false;
            dual_mcu::link.send_pair_u32(
              dual_mcu::MessageType::LATENCY_RESULT, sequence, elapsed_us, 3);
          }
          if (id(volume_command_pending) &&
              micros() - id(volume_command_started_us) > 2000000U) {
            const uint32_t sequence = id(volume_command_sequence);
            id(volume_command_pending) = false;
            dual_mcu::link.send_pair_u32(
              dual_mcu::MessageType::VOLUME_RESULT, sequence, 0, 2);
          }
          if (id(bridge_play_pending) &&
              micros() - id(bridge_play_started_us) > 8000000U) {
            const uint8_t response[] = {
              id(bridge_play_pending_kind),
              static_cast<uint8_t>(id(bridge_play_pending_index) & 0xFF),
              static_cast<uint8_t>((id(bridge_play_pending_index) >> 8) & 0xFF),
              6,
            };
            id(bridge_play_pending) = false;
            dual_mcu::link.send(
              dual_mcu::MessageType::MEDIA_LIBRARY_PLAY_RESULT,
              response, sizeof(response));
          }

          const bool link_up = id(last_s3_heartbeat_ms) != 0 &&
                               millis() - id(last_s3_heartbeat_ms) < 1500;
          if (!link_up && id(dual_mcu_link_connected).state) {
            id(dual_mcu_link_connected).publish_state(false);
            id(coprocessor_status).publish_state("S3 Link unterbrochen");
          }

          if (millis() - id(last_stats_publish_ms) >= 1000) {
            id(last_stats_publish_ms) = millis();
            const auto &stats = dual_mcu::link.stats();
            id(protocol_error_sensor).publish_state(
              stats.crc_errors + stats.decode_errors + stats.version_errors + stats.queue_overflows);
            id(encoder_overflow_sensor).publish_state(dual_mcu::encoder.overflows());
            id(esp32_encoder_count_sensor).publish_state(id(esp32_ec2_count));
            id(s3_encoder_count_sensor).publish_state(id(received_s3_ec1_count));
            id(encoder_difference_sensor).publish_state(
              id(esp32_ec2_count) - id(received_s3_ec1_count));
            id(s3_uptime_sensor).publish_state(id(received_s3_uptime_ms) / 1000.0f);
            id(bridge_action_count_sensor).publish_state(
              id(bridge_action_count));
            const bool time_ack_fresh =
              id(bridge_last_time_ack_ms) != 0 &&
              millis() - id(bridge_last_time_ack_ms) < 30000UL;
            if (id(bridge_s3_time_acknowledged).state != time_ack_fresh)
              id(bridge_s3_time_acknowledged).publish_state(time_ack_fresh);
            if (id(bridge_last_time_ack_ms) != 0)
              id(bridge_s3_time_ack_age_sensor).publish_state(
                (millis() - id(bridge_last_time_ack_ms)) / 1000.0f);
          }

  - interval: 500ms
    then:
      - if:
          condition:
            api.connected:
          then:
            - lambda: |-
                id(bridge_api_connected) = true;
                if (!id(bridge_forecast_requested)) {
                  id(bridge_forecast_requested) = true;
                  id(fetch_bridge_forecast).execute();
                }
          else:
            - lambda: |-
                id(bridge_api_connected) = false;
                id(bridge_forecast_requested) = false;
      - lambda: |-
          dual_mcu::link.send_u32(dual_mcu::MessageType::HEARTBEAT, millis());
          const auto bridge_now = id(bridge_time).now();
          if (bridge_now.is_valid() &&
              millis() - id(bridge_last_time_sent_ms) >= 10000UL) {
            id(bridge_last_time_epoch) =
              static_cast<uint32_t>(bridge_now.timestamp);
            dual_mcu::link.send_u32(
              dual_mcu::MessageType::TIME_STATE,
              id(bridge_last_time_epoch));
            id(bridge_last_time_sent_ms) = millis();
          }
          const uint8_t status[] = {
            static_cast<uint8_t>(id(bridge_api_connected) ? 0xFF : 0x7E),
            static_cast<uint8_t>(id(bridge_mqtt_client).is_connected() ? 0x01 : 0x00),
          };
          dual_mcu::link.send(dual_mcu::MessageType::BRIDGE_STATUS,
                              status, sizeof(status));
          // Individual Home Assistant callbacks already push changed state.
          // The periodic snapshot is only a loss-recovery guard; keeping it
          // infrequent avoids a burst of redundant redraws on the S3.
          if (millis() - id(bridge_last_snapshot_ms) >= 60000) {
            id(send_bridge_snapshot).execute();
          }

  - interval: 15min
    then:
      - if:
          condition:
            api.connected:
          then:
            - script.execute: fetch_bridge_forecast
