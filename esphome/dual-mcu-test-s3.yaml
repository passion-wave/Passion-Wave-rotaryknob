packages:
  application: !include dual-mcu-s3-core.yaml
  remove_public_ota:
    ota: !remove
  private_ota:
    ota:
      - platform: esphome
        id: ota_esphome
        password: !secret ota_password

# Private test-device wrapper. Factory builds include the core directly.
substitutions:
  # Native Music Assistant entity for the Sonos Move test device.
  ha_player: "media_player.wohnzimmer_2"
  # The coprocessor subscribes to these exact Home Assistant entities.
  light_1_entity: "light.hue_color_lamp_1_3"
  light_2_entity: "light.ambiente"
  light_3_entity: "light.hue_color_lamp_1_2"
  light_4_entity: "light.passion_wave_light_4"
  mqtt_host: !secret mqtt_host
  mqtt_username: !secret mqtt_username
  mqtt_password: !secret mqtt_password
  ha_weather: !secret ha_weather_entity
  weather_location: !secret weather_location_fallback
  ha_base_url: !secret home_assistant_base_url
  rain_radar_image_url: !secret rain_radar_image_url
  photo_image_url_0: !secret photo_image_url_0
  photo_image_url_1: !secret photo_image_url_1
  photo_image_url_2: !secret photo_image_url_2
  house_floorplan_image_url: !secret house_floorplan_image_url

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "Passion Wave Rotary Test"
    password: !secret fallback_ap_password
