  - id: parse_playlist_payload
    mode: restart
    parameters:
      payload: string
    then:
      - lambda: |-
          const std::string incoming = payload;
          char first_non_ws = '\0';
          for (char c : incoming) {
            if (!isspace(static_cast<unsigned char>(c))) {
              first_non_ws = c;
              break;
            }
          }
          if (incoming.size() > 12288 || (first_non_ws != '[' && first_non_ws != '{')) {
            if (!id(pending_playlist_request_id).empty()) {
              id(playlist_autoload_inflight) = false;
              id(playlist_autoload_anchor_count) = 0;
            }
            return;
          }

          DynamicJsonDocument doc(12288);
          if (deserializeJson(doc, incoming)) {
            if (!id(pending_playlist_request_id).empty()) {
              id(playlist_autoload_inflight) = false;
              id(playlist_autoload_anchor_count) = 0;
            }
            id(media_ui_dirty) = true;
            return;
          }

          auto clear_playlists = [&]() {
            id(ma_playlists_names_cache).clear();
            id(ma_playlists_uris_cache).clear();
            id(ma_playlists_item_ids_cache).clear();
            id(ma_playlists_types_cache).clear();
          };
          auto append_playlist = [&](JsonObject item, int fallback_index) {
            const char *name = item["name"] | item["title"] | "";
            const char *uri = item["uri"] | item["id"] | item["url"] | "";
            const char *item_id = item["item_id"] | item["playlist_item_id"] | "";
            const char *type = item["media_type"] | item["type"] | "playlist";
            std::string label = name == nullptr ? "" : std::string(name);
            if (label.empty()) {
              label = "Eintrag " + std::to_string(fallback_index);
            }
            id(ma_playlists_names_cache).push_back(label);
            id(ma_playlists_uris_cache).push_back(uri == nullptr ? "" : std::string(uri));
            id(ma_playlists_item_ids_cache).push_back(item_id == nullptr ? "" : std::string(item_id));
            id(ma_playlists_types_cache).push_back(type == nullptr || type[0] == '\0' ? "playlist" : std::string(type));
          };

          if (doc.is<JsonObject>()) {
            const std::string response_request_id = std::string(doc["request_id"] | "");
            if (!id(pending_playlist_request_id).empty()) {
              if (response_request_id.empty() || response_request_id != id(pending_playlist_request_id)) {
                id(playlist_autoload_inflight) = false;
                id(playlist_autoload_anchor_count) = 0;
                return;
              }
            } else if (!response_request_id.empty() && response_request_id.rfind(App.get_name(), 0) != 0) {
              return;
            }

            JsonArray arr = doc["items"].as<JsonArray>();
            if (arr.isNull()) arr = doc["playlists"].as<JsonArray>();
            if (arr.isNull()) {
              id(playlist_autoload_inflight) = false;
              id(playlist_autoload_anchor_count) = 0;
              return;
            }

            const int response_offset = doc["offset"] | 0;
            if (response_offset <= 0) {
              clear_playlists();
            }
            id(ma_playlists_names_cache).reserve(id(ma_playlists_names_cache).size() + arr.size());
            id(ma_playlists_uris_cache).reserve(id(ma_playlists_uris_cache).size() + arr.size());
            id(ma_playlists_item_ids_cache).reserve(id(ma_playlists_item_ids_cache).size() + arr.size());
            id(ma_playlists_types_cache).reserve(id(ma_playlists_types_cache).size() + arr.size());

            int fallback_index = static_cast<int>(id(ma_playlists_names_cache).size()) + 1;
            for (JsonObject item : arr) {
              append_playlist(item, fallback_index);
              fallback_index++;
            }

            id(ma_playlists_json_cache) = incoming;
            id(playlist_loaded_count) = static_cast<int>(id(ma_playlists_names_cache).size());
            id(playlist_total_available) = doc["total"] | id(playlist_loaded_count);
            id(playlist_request_offset) = doc["next_offset"] | (response_offset + static_cast<int>(arr.size()));
            const bool response_has_more = doc["has_more"] | false;
            id(playlist_has_more) = response_has_more &&
                                    (id(playlist_total_available) == 0 || id(playlist_loaded_count) < id(playlist_total_available));
            id(playlist_autoload_inflight) = false;
            id(playlist_paged_mode_ready) = true;
            id(last_accepted_playlist_request_id) = response_request_id;
            id(pending_playlist_request_id).clear();
            if (response_offset > 0 &&
                id(media_picker_visible) &&
                id(media_picker_tab) == 1 &&
                id(playlist_autoload_anchor_count) > 0 &&
                id(playlist_loaded_count) > id(playlist_autoload_anchor_count)) {
              const int first_new_index = id(playlist_autoload_anchor_count);
              id(selected_playlist_index) = first_new_index;
              id(media_picker_window_start) = first_new_index > 0 ? first_new_index - 1 : 0;
              id(media_picker_scroll_reset_requested) = true;
            }
            id(playlist_autoload_anchor_count) = 0;
          } else if (doc.is<JsonArray>()) {
            if (!id(pending_playlist_request_id).empty() || id(playlist_paged_mode_ready)) {
              return;
            }
            JsonArray arr = doc.as<JsonArray>();
            clear_playlists();
            id(ma_playlists_names_cache).reserve(arr.size());
            id(ma_playlists_uris_cache).reserve(arr.size());
            id(ma_playlists_item_ids_cache).reserve(arr.size());
            id(ma_playlists_types_cache).reserve(arr.size());
            int fallback_index = 1;
            for (JsonObject item : arr) {
              append_playlist(item, fallback_index);
              fallback_index++;
            }
            id(ma_playlists_json_cache) = incoming;
            id(playlist_loaded_count) = static_cast<int>(id(ma_playlists_names_cache).size());
            id(playlist_total_available) = id(playlist_loaded_count);
            id(playlist_request_offset) = id(playlist_loaded_count);
            id(playlist_has_more) = false;
            id(playlist_autoload_inflight) = false;
            id(playlist_paged_mode_ready) = false;
          }

          if (id(selected_playlist_index) >= static_cast<int>(id(ma_playlists_names_cache).size())) {
            id(selected_playlist_index) = static_cast<int>(id(ma_playlists_names_cache).size()) - 1;
          }
          if (id(selected_playlist_index) < 0) {
            id(selected_playlist_index) = 0;
          }
          id(media_ui_dirty) = true;
      - script.execute: refresh_media_picker_popup
      - script.execute: refresh_media_ui_if_needed
  - id: request_initial_playlist_page
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(demo_mode_active) || !id(wifi_connected);'
          then:
            - lambda: |-
                id(playlist_autoload_inflight) = false;
                id(pending_playlist_request_id).clear();
                id(playlist_has_more) = false;
                id(media_ui_dirty) = true;
