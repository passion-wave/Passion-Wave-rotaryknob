      then:
        - lambda: |-
            if (id(light_slot_3_index) != 10 || millis() < id(light_local_change_deadline_ms) || isnan(x)) return;
            int brightness_pct = static_cast<int>(lroundf((x / 255.0f) * 100.0f));
            if (brightness_pct < 0) brightness_pct = 0;
            if (brightness_pct > 100) brightness_pct = 100;
            id(light_3_brightness_pct) = brightness_pct;
            id(light_3_on) = brightness_pct > 0;
            id(light_ui_dirty) = true;
