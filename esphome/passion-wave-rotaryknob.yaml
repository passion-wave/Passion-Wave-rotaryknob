  - id: refresh_weather_ui
    mode: restart
    then:
      - lambda: |-
          auto rounded_int = [](float value) -> int {
            return static_cast<int>(lroundf(value));
          };
          auto mix_channel = [](uint8_t a, uint8_t b, float ratio) -> uint8_t {
            if (ratio < 0.0f) ratio = 0.0f;
            if (ratio > 1.0f) ratio = 1.0f;
            return static_cast<uint8_t>(roundf(static_cast<float>(a) + (static_cast<float>(b) - static_cast<float>(a)) * ratio));
          };
          auto mix_color = [&](uint32_t from, uint32_t to, float ratio) -> uint32_t {
            const uint8_t fr = (from >> 16) & 0xFF;
            const uint8_t fg = (from >> 8) & 0xFF;
            const uint8_t fb = from & 0xFF;
            const uint8_t tr = (to >> 16) & 0xFF;
            const uint8_t tg = (to >> 8) & 0xFF;
            const uint8_t tb = to & 0xFF;
            return (static_cast<uint32_t>(mix_channel(fr, tr, ratio)) << 16) |
                   (static_cast<uint32_t>(mix_channel(fg, tg, ratio)) << 8) |
                   static_cast<uint32_t>(mix_channel(fb, tb, ratio));
          };
          auto temp_index_color = [&](float temp) -> uint32_t {
            struct Stop {
              float temp;
              uint32_t color;
            };
            static const Stop stops[] = {
              {-10.0f, 0x2563EB},
              {5.0f, 0x38BDF8},
              {16.0f, 0x22C55E},
              {24.0f, 0xFACC15},
              {30.0f, 0xFB923C},
              {38.0f, 0xEF4444},
            };
            if (temp <= stops[0].temp) return stops[0].color;
            for (int i = 1; i < 6; i++) {
              if (temp <= stops[i].temp) {
                const float span = stops[i].temp - stops[i - 1].temp;
                const float ratio = span <= 0.1f ? 0.0f : (temp - stops[i - 1].temp) / span;
                return mix_color(stops[i - 1].color, stops[i].color, ratio);
              }
            }
            return stops[5].color;
          };
          float weather_span = id(weather_maximum) - id(weather_minimum);
          int weather_ring = 50;
          if (fabsf(weather_span) > 0.1f) {
            weather_ring = static_cast<int>(roundf(((id(weather_temperature) - id(weather_minimum)) / weather_span) * 100.0f));
          }
          if (weather_ring < 0) weather_ring = 0;
          if (weather_ring > 100) weather_ring = 100;
          if (id(weather_ring_arc) != nullptr) {
            const int tick_rotation = 106 + static_cast<int>(roundf(weather_ring * 159.0f / 100.0f));
            const uint32_t current_color = temp_index_color(id(weather_temperature));
            lv_arc_set_rotation(id(weather_ring_arc), tick_rotation);
            lv_obj_set_style_arc_color(id(weather_ring_arc), lv_color_hex(current_color), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_arc_color(id(weather_ring_arc), lv_color_hex(current_color), LV_PART_INDICATOR | LV_STATE_DEFAULT);
            lv_arc_set_value(id(weather_ring_arc), 100);
            lv_obj_invalidate(id(weather_ring_arc));
          }
          static lv_obj_t *weather_temp_gradient_arcs[18] = {};
          auto create_temp_gradient_arc = [&](int index) -> lv_obj_t * {
            auto *arc = lv_arc_create(id(weather_ring_host));
            lv_obj_set_size(arc, 356, 356);
            lv_obj_center(arc);
            lv_obj_remove_style(arc, nullptr, LV_PART_SCROLLBAR);
            lv_obj_clear_flag(arc, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_set_style_bg_opa(arc, LV_OPA_TRANSP, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_pad_all(arc, 0, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_arc_opa(arc, LV_OPA_COVER, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_arc_width(arc, 6, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_arc_rounded(arc, true, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_arc_opa(arc, LV_OPA_COVER, LV_PART_INDICATOR | LV_STATE_DEFAULT);
            lv_obj_set_style_arc_width(arc, 6, LV_PART_INDICATOR | LV_STATE_DEFAULT);
            lv_obj_set_style_arc_rounded(arc, true, LV_PART_INDICATOR | LV_STATE_DEFAULT);
            lv_obj_set_style_bg_opa(arc, LV_OPA_TRANSP, LV_PART_KNOB | LV_STATE_DEFAULT);
            lv_arc_set_range(arc, 0, 100);
            lv_arc_set_rotation(arc, 106 + (index * 9));
            lv_arc_set_bg_angles(arc, 0, 9);
            lv_arc_set_mode(arc, LV_ARC_MODE_NORMAL);
            lv_arc_set_value(arc, 100);
            return arc;
          };
          auto set_arc_color = [](lv_obj_t *arc, uint32_t color) {
            if (arc == nullptr) return;
            lv_obj_set_style_arc_color(arc, lv_color_hex(color), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_arc_color(arc, lv_color_hex(color), LV_PART_INDICATOR | LV_STATE_DEFAULT);
            lv_obj_invalidate(arc);
          };
          const float gradient_min = fminf(id(weather_minimum), id(weather_maximum));
          const float gradient_max = fmaxf(id(weather_minimum), id(weather_maximum));
          const float gradient_span = gradient_max - gradient_min;
          for (int index = 0; index < 18; index++) {
            if (weather_temp_gradient_arcs[index] == nullptr) {
              weather_temp_gradient_arcs[index] = create_temp_gradient_arc(index);
            }
            const float ratio = static_cast<float>(index) / 17.0f;
            const float sample_temp = gradient_min + (gradient_span <= 0.1f ? 0.0f : gradient_span * ratio);
            set_arc_color(weather_temp_gradient_arcs[index], temp_index_color(sample_temp));
          }
          if (id(weather_ring_arc) != nullptr) {
            lv_obj_move_foreground(id(weather_ring_arc));
          }
          auto set_day_arc = [](lv_obj_t *arc, uint32_t color) {
            if (arc == nullptr) return;
            lv_obj_set_style_arc_color(arc, lv_color_hex(color), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_arc_color(arc, lv_color_hex(color), LV_PART_INDICATOR | LV_STATE_DEFAULT);
            lv_obj_invalidate(arc);
          };
          struct WeatherVisual {
            const char *icon;
            uint32_t color;
          };
          auto weather_visual_for_condition = [](const std::string &condition) -> WeatherVisual {
            if (condition == "lightning" || condition == "lightning-rainy" || condition == "exceptional") {
              return {"\U0000EBDB", 0x050505};
            }
            if (condition == "rainy" || condition == "pouring" || condition == "hail" || condition == "snowy-rainy") {
              return {"\U0000F176", 0x2563EB};
            }
            if (condition == "snowy") {
              return {"\U0000EB3B", 0x38BDF8};
            }
            if (condition == "sunny" || condition == "clear-night") {
              return {"\U0000E430", 0xFACC15};
            }
            return {"\U0000E2BD", 0x94A3B8};
          };
          const WeatherVisual morning_visual = weather_visual_for_condition(id(weather_morning_condition));
          const WeatherVisual noon_visual = weather_visual_for_condition(id(weather_noon_condition));
          const WeatherVisual evening_visual = weather_visual_for_condition(id(weather_evening_condition));
          const uint32_t morning_color = morning_visual.color;
          const uint32_t noon_color = noon_visual.color;
          const uint32_t evening_color = evening_visual.color;
          set_day_arc(id(weather_day_morning_arc), morning_color);
          set_day_arc(id(weather_day_noon_arc), noon_color);
          set_day_arc(id(weather_day_evening_arc), evening_color);
