  - id: refresh_media_picker_popup
    mode: restart
    then:
      - lambda: |-
          if (media_picker_popup == nullptr) return;
          if (!id(media_picker_visible)) {
            lv_obj_add_flag(media_picker_popup, LV_OBJ_FLAG_HIDDEN);
            return;
          }
          lv_obj_clear_flag(media_picker_popup, LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(media_picker_popup);

          auto style_tab = [](lv_obj_t *button, lv_obj_t *label, bool active) {
            if (button == nullptr || label == nullptr) return;
            lv_obj_set_style_bg_color(button, lv_color_hex(active ? 0xEC4899 : 0x1F2937), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_color(label, lv_color_hex(active ? 0xFFFFFF : 0xCBD5E1), LV_PART_MAIN | LV_STATE_DEFAULT);
          };
          style_tab(media_picker_tab_list_button, media_picker_tab_list_label, id(media_picker_tab) == 0);
          style_tab(media_picker_tab_playlist_button, media_picker_tab_playlist_label, id(media_picker_tab) == 1);
          style_tab(media_picker_tab_radio_button, media_picker_tab_radio_label, id(media_picker_tab) == 2);
          style_tab(media_picker_tab_podcast_button, media_picker_tab_podcast_label, id(media_picker_tab) == 3);

          lv_obj_t *buttons[] = {
            media_picker_item_0_button, media_picker_item_1_button, media_picker_item_2_button, media_picker_item_3_button,
            media_picker_item_4_button, media_picker_item_5_button, media_picker_item_6_button, media_picker_item_7_button,
            media_picker_item_8_button, media_picker_item_9_button, media_picker_item_10_button, media_picker_item_11_button,
            media_picker_item_12_button, media_picker_item_13_button, media_picker_item_14_button, media_picker_item_15_button
          };
          lv_obj_t *labels[] = {
            media_picker_item_0_label, media_picker_item_1_label, media_picker_item_2_label, media_picker_item_3_label,
            media_picker_item_4_label, media_picker_item_5_label, media_picker_item_6_label, media_picker_item_7_label,
            media_picker_item_8_label, media_picker_item_9_label, media_picker_item_10_label, media_picker_item_11_label,
            media_picker_item_12_label, media_picker_item_13_label, media_picker_item_14_label, media_picker_item_15_label
          };
          auto set_row = [&](int row, const std::string &text, bool active, bool enabled) {
            if (row < 0 || row >= 16 || buttons[row] == nullptr || labels[row] == nullptr) return;
            lv_label_set_text(labels[row], text.c_str());
            lv_obj_set_style_bg_color(buttons[row], lv_color_hex(active ? 0xEC4899 : 0x111827), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_border_color(buttons[row], lv_color_hex(active ? 0xF9A8D4 : 0x334155), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_color(labels[row], lv_color_hex(enabled ? 0xFFFFFF : 0x64748B), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_clear_flag(buttons[row], LV_OBJ_FLAG_SCROLLABLE);
            if (enabled) {
              lv_obj_add_flag(buttons[row], LV_OBJ_FLAG_CLICKABLE);
              lv_obj_clear_flag(buttons[row], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(buttons[row], LV_OBJ_FLAG_CLICKABLE);
              lv_obj_clear_flag(buttons[row], LV_OBJ_FLAG_HIDDEN);
            }
          };
          auto hide_row = [&](int row) {
            if (row < 0 || row >= 16 || buttons[row] == nullptr) return;
            lv_obj_add_flag(buttons[row], LV_OBJ_FLAG_HIDDEN);
          };

          auto clamp_int = [](int value, int low, int high) -> int {
            if (value < low) return low;
            if (value > high) return high;
            return value;
          };
          auto prepare_window = [&](int total, int selected, int capacity) -> int {
            if (total <= 0 || capacity <= 0) {
              id(media_picker_window_start) = 0;
              return 0;
            }
            selected = clamp_int(selected, 0, total - 1);
            int max_start = total > capacity ? total - capacity : 0;
            int start = id(media_picker_window_start);
            start = clamp_int(start, 0, max_start);
            if (selected < start) start = selected;
            if (selected >= start + capacity) start = selected - capacity + 1;
            start = clamp_int(start, 0, max_start);
            id(media_picker_window_start) = start;
            return start;
          };

          int follow_row = -1;
          for (int i = 0; i < 16; i++) hide_row(i);
          if (id(media_picker_tab) == 0) {
            lv_label_set_text(media_picker_title_label, "Liste");
            const int total = static_cast<int>(id(ma_track_titles_cache).size());
            const bool loading_more = !id(pending_track_request_id).empty() || id(track_autoload_inflight);
            const bool reserve_more_row = id(track_has_more);
            const int capacity = reserve_more_row ? 15 : 16;
            const int start = prepare_window(total, id(selected_track_index), capacity);
            follow_row = id(selected_track_index) - start;
            if (total <= 0) {
              std::string hint = id(chosen_playlist_name).empty() ? "Erst Playlist auswaehlen" : "Liste wird geladen";
              set_row(0, hint, false, false);
            } else {
              int row = 0;
              for (; row < capacity && (start + row) < total; row++) {
                const int item = start + row;
                std::string text = id(ma_track_titles_cache)[item];
                if (item < static_cast<int>(id(ma_track_artists_cache).size()) && !id(ma_track_artists_cache)[item].empty()) {
                  text += " - " + id(ma_track_artists_cache)[item];
                }
                set_row(row, text, item == id(selected_track_index), true);
              }
              if (reserve_more_row && row < 16) {
                set_row(row, loading_more ? "Weitere werden geladen" : "Weitere laden", false, !loading_more);
              }
            }
          } else if (id(media_picker_tab) == 1) {
            lv_label_set_text(media_picker_title_label, "Playlist");
            const int total = static_cast<int>(id(ma_playlists_names_cache).size());
            const bool loading_more = !id(pending_playlist_request_id).empty() || id(playlist_autoload_inflight);
            const bool reserve_more_row = id(playlist_has_more);
            const int capacity = reserve_more_row ? 15 : 16;
            int selected = id(selected_playlist_index);
            int start = 0;
            if (reserve_more_row && selected >= total) {
              start = total > capacity ? total - capacity : 0;
              id(media_picker_window_start) = start;
            } else {
              start = prepare_window(total, selected, capacity);
            }
            follow_row = selected - start;
            if (total <= 0) {
              set_row(0, loading_more ? "Playlists werden geladen" : "Keine Playlists", false, false);
              if (reserve_more_row && !loading_more) {
                set_row(1, "Weiter laden", id(selected_playlist_index) >= total, true);
              }
            } else {
              int row = 0;
              for (; row < capacity && (start + row) < total; row++) {
                const int item = start + row;
                set_row(row, id(ma_playlists_names_cache)[item], item == id(selected_playlist_index), true);
              }
              if (reserve_more_row && row < 16) {
                set_row(row, loading_more ? "Wird geladen" : "Weiter laden", id(selected_playlist_index) >= total, !loading_more);
                if (id(selected_playlist_index) >= total) follow_row = row;
              }
            }
          } else if (id(media_picker_tab) == 2) {
            lv_label_set_text(media_picker_title_label, "Radio");
            const int total = static_cast<int>(id(ma_radios_names_cache).size());
            const int start = prepare_window(total, id(selected_radio_index), 16);
            follow_row = id(selected_radio_index) - start;
            if (total <= 0) {
              set_row(0, "Keine Radios", false, false);
            } else {
              for (int row = 0; row < 16 && (start + row) < total; row++) {
                const int item = start + row;
                set_row(row, id(ma_radios_names_cache)[item], item == id(selected_radio_index), true);
              }
            }
          } else {
            lv_label_set_text(media_picker_title_label, "Podcast");
            const int total = static_cast<int>(id(ma_podcasts_names_cache).size());
            const int start = prepare_window(total, id(selected_podcast_index), 16);
            follow_row = id(selected_podcast_index) - start;
            if (total <= 0) {
              set_row(0, "Keine Podcasts", false, false);
            } else {
              for (int row = 0; row < 16 && (start + row) < total; row++) {
                const int item = start + row;
                set_row(row, id(ma_podcasts_names_cache)[item], item == id(selected_podcast_index), true);
              }
            }
          }
          if (follow_row < 0) follow_row = 0;
          if (follow_row > 15) follow_row = 15;
          int scroll_target = follow_row <= 2 ? 0 : (follow_row * 48) - 96;
          if (scroll_target < 0) scroll_target = 0;
          if (id(media_picker_scroll_reset_requested) || follow_row >= 0) {
            lv_obj_scroll_to_y(media_picker_list, scroll_target, LV_ANIM_OFF);
            id(media_picker_scroll_reset_requested) = false;
          }
  - id: media_select_prev_item
    mode: restart
    then:
      - lambda: |-
          id(ui_last_activity_ms) = millis();
          id(media_last_activity_ms) = millis();
          id(media_list_last_activity_ms) = millis();
