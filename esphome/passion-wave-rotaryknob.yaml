  - id: refresh_weather_screensaver
    mode: restart
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) {
            now = id(sntp_time).now();
          }
          const bool time_valid = now.is_valid();
          const std::string raw = id(weather_condition_raw);
          const bool is_night = raw == "clear-night" || (time_valid && (now.hour >= 20 || now.hour < 6));
          const bool is_rain = raw == "rainy" || raw == "pouring" || raw == "lightning-rainy" || raw == "hail";
          const bool is_snow = raw == "snowy" || raw == "snowy-rainy";
          const bool is_fog = raw == "fog";
          const bool is_partly = raw == "partlycloudy";
          const bool is_cloudy = raw == "cloudy" || is_fog || raw == "windy-variant" || is_partly || is_rain || is_snow;

          const uint32_t sky = is_rain ? (is_night ? 0x0E1422 : 0x5C6E84)
                             : is_snow ? (is_night ? 0x1A223A : 0x96B2CE)
                             : is_cloudy ? (is_night ? 0x121C30 : 0x7088A6)
                             : is_night ? 0x0A122A : 0x589EE4;
          const uint32_t hill_1 = is_night ? 0x123A36 : 0x2A7656;
          const uint32_t hill_2 = is_night ? 0x1C5048 : 0x3A946C;
          const uint32_t hill_3 = is_night ? 0x18443E : 0x32805E;
          const uint32_t label_color = is_night ? 0xF4F7FF : 0xFFFFFF;

          auto style_bg = [](lv_obj_t *obj, uint32_t color) {
            if (obj == nullptr) return;
            lv_obj_set_style_bg_color(obj, lv_color_hex(color), LV_PART_MAIN | LV_STATE_DEFAULT);
          };
          auto style_text = [](lv_obj_t *obj, uint32_t color) {
            if (obj == nullptr) return;
            lv_obj_set_style_text_color(obj, lv_color_hex(color), LV_PART_MAIN | LV_STATE_DEFAULT);
          };
          auto show_obj = [](lv_obj_t *obj, bool visible) {
            if (obj == nullptr) return;
            if (visible) {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };

          style_bg(screensaver_bg, sky);
          style_bg(screensaver_moon_cutout, sky);
          style_bg(screensaver_hill_1, hill_1);
          style_bg(screensaver_hill_2, hill_2);
          style_bg(screensaver_hill_3, hill_3);
          style_text(screensaver_date_label, label_color);
          style_text(screensaver_summary_label, label_color);
          style_text(screensaver_rain_label, label_color);
          style_text(screensaver_temp_label, label_color);
          style_text(screensaver_battery_label, label_color);
          style_text(screensaver_charge_icon_label, label_color);
          show_obj(screensaver_time_shadow_label, false);
          show_obj(screensaver_time_label, false);

          const uint32_t hand_color = 0x334155;
          const uint32_t minute_color = 0x111827;
          lv_obj_set_style_bg_opa(screensaver_clock_host, LV_OPA_TRANSP, LV_PART_MAIN | LV_STATE_DEFAULT);
          lv_obj_set_style_border_width(screensaver_clock_host, 0, LV_PART_MAIN | LV_STATE_DEFAULT);
          style_bg(screensaver_clock_center_dot, minute_color);
          lv_obj_set_style_bg_opa(screensaver_clock_center_dot, LV_OPA_COVER, LV_PART_MAIN | LV_STATE_DEFAULT);
          if (id(screensaver_hour_hand) != nullptr && id(screensaver_minute_hand) != nullptr) {
            if (time_valid) {
              static lv_point_t hour_points[2];
              static lv_point_t minute_points[2];
              const int center = 180;
              const float minute_angle = ((static_cast<float>(now.minute) + static_cast<float>(now.second) / 60.0f) * 6.0f - 90.0f) * 0.0174532925f;
              const float hour_angle = (((now.hour % 12) + static_cast<float>(now.minute) / 60.0f) * 30.0f - 90.0f) * 0.0174532925f;
              hour_points[0] = {center, center};
              hour_points[1] = {
                center + static_cast<lv_coord_t>(roundf(cosf(hour_angle) * 96.0f)),
                center + static_cast<lv_coord_t>(roundf(sinf(hour_angle) * 96.0f))
              };
              minute_points[0] = {center, center};
              minute_points[1] = {
                center + static_cast<lv_coord_t>(roundf(cosf(minute_angle) * 148.0f)),
                center + static_cast<lv_coord_t>(roundf(sinf(minute_angle) * 148.0f))
              };
              lv_line_set_points(id(screensaver_hour_hand), hour_points, 2);
              lv_line_set_points(id(screensaver_minute_hand), minute_points, 2);
              lv_obj_set_style_line_color(id(screensaver_hour_hand), lv_color_hex(hand_color), LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_line_color(id(screensaver_minute_hand), lv_color_hex(minute_color), LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_line_opa(id(screensaver_hour_hand), LV_OPA_COVER, LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_line_opa(id(screensaver_minute_hand), LV_OPA_COVER, LV_PART_MAIN | LV_STATE_DEFAULT);
              show_obj(id(screensaver_hour_hand), true);
              show_obj(id(screensaver_minute_hand), true);
              show_obj(screensaver_clock_host, true);
            } else {
              show_obj(id(screensaver_hour_hand), false);
              show_obj(id(screensaver_minute_hand), false);
              show_obj(screensaver_clock_host, false);
            }
          }

          show_obj(screensaver_sun, !is_night);
          show_obj(screensaver_sun_ray_0, !is_night && raw == "sunny");
          show_obj(screensaver_sun_ray_1, !is_night && raw == "sunny");
          show_obj(screensaver_sun_ray_2, !is_night && raw == "sunny");
          show_obj(screensaver_sun_ray_3, !is_night && raw == "sunny");
          show_obj(screensaver_moon, is_night);
          show_obj(screensaver_moon_cutout, is_night);
          show_obj(screensaver_star_0, is_night);
          show_obj(screensaver_star_1, is_night);
          show_obj(screensaver_star_2, is_night);
          show_obj(screensaver_star_3, is_night);

          const bool clouds_visible = is_cloudy;
          show_obj(screensaver_cloud_0, clouds_visible);
          show_obj(screensaver_cloud_1, clouds_visible);
          show_obj(screensaver_cloud_2, clouds_visible);
          show_obj(screensaver_cloud_3, clouds_visible);
          show_obj(screensaver_cloud_4, clouds_visible);
          show_obj(screensaver_cloud_5, clouds_visible);
          show_obj(screensaver_cloud_6, clouds_visible && (is_cloudy && !is_partly));
          show_obj(screensaver_cloud_7, clouds_visible && (is_cloudy && !is_partly));

          show_obj(screensaver_rain_0, is_rain);
          show_obj(screensaver_rain_1, is_rain);
          show_obj(screensaver_rain_2, is_rain);
          show_obj(screensaver_rain_3, is_rain);
          show_obj(screensaver_rain_4, is_rain);
          show_obj(screensaver_snow_0, is_snow);
          show_obj(screensaver_snow_1, is_snow);
          show_obj(screensaver_snow_2, is_snow);
          show_obj(screensaver_snow_3, is_snow);
          show_obj(screensaver_snow_4, is_snow);
          show_obj(screensaver_fog_0, is_fog);
          show_obj(screensaver_fog_1, is_fog);
          show_obj(screensaver_fog_2, is_fog);
          show_obj(screensaver_fog_3, is_fog);
          show_obj(screensaver_fog_4, is_fog);

          if (time_valid) {
            const char *weekdays[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
            const char *months[] = {"Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"};
            const int weekday_index = now.day_of_week >= 1 && now.day_of_week <= 7 ? now.day_of_week - 1 : 0;
            const int month_index = now.month >= 1 && now.month <= 12 ? now.month - 1 : 0;
            lv_label_set_text_fmt(screensaver_date_label, "%s %02d.%s", weekdays[weekday_index], now.day_of_month, months[month_index]);
          } else {
            lv_label_set_text(screensaver_date_label, "--");
          }
          lv_label_set_text_fmt(screensaver_temp_label, "%d°", static_cast<int>(lroundf(id(weather_temperature))));
          lv_label_set_text(screensaver_summary_label, id(weather_condition_text).c_str());
          lv_label_set_text(screensaver_rain_label, id(weather_rain_eta_text).c_str());
          id(refresh_battery_ui).execute();
  - id: refresh_media_ui_if_needed
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(current_page) == 2 && id(media_ui_dirty);'
          then:
            - if:
                condition:
                  lambda: 'return id(media_picker_visible);'
                then:
                  - script.execute: refresh_media_picker_popup
            - script.execute: refresh_media_ui
      - if:
          condition:
            lambda: 'return id(current_page) == 6 && id(media_ui_dirty);'
          then:
            - script.execute: refresh_media_cover_ui
  - id: refresh_media_ui
    mode: restart
    then:
      - lambda: |-
          auto clamp_int = [](int value, int low, int high) -> int {
            if (value < low) return low;
            if (value > high) return high;
            return value;
          };
          const int volume_pct = clamp_int(static_cast<int>(roundf(id(display_volume_level) * 100.0f)), 0, 100);
          if (id(media_ring_arc) != nullptr) {
            lv_arc_set_value(id(media_ring_arc), volume_pct);
          }
          int progress_pct = 0;
          if (id(media_duration_seconds) > 1.0f) {
            progress_pct = clamp_int(static_cast<int>(roundf((id(media_position_seconds) / id(media_duration_seconds)) * 100.0f)), 0, 100);
          } else if (id(music_state_cache) == "playing") {
            progress_pct = 5;
          }
          if (id(media_progress_arc) != nullptr) {
            lv_arc_set_value(id(media_progress_arc), progress_pct);
          }
          if (media_shuffle_button != nullptr) {
            lv_obj_set_style_bg_color(media_shuffle_button, lv_color_hex(id(media_shuffle_enabled) ? 0xEC4899 : 0x334155), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_color(media_shuffle_icon_label, lv_color_hex(id(media_shuffle_enabled) ? 0xFFFFFF : 0xCBD5E1), LV_PART_MAIN | LV_STATE_DEFAULT);
          }
          if (media_repeat_button != nullptr) {
            lv_obj_set_style_bg_color(media_repeat_button, lv_color_hex(id(media_repeat_single_enabled) ? 0xEC4899 : 0x334155), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_color(media_repeat_icon_label, lv_color_hex(id(media_repeat_single_enabled) ? 0xFFFFFF : 0xCBD5E1), LV_PART_MAIN | LV_STATE_DEFAULT);
          }

          auto set_visible = [](lv_obj_t *obj, bool visible) {
            if (obj == nullptr) return;
            if (visible) {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };
          const bool playing = id(music_state_cache) == "playing";
          const bool track_picker_active = id(track_select_active);
          std::string title;
          std::string prev_track;
          std::string next_track;
          std::string subtitle = id(media_artist_cache);
          if (track_picker_active) {
            const int total_tracks = static_cast<int>(id(ma_track_titles_cache).size());
            if (total_tracks > 0) {
              id(selected_track_index) = clamp_int(id(selected_track_index), 0, total_tracks - 1);
              title = id(ma_track_titles_cache)[id(selected_track_index)];
              if (title.empty()) {
                title = "Titel " + std::to_string(id(selected_track_index) + 1);
              }
              if (total_tracks > 1) {
                prev_track = id(ma_track_titles_cache)[(id(selected_track_index) + total_tracks - 1) % total_tracks];
                next_track = id(ma_track_titles_cache)[(id(selected_track_index) + 1) % total_tracks];
              }
            } else {
              title = id(pending_track_request_id).empty() ? "Keine Tracks" : "Tracks laden";
            }
          } else {
            title = id(media_title_cache);
            if (title.empty()) title = id(current_media_label);
            if (title.empty()) title = "Bereit";
            if (subtitle.empty()) subtitle = id(music_state_cache);
            if (subtitle.empty()) subtitle = "Home Assistant";
          }
          lv_label_set_text(media_source_label, "");
          lv_label_set_text(media_main_label, title.c_str());
          lv_label_set_text(media_subtitle_label, subtitle.c_str());
          lv_label_set_text(media_track_prev_label, prev_track.c_str());
          lv_label_set_text(media_track_next_label, next_track.c_str());
          set_visible(media_source_label, false);
          set_visible(media_subtitle_label, !track_picker_active);
          set_visible(media_track_prev_label, track_picker_active);
          set_visible(media_track_next_label, track_picker_active);
          lv_label_set_text(media_play_icon_label, playing ? "\U0000E034" : "\U0000E037");

          std::vector<std::string> *names = &id(ma_playlists_names_cache);
          if (id(media_browser_mode) == 2) {
            names = &id(ma_radios_names_cache);
          } else if (id(media_browser_mode) == 3) {
            names = &id(ma_podcasts_names_cache);
          }
          const char *browser_title =
            (id(media_browser_mode) == 1) ? "Playlist" :
            (id(media_browser_mode) == 2) ? "Radio" : "Podcast";
          int idx =
            (id(media_browser_mode) == 1) ? id(selected_playlist_index) :
            (id(media_browser_mode) == 2) ? id(selected_radio_index) :
                                            id(selected_podcast_index);
          const int total = static_cast<int>(names->size());
          std::string current_item = "Keine Daten";
          std::string prev_item;
          std::string next_item;
          if (total > 0) {
            idx = clamp_int(idx, 0, total - 1);
            current_item = (*names)[idx];
            if (total > 1) {
              prev_item = (*names)[(idx + total - 1) % total];
              next_item = (*names)[(idx + 1) % total];
            }
          }

          lv_label_set_text(media_list_mode_label, browser_title);
          lv_label_set_text(media_list_prev_label, prev_item.c_str());
          lv_label_set_text(media_list_current_label, "\U0000E8B6");
          lv_label_set_text(media_list_next_label, next_item.c_str());
          lv_label_set_text(media_list_hint_label, "\U0000E042");
          id(refresh_battery_ui).execute();
          const bool list_active = id(control_mode) == 2;
          set_visible(media_list_mode_label, false);
          set_visible(media_list_prev_label, false);
          set_visible(media_list_button, true);
          set_visible(media_list_next_label, false);
          set_visible(media_list_hint_label, false);
          if (media_page_cover_image_widget != nullptr && media_page_cover_fallback != nullptr) {
            if (id(media_page_cover_ready)) {
              lv_img_set_src(media_page_cover_image_widget, id(media_page_cover_image));
              lv_obj_clear_flag(media_page_cover_image_widget, LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(media_page_cover_fallback, LV_OBJ_FLAG_HIDDEN);
              lv_obj_invalidate(media_page_cover_image_widget);
            } else {
              lv_obj_add_flag(media_page_cover_image_widget, LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(media_page_cover_fallback, LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_style_bg_color(media_page_cover_fallback, lv_color_hex(id(media_cover_url_cache).empty() ? 0x1F2937 : 0x2D1B3D), LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_border_color(media_page_cover_fallback, lv_color_hex(id(media_cover_url_cache).empty() ? 0x334155 : 0xEC4899), LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_text_color(media_page_cover_icon_label, lv_color_hex(id(media_cover_url_cache).empty() ? 0xEC4899 : 0xF9A8D4), LV_PART_MAIN | LV_STATE_DEFAULT);
            }
          }
          if (list_active) {
            lv_obj_set_pos(media_list_button, 64, 122);
            lv_obj_set_size(media_list_button, 48, 48);
            lv_obj_set_style_radius(media_list_button, 24, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_bg_opa(media_list_button, LV_OPA_COVER, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_bg_color(media_list_button, lv_color_hex(0xEC4899), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_border_width(media_list_button, 0, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_border_color(media_list_button, lv_color_hex(0xEC4899), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_border_side(media_list_button, LV_BORDER_SIDE_FULL, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_color(media_list_current_label, lv_color_hex(0xFFFFFF), LV_PART_MAIN | LV_STATE_DEFAULT);
          } else {
            lv_obj_set_pos(media_list_button, 64, 122);
            lv_obj_set_size(media_list_button, 48, 48);
            lv_obj_set_style_radius(media_list_button, 24, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_bg_opa(media_list_button, LV_OPA_COVER, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_border_width(media_list_button, 0, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_bg_color(media_list_button, lv_color_hex(0x334155), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_border_color(media_list_button, lv_color_hex(0x334155), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_border_side(media_list_button, LV_BORDER_SIDE_FULL, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_color(media_list_current_label, lv_color_hex(0xFFFFFF), LV_PART_MAIN | LV_STATE_DEFAULT);
          }
          id(media_ui_dirty) = false;
  - id: refresh_media_cover_ui
    mode: restart
