  - id: timer_tick
    mode: restart
    then:
      - lambda: |-
          if (!id(timer_running)) return;
          const uint32_t now_ms = millis();
          if (id(timer_last_tick_ms) == 0) {
            id(timer_last_tick_ms) = now_ms;
            return;
          }
          const uint32_t elapsed = (now_ms - id(timer_last_tick_ms)) / 1000UL;
          if (elapsed == 0) return;
          id(timer_last_tick_ms) += elapsed * 1000UL;
          id(timer_remaining_seconds) -= static_cast<int>(elapsed);
          if (id(timer_remaining_seconds) <= 0) {
            id(timer_remaining_seconds) = 0;
            id(timer_running) = false;
            id(timer_finished) = true;
            id(timer_last_tick_ms) = 0;
            id(ui_last_activity_ms) = millis();
            id(play_timer_done_haptic).execute();
            if (!id(display_sleeping)) {
              id(show_timer_page).execute();
