  - id: refresh_media_cover_url
    mode: restart
    then:
      - lambda: |-
          auto normalize_cover_url = [](const std::string &picture) -> std::string {
            if (picture.empty() || picture == "unknown" || picture == "unavailable") {
              return "";
            }
            auto tune_music_assistant_proxy = [](std::string url) -> std::string {
              if (url.find("/imageproxy?") == std::string::npos) {
                return url;
              }
              auto set_query_value = [](std::string &target, const std::string &key, const std::string &value) {
                const std::string needle = key + "=";
                const size_t query = target.find('?');
                size_t pos = query == std::string::npos ? std::string::npos : target.find(needle, query + 1);
                if (pos == std::string::npos) {
                  target += target.find('?') == std::string::npos ? "?" : "&";
                  target += needle + value;
                  return;
                }
                const size_t value_start = pos + needle.size();
                size_t value_end = target.find('&', value_start);
                if (value_end == std::string::npos) {
                  value_end = target.size();
                }
                target.replace(value_start, value_end - value_start, value);
              };
              set_query_value(url, "size", "256");
              set_query_value(url, "fmt", "jpeg");
              return url;
            };
            std::string normalized;
            if (picture.rfind("http://", 0) == 0 || picture.rfind("https://", 0) == 0) {
              normalized = tune_music_assistant_proxy(picture);
            } else if (picture[0] == '/') {
              normalized = tune_music_assistant_proxy(std::string("${ha_base_url}") + picture);
            } else {
              normalized = tune_music_assistant_proxy(std::string("${ha_base_url}/") + picture);
            }
            if (normalized.size() > 512) {
              return "";
            }
            return normalized;
          };

          std::string raw_picture = id(media_entity_picture_cache);
          const char *source = "entity_picture";
          if (raw_picture.empty()) {
            raw_picture = id(media_entity_picture_local_cache);
            source = "entity_picture_local";
          }
          if (raw_picture.empty()) {
            raw_picture = id(media_image_url_cache);
            source = "media_image_url";
          }

          const std::string url = normalize_cover_url(raw_picture);
          if (url.empty()) {
            if (!id(media_cover_url_cache).empty() || id(media_cover_ready) || id(media_page_cover_ready)) {
              id(media_cover_url_cache).clear();
              id(media_cover_update_pending) = false;
              id(media_cover_pipeline_state) = 0;
              id(media_cover_active_target) = 0;
              id(media_cover_active_url).clear();
              id(media_cover_backoff_until_ms) = 0;
              id(media_cover_failure_count) = 0;
              id(media_page_cover_loaded_url).clear();
              id(media_full_cover_loaded_url).clear();
              id(media_cover_ready) = false;
              id(media_page_cover_ready) = false;
              id(media_ui_dirty) = true;
              id(publish_media_debug).execute(
                "esp_cover_update_deferred",
                "empty",
                source,
                "fallback");
            }
            return;
          }

          if (url != id(media_cover_url_cache)) {
            id(media_cover_url_cache) = url;
            id(media_runtime_cover_url_text).publish_state(url);
            id(media_cover_update_pending) = true;
            id(media_cover_pipeline_state) = 1;
            id(media_cover_active_target) = 0;
            id(media_cover_active_url).clear();
            id(media_cover_backoff_until_ms) = 0;
            id(media_cover_failure_count) = 0;
            id(media_page_cover_loaded_url).clear();
            id(media_full_cover_loaded_url).clear();
            id(media_cover_ready) = false;
            id(media_page_cover_ready) = false;
            id(media_ui_dirty) = true;
            id(publish_media_debug).execute(
              "esp_cover_url_changed",
              source,
              "cover",
              url);
          } else if (!id(media_page_cover_ready) && !id(media_cover_update_pending)) {
            id(media_cover_update_pending) = true;
            id(media_cover_pipeline_state) = 1;
            id(publish_media_debug).execute(
              "esp_cover_update_deferred",
              source,
              "cover",
              "page cover missing");
          }

          if (id(music_state_cache) == "playing" && id(media_cover_fullscreen_due_ms) == 0) {
            id(media_cover_fullscreen_due_ms) = millis() + 10000;
          }
      - script.execute: refresh_media_ui_if_needed
  - id: process_media_cover_update
    mode: restart
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t heap = esp_get_free_heap_size();
          const bool loading =
            id(media_cover_pipeline_state) == 2 ||
            id(media_cover_pipeline_state) == 3;

          auto publish_skip = [&](const std::string &phase, const std::string &detail) {
            if (id(media_cover_last_skip_ms) == 0 || now - id(media_cover_last_skip_ms) >= 3000) {
              id(media_cover_last_skip_ms) = now;
              id(publish_media_debug).execute(
                phase,
                id(media_cover_url_cache).empty() ? std::string("-") : id(media_cover_url_cache),
                "cover",
                detail);
            }
          };

          if (id(media_cover_url_cache).empty()) {
            id(media_cover_update_pending) = false;
            if (!loading) {
              id(media_cover_pipeline_state) = 0;
              id(media_cover_active_target) = 0;
              id(media_cover_active_url).clear();
            }
            return;
          }

          if (loading) {
            return;
          }

          if (id(media_cover_pipeline_state) == 4) {
            if (now < id(media_cover_backoff_until_ms)) {
              publish_skip("esp_cover_update_failed_backoff", "waiting");
              return;
            }
            id(media_cover_pipeline_state) = 1;
            id(media_cover_failure_count) = 0;
          }

          const bool page_wanted =
            id(media_cover_update_pending) ||
            !id(media_page_cover_ready) ||
            id(media_page_cover_loaded_url) != id(media_cover_url_cache);
          const bool fullscreen_context =
            id(current_page) == 6 ||
            (id(music_state_cache) == "playing" &&
             id(media_cover_fullscreen_due_ms) != 0 &&
             now + 2500 >= id(media_cover_fullscreen_due_ms));
          const bool fullscreen_wanted =
            fullscreen_context &&
            (id(media_full_cover_loaded_url) != id(media_cover_url_cache) || !id(media_cover_ready));

          if (!page_wanted && !fullscreen_wanted) {
            id(media_cover_pipeline_state) = 0;
            id(media_cover_active_target) = 0;
            id(media_cover_active_url).clear();
            return;
          }

          const bool media_list_active = id(current_page) == 2 && id(control_mode) == 2;
          const bool request_busy =
            id(track_autoload_inflight) ||
            id(playlist_autoload_inflight) ||
            !id(pending_track_request_id).empty() ||
            !id(pending_playlist_request_id).empty();
          const bool recent_touch =
            id(ui_last_activity_ms) != 0 &&
            now - id(ui_last_activity_ms) < 700;
          const bool busy =
            id(demo_mode_active) ||
            !id(wifi_connected) ||
            id(display_sleeping) ||
            id(media_picker_visible) ||
            id(track_select_active) ||
            media_list_active ||
            request_busy ||
            recent_touch ||
            (id(media_cover_boot_defer_until_ms) != 0 && now < id(media_cover_boot_defer_until_ms));

          if (busy) {
            publish_skip("esp_cover_update_skip_busy", "ui/network busy");
            id(media_cover_pipeline_state) = 1;
            return;
          }

          if (id(media_cover_last_attempt_ms) != 0 && now - id(media_cover_last_attempt_ms) < 2000) {
            id(media_cover_pipeline_state) = 1;
            return;
          }

          if (heap < 2097152) {
            id(media_cover_pipeline_state) = 4;
            id(media_cover_backoff_until_ms) = now + 5000;
            publish_skip("esp_cover_update_skip_heap", std::string("heap=") + std::to_string(heap));
            return;
          }

          const int target = page_wanted ? 1 : 2;
          id(media_cover_active_target) = target;
          id(media_cover_active_url) = id(media_cover_url_cache);
          id(media_cover_pipeline_state) = target == 1 ? 2 : 3;
          id(media_cover_last_attempt_ms) = now;
          if (target == 1) {
            id(media_page_cover_ready) = false;
            id(publish_media_debug).execute(
              "esp_cover_update_start",
              "page",
              "cover",
              id(media_cover_url_cache));
            id(media_page_cover_image).set_url(id(media_cover_url_cache));
            id(media_page_cover_image).update();
          } else {
            id(media_cover_ready) = false;
            id(publish_media_debug).execute(
              "esp_cover_update_start",
              "fullscreen",
              "cover",
              id(media_cover_url_cache));
            id(media_cover_image).set_url(id(media_cover_url_cache));
            id(media_cover_image).update();
          }
