              id(light_brightness_pct) = brightness_pct;
            }
        - script.execute: refresh_light_ui_if_needed
  - platform: homeassistant
    id: backend_light_4_brightness
    entity_id: ${light_4_entity}
    attribute: brightness
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(light_slot_4_index) != 4 || millis() < id(light_local_change_deadline_ms) || isnan(x)) return;
            int brightness_pct = static_cast<int>(lroundf((x / 255.0f) * 100.0f));
            if (brightness_pct < 0) brightness_pct = 0;
            if (brightness_pct > 100) brightness_pct = 100;
            id(light_4_brightness_pct) = brightness_pct;
            id(light_4_on) = brightness_pct > 0;
            id(light_ui_dirty) = true;
            if (id(light_source_index) == 3 && brightness_pct != id(light_brightness_pct)) {
              id(light_brightness_pct) = brightness_pct;
            }
        - script.execute: refresh_light_ui_if_needed
  - platform: homeassistant
    id: backend_light_1_color_temp
    entity_id: ${light_1_entity}
    attribute: color_temp_kelvin
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(scene_slot_index) != 0 || millis() < id(light_local_change_deadline_ms) || isnan(x)) return;
            id(light_1_color_temp) = static_cast<int>(lroundf(x));
            if (id(light_source_index) == 0) {
              id(light_color_temp) = id(light_1_color_temp);
              static const int color_values[] = {2200, 2700, 3000, 3200, 3500, 3700, 4000};
              int best_index = 0;
              int best_distance = abs(id(light_color_temp) - color_values[0]);
              for (int index = 1; index < 7; index++) {
                const int distance = abs(id(light_color_temp) - color_values[index]);
                if (distance < best_distance) {
                  best_distance = distance;
                  best_index = index;
                }
              }
              id(light_color_index) = best_index;
              id(light_ui_dirty) = true;
            }
        - script.execute: refresh_light_ui_if_needed
  - platform: homeassistant
