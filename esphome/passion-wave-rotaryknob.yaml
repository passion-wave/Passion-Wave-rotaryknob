    on_value:
      then:
        - lambda: |-
            const std::string condition = x;
            id(weather_condition_raw) = condition;
            const char *translated = "Wetter";
            if (condition == "clear-night") {
              translated = "Klar";
            } else if (condition == "cloudy") {
              translated = "Bedeckt";
            } else if (condition == "exceptional") {
              translated = "Unwetter";
            } else if (condition == "fog") {
              translated = "Nebel";
            } else if (condition == "hail") {
              translated = "Hagel";
            } else if (condition == "lightning") {
              translated = "Gewitter";
            } else if (condition == "lightning-rainy") {
              translated = "Gewitterregen";
            } else if (condition == "partlycloudy") {
              translated = "Teilweise wolkig";
            } else if (condition == "pouring") {
              translated = "Starkregen";
            } else if (condition == "rainy") {
              translated = "Regen";
            } else if (condition == "snowy") {
              translated = "Schnee";
            } else if (condition == "snowy-rainy") {
              translated = "Schneeregen";
            } else if (condition == "sunny") {
              translated = "Sonnig";
            } else if (condition == "windy") {
              translated = "Windig";
            } else if (condition == "windy-variant") {
              translated = "Windig wolkig";
            }
            id(weather_condition_text) = translated;
            if (id(weather_detail_text).empty() || id(weather_detail_text) == "Lokale Vorhersage" || id(weather_detail_text) == "DWD Ebersberg") {
