    then:
      - lambda: |-
          id(control_mode) = 3;
          id(light_ui_dirty) = true;
          id(media_ui_dirty) = true;
      - script.execute: refresh_settings_ui
  - id: control_prev_action
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(control_mode) == 0;'
          then:
            - script.execute: cycle_light_source
          else:
            - if:
                condition:
                  lambda: 'return id(control_mode) == 2;'
                then:
                  - script.execute: media_select_prev_item
                else:
                  - if:
                      condition:
                        lambda: 'return id(control_mode) == 4;'
                      then:
                        - script.execute: media_select_prev_track
                      else:
                        - if:
                            condition:
                              lambda: 'return id(control_mode) == 1;'
                            then:
                              - script.execute: media_prev_track
                              - if:
                                  condition:
                                    lambda: 'return !id(demo_mode_active) && id(wifi_connected);'
                                  then:
                                    - homeassistant.service:
                                        service: media_player.media_previous_track
                                        data_template:
                                          entity_id: !lambda 'return id(media_effective_entity_id);'
  - id: control_next_action
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(control_mode) == 0;'
          then:
            - script.execute: cycle_light_source
          else:
            - if:
                condition:
                  lambda: 'return id(control_mode) == 2;'
                then:
                  - script.execute: media_select_next_item
                else:
                  - if:
