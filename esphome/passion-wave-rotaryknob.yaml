                if (id(light_brightness_pct) <= 0) id(light_brightness_pct) = 100;
                if (id(light_1_brightness_pct) <= 0) id(light_1_brightness_pct) = 100;
      - if:
          condition:
            lambda: 'return id(light_pending_color_sync) && id(light_source_index) == 0 && scrollwheel_targets::scene_slot_is_wled(id(scene_slot_index));'
          then:
            - homeassistant.service:
