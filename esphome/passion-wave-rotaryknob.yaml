    # Timer mit Scrollwheel-Einstellung im runden Demo-Stil
    - id: page_11
      on_load:
        - lambda: |-
            id(current_page) = 11;
            if (!id(timer_running) && !id(timer_finished)) {
              id(timer_remaining_seconds) = id(timer_duration_seconds);
            }
            if (id(timer_ring_arc) == nullptr) {
              auto *arc = lv_arc_create(id(timer_arc_host));
              lv_obj_set_size(arc, 320, 320);
              lv_obj_center(arc);
              lv_obj_remove_style(arc, nullptr, LV_PART_SCROLLBAR);
              lv_obj_clear_flag(arc, LV_OBJ_FLAG_CLICKABLE);
              lv_obj_set_style_bg_opa(arc, LV_OPA_TRANSP, LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_pad_all(arc, 0, LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_arc_color(arc, lv_color_hex(0x303540), LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_arc_opa(arc, LV_OPA_COVER, LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_arc_width(arc, 5, LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_arc_rounded(arc, true, LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_arc_color(arc, lv_color_hex(0xF59E0B), LV_PART_INDICATOR | LV_STATE_DEFAULT);
              lv_obj_set_style_arc_opa(arc, LV_OPA_COVER, LV_PART_INDICATOR | LV_STATE_DEFAULT);
              lv_obj_set_style_arc_width(arc, 5, LV_PART_INDICATOR | LV_STATE_DEFAULT);
              lv_obj_set_style_arc_rounded(arc, true, LV_PART_INDICATOR | LV_STATE_DEFAULT);
              lv_obj_set_style_bg_opa(arc, LV_OPA_TRANSP, LV_PART_KNOB | LV_STATE_DEFAULT);
              lv_arc_set_range(arc, 0, 100);
              lv_arc_set_rotation(arc, 270);
              lv_arc_set_bg_angles(arc, 0, 360);
              lv_arc_set_mode(arc, LV_ARC_MODE_NORMAL);
              lv_arc_set_value(arc, 0);
              id(timer_ring_arc) = arc;
            }
            lv_obj_set_style_text_align(timer_title_label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_align(timer_time_label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN | LV_STATE_DEFAULT);
