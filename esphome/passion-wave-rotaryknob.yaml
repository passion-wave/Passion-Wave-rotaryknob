    entity_id: ${light_1_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(scene_slot_index) != 0) return;
            const bool is_on = x == "on";
            id(light_1_on) = is_on;
            if (!is_on) {
              id(light_1_brightness_pct) = 0;
            } else if (id(light_1_brightness_pct) <= 0) {
              id(light_1_brightness_pct) = 100;
