            lv_label_set_long_mode(media_cover_title_label, LV_LABEL_LONG_CLIP);
            lv_label_set_long_mode(media_cover_artist_label, LV_LABEL_LONG_CLIP);
            lv_obj_set_style_text_align(media_cover_title_label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_align(media_cover_artist_label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN | LV_STATE_DEFAULT);
