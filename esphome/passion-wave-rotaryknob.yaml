sensor:
  - platform: adc
    pin: GPIO1
    name: "scrollwheel Battery Voltage"
    id: battery_voltage
    attenuation: 12db
    accuracy_decimals: 2
    update_interval: 15s
    unit_of_measurement: "V"
    icon: mdi:battery-medium
    filters:
      - multiply: 2.0
      - median:
          window_size: 7
          send_every: 1
          send_first_at: 1
    on_value:
      then:
        - lambda: |-
            id(external_power_detected) = !isnan(x) && x >= 4.15f;
        - component.update: battery_percentage
  - platform: template
    id: battery_percentage
    name: "scrollwheel Battery Percentage"
    lambda: return id(battery_voltage).state;
    accuracy_decimals: 0
    unit_of_measurement: "%"
    icon: mdi:battery-medium
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 2.80 -> 0.0
            - 3.10 -> 10.0
            - 3.30 -> 20.0
            - 3.45 -> 30.0
            - 3.60 -> 40.0
            - 3.70 -> 50.0
            - 3.75 -> 60.0
            - 3.80 -> 70.0
            - 3.90 -> 80.0
            - 4.00 -> 90.0
            - 4.20 -> 100.0
      - lambda: |-
          if (x > 100) return 100;
          if (x < 0) return 0;
          return x;
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) {
              return;
            }
            int pct = static_cast<int>(lroundf(x));
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;
            id(battery_percentage_cache) = pct;
            id(media_ui_dirty) = true;
        - script.execute: refresh_media_ui_if_needed
        - script.execute: refresh_battery_ui
  - platform: homeassistant
    id: ha_volume_level
    entity_id: ${ha_player}
    attribute: volume_level
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!id(media_static_fallback_active)) return;
            if (isnan(x)) {
              return;
            }
            if (id(volume_override_active) && millis() < id(volume_override_until_ms)) {
              return;
            }
            id(display_volume_level) = x;
            id(volume_override_active) = false;
            id(media_ui_dirty) = true;
        - script.execute: refresh_media_ui_if_needed
  - platform: homeassistant
    id: ha_media_position
    entity_id: ${ha_player}
    attribute: media_position
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!id(media_static_fallback_active)) return;
            if (isnan(x)) return;
            id(media_position_seconds) = x;
            id(media_ui_dirty) = true;
        - script.execute: refresh_media_ui_if_needed
  - platform: homeassistant
    id: ha_media_duration
    entity_id: ${ha_player}
    attribute: media_duration
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!id(media_static_fallback_active)) return;
            if (isnan(x)) return;
            id(media_duration_seconds) = x;
            id(media_ui_dirty) = true;
        - script.execute: refresh_media_ui_if_needed
  - platform: homeassistant
    id: backend_light_1_brightness
    entity_id: ${light_1_entity}
    attribute: brightness
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(scene_slot_index) != 0 || millis() < id(light_local_change_deadline_ms) || isnan(x)) return;
            int brightness_pct = static_cast<int>(lroundf((x / 255.0f) * 100.0f));
            if (brightness_pct < 0) brightness_pct = 0;
            if (brightness_pct > 100) brightness_pct = 100;
            id(light_1_brightness_pct) = brightness_pct;
            id(light_1_on) = brightness_pct > 0;
            id(light_ui_dirty) = true;
            if (id(light_source_index) == 0 && brightness_pct != id(light_brightness_pct)) {
              id(light_brightness_pct) = brightness_pct;
            }
        - script.execute: refresh_light_ui_if_needed
  - platform: homeassistant
    id: backend_light_2_brightness
    entity_id: ${light_2_entity}
    attribute: brightness
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(light_slot_2_index) != 11 || millis() < id(light_local_change_deadline_ms) || isnan(x)) return;
            int brightness_pct = static_cast<int>(lroundf((x / 255.0f) * 100.0f));
            if (brightness_pct < 0) brightness_pct = 0;
            if (brightness_pct > 100) brightness_pct = 100;
            id(light_2_brightness_pct) = brightness_pct;
            id(light_2_on) = brightness_pct > 0;
