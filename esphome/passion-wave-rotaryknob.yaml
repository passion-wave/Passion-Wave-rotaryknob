  ambiente_scene_5_entity: "scene.passion_wave_scene_5"
  light_2_name: "Light 2"
  light_2_entity: "light.passion_wave_light_2"
  light_3_name: "Light 3"
  light_3_entity: "light.passion_wave_light_3"
  light_4_name: "Light 4"
  light_4_entity: "light.passion_wave_light_4"
  light_4_preset_select: "select.passion_wave_wled_preset"
  playlist_selector: "input_select.passion_wave_playlist"
  mqtt_host: !secret mqtt_host
  mqtt_username: !secret mqtt_username
  mqtt_password: !secret mqtt_password
  playlist_json_sensor: "passion_wave/media/playlists"
  playlist_request_topic: "passion_wave/media/playlists/request"
  playlist_page_json_sensor: "passion_wave/media/playlists/state"
  playlist_page_limit: "24"
  radio_json_sensor: "passion_wave/media/radios"
  podcast_json_sensor: "passion_wave/media/podcasts"
  playlist_tracks_request_topic: "passion_wave/media/playlist_tracks/request"
  playlist_tracks_json_sensor: "passion_wave/media/playlist_tracks/state"
  media_debug_topic: "passion_wave/rotaryknob/media/debug"
  playlist_track_limit: "16"
  ha_weather: !secret ha_weather_entity
  weather_location: !secret weather_location_fallback
  ha_base_url: !secret home_assistant_base_url
  rain_radar_image_url: !secret rain_radar_image_url
  photo_image_url_0: !secret photo_image_url_0
  photo_image_url_1: !secret photo_image_url_1
  photo_image_url_2: !secret photo_image_url_2
  house_floorplan_image_url: !secret house_floorplan_image_url

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "${project_name}"
    version: "${project_version}"
  build_path: build/passion_wave_rotaryknob
  includes:
    - <ArduinoJson.h>
    - <cctype>
    - <cmath>
    - <cstring>
    - <cstdlib>
    - <ctime>
    - <esp_system.h>
    - <vector>
    - scrollwheel_dynamic_targets.h
    - squareline_font_bridge.h
    - round_Temp/fonts/ui_font_Number.c
  platformio_options:
    lib_deps:
      - bblanchon/ArduinoJson@6.21.3
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L
    build_flags:
      - -DCONFIG_LV_USE_ARC=1
      - -DCONFIG_LV_USE_LINE=1
  on_boot:
    priority: -100
    then:
      - lambda: |-
          auto reset_reason_to_text = [](esp_reset_reason_t reason) -> const char * {
            switch (reason) {
              case ESP_RST_POWERON: return "poweron";
              case ESP_RST_EXT: return "external";
              case ESP_RST_SW: return "software";
              case ESP_RST_PANIC: return "panic";
              case ESP_RST_INT_WDT: return "interrupt_watchdog";
              case ESP_RST_TASK_WDT: return "task_watchdog";
              case ESP_RST_WDT: return "watchdog";
              case ESP_RST_DEEPSLEEP: return "deepsleep";
              case ESP_RST_BROWNOUT: return "brownout";
              case ESP_RST_SDIO: return "sdio";
              default: return "unknown";
            }
          };
          const char *reason = reset_reason_to_text(esp_reset_reason());
          id(media_debug_reset_reason_text).publish_state(reason);
          id(media_debug_last_event) = std::string("boot reset=") + reason;
          id(media_debug_status_text).publish_state(id(media_debug_last_event));
          id(media_cover_boot_defer_until_ms) = millis() + 12000;
          ESP_LOGW("media_debug", "boot reset_reason=%s free_heap=%u min_free_heap=%u",
                   reason,
                   static_cast<unsigned>(esp_get_free_heap_size()),
                   static_cast<unsigned>(esp_get_minimum_free_heap_size()));
      - script.execute: refresh_media_target_runtime
      - delay: 800ms
      - script.execute: show_weather_page
      - script.execute: refresh_weather_time
      - script.execute: refresh_weather_ui
      - delay: 5s
      - script.execute: sync_demo_mode_with_wifi
      - if:
          condition:
            lambda: 'return id(wifi_connected) && !id(demo_mode_active);'
          then:
            - script.execute: fetch_weather
            - script.execute: fetch_rain_eta
      - delay: 10s
      - script.execute: sync_demo_mode_with_wifi
      - if:
          condition:
            lambda: 'return id(wifi_connected) && !id(demo_mode_active);'
          then:
            - script.execute: fetch_weather
            - script.execute: fetch_rain_eta

dashboard_import:
  package_import_url: github://Passion-Wave/Passion-Wave-rotaryknob/esphome/passion-wave-rotaryknob.yaml@main
  import_full_config: true

external_components:
  - source:
      type: git
      url: https://github.com/RAR/esphome-drv2605
      ref: 214077a1934e5a1f52488731bf45ab51048c3570
    components: [drv2605]
    refresh: 0s

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal

logger:
  level: WARN

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key
  services:
    - service: media_debug_on
      then:
        - switch.turn_on: media_latency_debug_enabled
        - delay: 100ms
        - script.execute: media_debug_dump_state
    - service: media_debug_off
      then:
        - switch.turn_off: media_latency_debug_enabled
    - service: media_debug_dump
      then:
        - switch.turn_on: media_latency_debug_enabled
        - delay: 100ms
        - script.execute: media_debug_dump_state
    - service: radar_refresh
      then:
        - lambda: 'id(rain_radar_force_refresh) = true;'
        - script.execute: refresh_rain_radar_image

mqtt:
  id: mqtt_client
  broker: ${mqtt_host}
  username: ${mqtt_username}
  password: ${mqtt_password}
  enable_on_boot: false
  discovery: false
  reboot_timeout: 0s
  log_topic: null

http_request:
  verify_ssl: false
  timeout: 5s

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:
  num_attempts: 30
  boot_is_good_after: 90s
  reboot_timeout: 10min

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  on_connect:
    then:
      - lambda: 'id(wifi_connected) = true;'
      - script.execute: disable_demo_mode
      - mqtt.enable:
          id: mqtt_client
      - delay: 2s
      - script.execute: fetch_weather
      - script.execute: fetch_rain_eta
      - script.execute: refresh_settings_ui
  on_disconnect:
    then:
      - lambda: 'id(wifi_connected) = false;'
      - delay: 12s
      - script.execute: sync_demo_mode_with_wifi
  ap:
    ssid: "Passion-Wave-Rotaryknob"
    password: !secret fallback_ap_password

spi:
  id: display_qspi
  type: quad
  clk_pin: 13
  data_pins: [15, 16, 17, 18]

i2c:
  sda: 11
  scl: 12
  id: touchscreen_bus
  frequency: 400kHz

drv2605:
  id: haptic_driver
  i2c_id: touchscreen_bus
  address: 0x5A
  motor_type: LRA
  library: 6

deep_sleep:
  id: battery_deep_sleep
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - number: GPIO9
        allow_other_uses: true

