time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Berlin
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(display_sleeping) && !id(external_power_detected) && !id(timer_running) && !id(alarm_alert_active) && (millis() - id(ui_last_activity_ms)) >= 90000;'
          then:
            - deep_sleep.enter: battery_deep_sleep
      - script.execute: timer_tick
      - script.execute: alarm_tick
      - if:
          condition:
            lambda: 'return !id(display_sleeping);'
          then:
            - script.execute: refresh_second_dot
      - if:
          condition:
            lambda: |-
              return id(extra_menu_visible) &&
                     id(extra_menu_hide_at_ms) != 0 &&
                     millis() >= id(extra_menu_hide_at_ms);
          then:
            - script.execute: hide_extra_menu
      - if:
          condition:
            lambda: 'return !id(display_sleeping) && (id(current_page) == 1 || id(current_page) == 2 || id(current_page) == 5 || id(current_page) == 6);'
          then:
            - script.execute: refresh_control_time
            - script.execute: refresh_media_ui_if_needed
      - if:
          condition:
            lambda: 'return !id(display_sleeping) && id(current_page) == 4;'
          then:
            - script.execute: refresh_weather_time
      - if:
          condition:
            lambda: 'return !id(display_sleeping) && (id(current_page) == 8 || id(rain_radar_loading));'
          then:
            - script.execute: refresh_rain_radar_ui
      - if:
          condition:
            lambda: 'return !id(display_sleeping) && id(current_page) == 7;'
          then:
            - script.execute: refresh_weather_screensaver
      - if:
          condition:
            lambda: |-
              return id(current_page) == 2 &&
                     !id(display_sleeping) &&
                     !id(media_picker_visible) &&
                     id(control_mode) == 2 &&
                     (millis() - id(media_list_last_activity_ms)) >= 4000;
          then:
            - lambda: |-
                id(control_mode) = 1;
                id(media_ui_dirty) = true;
            - script.execute: refresh_media_ui_if_needed
      - if:
          condition:
            lambda: |-
              return id(current_page) == 2 &&
                     !id(display_sleeping) &&
                     !id(media_picker_visible) &&
                     id(track_select_active) &&
                     (millis() - id(track_select_last_activity_ms)) >= 4000;
          then:
            - lambda: |-
                id(track_select_active) = false;
                id(control_mode) = 1;
                id(media_ui_dirty) = true;
            - script.execute: refresh_media_ui_if_needed
      - if:
          condition:
            lambda: |-
              const bool cover_allowed_page =
                id(current_page) == 1 ||
                id(current_page) == 2 ||
                id(current_page) == 4;
              const bool media_list_active = id(current_page) == 2 && id(control_mode) == 2;
              return cover_allowed_page &&
                     !id(display_sleeping) &&
                     !media_list_active &&
                     !id(media_picker_visible) &&
                     !id(track_select_active) &&
                     id(music_state_cache) == "playing" &&
                     !id(media_cover_url_cache).empty() &&
                     (id(media_cover_ready) || id(media_page_cover_ready)) &&
                     id(media_cover_fullscreen_due_ms) != 0 &&
                     millis() >= id(media_cover_fullscreen_due_ms) &&
                     (millis() - id(ui_last_activity_ms)) >= 10000;
          then:
            - script.execute: show_media_cover_page
      - if:
          condition:
            lambda: |-
              return id(current_page) != 7 &&
                     !id(display_sleeping) &&
                     !id(media_picker_visible) &&
                     !id(timer_running) &&
                     !id(alarm_alert_active) &&
                     id(music_state_cache) != "playing" &&
                     (millis() - id(ui_last_activity_ms)) >= static_cast<uint32_t>(id(screensaver_timeout_seconds)) * 1000UL;
          then:
            - script.execute: show_weather_screensaver
      - if:
          condition:
            lambda: |-
              return !id(external_power_detected) &&
                     !id(display_sleeping) &&
                     !id(timer_running) &&
                     !id(alarm_alert_active) &&
                     (millis() - id(ui_last_activity_ms)) >= 12000;
          then:
            - script.execute: sleep_display_on_battery
      - if:
          condition:
            lambda: |-
              return id(external_power_detected) &&
                     !id(display_sleeping) &&
                     !id(display_charge_dimmed) &&
                     !id(timer_running) &&
                     !id(alarm_alert_active) &&
                     (millis() - id(ui_last_activity_ms)) >= 900000;
          then:
            - script.execute: dim_display_on_external_power
  - interval: 500ms
    then:
      - script.execute: process_media_cover_update
      - if:
          condition:
            lambda: 'return !id(display_sleeping) && id(current_page) == 1 && id(light_color_selected) && id(light_color_timer) > 0;'
          then:
            - lambda: |-
                id(light_color_timer) = id(light_color_timer) - 1;
                if (id(light_color_timer) == 0) {
                  id(light_color_selected) = false;
                  id(light_ui_dirty) = true;
                }
            - script.execute: refresh_light_ui_if_needed
      - if:
          condition:
            lambda: |-
              return !id(display_sleeping) &&
                     id(current_page) == 6 &&
                     id(media_cover_volume_overlay_until_ms) != 0 &&
                     millis() >= id(media_cover_volume_overlay_until_ms);
          then:
            - lambda: |-
                id(media_cover_volume_overlay_until_ms) = 0;
                id(media_ui_dirty) = true;
            - script.execute: refresh_media_ui_if_needed
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              const std::string raw = id(weather_condition_raw);
              return !id(display_sleeping) &&
                     id(current_page) == 7 &&
                     (raw == "rainy" || raw == "pouring" || raw == "lightning-rainy" || raw == "hail" ||
                      raw == "snowy" || raw == "snowy-rainy" || raw == "fog");
          then:
            - lambda: |-
                const std::string raw = id(weather_condition_raw);
                const bool is_rain = raw == "rainy" || raw == "pouring" || raw == "lightning-rainy" || raw == "hail";
                const bool is_snow = raw == "snowy" || raw == "snowy-rainy";
                const bool is_fog = raw == "fog";
                const uint32_t tick = millis() / 250U;
                auto set_pos = [](lv_obj_t *obj, int x, int y) {
                  if (obj == nullptr) return;
                  lv_obj_set_pos(obj, x, y);
                };

                if (is_rain) {
                  const int base_x[5] = {70, 122, 180, 232, 284};
                  const int phase[5] = {0, 34, 12, 58, 26};
                  for (int i = 0; i < 5; i++) {
                    const int y = 118 + static_cast<int>((tick * 22 + phase[i]) % 116);
                    const int x = base_x[i] + static_cast<int>((tick + i) % 4);
                    lv_obj_t *drops[5] = {screensaver_rain_0, screensaver_rain_1, screensaver_rain_2, screensaver_rain_3, screensaver_rain_4};
                    set_pos(drops[i], x, y);
                  }
                }

                if (is_snow) {
                  const int base_x[5] = {76, 132, 190, 238, 286};
                  const int phase[5] = {4, 48, 18, 74, 34};
                  for (int i = 0; i < 5; i++) {
                    const int y = 116 + static_cast<int>((tick * 7 + phase[i]) % 128);
                    const int sway = static_cast<int>(((tick + i * 2) % 9)) - 4;
                    lv_obj_t *flakes[5] = {screensaver_snow_0, screensaver_snow_1, screensaver_snow_2, screensaver_snow_3, screensaver_snow_4};
                    set_pos(flakes[i], base_x[i] + sway, y);
                  }
                }

                if (is_fog) {
                  const int base_y[5] = {122, 146, 170, 194, 218};
                  const int phase[5] = {0, 74, 148, 38, 112};
                  const int speed[5] = {5, 4, 6, 3, 5};
                  for (int i = 0; i < 5; i++) {
                    const int x = -82 + static_cast<int>((tick * speed[i] + phase[i]) % 448);
                    lv_obj_t *fog[5] = {screensaver_fog_0, screensaver_fog_1, screensaver_fog_2, screensaver_fog_3, screensaver_fog_4};
                    set_pos(fog[i], x, base_y[i]);
                  }
                }
  - interval: 20ms
    then:
      - lambda: |-
          int steps = id(knob_delta);
          id(knob_delta) = 0;
          if (id(display_sleeping)) {
            return;
          }
          if (steps == 0) {
            return;
          }
          const bool rotary_action_page =
            id(current_page) == 1 ||
            id(current_page) == 2 ||
            id(current_page) == 6 ||
            id(current_page) == 11 ||
            id(current_page) == 12;
          if (!rotary_action_page) {
            return;
          }

          bool action_handled = false;
          bool refresh_light = false;
          bool refresh_media = false;
          bool request_more_tracks = false;
          bool request_more_playlists = false;

          if (id(current_page) == 1) {
            if (id(light_source_index) != 0) {
              id(light_color_selected) = false;
              id(light_pending_color_sync) = false;
            }
            if (id(light_color_selected)) {
              int new_index = id(ambiente_scene_index) + steps;
              const int scene_count = scrollwheel_targets::scene_value_count(id(scene_slot_index));
              if (new_index < 0) new_index = 0;
              if (new_index >= scene_count) new_index = scene_count - 1;
              if (new_index != id(ambiente_scene_index)) {
                id(ambiente_scene_index) = new_index;
                id(ambiente_scene_name) = scrollwheel_targets::scene_value_name(id(scene_slot_index), id(ambiente_scene_index));
                action_handled = true;
              }
              if (action_handled) {
                id(light_color_timer) = 0;
                id(light_pending_color_sync) = true;
              }
            } else {
              int new_brightness = id(light_brightness_pct) + (steps * 5);
              if (new_brightness < 0) new_brightness = 0;
              if (new_brightness > 100) new_brightness = 100;
              if (new_brightness != id(light_brightness_pct)) {
                id(light_brightness_pct) = new_brightness;
                if (id(light_source_index) == 0) id(light_1_on) = new_brightness > 0;
                else if (id(light_source_index) == 1) id(light_2_on) = new_brightness > 0;
                else if (id(light_source_index) == 2) id(light_3_on) = new_brightness > 0;
                else id(light_4_on) = new_brightness > 0;
                id(light_pending_brightness_sync) = true;
                action_handled = true;
              }
            }
            if (action_handled) {
              id(light_sync_generation) += 1;
              id(light_local_change_deadline_ms) = millis() + 1200;
              id(light_sync_deadline_ms) = millis() + 150;
              id(light_ui_dirty) = true;
              refresh_light = true;
            }
          } else if (id(current_page) == 2 || id(current_page) == 6) {
            id(media_last_activity_ms) = millis();
            if (id(current_page) == 2 && id(media_picker_visible)) {
              id(media_list_last_activity_ms) = millis();
              const int tab = id(media_picker_tab);
              if (tab == 0) {
                id(track_select_last_activity_ms) = millis();
                id(track_select_active) = true;
                id(control_mode) = 4;
                const int size = static_cast<int>(id(ma_track_titles_cache).size());
                if (size > 0) {
                  int next = id(selected_track_index) + steps;
                  const bool wants_more = steps > 0 && next >= size - 3 && id(track_has_more);
                  if (next < 0) next = 0;
                  if (next >= size) next = size - 1;
                  if (next != id(selected_track_index)) {
                    id(selected_track_index) = next;
                    action_handled = true;
                  }
                  request_more_tracks =
                    wants_more &&
                    id(pending_track_request_id).empty() &&
                    !id(track_autoload_inflight);
                  if (request_more_tracks) {
                    action_handled = true;
                  }
                }
              } else {
                std::vector<std::string> *names = &id(ma_playlists_names_cache);
                int *idx = &id(selected_playlist_index);
                if (tab == 2) {
                  names = &id(ma_radios_names_cache);
                  idx = &id(selected_radio_index);
                } else if (tab == 3) {
                  names = &id(ma_podcasts_names_cache);
                  idx = &id(selected_podcast_index);
                }
                const int base_size = static_cast<int>(names->size());
                const int size = base_size;
                if (size > 0) {
                  int next = *idx + steps;
                  const bool wants_more =
                    tab == 1 &&
                    steps > 0 &&
                    next >= size - 1 &&
                    id(playlist_has_more);
                  if (next < 0) next = 0;
                  if (next >= size) next = size - 1;
                  if (next != *idx) {
                    *idx = next;
                    action_handled = true;
                  }
                  request_more_playlists =
                    wants_more &&
                    id(pending_playlist_request_id).empty() &&
                    !id(playlist_autoload_inflight);
                  if (request_more_playlists) {
                    action_handled = true;
                  }
                } else if (tab == 1 &&
                           steps > 0 &&
                           id(playlist_has_more) &&
                           id(pending_playlist_request_id).empty() &&
                           !id(playlist_autoload_inflight)) {
                  request_more_playlists = true;
                  action_handled = true;
                }
              }
              if (action_handled) {
                id(media_ui_dirty) = true;
                refresh_media = true;
              }
            } else if (id(control_mode) == 2) {
              id(media_list_last_activity_ms) = millis();
              std::vector<std::string> *names = &id(ma_playlists_names_cache);
              if (id(media_browser_mode) == 2) {
                names = &id(ma_radios_names_cache);
              } else if (id(media_browser_mode) == 3) {
                names = &id(ma_podcasts_names_cache);
              }
              const int size = static_cast<int>(names->size());
              if (size > 0) {
                int *idx =
                  (id(media_browser_mode) == 1) ? &id(selected_playlist_index) :
                  (id(media_browser_mode) == 2) ? &id(selected_radio_index) :
                                                  &id(selected_podcast_index);
                int raw_next = *idx + steps;
                int next = raw_next;
                if (id(media_browser_mode) == 1 && id(playlist_has_more)) {
                  if (next < 0) next = 0;
                  if (next >= size) next = size - 1;
                } else {
                  next = raw_next % size;
                  if (next < 0) next += size;
                }
                const bool wants_more =
                  id(media_browser_mode) == 1 &&
                  steps > 0 &&
                  raw_next >= size - 1 &&
                  id(playlist_has_more);
                if (next != *idx) {
                  *idx = next;
                  id(media_ui_dirty) = true;
                  refresh_media = true;
                  action_handled = true;
                }
                request_more_playlists =
                  wants_more &&
                  id(pending_playlist_request_id).empty() &&
                  !id(playlist_autoload_inflight);
                if (request_more_playlists) {
                  action_handled = true;
                }
              }
            } else if (id(control_mode) == 4) {
              id(track_select_last_activity_ms) = millis();
              id(track_select_active) = true;
              const int size = static_cast<int>(id(ma_track_titles_cache).size());
              if (size > 0) {
                int raw_next = id(selected_track_index) + steps;
                int next = raw_next;
                if (id(track_has_more)) {
                  if (next < 0) next = 0;
                  if (next >= size) next = size - 1;
                } else {
                  next = raw_next % size;
                  if (next < 0) next += size;
                }
                if (next != id(selected_track_index)) {
                  id(selected_track_index) = next;
                  id(media_ui_dirty) = true;
                  refresh_media = true;
                  action_handled = true;
                }
                request_more_tracks =
                  steps > 0 &&
                  (raw_next >= size || id(selected_track_index) >= size - 3) &&
                  id(track_has_more) &&
                  id(pending_track_request_id).empty() &&
                  !id(track_autoload_inflight);
                if (request_more_tracks) {
                  action_handled = true;
                }
              }
            } else {
              float base = id(volume_override_active) ? id(display_volume_level) : id(ha_volume_level).state;
              if (isnan(base)) base = id(display_volume_level);
              if (isnan(base)) base = 0.5f;
              float target = base + (static_cast<float>(steps) * 0.02f);
              if (target < 0.0f) target = 0.0f;
              if (target > 1.0f) target = 1.0f;
              if (roundf(target * 100.0f) != roundf(base * 100.0f)) {
                id(display_volume_level) = target;
                id(volume_override_active) = true;
                id(volume_override_until_ms) = millis() + 1200;
                if (id(current_page) == 6) {
                  id(media_cover_volume_overlay_until_ms) = millis() + 1400;
                }
                id(media_pending_volume_sync) = true;
                id(media_volume_sync_deadline_ms) = millis() + 150;
                id(media_ui_dirty) = true;
                refresh_media = true;
                action_handled = true;
              }
            }
          } else if (id(current_page) == 11) {
            if (!id(timer_running)) {
              if (id(timer_edit_field) < 0 || id(timer_edit_field) > 1) id(timer_edit_field) = 0;
              const int step_seconds = id(timer_edit_field) == 1 ? 10 : 60;
              int target = id(timer_duration_seconds) + (steps * step_seconds);
              if (target < 10) target = 10;
              if (target > 5999) target = 5999;
              if (target != id(timer_duration_seconds) || id(timer_finished)) {
                id(timer_duration_seconds) = target;
                id(timer_remaining_seconds) = target;
                id(timer_finished) = false;
                id(refresh_timer_ui).execute();
                action_handled = true;
              }
            }
          } else if (id(current_page) == 12) {
            const int old_hour = id(alarm_hour);
            const int old_minute = id(alarm_minute);
            if (id(alarm_edit_field) == 0) {
              int hour = (id(alarm_hour) + steps) % 24;
              if (hour < 0) hour += 24;
              id(alarm_hour) = hour;
            } else {
              int total = id(alarm_hour) * 60 + id(alarm_minute) + (steps * 5);
              total %= 1440;
              if (total < 0) total += 1440;
              id(alarm_hour) = total / 60;
              id(alarm_minute) = (total % 60 / 5) * 5;
            }
            if (id(alarm_hour) != old_hour || id(alarm_minute) != old_minute) {
              id(refresh_alarm_ui).execute();
              action_handled = true;
            }
          }

          if (!action_handled) {
            return;
          }
          id(play_haptic_feedback).execute();

          if (request_more_tracks) {
            id(request_more_playlist_tracks).execute();
          }
          if (request_more_playlists) {
            id(request_more_playlist_page).execute();
          }
          if (refresh_light) {
            id(refresh_light_ui_if_needed).execute();
          }
          if (refresh_media) {
            id(refresh_media_ui_if_needed).execute();
          }
  - interval: 50ms
    then:
      - if:
          condition:
            lambda: |-
              return (id(light_pending_brightness_sync) || id(light_pending_color_sync)) &&
                     !id(display_sleeping) &&
                     millis() >= id(light_sync_deadline_ms);
          then:
            - script.execute: light_sync_remote
      - if:
          condition:
            lambda: |-
              return id(media_pending_volume_sync) &&
                     !id(display_sleeping) &&
                     millis() >= id(media_volume_sync_deadline_ms);
          then:
            - script.execute: media_sync_remote
  - interval: 200ms
    then:
      - if:
          condition:
            lambda: |-
              if (id(display_sleeping) ||
                  id(current_page) != 2 ||
                  !id(media_picker_visible) ||
                  id(media_picker_tab) != 1 ||
                  !id(playlist_has_more) ||
                  !id(pending_playlist_request_id).empty() ||
                  id(playlist_autoload_inflight)) {
                return false;
              }
              const int loaded = static_cast<int>(id(ma_playlists_names_cache).size());
              if (loaded <= 0) {
                return true;
              }
              if (id(selected_playlist_index) >= loaded - 1) {
                return true;
              }
              if (media_picker_list != nullptr && lv_obj_get_scroll_bottom(media_picker_list) <= 8) {
                return true;
              }
              return false;
          then:
            - script.execute: request_more_playlist_page
      - if:
          condition:
            lambda: 'return !id(display_sleeping) && id(volume_override_active) && millis() >= id(volume_override_until_ms);'
          then:
            - lambda: |-
                id(volume_override_active) = false;
                id(media_ui_dirty) = true;
            - script.execute: refresh_media_ui_if_needed
  - interval: 5s
    then:
      - script.execute: refresh_dynamic_media_snapshot
  - interval: 15min
    then:
      - if:
          condition:
            lambda: 'return !id(display_sleeping) || id(external_power_detected);'
          then:
            - script.execute: fetch_weather
            - script.execute: fetch_rain_eta

switch:
  - platform: template
    name: "scrollwheel Media Debug"
    id: media_latency_debug_enabled
    entity_category: diagnostic
    icon: mdi:bug-check
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(media_debug_trace_id) = App.get_name() + "-manual-debug-" + std::to_string(millis());
          id(media_debug_start_ms) = millis();
          id(media_debug_event_seq) = 0;
          id(media_debug_last_event) = "debug enabled";
          id(media_debug_status_text).publish_state(id(media_debug_last_event));
          ESP_LOGW("media_debug", "enabled trace_id=%s heap=%u",
                   id(media_debug_trace_id).c_str(),
                   static_cast<unsigned>(esp_get_free_heap_size()));
    turn_off_action:
      - lambda: |-
          id(media_debug_last_event) = "debug disabled";
          id(media_debug_status_text).publish_state(id(media_debug_last_event));
          ESP_LOGW("media_debug", "disabled");
  - platform: template
    name: "scrollwheel Vibration"
    id: haptic_enabled_switch
    entity_category: config
    lambda: "return id(haptic_enabled);"
    turn_on_action:
      - lambda: 'id(haptic_enabled) = true;'
      - script.execute: play_haptic_feedback
      - script.execute: refresh_settings_ui
    turn_off_action:
      - lambda: 'id(haptic_enabled) = false;'
      - script.execute: refresh_settings_ui
  - platform: template
    name: "scrollwheel Demo"
    id: demo_mode_enabled_switch
    entity_category: config
    lambda: "return id(demo_mode_enabled);"
    turn_on_action:
      - lambda: 'id(demo_mode_enabled) = true;'
      - script.execute: sync_demo_mode_with_wifi
      - script.execute: refresh_settings_ui
    turn_off_action:
      - lambda: 'id(demo_mode_enabled) = false;'
      - script.execute: disable_demo_mode
      - script.execute: refresh_settings_ui

number:
  - platform: template
    name: "scrollwheel Rotary Haptic Effect"
    id: haptic_effect_number
    entity_category: config
    lambda: "return id(haptic_effect_index);"
    update_interval: 1s
    min_value: 1
    max_value: 123
    step: 1
    mode: box
    set_action:
      - lambda: |-
          int effect = static_cast<int>(roundf(x));
          if (effect < 1) effect = 1;
          if (effect > 123) effect = 123;
          id(haptic_effect_index) = effect;
      - script.execute: play_haptic_feedback
      - script.execute: refresh_settings_ui
  - platform: template
    name: "scrollwheel Timer Done Haptic Effect"
    id: timer_done_haptic_effect_number
    entity_category: config
    lambda: "return id(timer_done_haptic_effect_index);"
    update_interval: 1s
    min_value: 1
    max_value: 123
    step: 1
    mode: box
    set_action:
      - lambda: |-
          int effect = static_cast<int>(roundf(x));
          if (effect < 1) effect = 1;
          if (effect > 123) effect = 123;
          id(timer_done_haptic_effect_index) = effect;
      - script.execute: play_timer_done_haptic
      - script.execute: refresh_settings_ui
  - platform: template
    name: "scrollwheel Screensaver Timeout"
    id: screensaver_timeout_number
    entity_category: config
    lambda: "return id(screensaver_timeout_seconds);"
    update_interval: 1s
    min_value: 10
    max_value: 180
    step: 5
    mode: box
    unit_of_measurement: "s"
    set_action:
      - lambda: |-
          int seconds = static_cast<int>(roundf(x));
          if (seconds < 10) seconds = 10;
          if (seconds > 180) seconds = 180;
          id(screensaver_timeout_seconds) = seconds;
      - script.execute: refresh_settings_ui

