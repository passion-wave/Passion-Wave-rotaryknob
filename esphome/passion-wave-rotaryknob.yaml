  - id: refresh_light_ui
    mode: restart
    then:
      - lambda: |-
          auto clamp_int = [](int value, int low, int high) -> int {
            if (value < low) return low;
            if (value > high) return high;
            return value;
          };
          id(ambiente_scene_index) = scrollwheel_targets::clamp_index(id(ambiente_scene_index), scrollwheel_targets::scene_value_count(id(scene_slot_index)));
          id(ambiente_scene_name) = scrollwheel_targets::scene_value_name(id(scene_slot_index), id(ambiente_scene_index));
          const bool scene_selected = id(light_source_index) == 0 && id(light_color_selected);
          const int scene_count = scrollwheel_targets::scene_value_count(id(scene_slot_index));
          const int scene_progress = scene_count <= 1 ? 0 : clamp_int((id(ambiente_scene_index) * 100) / (scene_count - 1), 0, 100);
          const int light_ring_value = scene_selected ? scene_progress : clamp_int(id(light_brightness_pct), 0, 100);
          if (id(light_brightness_arc) != nullptr) {
            lv_arc_set_value(id(light_brightness_arc), light_ring_value);
          }
          int source_index = id(light_source_index);
          if (source_index < 0 || source_index > 3) {
            source_index = 0;
            id(light_source_index) = 0;
          }
          const char *light_names[] = {
            id(light_slot_1_label_text).state.c_str(),
            id(light_slot_2_label_text).state.c_str(),
            id(light_slot_3_label_text).state.c_str(),
            id(light_slot_4_label_text).state.c_str(),
          };
          const char *demo_light_names[] = {"Ambiente", "Couch", "Table", "Accent"};
          if (id(demo_mode_active)) {
            for (int i = 0; i < 4; i++) {
              light_names[i] = demo_light_names[i];
            }
          }
          const bool light_on[] = {id(light_1_on), id(light_2_on), id(light_3_on), id(light_4_on)};
          auto style_light_status = [&](lv_obj_t *chip, lv_obj_t *icon, bool is_on, bool selected) {
            const uint32_t bg = is_on ? 0xF59E0B : 0x111827;
            const uint32_t icon_color = is_on ? 0x111827 : 0x64748B;
            const uint32_t border_color = selected ? 0xF8FAFC : (is_on ? 0xFBBF24 : 0x334155);
            lv_obj_set_style_bg_color(chip, lv_color_hex(bg), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_bg_opa(chip, is_on ? LV_OPA_COVER : LV_OPA_70, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_border_width(chip, selected ? 2 : 1, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_border_color(chip, lv_color_hex(border_color), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_shadow_width(chip, is_on ? 8 : 0, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_shadow_color(chip, lv_color_hex(0xF59E0B), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_shadow_opa(chip, is_on ? LV_OPA_30 : LV_OPA_TRANSP, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_color(icon, lv_color_hex(icon_color), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_opa(icon, is_on ? LV_OPA_COVER : LV_OPA_70, LV_PART_MAIN | LV_STATE_DEFAULT);
          };
          style_light_status(light_status_1_chip, light_status_1_icon, light_on[0], source_index == 0);
          style_light_status(light_status_2_chip, light_status_2_icon, light_on[1], source_index == 1);
          style_light_status(light_status_3_chip, light_status_3_icon, light_on[2], source_index == 2);
          style_light_status(light_status_4_chip, light_status_4_icon, light_on[3], source_index == 3);
          lv_label_set_text(light_active_summary_label, "");
          lv_obj_add_flag(light_active_summary_label, LV_OBJ_FLAG_HIDDEN);
          const bool supports_color = source_index == 0;
          if (!supports_color) {
            id(light_color_selected) = false;
            id(light_pending_color_sync) = false;
          }
          if (id(light_color_selected)) {
            lv_label_set_text(light_mode_label, light_names[source_index]);
            lv_obj_set_style_text_font(light_value_label, id(roboto_20), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_label_set_text(light_value_label, id(ambiente_scene_name).c_str());
            lv_label_set_text(light_source_label, scrollwheel_targets::scene_slot_is_wled(id(scene_slot_index)) ? "Preset" : "Szene");
            lv_label_set_text(light_context_1_label, scrollwheel_targets::scene_slot_name(id(scene_slot_index)));
            lv_label_set_text_fmt(light_context_2_label, "%d%%", id(light_brightness_pct));
            lv_label_set_text(light_context_3_label, "HELLIGKEIT");
          } else {
            lv_obj_set_style_text_font(light_value_label, id(roboto_24), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_label_set_text_fmt(light_value_label, "%d%%", id(light_brightness_pct));
            lv_label_set_text(light_mode_label, light_names[source_index]);
            lv_label_set_text(light_source_label, "Helligkeit");
            if (supports_color) {
              lv_label_set_text(light_context_1_label, id(ambiente_scene_name).c_str());
              lv_label_set_text(light_context_2_label, scrollwheel_targets::scene_slot_is_wled(id(scene_slot_index)) ? "Preset" : "Szene");
              lv_label_set_text(light_context_3_label, "SLOT");
            } else {
              lv_label_set_text(light_context_1_label, "");
              lv_label_set_text(light_context_2_label, "nur");
              lv_label_set_text(light_context_3_label, "HELLIGKEIT");
            }
          }
          const uint32_t swatch = ((uint32_t) id(light_rgb_red) << 16) | ((uint32_t) id(light_rgb_green) << 8) | (uint32_t) id(light_rgb_blue);
          lv_obj_set_style_bg_color(light_swatch, lv_color_hex(swatch), LV_PART_MAIN | LV_STATE_DEFAULT);
          id(light_ui_dirty) = false;
  - id: cycle_light_source
    mode: restart
    then:
      - lambda: |-
          id(ui_last_activity_ms) = millis();
          id(light_source_index) += 1;
          if (id(light_source_index) > 3) {
            id(light_source_index) = 0;
          }
          id(light_color_selected) = false;
          id(light_pending_brightness_sync) = false;
          id(light_pending_color_sync) = false;
          if (id(light_source_index) == 0) {
            id(light_brightness_pct) = id(light_1_on) ? id(light_1_brightness_pct) : 0;
            id(light_color_temp) = id(light_1_color_temp);
          } else if (id(light_source_index) == 1) {
            id(light_brightness_pct) = id(light_2_on) ? id(light_2_brightness_pct) : 0;
          } else if (id(light_source_index) == 2) {
            id(light_brightness_pct) = id(light_3_on) ? id(light_3_brightness_pct) : 0;
          } else {
            id(light_brightness_pct) = id(light_4_on) ? id(light_4_brightness_pct) : 0;
            id(light_color_temp) = id(light_4_color_temp);
          }
          static const int color_values[] = {2200, 2700, 3000, 3200, 3500, 3700, 4000};
          int best_index = 0;
          int best_distance = abs(id(light_color_temp) - color_values[0]);
          for (int index = 1; index < 7; index++) {
            const int distance = abs(id(light_color_temp) - color_values[index]);
            if (distance < best_distance) {
              best_distance = distance;
              best_index = index;
            }
          }
          id(light_color_index) = best_index;
          id(light_ui_dirty) = true;
      - script.execute: refresh_light_ui_if_needed
