  - id: enable_swipe_navigation_bubble
    mode: restart
    then:
      - lambda: |-
          auto *root = lv_scr_act();
          if (root == nullptr) return;
          std::vector<lv_obj_t *> stack;
          stack.push_back(root);
          while (!stack.empty()) {
            lv_obj_t *obj = stack.back();
            stack.pop_back();
            if (obj == nullptr) continue;
            #ifdef LV_OBJ_FLAG_GESTURE_BUBBLE
            lv_obj_add_flag(obj, LV_OBJ_FLAG_GESTURE_BUBBLE);
            #else
            lv_obj_add_flag(obj, LV_OBJ_FLAG_EVENT_BUBBLE);
            #endif
            const uint32_t child_count = lv_obj_get_child_cnt(obj);
            for (uint32_t child_index = 0; child_index < child_count; child_index++) {
              stack.push_back(lv_obj_get_child(obj, child_index));
            }
          }
  - id: handle_fast_touch_swipe
    mode: restart
    then:
      - lambda: |-
          if (id(touch_swipe_handled) || id(touch_swipe_started_sleeping) || id(display_sleeping)) {
            return;
          }

          const int direction = id(touch_swipe_direction);
          const int page = id(current_page);
          const bool radar_popup_open =
            weather_radar_popup != nullptr &&
            !lv_obj_has_flag(weather_radar_popup, LV_OBJ_FLAG_HIDDEN);
          if (radar_popup_open || id(media_picker_visible) || id(track_select_active)) {
            return;
          }

          auto mark_handled = []() {
            id(touch_swipe_handled) = true;
            id(touch_swipe_nav_suppress_until_ms) = millis() + 450;
            id(ui_last_activity_ms) = millis();
            id(hide_extra_menu).execute();
            id(play_haptic_feedback).execute();
          };

          if (page == 7) {
            mark_handled();
            id(return_from_screensaver).execute();
            return;
          }
          if (page == 6) {
            mark_handled();
            id(show_media_page).execute();
            return;
          }

          if (direction == 1) {
            if (page == 1) {
              mark_handled();
              id(show_weather_page).execute();
            } else if (page == 2) {
              mark_handled();
              id(show_light_page).execute();
            } else if (page == 4) {
              mark_handled();
              id(show_media_page).execute();
            }
          } else if (direction == 2) {
            if (page == 1) {
              mark_handled();
              id(show_media_page).execute();
            } else if (page == 2) {
              mark_handled();
              id(show_weather_page).execute();
            } else if (page == 4) {
              mark_handled();
              id(show_light_page).execute();
            }
          } else if (direction == 3) {
            if (page == 4) {
              mark_handled();
              id(show_media_page).execute();
            } else if (page == 8 || page == 9 || page == 10 || page == 11 || page == 12) {
              mark_handled();
              id(show_weather_page).execute();
            }
          }
