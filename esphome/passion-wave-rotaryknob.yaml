                  lv_obj_clear_flag(rain_radar_fallback_label, LV_OBJ_FLAG_HIDDEN);
                }
                if (weather_radar_popup != nullptr && !lv_obj_has_flag(weather_radar_popup, LV_OBJ_FLAG_HIDDEN)) {
                  lv_img_set_src(weather_radar_popup_image, id(rain_radar_image));
                  if (id(rain_radar_ready)) {
                    lv_obj_clear_flag(weather_radar_popup_image, LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(weather_radar_popup_fallback_label, LV_OBJ_FLAG_HIDDEN);
                  } else {
                    lv_obj_add_flag(weather_radar_popup_image, LV_OBJ_FLAG_HIDDEN);
                    lv_obj_clear_flag(weather_radar_popup_fallback_label, LV_OBJ_FLAG_HIDDEN);
                  }
                }
