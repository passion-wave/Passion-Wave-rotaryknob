                                  then:
                                    - homeassistant.service:
                                        service: media_player.media_next_track
                                        data_template:
                                          entity_id: !lambda 'return id(media_effective_entity_id);'
  - id: refresh_control_ui_if_needed
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(current_page) == 1 && id(light_ui_dirty);'
          then:
            - script.execute: refresh_light_ui
      - if:
          condition:
            lambda: 'return (id(current_page) == 2 || id(current_page) == 6) && id(media_ui_dirty);'
          then:
            - script.execute: refresh_media_ui_if_needed
  - id: refresh_control_ui
    mode: restart
    then:
      - script.execute: refresh_control_time
      - script.execute: refresh_control_ui_if_needed
      - script.execute: refresh_battery_ui
      - if:
          condition:
            lambda: 'return id(current_page) == 5;'
          then:
            - script.execute: refresh_settings_ui
  - id: refresh_control_time
    mode: restart
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) {
            now = id(sntp_time).now();
          }
          char time_buffer[6];
          char date_buffer[24];
          if (now.is_valid()) {
            const char *weekdays[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
            const char *months[] = {"Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"};
            const int weekday_index = now.day_of_week >= 1 && now.day_of_week <= 7 ? now.day_of_week - 1 : 0;
            const int month_index = now.month >= 1 && now.month <= 12 ? now.month - 1 : 0;
            snprintf(time_buffer, sizeof(time_buffer), "%02d:%02d", now.hour, now.minute);
            snprintf(date_buffer, sizeof(date_buffer), "%s %02d.%s", weekdays[weekday_index], now.day_of_month, months[month_index]);
          } else {
            snprintf(time_buffer, sizeof(time_buffer), "--:--");
            snprintf(date_buffer, sizeof(date_buffer), "--");
          }
          if (id(current_page) == 1) {
            lv_label_set_text(light_time_label, time_buffer);
            lv_label_set_text(light_date_label, date_buffer);
          } else if (id(current_page) == 2) {
            lv_label_set_text(media_time_label, time_buffer);
            lv_label_set_text(media_date_label, date_buffer);
          } else if (id(current_page) == 5) {
            lv_label_set_text(settings_time_label, time_buffer);
            lv_label_set_text(settings_date_label, date_buffer);
          }
  - id: light_sync_remote
    mode: restart
    then:
      - lambda: |-
          auto clamp_channel = [](float value) -> int {
            if (value < 0.0f) return 0;
            if (value > 255.0f) return 255;
            return static_cast<int>(value + 0.5f);
          };

          const float kelvin = static_cast<float>(id(light_color_temp));
          const float temperature = kelvin / 100.0f;
          float red = 255.0f;
          float green = 0.0f;
          float blue = 0.0f;

          if (temperature <= 66.0f) {
            green = 99.4708025861f * logf(temperature) - 161.1195681661f;
            if (temperature <= 19.0f) {
              blue = 0.0f;
            } else {
              blue = 138.5177312231f * logf(temperature - 10.0f) - 305.0447927307f;
            }
          } else {
            red = 329.698727446f * powf(temperature - 60.0f, -0.1332047592f);
            green = 288.1221695283f * powf(temperature - 60.0f, -0.0755148492f);
            blue = 255.0f;
          }

          id(light_rgb_red) = clamp_channel(red);
          id(light_rgb_green) = clamp_channel(green);
          id(light_rgb_blue) = clamp_channel(blue);
          if (id(light_source_index) == 0) {
            id(light_1_brightness_pct) = id(light_brightness_pct);
            id(light_1_on) = id(light_brightness_pct) > 0;
            id(light_1_color_temp) = id(light_color_temp);
          } else if (id(light_source_index) == 1) {
            id(light_2_brightness_pct) = id(light_brightness_pct);
            id(light_2_on) = id(light_brightness_pct) > 0;
          } else if (id(light_source_index) == 2) {
            id(light_3_brightness_pct) = id(light_brightness_pct);
            id(light_3_on) = id(light_brightness_pct) > 0;
          } else {
            id(light_4_brightness_pct) = id(light_brightness_pct);
            id(light_4_on) = id(light_brightness_pct) > 0;
          }
          id(light_ui_dirty) = true;
      - if:
          condition:
            lambda: 'return id(demo_mode_active) || !id(wifi_connected);'
          then:
            - lambda: |-
                id(light_pending_brightness_sync) = false;
                id(light_pending_color_sync) = false;
                id(light_ui_dirty) = true;
            - script.execute: refresh_light_ui_if_needed
            - script.stop: light_sync_remote
      - if:
          condition:
            lambda: 'return id(light_pending_brightness_sync) && id(light_brightness_pct) <= 0 && id(light_source_index) == 0;'
          then:
            - homeassistant.service:
                service: light.turn_off
                data_template:
                  entity_id: !lambda 'return id(light_slot_1_entity_text).state;'
            - lambda: |-
                id(light_pending_brightness_sync) = false;
                id(light_pending_color_sync) = false;
      - if:
          condition:
            lambda: 'return id(light_pending_brightness_sync) && id(light_brightness_pct) <= 0 && id(light_source_index) == 1;'
          then:
            - homeassistant.service:
                service: light.turn_off
                data_template:
                  entity_id: !lambda 'return id(light_slot_2_entity_text).state;'
            - lambda: |-
                id(light_pending_brightness_sync) = false;
                id(light_pending_color_sync) = false;
      - if:
          condition:
            lambda: 'return id(light_pending_brightness_sync) && id(light_brightness_pct) <= 0 && id(light_source_index) == 2;'
          then:
            - homeassistant.service:
                service: light.turn_off
                data_template:
                  entity_id: !lambda 'return id(light_slot_3_entity_text).state;'
            - lambda: |-
                id(light_pending_brightness_sync) = false;
                id(light_pending_color_sync) = false;
      - if:
          condition:
            lambda: 'return id(light_pending_brightness_sync) && id(light_brightness_pct) <= 0 && id(light_source_index) == 3;'
          then:
            - homeassistant.service:
                service: light.turn_off
                data_template:
                  entity_id: !lambda 'return id(light_slot_4_entity_text).state;'
            - lambda: |-
                id(light_pending_brightness_sync) = false;
                id(light_pending_color_sync) = false;
      - if:
          condition:
            lambda: 'return (id(light_pending_brightness_sync) || id(light_pending_color_sync)) && id(light_brightness_pct) > 0 && id(light_source_index) == 0;'
          then:
            - homeassistant.service:
                service: light.turn_on
                data:
                  transition: "0.15"
                data_template:
                  entity_id: !lambda 'return id(light_slot_1_entity_text).state;'
                  brightness_pct: !lambda 'return to_string(id(light_brightness_pct));'
            - lambda: |-
                id(light_pending_brightness_sync) = false;
                id(light_pending_color_sync) = false;
      - if:
          condition:
            lambda: 'return (id(light_pending_brightness_sync) || id(light_pending_color_sync)) && id(light_brightness_pct) > 0 && id(light_source_index) == 1;'
          then:
            - homeassistant.service:
                service: light.turn_on
                data:
                  transition: "0.15"
                data_template:
                  entity_id: !lambda 'return id(light_slot_2_entity_text).state;'
                  brightness_pct: !lambda 'return to_string(id(light_brightness_pct));'
            - lambda: |-
                id(light_pending_brightness_sync) = false;
                id(light_pending_color_sync) = false;
      - if:
          condition:
            lambda: 'return (id(light_pending_brightness_sync) || id(light_pending_color_sync)) && id(light_brightness_pct) > 0 && id(light_source_index) == 2;'
          then:
