packages:
  application: !include passion-wave-rotaryknob-core.yaml

# Private development wrapper. Public factory builds include the
# credential-free core directly and never parse these secret references.
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "Passion-Wave-Rotaryknob"
    password: !secret fallback_ap_password
