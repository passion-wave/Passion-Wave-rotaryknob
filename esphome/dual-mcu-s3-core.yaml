packages:
  stable_1_2_0: !include passion-wave-rotaryknob-core.yaml

# This test profile deliberately extends, rather than copies, the complete
# 1.2.0 firmware. All display, touch, haptic, media, weather, light, timer,
# alarm, MQTT and Home Assistant behavior therefore remains active on the S3.
substitutions:
  name: "passion-wave-rotary-test-s3"
  friendly_name: "Passion Wave Rotaryknob Test S3"
  project_name: "passion-wave.rotaryknob-test-s3"
  project_version: "2.0.0"
  ui_next_enabled: "true"
  dual_mcu_ha_bridge_enabled: "true"
  dual_mcu_stage1_performance_enabled: "true"
  dual_mcu_stage2_library_offload_enabled: "true"
  # Native Music Assistant counterpart of the Sonos entity
  # media_player.unnamed_room (same RINCON unique ID).
  ha_player: "media_player.roam_2"
  light_1_entity: "light.buero_monitor_wled"
  light_1_preset_select: "select.buero_monitor_wled_preset"
  media_debug_topic: "passion_wave/rotaryknob_test_s3/media/debug"
  mqtt_host: "homeassistant.local"
  mqtt_username: ""
  mqtt_password: ""
  ha_weather: "weather.forecast_home"
  weather_location: "Home"
  ha_base_url: "http://homeassistant.local:8123"
  rain_radar_image_url: "http://homeassistant.local:8123/local/passion-wave/radar.jpg"
  photo_image_url_0: "http://homeassistant.local:8123/local/passion-wave/photo-0.jpg"
  photo_image_url_1: "http://homeassistant.local:8123/local/passion-wave/photo-1.jpg"
  photo_image_url_2: "http://homeassistant.local:8123/local/passion-wave/photo-2.jpg"
  house_floorplan_image_url: "http://homeassistant.local:8123/local/passion-wave/floorplan.png"

esphome:
  min_version: 2026.7.0
  build_path: build/passion_wave_dual_mcu_s3_test
  # ESPHome 2026.7 supplies ArduinoJson as an ESP-IDF component. Remove only
  # the inherited PlatformIO duplicate; <ArduinoJson.h> remains available.
  platformio_options:
    lib_deps: !remove
  includes:
    - dual_mcu_link.h
    - dual_mcu_radar_proxy.h
    - dual_mcu_library_proxy.h

# Do not offer to replace this diagnostic profile from the public dashboard
# import. The inherited runtime functionality remains unchanged.
dashboard_import: !remove

uart:
  id: inter_mcu_uart
  tx_pin: GPIO38
  rx_pin: GPIO48
  baud_rate: 2000000
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

