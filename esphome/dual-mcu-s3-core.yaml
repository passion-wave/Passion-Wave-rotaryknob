  - platform: template
    id: dual_mcu_esp32_link_connected
    name: "ESP32 Coprocessor Link"
    device_class: connectivity
    entity_category: diagnostic
  - platform: template
    id: dual_mcu_ha_bridge_connected
    name: "ESP32 Home Assistant Bridge"
    device_class: connectivity
    entity_category: diagnostic
  - platform: template
    id: dual_mcu_stage1_fallback_active_sensor
    name: "S3 Compatibility Network Fallback"
    device_class: running
    entity_category: diagnostic
  - platform: template
    id: dual_mcu_bridge_time_synced
    name: "ESP32 Bridge Time Synced"
    device_class: connectivity
    entity_category: diagnostic

switch:
  - platform: template
    id: dual_mcu_s3_network_rescue
    name: "S3 Network Rescue Mode"
    icon: "mdi:lifebuoy"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          id(dual_mcu_s3_rescue_mode_enabled) = true;
          id(dual_mcu_stage1_fallback_network_active) = true;
          id(dual_mcu_s3_library_fallback_active) = true;
          id(dual_mcu_stage1_fallback_started_ms) = millis();
          id(dual_mcu_stage1_fallback_refresh_sent) = false;
          id(dual_mcu_stage1_fallback_active_sensor).publish_state(true);
          id(dual_mcu_library_proxy_status).publish_state(
            "S3 Rescue bewusst aktiviert");
      - mqtt.enable:
          id: mqtt_client
      - delay: 2s
      - script.execute: fetch_weather
      - script.execute: fetch_rain_eta
    turn_off_action:
      - mqtt.disable:
          id: mqtt_client
      - lambda: |-
          id(dual_mcu_s3_rescue_mode_enabled) = false;
          id(dual_mcu_stage1_fallback_network_active) = false;
          id(dual_mcu_s3_library_fallback_active) = false;
          id(dual_mcu_stage1_fallback_started_ms) = 0;
          id(dual_mcu_stage1_fallback_refresh_sent) = false;
          id(dual_mcu_stage1_fallback_active_sensor).publish_state(false);
          id(dual_mcu_library_proxy_status).publish_state(
            id(dual_mcu_ha_bridge_ready)
              ? "ESP32 Bibliothek aktiv"
              : "ESP32 Bridge fehlt · Rescue aus");

