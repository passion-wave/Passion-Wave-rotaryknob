packages:
  application: !include dual-mcu-s3-core.yaml
  public_defaults:
    substitutions:
      ha_weather: "weather.forecast_home"
      weather_location: "Home"
      ha_base_url: "http://homeassistant.local:8123"
      rain_radar_image_url: "http://homeassistant.local:8123/local/scrollwheel/rain_radar_z1.jpg"
      photo_image_url_0: "http://homeassistant.local:8123/local/passion-wave/photo-0.jpg"
      photo_image_url_1: "http://homeassistant.local:8123/local/passion-wave/photo-1.jpg"
      photo_image_url_2: "http://homeassistant.local:8123/local/passion-wave/photo-2.jpg"
      house_floorplan_image_url: "http://homeassistant.local:8123/local/passion-wave/floorplan-render/live.png"

substitutions:
  name: "passionwave-rotaryknob"
  friendly_name: "PassionWave RotaryKnob"
  project_name: "passion-wave.rotaryknob-s3"
  project_version: "3.0.1-beta.5"
  factory_onboarding_guard: "true"
  responsive_power_policy_enabled: "true"
  responsive_power_idle_ms: "3000"
  battery_deep_sleep_after_inactivity_ms: "75000"
  ha_weather: "weather.forecast_home"
  weather_location: "Home"
  ha_base_url: "http://homeassistant.local:8123"
  rain_radar_image_url: "http://homeassistant.local:8123/local/scrollwheel/rain_radar_z1.jpg"
  photo_image_url_0: "http://homeassistant.local:8123/local/passion-wave/photo-0.jpg"
  photo_image_url_1: "http://homeassistant.local:8123/local/passion-wave/photo-1.jpg"
  photo_image_url_2: "http://homeassistant.local:8123/local/passion-wave/photo-2.jpg"
  house_floorplan_image_url: "http://homeassistant.local:8123/local/passion-wave/floorplan-render/live.png"
  ha_player: "media_player.passion_wave_media"
  light_1_entity: "light.passion_wave_light_1"
  light_1_preset_select: "select.passion_wave_wled_preset_1"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  build_path: build/passion_wave_factory_s3
  project:
    name: "${project_name}"
    version: "${project_version}"

dashboard_import:
  package_import_url: github://Passion-Wave/Passion-Wave-rotaryknob/esphome/factory-s3.yaml@main
  import_full_config: false

# Provisioning-only profile: the PassionWave Home Assistant integration
# generates and installs a unique key before it creates the ESPHome entry.
# No customer-visible or shared key is compiled into the public image.
api:
  reboot_timeout: 0s
  encryption:

provisioning:
  timeout: 20min

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_http_request
    on_begin:
      - text_sensor.template.publish:
          id: firmware_update_status
          state: "ota_started"
    on_progress:
      - lambda: |-
          id(firmware_update_status).publish_state(
              std::string("ota_progress:") +
              std::to_string(static_cast<int>(x + 0.5f)));
    on_end:
      - text_sensor.template.publish:
          id: firmware_update_status
          state: "ota_complete"
    on_error:
      - lambda: |-
          id(firmware_update_status).publish_state(
              std::string("ota_error:") + std::to_string(x));

wifi:
  ssid: !remove
  password: !remove
  ap:
    ssid: "Passion Wave Setup S3"
    password: "passion-wave"

captive_portal:

# ESP Web Tools owns Wi-Fi provisioning inside its dialog. Keep next_url
# unset so the customer cannot leave the guided two-processor flow early.
improv_serial:
