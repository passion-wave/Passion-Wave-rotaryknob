# Shared installed-device transport. The API key is not compiled into an
# update image: ESPHome reuses the per-endpoint key provisioned into NVS during
# onboarding. OTA and fallback Wi-Fi remain installation-private.
api:
  reboot_timeout: 0s
  encryption:

ota:
  - platform: esphome
    id: ota_esphome
    password: "${managed_ota_password}"
  - platform: http_request
    id: ota_http_request
    on_begin:
      - text_sensor.template.publish:
          id: firmware_update_status
          state: "ota_started"
    on_progress:
      - lambda: |-
          id(firmware_update_status).publish_state(
              std::string("ota_progress:") +
              std::to_string(static_cast<int>(x + 0.5f)));
    on_end:
      - text_sensor.template.publish:
          id: firmware_update_status
          state: "ota_complete"
    on_error:
      - lambda: |-
          id(firmware_update_status).publish_state(
              std::string("ota_error:") + std::to_string(x));

wifi:
  ssid: "${managed_wifi_ssid}"
  password: "${managed_wifi_password}"
  # Installed devices have exactly one provisioned customer WLAN. Reconnect
  # directly instead of spending several seconds on a full channel scan.
  fast_connect: true
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "${managed_fallback_ap_ssid}"
    password: "${managed_fallback_ap_password}"

captive_portal:
