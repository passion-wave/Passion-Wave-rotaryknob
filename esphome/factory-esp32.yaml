packages:
  bridge: !include dual-mcu-esp32-core.yaml
  public_defaults:
    substitutions:
      ha_weather: "weather.forecast_home"
      ha_base_url: "http://homeassistant.local:8123"
      rain_radar_image_url: "http://homeassistant.local:8123/local/scrollwheel/rain_radar_z1.jpg"
      photo_image_url_0: "http://homeassistant.local:8123/local/passion-wave/photo-0.jpg"
      photo_image_url_1: "http://homeassistant.local:8123/local/passion-wave/photo-1.jpg"
      photo_image_url_2: "http://homeassistant.local:8123/local/passion-wave/photo-2.jpg"
      house_floorplan_image_url: "http://homeassistant.local:8123/local/passion-wave/floorplan-render/live.png"

substitutions:
  name: "passionwave-knob-bridge"
  friendly_name: "PassionWave Rotaryknob Bridge"
  ha_player: "media_player.passion_wave_media"
  light_1_entity: "light.passion_wave_light_1"
  wled_preset_entity: "select.passion_wave_wled_preset_1"
  light_2_entity: "light.passion_wave_light_2"
  light_3_entity: "light.passion_wave_light_3"
  light_4_entity: "light.passion_wave_light_4"
  light_4_preset_select: "select.passion_wave_wled_preset"
  ha_weather: "weather.forecast_home"
  ha_base_url: "http://homeassistant.local:8123"
  rain_radar_image_url: "http://homeassistant.local:8123/local/scrollwheel/rain_radar_z1.jpg"
  photo_image_url_0: "http://homeassistant.local:8123/local/passion-wave/photo-0.jpg"
  photo_image_url_1: "http://homeassistant.local:8123/local/passion-wave/photo-1.jpg"
  photo_image_url_2: "http://homeassistant.local:8123/local/passion-wave/photo-2.jpg"
  house_floorplan_image_url: "http://homeassistant.local:8123/local/passion-wave/floorplan-render/live.png"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  build_path: build/passion_wave_factory_esp32
  project:
    name: "passion-wave.rotaryknob-bridge"
    version: "3.0.0-beta.12"

dashboard_import:
  package_import_url: github://Passion-Wave/Passion-Wave-rotaryknob/esphome/factory-esp32.yaml@main
  import_full_config: false

# Provisioning-only profile: the PassionWave Home Assistant integration
# generates and installs a unique key before it creates the ESPHome entry.
# No customer-visible or shared key is compiled into the public image.
api:
  id: esp32_api
  reboot_timeout: 0s
  encryption:

provisioning:
  timeout: 20min

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_http_request

wifi:
  ssid: !remove
  password: !remove
  ap:
    ssid: "Passion Wave Setup Bridge"
    password: "passion-wave"

# ESP Web Tools owns Wi-Fi provisioning inside its dialog. Keep next_url
# unset so Home Assistant is only opened by the final website step.
improv_serial:
