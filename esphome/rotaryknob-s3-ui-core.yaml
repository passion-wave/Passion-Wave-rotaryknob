            id(light_color_temp) = id(light_1_color_temp);
          } else if (id(light_source_index) == 1) {
            id(light_brightness_pct) = id(light_2_on) ? id(light_2_brightness_pct) : 0;
          } else if (id(light_source_index) == 2) {
            id(light_brightness_pct) = id(light_3_on) ? id(light_3_brightness_pct) : 0;
          } else {
            id(light_brightness_pct) = id(light_4_on) ? id(light_4_brightness_pct) : 0;
            id(light_color_temp) = id(light_4_color_temp);
