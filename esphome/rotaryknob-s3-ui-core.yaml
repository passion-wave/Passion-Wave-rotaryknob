  - id: refresh_weather_ui
    mode: restart
    then:
      - lambda: |-
          if (id(ui_next_enabled)) {
            id(weather_ui_dirty) = false;
            return;
          }
          auto rounded_int = [](float value) -> int {
            return static_cast<int>(lroundf(value));
          };
          auto mix_channel = [](uint8_t a, uint8_t b, float ratio) -> uint8_t {
            if (ratio < 0.0f) ratio = 0.0f;
            if (ratio > 1.0f) ratio = 1.0f;
            return static_cast<uint8_t>(roundf(static_cast<float>(a) + (static_cast<float>(b) - static_cast<float>(a)) * ratio));
          };
          auto mix_color = [&](uint32_t from, uint32_t to, float ratio) -> uint32_t {
            const uint8_t fr = (from >> 16) & 0xFF;
            const uint8_t fg = (from >> 8) & 0xFF;
            const uint8_t fb = from & 0xFF;
            const uint8_t tr = (to >> 16) & 0xFF;
            const uint8_t tg = (to >> 8) & 0xFF;
            const uint8_t tb = to & 0xFF;
            return (static_cast<uint32_t>(mix_channel(fr, tr, ratio)) << 16) |
                   (static_cast<uint32_t>(mix_channel(fg, tg, ratio)) << 8) |
                   static_cast<uint32_t>(mix_channel(fb, tb, ratio));
          };
          auto temp_index_color = [&](float temp) -> uint32_t {
            struct Stop {
              float temp;
              uint32_t color;
            };
            static const Stop stops[] = {
              {-10.0f, 0x2563EB},
              {5.0f, 0x38BDF8},
              {16.0f, 0x22C55E},
              {24.0f, 0xFACC15},
              {30.0f, 0xFB923C},
              {38.0f, 0xEF4444},
            };
            if (temp <= stops[0].temp) return stops[0].color;
            for (int i = 1; i < 6; i++) {
              if (temp <= stops[i].temp) {
                const float span = stops[i].temp - stops[i - 1].temp;
                const float ratio = span <= 0.1f ? 0.0f : (temp - stops[i - 1].temp) / span;
                return mix_color(stops[i - 1].color, stops[i].color, ratio);
              }
            }
            return stops[5].color;
          };
          float weather_span = id(weather_maximum) - id(weather_minimum);
          int weather_ring = 50;
          if (fabsf(weather_span) > 0.1f) {
            weather_ring = static_cast<int>(roundf(((id(weather_temperature) - id(weather_minimum)) / weather_span) * 100.0f));
          }
          if (weather_ring < 0) weather_ring = 0;
          if (weather_ring > 100) weather_ring = 100;
          if (id(weather_ring_arc) != nullptr) {
            const int tick_rotation = 106 + static_cast<int>(roundf(weather_ring * 159.0f / 100.0f));
            const uint32_t current_color = temp_index_color(id(weather_temperature));
            lv_arc_set_rotation(id(weather_ring_arc), tick_rotation);
            lv_obj_set_style_arc_color(id(weather_ring_arc), lv_color_hex(current_color), LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_arc_color(id(weather_ring_arc), lv_color_hex(current_color), LV_PART_INDICATOR | LV_STATE_DEFAULT);
            lv_arc_set_value(id(weather_ring_arc), 100);
            lv_obj_invalidate(id(weather_ring_arc));
          }
          static lv_obj_t *weather_temp_gradient_arcs[18] = {};
          auto create_temp_gradient_arc = [&](int index) -> lv_obj_t * {
            auto *arc = lv_arc_create(id(weather_ring_host));
