  - id: refresh_rain_radar_ui
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(current_page) == 8 || (id(current_page) == 4 && weather_radar_popup != nullptr && !lv_obj_has_flag(weather_radar_popup, LV_OBJ_FLAG_HIDDEN));'
          then:
            - lambda: |-
                const uint32_t now = millis();
                const int image_width =
                  id(rain_radar_active_buffer) == 0
                    ? id(rain_radar_image).get_width()
                    : id(rain_radar_staging_image).get_width();
                const int image_height =
                  id(rain_radar_active_buffer) == 0
                    ? id(rain_radar_image).get_height()
                    : id(rain_radar_staging_image).get_height();
                if (image_width > 0 && image_height > 0 && !id(rain_radar_ready)) {
                  id(rain_radar_ready) = true;
                  id(rain_radar_loading) = false;
                  id(rain_radar_loading_started_ms) = 0;
                  id(rain_radar_status_text) = "Lokaler Fokus";
                  id(rain_radar_debug_status_text).publish_state("ready via image dimensions");
                  ESP_LOGW("rain_radar", "radar ready via image dimensions width=%d height=%d", image_width, image_height);
                }
                if (id(rain_radar_loading) && id(rain_radar_loading_started_ms) != 0 &&
                    now - id(rain_radar_loading_started_ms) > 15000) {
                  id(rain_radar_loading) = false;
                  id(rain_radar_loading_started_ms) = 0;
                  id(rain_radar_status_text) = id(rain_radar_ready) ? "Letztes Radar" : "Radar Timeout";
                  id(rain_radar_debug_status_text).publish_state(id(rain_radar_status_text));
                  ESP_LOGW("rain_radar", "radar image update timeout width=%d height=%d", image_width, image_height);
                }
                const int eta =
                  id(rain_radar_eta_valid) ? id(rain_radar_eta_minutes) :
                  id(weather_rain_minutes);
                char headline[48];
                if (id(rain_radar_raining) || eta == 0) {
                  snprintf(headline, sizeof(headline), "Regen jetzt");
                } else if (eta > 0) {
                  snprintf(headline, sizeof(headline), "Regen in %d min", eta);
                } else {
                  snprintf(headline, sizeof(headline), "Kein Regen erwartet");
                }
                lv_label_set_text(rain_radar_title_label, headline);

                char direction[64];
                if (id(rain_radar_direction_valid)) {
                  static const char *names[] = {
                    "N", "NO", "O", "SO", "S", "SW", "W", "NW"};
                  const int bearing =
                    ((id(rain_radar_direction_tenths) + 225) / 450) % 8;
                  if (id(rain_radar_motion_speed_valid)) {
                    snprintf(direction, sizeof(direction), "aus %s · %.1f km/h",
                             names[bearing],
                             id(rain_radar_motion_speed_tenths) / 10.0f);
                  } else {
                    snprintf(direction, sizeof(direction), "aus %s", names[bearing]);
                  }
                } else {
                  snprintf(direction, sizeof(direction), "Richtung nicht verfügbar");
                }
                lv_label_set_text(rain_radar_status_label, direction);
                static const char *ranges[] = {"264 km", "132 km", "66 km"};
                lv_label_set_text(
                  rain_radar_zoom_label,
                  ranges[std::clamp(id(rain_radar_zoom_level), 0, 2)]);
                lv_label_set_text(
                  rain_radar_loading_label,
                  id(rain_radar_loading) ? "Aktualisiere…" : "");
                if (id(rain_radar_ready)) {
                  if (id(rain_radar_active_buffer) == 0)
                    lv_img_set_src(rain_radar_image_widget, id(rain_radar_image));
                  else
                    lv_img_set_src(rain_radar_image_widget, id(rain_radar_staging_image));
