      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${ha_weather}
            type: daily
          capture_response: true
          on_success:
            - lambda: |-
                  JsonObjectConst root = response["response"].as<JsonObjectConst>();
                  if (root.isNull()) {
                    root = response["service_response"].as<JsonObjectConst>();
                  }
                  if (root.isNull()) {
                    root = response;
                  }
                  JsonObjectConst weather = root["${ha_weather}"].as<JsonObjectConst>();
                  if (weather.isNull() && root.containsKey("forecast")) {
                    weather = root;
                  }
                  JsonArrayConst forecasts = weather["forecast"].as<JsonArrayConst>();
                  if (forecasts.isNull() || forecasts.size() == 0) {
                    id(weather_detail_text) = "Forecast nicht geladen";
                    id(weather_ui_dirty) = true;
                    return;
                  }

                  auto read_float = [](JsonVariantConst value, float fallback) -> float {
                    if (value.isNull()) {
                      return fallback;
                    }
                    if (value.is<float>() || value.is<double>() || value.is<int>()) {
                      return value.as<float>();
                    }
                    const char *text = value.as<const char *>();
                    if (text == nullptr || text[0] == '\0') {
                      return fallback;
                    }
                    char *end = nullptr;
                    const float parsed = strtof(text, &end);
                    return end != text ? parsed : fallback;
                  };

                  auto set_forecast = [&](int index, float minimum, float maximum) {
                    switch (index) {
                      case 0:
                        id(weather_forecast_min_0) = minimum;
                        id(weather_forecast_max_0) = maximum;
                        break;
                      case 1:
                        id(weather_forecast_min_1) = minimum;
                        id(weather_forecast_max_1) = maximum;
                        break;
                      case 2:
                        id(weather_forecast_min_2) = minimum;
                        id(weather_forecast_max_2) = maximum;
                        break;
                      case 3:
                        id(weather_forecast_min_3) = minimum;
                        id(weather_forecast_max_3) = maximum;
                        break;
                      default:
                        id(weather_forecast_min_4) = minimum;
                        id(weather_forecast_max_4) = maximum;
                        break;
                    }
                  };

                  auto set_forecast_condition = [&](int index, const std::string &condition) {
                    switch (index) {
                      case 0: id(weather_forecast_condition_0) = condition; break;
                      case 1: id(weather_forecast_condition_1) = condition; break;
                      case 2: id(weather_forecast_condition_2) = condition; break;
                      case 3: id(weather_forecast_condition_3) = condition; break;
                      default: id(weather_forecast_condition_4) = condition; break;
                    }
                  };

                  for (int index = 0; index < 5; index++) {
                    if (forecasts.size() <= index) {
                      break;
                    }
                    JsonObjectConst forecast = forecasts[index].as<JsonObjectConst>();
                    const float minimum = read_float(forecast["templow"], id(weather_minimum));
                    const float maximum = read_float(forecast["temperature"], id(weather_maximum));
                    if (index == 0) {
                      id(weather_minimum) = minimum;
                      id(weather_maximum) = maximum;
                      float rain_probability = read_float(forecast["precipitation_probability"], -1.0f);
                      if (rain_probability < 0.0f) {
                        const float precipitation = read_float(forecast["precipitation"], 0.0f);
                        rain_probability = precipitation > 0.01f ? 80.0f : 0.0f;
                      }
                      int rounded_rain = static_cast<int>(lroundf(rain_probability));
                      if (rounded_rain < 0) rounded_rain = 0;
                      if (rounded_rain > 100) rounded_rain = 100;
                      id(weather_precipitation_probability) = rounded_rain;
                    }
                    set_forecast(index, minimum, maximum);
                    const char *forecast_condition = forecast["condition"].as<const char *>();
                    set_forecast_condition(index, forecast_condition == nullptr || forecast_condition[0] == '\0'
                                                      ? "partlycloudy" : forecast_condition);
                  }
                  id(weather_ui_dirty) = true;
            - script.execute: refresh_weather_ui_if_needed
          on_error:
            - lambda: |-
                  id(weather_detail_text) = "Forecast nicht geladen";
                  id(weather_ui_dirty) = true;
            - script.execute: refresh_weather_ui_if_needed
