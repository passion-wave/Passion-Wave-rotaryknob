  - id: refresh_rain_radar_image
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(demo_mode_active) || (!id(wifi_connected) && !id(dual_mcu_ha_bridge_ready));'
          then:
            - lambda: |-
                id(rain_radar_ready) = false;
                id(rain_radar_loading) = false;
                id(rain_radar_loading_started_ms) = 0;
                id(rain_radar_status_text) = id(demo_mode_active) ? "Demo ohne WLAN" : "WLAN offline";
                id(rain_radar_debug_status_text).publish_state(id(rain_radar_status_text));
            - script.execute: refresh_rain_radar_ui
            - script.stop: refresh_rain_radar_image
      - lambda: |-
          const uint32_t now = millis();
          const bool force = id(rain_radar_force_refresh);
          id(rain_radar_force_refresh) = false;

          std::string url = id(rain_radar_image_path_cache);
          while (!url.empty() && isspace(static_cast<unsigned char>(url.front()))) url.erase(url.begin());
          while (!url.empty() && isspace(static_cast<unsigned char>(url.back()))) url.pop_back();
          if (!url.empty() && url[0] == '/') {
            std::string base = "${ha_base_url}";
            while (!base.empty() && base.back() == '/') base.pop_back();
            url = base + url;
          }
          if (url.empty() || url == "unknown" || url == "unavailable") {
            url = "${rain_radar_image_url}";
          }
          while (!url.empty() && isspace(static_cast<unsigned char>(url.front()))) url.erase(url.begin());
          while (!url.empty() && isspace(static_cast<unsigned char>(url.back()))) url.pop_back();

          if (url.empty() || url == "unknown" || url == "unavailable" ||
              (url.rfind("http://", 0) != 0 && url.rfind("https://", 0) != 0)) {
            id(rain_radar_ready) = false;
            id(rain_radar_loading) = false;
            id(rain_radar_loading_started_ms) = 0;
            id(rain_radar_status_text) = "Radar URL fehlt";
            id(rain_radar_debug_status_text).publish_state(id(rain_radar_status_text));
            ESP_LOGW("rain_radar", "invalid radar url");
            return;
          }
          if (url.size() > 512) {
            id(rain_radar_ready) = false;
            id(rain_radar_loading) = false;
            id(rain_radar_loading_started_ms) = 0;
            id(rain_radar_status_text) = "Radar URL zu lang";
            id(rain_radar_debug_status_text).publish_state(id(rain_radar_status_text));
            ESP_LOGW("rain_radar", "radar url too long: %u", static_cast<unsigned>(url.size()));
            return;
          }
          if (id(rain_radar_loading)) {
            id(rain_radar_status_text) = id(rain_radar_ready) ? "Aktualisiere" : "Lade Radar";
            id(rain_radar_debug_status_text).publish_state(id(rain_radar_status_text));
            ESP_LOGW("rain_radar", "radar update skipped: already loading age_ms=%u", static_cast<unsigned>(now - id(rain_radar_loading_started_ms)));
            return;
          }
          if (!force && id(rain_radar_ready) && id(rain_radar_loaded_url) == url &&
              id(rain_radar_last_attempt_ms) != 0 &&
              now - id(rain_radar_last_attempt_ms) < 60000UL) {
            id(rain_radar_status_text) = "Lokaler Fokus";
            id(rain_radar_debug_status_text).publish_state(id(rain_radar_status_text));
            return;
          }
          if (!force && id(rain_radar_last_attempt_ms) != 0 &&
              now - id(rain_radar_last_attempt_ms) < 5000) {
            id(rain_radar_status_text) = id(rain_radar_ready) ? "Letztes Radar" : "Warte Radar";
            id(rain_radar_debug_status_text).publish_state(id(rain_radar_status_text));
            ESP_LOGW("rain_radar", "radar update skipped: throttle age_ms=%u", static_cast<unsigned>(now - id(rain_radar_last_attempt_ms)));
            return;
          }

