  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              const std::string raw = id(weather_condition_raw);
              return !id(display_sleeping) &&
                     id(current_page) == 7 &&
                     (raw == "rainy" || raw == "pouring" || raw == "lightning-rainy" || raw == "hail" ||
                      raw == "snowy" || raw == "snowy-rainy" || raw == "fog");
          then:
            - lambda: |-
                const std::string raw = id(weather_condition_raw);
                const bool is_rain = raw == "rainy" || raw == "pouring" || raw == "lightning-rainy" || raw == "hail";
                const bool is_snow = raw == "snowy" || raw == "snowy-rainy";
                const bool is_fog = raw == "fog";
                const uint32_t tick = millis() / 250U;
                auto set_pos = [](lv_obj_t *obj, int x, int y) {
                  if (obj == nullptr) return;
                  lv_obj_set_pos(obj, x, y);
                };

                if (is_rain) {
                  const int base_x[5] = {70, 122, 180, 232, 284};
                  const int phase[5] = {0, 34, 12, 58, 26};
                  for (int i = 0; i < 5; i++) {
                    const int y = 118 + static_cast<int>((tick * 22 + phase[i]) % 116);
                    const int x = base_x[i] + static_cast<int>((tick + i) % 4);
                    lv_obj_t *drops[5] = {screensaver_rain_0, screensaver_rain_1, screensaver_rain_2, screensaver_rain_3, screensaver_rain_4};
                    set_pos(drops[i], x, y);
                  }
                }

                if (is_snow) {
                  const int base_x[5] = {76, 132, 190, 238, 286};
                  const int phase[5] = {4, 48, 18, 74, 34};
                  for (int i = 0; i < 5; i++) {
                    const int y = 116 + static_cast<int>((tick * 7 + phase[i]) % 128);
                    const int sway = static_cast<int>(((tick + i * 2) % 9)) - 4;
                    lv_obj_t *flakes[5] = {screensaver_snow_0, screensaver_snow_1, screensaver_snow_2, screensaver_snow_3, screensaver_snow_4};
                    set_pos(flakes[i], base_x[i] + sway, y);
                  }
                }

                if (is_fog) {
                  const int base_y[5] = {122, 146, 170, 194, 218};
                  const int phase[5] = {0, 74, 148, 38, 112};
                  const int speed[5] = {5, 4, 6, 3, 5};
                  for (int i = 0; i < 5; i++) {
                    const int x = -82 + static_cast<int>((tick * speed[i] + phase[i]) % 448);
                    lv_obj_t *fog[5] = {screensaver_fog_0, screensaver_fog_1, screensaver_fog_2, screensaver_fog_3, screensaver_fog_4};
                    set_pos(fog[i], x, base_y[i]);
                  }
                }
