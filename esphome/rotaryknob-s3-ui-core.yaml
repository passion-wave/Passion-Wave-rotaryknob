            id(current_page) == 6 ||
            id(current_page) == 8 ||
            id(current_page) == 11 ||
            id(current_page) == 12 ||
            id(current_page) == 21 ||
            id(current_page) == 22 ||
            id(current_page) == 23;
          if (!rotary_action_page) {
