substitutions:
  name: "passion-wave-rotaryknob"
  friendly_name: "Passion Wave RotaryKnob"
  device_description: "ESP32S3-1.8-inch JC3636K518C"
  project_name: "passion-wave.rotaryknob"
  project_version: "3.0.1-beta.6"
  ui_next_enabled: "false"
  dual_mcu_ha_bridge_enabled: "true"
  # V3 has no direct S3 application-network fallback. The classic ESP32 owns
  # all Home Assistant application traffic and forwards state/assets by UART.
  dual_mcu_stage1_performance_enabled: "true"
  dual_mcu_stage2_library_offload_enabled: "true"
  # Public factory builds stay discoverable until Home Assistant has connected
  # once. Adopted and development builds retain the normal idle policy.
  factory_onboarding_guard: "false"
  responsive_power_policy_enabled: "false"
  responsive_power_idle_ms: "3000"
  battery_deep_sleep_after_inactivity_ms: "90000"
  ha_player: "media_player.passion_wave_media"
  light_1_name: "Light 1"
  light_1_entity: "light.passion_wave_light_1"
  light_1_preset_select: "select.passion_wave_wled_preset_1"
  ambiente_scene_1_name: "Scene 1"
  ambiente_scene_1_entity: "scene.passion_wave_scene_1"
  ambiente_scene_2_name: "Scene 2"
  ambiente_scene_2_entity: "scene.passion_wave_scene_2"
  ambiente_scene_3_name: "Scene 3"
  ambiente_scene_3_entity: "scene.passion_wave_scene_3"
  ambiente_scene_4_name: "Scene 4"
  ambiente_scene_4_entity: "scene.passion_wave_scene_4"
  ambiente_scene_5_name: "Scene 5"
  ambiente_scene_5_entity: "scene.passion_wave_scene_5"
  light_2_name: "Light 2"
  light_2_entity: "light.passion_wave_light_2"
  light_3_name: "Light 3"
  light_3_entity: "light.passion_wave_light_3"
  light_4_name: "Light 4"
  light_4_entity: "light.passion_wave_light_4"
  light_4_preset_select: "select.passion_wave_wled_preset"
  playlist_selector: "input_select.passion_wave_playlist"
  playlist_page_limit: "24"
  playlist_track_limit: "16"
  ha_weather: "weather.forecast_home"
  weather_location: "Home"
  ha_base_url: "http://homeassistant.local:8123"
  rain_radar_image_url: "http://homeassistant.local:8123/local/scrollwheel/rain_radar_z1.jpg"
  photo_image_url_0: "http://homeassistant.local:8123/local/passion-wave/photo-0.jpg"
  photo_image_url_1: "http://homeassistant.local:8123/local/passion-wave/photo-1.jpg"
  photo_image_url_2: "http://homeassistant.local:8123/local/passion-wave/photo-2.jpg"
