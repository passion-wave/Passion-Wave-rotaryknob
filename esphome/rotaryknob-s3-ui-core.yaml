  - id: media_volume_down
    mode: restart
    then:
      - lambda: |-
          id(ui_last_activity_ms) = millis();
          id(media_last_activity_ms) = millis();
          float base = id(display_volume_level);
          if (isnan(base)) return;
          float target = base - 0.02f;
          if (target < 0.0f) target = 0.0f;
          id(display_volume_level) = target;
          id(volume_override_active) = true;
          // Keep HA feedback out only while the user is actively turning.
          // Every detent remains immediate; 350 ms is an idle-release window,
          // not an input debounce.
          id(volume_override_until_ms) = millis() + 3000;
          id(media_pending_volume_sync) = true;
          id(media_volume_sync_deadline_ms) = millis();
          if (id(dual_mcu_ha_bridge_enabled) &&
              id(dual_mcu_ha_bridge_ready)) {
            id(media_volume_confirmation_pending) = true;
            id(media_volume_confirmation_target_pct) =
              static_cast<uint8_t>(lroundf(target * 100.0f));
            id(media_volume_confirmation_deadline_ms) = millis() + 3000;
          }
          id(displayed_media_volume_sensor).publish_state(
            static_cast<int>(lroundf(target * 100.0f)));
          id(media_ui_dirty) = true;
