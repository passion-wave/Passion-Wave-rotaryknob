online_image:
  - id: media_cover_image
    url: "http://127.0.0.1/"
    format: JPEG
    type: RGB565
    # Decode into the final overscan geometry. The LVGL widget is never scaled;
    # the 360x360 panel clips four pixels from every edge instead.
    resize: 368x368
    buffer_size: 65536
    update_interval: never
    on_download_finished:
      - lambda: |-
          const bool current =
            id(media_cover_active_target) == 2 &&
            id(media_cover_active_url) == id(media_cover_url_cache);
          id(media_cover_ready) = current;
          if (current) {
            id(media_full_cover_loaded_url) = id(media_cover_url_cache);
            id(media_cover_failure_count) = 0;
            id(media_cover_last_success_ms) = millis();
          } else {
            id(media_full_cover_loaded_url).clear();
            id(media_cover_update_pending) = true;
          }
          id(media_cover_pipeline_state) = 0;
          id(media_cover_active_target) = 0;
          id(media_cover_active_url).clear();
          id(media_ui_dirty) = true;
          id(publish_media_debug).execute(
            current ? "esp_cover_update_done" : "esp_cover_update_deferred",
            "fullscreen",
            "cover",
            current ? id(media_cover_url_cache) : std::string("stale download ignored"));
      - script.execute: refresh_media_ui_if_needed
    on_error:
      - lambda: |-
          id(media_cover_ready) = false;
          id(media_full_cover_loaded_url).clear();
          id(media_cover_failure_count) += 1;
          id(media_cover_backoff_until_ms) = millis() + (id(media_cover_failure_count) >= 3 ? 60000 : 5000);
          id(media_cover_pipeline_state) = 4;
          id(media_cover_active_target) = 0;
          id(media_cover_active_url).clear();
          id(media_ui_dirty) = true;
          id(publish_media_debug).execute(
            "esp_cover_update_failed_backoff",
            "fullscreen",
            "cover",
            std::string("failures=") + std::to_string(id(media_cover_failure_count)));
      - script.execute: refresh_media_ui_if_needed
  - id: media_page_cover_image
    url: "http://127.0.0.1/"
    format: JPEG
    type: RGB565
    resize: 124x124
    buffer_size: 65536
    update_interval: never
    on_download_finished:
      - lambda: |-
          const bool current =
            id(media_cover_active_target) == 1 &&
            id(media_cover_active_url) == id(media_cover_url_cache);
          id(media_page_cover_ready) = current;
          if (current) {
            id(media_page_cover_loaded_url) = id(media_cover_url_cache);
            id(media_cover_update_pending) = false;
            id(media_cover_failure_count) = 0;
            id(media_cover_last_success_ms) = millis();
          } else {
            id(media_page_cover_loaded_url).clear();
            id(media_cover_update_pending) = true;
          }
          id(media_cover_pipeline_state) = 0;
          id(media_cover_active_target) = 0;
          id(media_cover_active_url).clear();
          id(media_ui_dirty) = true;
          id(publish_media_debug).execute(
            current ? "esp_cover_update_done" : "esp_cover_update_deferred",
            "page",
            "cover",
            current ? id(media_cover_url_cache) : std::string("stale download ignored"));
      - script.execute: refresh_media_ui_if_needed
    on_error:
      - lambda: |-
          id(media_page_cover_ready) = false;
          id(media_page_cover_loaded_url).clear();
          id(media_cover_failure_count) += 1;
          id(media_cover_backoff_until_ms) = millis() + (id(media_cover_failure_count) >= 3 ? 60000 : 5000);
          id(media_cover_pipeline_state) = 4;
          id(media_cover_active_target) = 0;
          id(media_cover_active_url).clear();
          id(media_ui_dirty) = true;
          id(publish_media_debug).execute(
            "esp_cover_update_failed_backoff",
            "page",
            "cover",
            std::string("failures=") + std::to_string(id(media_cover_failure_count)));
      - script.execute: refresh_media_ui_if_needed
  - id: rain_radar_image
    url: "${rain_radar_image_url}"
    format: JPEG
    type: RGB565
    resize: 320x320
    buffer_size: 65536
    update_interval: never
    on_download_finished:
      - lambda: |-
          id(rain_radar_active_buffer) = 0;
          id(rain_radar_ready) = true;
          id(rain_radar_loading) = false;
          id(rain_radar_loading_started_ms) = 0;
          id(rain_radar_loaded_url) = id(rain_radar_active_url);
          id(rain_radar_status_text) = "Lokaler Fokus";
          id(rain_radar_debug_status_text).publish_state(
            std::string("loaded width=") + std::to_string(id(rain_radar_image).get_width()) +
            " height=" + std::to_string(id(rain_radar_image).get_height()));
          ESP_LOGW("rain_radar", "radar image loaded width=%d height=%d", id(rain_radar_image).get_width(), id(rain_radar_image).get_height());
      - script.execute: refresh_rain_radar_ui
    on_error:
      - lambda: |-
          id(rain_radar_loading) = false;
          id(rain_radar_loading_started_ms) = 0;
          id(rain_radar_status_text) = id(rain_radar_ready) ? "Letztes Radar" : "Radar Fehler";
          if (id(rain_radar_loaded_url).empty()) {
            id(rain_radar_ready) = false;
          }
          id(rain_radar_debug_status_text).publish_state(id(rain_radar_status_text));
          ESP_LOGW("rain_radar", "radar image download failed");
      - script.execute: refresh_rain_radar_ui
  - id: rain_radar_staging_image
    url: "${rain_radar_image_url}"
    format: JPEG
    type: RGB565
    resize: 320x320
    buffer_size: 65536
    update_interval: never
  - id: photo_slideshow_image
    url: "${photo_image_url_0}"
    format: JPEG
    type: RGB565
    resize: 360x360
    buffer_size: 65536
    update_interval: never
    on_download_finished:
      - lambda: |-
          id(photo_slideshow_loading) = false;
          id(photo_slideshow_ready) = true;
      - script.execute: refresh_photo_ui
    on_error:
      - lambda: |-
          id(photo_slideshow_loading) = false;
          id(photo_slideshow_ready) = false;
      - script.execute: refresh_photo_ui
  - id: house_floorplan_image
    url: "${house_floorplan_image_url}"
    format: PNG
    type: RGB565
    resize: 360x360
    # ESPHome caps this input buffer at 64 KiB. The HA renderer therefore
    # quantizes to the display's RGB565 precision before PNG compression.
    buffer_size: 65536
    update_interval: never
    on_download_finished:
      - lambda: |-
          id(house_floorplan_loading) = false;
          id(house_floorplan_ready) = true;
          id(house_floorplan_error) = false;
      - script.execute: refresh_house_ui
    on_error:
      - lambda: |-
          id(house_floorplan_loading) = false;
          id(house_floorplan_ready) = false;
          id(house_floorplan_error) = true;
      - script.execute: refresh_house_ui

