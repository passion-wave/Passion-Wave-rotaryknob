  - id: ui_next_direct_wled_preset
    mode: restart
    parameters:
      option: std::string
    then:
      - lambda: |-
          dual_mcu::link.send_ha_text_action(
            dual_mcu::HAAction::SELECT_OPTION,
            "${light_1_preset_select}", option.c_str());
  - id: select_light_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(current_page) == 1;'
          then:
