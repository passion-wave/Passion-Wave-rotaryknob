                                          dual_mcu::HAAction::MEDIA_NEXT, 0,
                                          id(media_effective_entity_id).c_str());
  - id: refresh_control_ui_if_needed
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(current_page) == 1 && id(light_ui_dirty);'
          then:
            - script.execute: refresh_light_ui
      - if:
          condition:
            lambda: 'return (id(current_page) == 2 || id(current_page) == 6) && id(media_ui_dirty);'
          then:
            - script.execute: refresh_media_ui_if_needed
  - id: refresh_control_ui
    mode: restart
    then:
      - script.execute: refresh_control_time
      - script.execute: refresh_control_ui_if_needed
      - script.execute: refresh_battery_ui
      - if:
          condition:
            lambda: 'return id(current_page) == 5;'
          then:
            - script.execute: refresh_settings_ui
  - id: refresh_control_time
    mode: restart
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) {
            now = id(sntp_time).now();
          }
          char time_buffer[9];
          char date_buffer[24];
          if (now.is_valid()) {
            const char *weekdays[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
            const char *months[] = {"Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"};
            const int weekday_index = now.day_of_week >= 1 && now.day_of_week <= 7 ? now.day_of_week - 1 : 0;
            const int month_index = now.month >= 1 && now.month <= 12 ? now.month - 1 : 0;
            snprintf(time_buffer, sizeof(time_buffer), "%02d:%02d", now.hour, now.minute);
            snprintf(date_buffer, sizeof(date_buffer), "%s %02d.%s", weekdays[weekday_index], now.day_of_month, months[month_index]);
          } else {
            snprintf(time_buffer, sizeof(time_buffer), "--:--");
            snprintf(date_buffer, sizeof(date_buffer), "--");
          }
          if (id(current_page) == 1) {
            lv_label_set_text(light_time_label, time_buffer);
            lv_label_set_text(light_date_label, date_buffer);
          } else if (id(current_page) == 2) {
            lv_label_set_text(media_time_label, time_buffer);
            lv_label_set_text(media_date_label, date_buffer);
          }
  - id: light_sync_remote
    mode: restart
    then:
      - lambda: |-
          auto clamp_channel = [](float value) -> int {
            if (value < 0.0f) return 0;
            if (value > 255.0f) return 255;
            return static_cast<int>(value + 0.5f);
          };

          const float kelvin = static_cast<float>(id(light_color_temp));
          const float temperature = kelvin / 100.0f;
          float red = 255.0f;
          float green = 0.0f;
          float blue = 0.0f;

          if (temperature <= 66.0f) {
            green = 99.4708025861f * logf(temperature) - 161.1195681661f;
            if (temperature <= 19.0f) {
              blue = 0.0f;
            } else {
              blue = 138.5177312231f * logf(temperature - 10.0f) - 305.0447927307f;
            }
          } else {
            red = 329.698727446f * powf(temperature - 60.0f, -0.1332047592f);
            green = 288.1221695283f * powf(temperature - 60.0f, -0.0755148492f);
            blue = 255.0f;
          }

          id(light_rgb_red) = clamp_channel(red);
          id(light_rgb_green) = clamp_channel(green);
          id(light_rgb_blue) = clamp_channel(blue);
          if (id(light_source_index) == 0) {
            id(light_1_brightness_pct) = id(light_brightness_pct);
            id(light_1_on) = id(light_brightness_pct) > 0;
            id(light_1_color_temp) = id(light_color_temp);
          } else if (id(light_source_index) == 1) {
            id(light_2_brightness_pct) = id(light_brightness_pct);
            id(light_2_on) = id(light_brightness_pct) > 0;
          } else if (id(light_source_index) == 2) {
            id(light_3_brightness_pct) = id(light_brightness_pct);
            id(light_3_on) = id(light_brightness_pct) > 0;
          } else {
            id(light_4_brightness_pct) = id(light_brightness_pct);
            id(light_4_on) = id(light_brightness_pct) > 0;
          }
          id(light_ui_dirty) = true;
      - if:
          condition:
            lambda: 'return id(demo_mode_active) || (!id(wifi_connected) && !id(dual_mcu_ha_bridge_ready));'
          then:
            - lambda: |-
                id(light_pending_brightness_sync) = false;
                id(light_pending_color_sync) = false;
                id(light_ui_dirty) = true;
            - script.execute: refresh_light_ui_if_needed
            - script.stop: light_sync_remote
      - if:
          condition:
            lambda: 'return id(light_pending_brightness_sync) && !id(light_pending_color_sync) && id(dual_mcu_ha_bridge_enabled) && id(dual_mcu_ha_bridge_ready);'
          then:
            - lambda: |-
                const char *entity = id(light_source_index) == 0 ? id(light_slot_1_entity_text).state.c_str() :
                                     id(light_source_index) == 1 ? id(light_slot_2_entity_text).state.c_str() :
                                     id(light_source_index) == 2 ? id(light_slot_3_entity_text).state.c_str() :
                                                                   id(light_slot_4_entity_text).state.c_str();
                const auto action = id(light_brightness_pct) <= 0
                  ? dual_mcu::HAAction::LIGHT_OFF
                  : dual_mcu::HAAction::LIGHT_BRIGHTNESS;
                dual_mcu::link.send_ha_action(
                  action, static_cast<uint8_t>(std::clamp(id(light_brightness_pct), 0, 100)), entity);
                id(light_pending_brightness_sync) = false;
                id(light_pending_color_sync) = false;
            - script.execute: refresh_light_ui_if_needed
            - script.stop: light_sync_remote

  - id: light_turn_current_off
    mode: restart
    then:
      - lambda: |-
          id(light_sync_generation) += 1;
          id(light_local_change_deadline_ms) = millis() + 1200;
          id(light_brightness_pct) = 0;
          id(light_pending_brightness_sync) = false;
          id(light_pending_color_sync) = false;
          if (id(light_source_index) == 0) {
            id(light_1_brightness_pct) = 0;
            id(light_1_on) = false;
          } else if (id(light_source_index) == 1) {
            id(light_2_brightness_pct) = 0;
            id(light_2_on) = false;
          } else if (id(light_source_index) == 2) {
            id(light_3_brightness_pct) = 0;
            id(light_3_on) = false;
          } else {
            id(light_4_brightness_pct) = 0;
            id(light_4_on) = false;
          }
          id(light_ui_dirty) = true;
      - if:
          condition:
            lambda: 'return id(dual_mcu_ha_bridge_enabled) && id(dual_mcu_ha_bridge_ready);'
          then:
            - lambda: |-
                const char *entity = id(light_source_index) == 0 ? id(light_slot_1_entity_text).state.c_str() :
                                     id(light_source_index) == 1 ? id(light_slot_2_entity_text).state.c_str() :
                                     id(light_source_index) == 2 ? id(light_slot_3_entity_text).state.c_str() :
                                                                   id(light_slot_4_entity_text).state.c_str();
                dual_mcu::link.send_ha_action(dual_mcu::HAAction::LIGHT_OFF, 0, entity);
      - script.execute: refresh_light_ui_if_needed

  - id: light_toggle_current
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              if (id(light_source_index) == 0) return id(light_1_on);
              if (id(light_source_index) == 1) return id(light_2_on);
              if (id(light_source_index) == 2) return id(light_3_on);
              return id(light_4_on);
          then:
            - script.execute: light_turn_current_off
          else:
            - lambda: |-
                id(light_sync_generation) += 1;
                id(light_local_change_deadline_ms) = millis() + 1200;
                id(light_brightness_pct) = 100;
                id(light_pending_brightness_sync) = false;
                id(light_pending_color_sync) = false;
                if (id(light_source_index) == 0) {
                  id(light_1_brightness_pct) = 100;
                  id(light_1_on) = true;
                } else if (id(light_source_index) == 1) {
                  id(light_2_brightness_pct) = 100;
                  id(light_2_on) = true;
                } else if (id(light_source_index) == 2) {
                  id(light_3_brightness_pct) = 100;
                  id(light_3_on) = true;
                } else {
                  id(light_4_brightness_pct) = 100;
                  id(light_4_on) = true;
                }
                id(light_ui_dirty) = true;
            - if:
                condition:
                  lambda: 'return id(dual_mcu_ha_bridge_enabled) && id(dual_mcu_ha_bridge_ready);'
                then:
                  - lambda: |-
                      const char *entity = id(light_source_index) == 0 ? id(light_slot_1_entity_text).state.c_str() :
                                           id(light_source_index) == 1 ? id(light_slot_2_entity_text).state.c_str() :
                                           id(light_source_index) == 2 ? id(light_slot_3_entity_text).state.c_str() :
                                                                         id(light_slot_4_entity_text).state.c_str();
                      dual_mcu::link.send_ha_action(dual_mcu::HAAction::LIGHT_ON, 100, entity);
            - script.execute: refresh_light_ui_if_needed

  - id: light_turn_all_off
    mode: restart
    then:
      - lambda: |-
          id(light_sync_generation) += 1;
          id(light_local_change_deadline_ms) = millis() + 1200;
          id(light_brightness_pct) = 0;
          id(light_1_brightness_pct) = 0;
          id(light_2_brightness_pct) = 0;
          id(light_3_brightness_pct) = 0;
          id(light_4_brightness_pct) = 0;
          id(light_1_on) = false;
          id(light_2_on) = false;
          id(light_3_on) = false;
          id(light_4_on) = false;
          id(light_pending_brightness_sync) = false;
          id(light_pending_color_sync) = false;
          id(light_ui_dirty) = true;
      - if:
          condition:
            lambda: 'return id(dual_mcu_ha_bridge_enabled) && id(dual_mcu_ha_bridge_ready);'
          then:
            - lambda: |-
                const char *entities[] = {
                  id(light_slot_1_entity_text).state.c_str(),
                  id(light_slot_2_entity_text).state.c_str(),
                  id(light_slot_3_entity_text).state.c_str(),
                  id(light_slot_4_entity_text).state.c_str(),
                };
                for (const char *entity : entities) {
                  if (entity != nullptr && entity[0] != '\0')
                    dual_mcu::link.send_ha_action(
                      dual_mcu::HAAction::LIGHT_OFF, 0, entity);
                }
      - script.execute: refresh_light_ui_if_needed

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Berlin
  # Retain the historical fallback ID for UI code, but source it through the
  # encrypted Native API as well. V3 performs no SNTP request on the S3.
  - platform: homeassistant
    id: sntp_time
    timezone: Europe/Berlin

interval:
  # Stay fully responsive during interaction and asset transfer. On battery,
  # connected modem sleep starts only after the short quiet window.
  - interval: 250ms
    then:
      - lambda: |-
          if (!${responsive_power_policy_enabled}) return;
          const uint32_t now = millis();
          const bool recent_activity =
            now < 30000U ||
            (id(ui_last_activity_ms) != 0 &&
             now - id(ui_last_activity_ms) < ${responsive_power_idle_ms}U);
          const bool asset_active =
            dual_mcu::asset_decode_running ||
            dual_mcu::radar_client.active() ||
            id(dual_mcu_asset_active_kind) != 0 ||
            id(dual_mcu_asset_pending_kind) != 0 ||
            id(rain_radar_loading) ||
            id(photo_slideshow_loading) ||
            id(house_floorplan_loading);
          responsive_power::wifi_policy().update(
            id(external_power_detected), recent_activity || asset_active, now);

  # Optional full-screen images are decoded lazily. Once their page has been
  # left, release pixel buffers after a short grace period. Radar and
  # floorplan will therefore fetch a current frame on the next visit; photos
  # trade a rare reload for a permanently smaller PSRAM footprint.
  - interval: 15s
    then:
      - lambda: |-
          const uint32_t now = millis();
          const bool asset_idle =
            !dual_mcu::asset_decode_running &&
            !dual_mcu::radar_client.active() &&
            id(dual_mcu_asset_active_kind) == 0 &&
            id(dual_mcu_asset_pending_kind) == 0 &&
            !id(rain_radar_loading) &&
            !id(photo_slideshow_loading) &&
            !id(house_floorplan_loading);

          if (id(current_page) == 8) {
            id(rain_radar_last_visible_ms) = now;
          } else if (asset_idle && id(rain_radar_last_visible_ms) != 0 &&
                     now - id(rain_radar_last_visible_ms) >= 45000U) {
            id(rain_radar_image).release();
            id(rain_radar_staging_image).release();
            id(rain_radar_ready) = false;
            id(rain_radar_loaded_url).clear();
            id(rain_radar_active_buffer) = 0;
            id(rain_radar_status_text) = "Aktualisierung beim Öffnen";
            id(rain_radar_last_visible_ms) = 0;
          }

          if (id(current_page) == 9) {
            id(photo_last_visible_ms) = now;
          } else if (asset_idle && id(photo_last_visible_ms) != 0 &&
                     now - id(photo_last_visible_ms) >= 30000U) {
            id(photo_slideshow_image).release();
            id(photo_slideshow_ready) = false;
            id(photo_last_visible_ms) = 0;
          }

          if (id(current_page) == 10) {
            id(house_last_visible_ms) = now;
          } else if (asset_idle && id(house_last_visible_ms) != 0 &&
                     now - id(house_last_visible_ms) >= 45000U) {
            id(house_floorplan_image).release();
            id(house_floorplan_ready) = false;
            id(house_floorplan_error) = false;
            id(house_last_visible_ms) = 0;
          }
  - interval: 1s
    then:
      - lambda: |-
          static uint32_t last_stage1_diagnostic_ms = 0;
          const uint32_t now_ms = millis();
          const bool stage1_diagnostic_window =
            !id(dual_mcu_stage1_performance_enabled) ||
            ((id(display_sleeping) || id(ui_last_activity_ms) == 0 ||
              now_ms - id(ui_last_activity_ms) >= 2500) &&
             (last_stage1_diagnostic_ms == 0 || now_ms - last_stage1_diagnostic_ms >= 10000));
          if (stage1_diagnostic_window) {
            last_stage1_diagnostic_ms = now_ms;
            id(ec1_encoder_net_count).publish_state(
              static_cast<float>(ec1_pcnt::encoder.signed_total()));
            id(ec1_encoder_left_count).publish_state(
              static_cast<float>(ec1_pcnt::encoder.left_total()));
            id(ec1_encoder_right_count).publish_state(
              static_cast<float>(ec1_pcnt::encoder.right_total()));
            id(ec1_encoder_common_mode_batches).publish_state(
              static_cast<float>(ec1_pcnt::encoder.common_mode_batches()));
            id(ec1_encoder_read_errors).publish_state(
              static_cast<float>(ec1_pcnt::encoder.read_errors()));
            id(ec1_encoder_max_batch).publish_state(
              static_cast<float>(ec1_pcnt::encoder.max_batch()));
          }
      - if:
          condition:
            lambda: |-
              return id(display_sleeping) &&
                     !id(external_power_detected) &&
                     !id(display_keep_awake) &&
                     (!${factory_onboarding_guard} ||
                      id(factory_onboarding_completed)) &&
                     id(music_state_cache) != "playing" &&
                     !id(timer_running) &&
                     !id(alarm_alert_active) &&
                     (millis() - id(ui_last_activity_ms)) >=
                       ${battery_deep_sleep_after_inactivity_ms}UL;
          then:
            - deep_sleep.enter: battery_deep_sleep
      - script.execute: timer_tick
      - script.execute: alarm_tick
      - if:
          condition:
            lambda: |-
              return !id(dual_mcu_stage1_performance_enabled) &&
                     !id(display_sleeping);
          then:
            - script.execute: refresh_second_dot
      - if:
          condition:
            lambda: |-
              return id(extra_menu_visible) &&
                     id(extra_menu_hide_at_ms) != 0 &&
                     millis() >= id(extra_menu_hide_at_ms);
          then:
            - script.execute: hide_extra_menu
      - if:
          condition:
            lambda: |-
              return !id(display_sleeping) &&
                     !id(dual_mcu_stage1_performance_enabled) &&
                     (id(current_page) == 1 || id(current_page) == 2 ||
                      id(current_page) == 5 || id(current_page) == 6);
          then:
            - script.execute: refresh_control_time
            - script.execute: refresh_media_ui_if_needed
      - if:
          condition:
            lambda: |-
              return !id(display_sleeping) && id(current_page) == 4 &&
                     !id(dual_mcu_stage1_performance_enabled);
          then:
            - script.execute: refresh_weather_time
      - if:
          condition:
            lambda: 'return !id(display_sleeping) && (id(current_page) == 8 || id(rain_radar_loading));'
          then:
            - script.execute: refresh_rain_radar_ui
      - if:
          condition:
            lambda: |-
              return !id(display_sleeping) && id(current_page) == 7 &&
                     !id(dual_mcu_stage1_performance_enabled);
          then:
            - script.execute: refresh_weather_screensaver
      - if:
          condition:
            lambda: |-
              return id(current_page) == 2 &&
                     !id(display_sleeping) &&
                     !id(media_picker_visible) &&
                     id(control_mode) == 2 &&
                     (millis() - id(media_list_last_activity_ms)) >= 4000;
          then:
            - lambda: |-
                id(control_mode) = 1;
                id(media_ui_dirty) = true;
            - script.execute: refresh_media_ui_if_needed
      - if:
          condition:
            lambda: |-
              return id(current_page) == 2 &&
                     !id(display_sleeping) &&
                     !id(media_picker_visible) &&
                     id(track_select_active) &&
                     (millis() - id(track_select_last_activity_ms)) >= 4000;
          then:
            - lambda: |-
                id(track_select_active) = false;
                id(control_mode) = 1;
                id(media_ui_dirty) = true;
            - script.execute: refresh_media_ui_if_needed
      - if:
          condition:
            lambda: |-
              const bool cover_allowed_page =
                id(current_page) == 1 ||
                id(current_page) == 2 ||
                id(current_page) == 4 ||
                id(current_page) == 7 ||
                (id(current_page) >= 20 && id(current_page) <= 24);
              const bool media_list_active = id(current_page) == 2 && id(control_mode) == 2;
              return cover_allowed_page &&
                     !id(display_sleeping) &&
                     !media_list_active &&
                     !id(media_picker_visible) &&
                     !id(track_select_active) &&
                     id(music_state_cache) == "playing" &&
                     !id(media_cover_url_cache).empty() &&
                     (id(media_cover_ready) || id(media_page_cover_ready)) &&
                     id(media_cover_fullscreen_due_ms) != 0 &&
                     millis() >= id(media_cover_fullscreen_due_ms) &&
                     (millis() - id(ui_last_activity_ms)) >= 10000;
          then:
            - script.execute: show_media_cover_page
      - if:
          condition:
            lambda: |-
              return id(current_page) != 7 &&
                     !id(display_sleeping) &&
                     !id(display_keep_awake) &&
                     id(battery_percentage_cache) >= 100 &&
                     !id(media_picker_visible) &&
                     !id(timer_running) &&
                     !id(alarm_alert_active) &&
                     id(music_state_cache) != "playing" &&
                     (millis() - id(ui_last_activity_ms)) >= static_cast<uint32_t>(id(screensaver_timeout_seconds)) * 1000UL;
          then:
            - script.execute: show_weather_screensaver
      - if:
          condition:
            lambda: |-
              return id(battery_percentage_cache) < 100 &&
                     !id(display_keep_awake) &&
                     !id(display_sleeping) &&
                     !id(display_charge_dimmed) &&
                     !id(timer_running) &&
                     !id(alarm_alert_active) &&
                     (millis() - id(ui_last_activity_ms)) >=
                       static_cast<uint32_t>(id(display_dim_delay_seconds)) * 1000UL;
          then:
            - script.execute: dim_display_below_full
      - if:
          condition:
            lambda: |-
              const bool playback = id(music_state_cache) == "playing";
              const int timeout_seconds = playback
                ? id(display_sleep_playback_seconds)
                : id(display_sleep_no_playback_seconds);
              return id(battery_percentage_cache) < 100 &&
                     !id(display_keep_awake) &&
                     !id(display_sleeping) &&
                     !id(timer_running) &&
                     !id(alarm_alert_active) &&
                     (millis() - id(ui_last_activity_ms)) >=
