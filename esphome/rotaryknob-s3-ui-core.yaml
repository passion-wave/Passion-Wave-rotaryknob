  - id: publish_media_debug
    mode: queued
    parameters:
      phase: string
      item: string
      media_type: string
      detail: string
    then:
      - if:
          condition:
            lambda: 'return !id(demo_mode_active) && id(wifi_connected) && id(media_latency_debug_enabled).state;'
          then:
            - lambda: |-
                const uint32_t now_ms = millis();
                auto compact_debug = [](const std::string &input, size_t limit) -> std::string {
                  std::string out;
                  out.reserve(input.size() < limit ? input.size() : limit);
                  bool last_space = false;
                  for (unsigned char c : input) {
                    char next = '\0';
                    if (c >= 32 && c <= 126) {
                      next = static_cast<char>(c);
                    } else if (c == '\n' || c == '\r' || c == '\t' || c >= 127) {
                      next = ' ';
                    }
                    if (next == '\0') continue;
                    if (next == ' ') {
                      if (last_space) continue;
                      last_space = true;
                    } else {
                      last_space = false;
                    }
                    out.push_back(next);
                    if (out.size() >= limit) break;
                  }
                  while (!out.empty() && out.back() == ' ') out.pop_back();
                  return out.empty() ? std::string("-") : out;
                };
                const std::string safe_phase = compact_debug(phase, 48);
                const std::string safe_item = compact_debug(item, 96);
                const std::string safe_type = compact_debug(media_type, 40);
                const std::string safe_detail = compact_debug(detail, 160);
                id(media_debug_event_seq) += 1;
                char status[240];
                snprintf(
                  status,
                  sizeof(status),
                  "#%lu %s item=%s type=%s tracks=%d selected=%d pending=%s heap=%u",
                  static_cast<unsigned long>(id(media_debug_event_seq)),
                  safe_phase.c_str(),
                  safe_item.c_str(),
                  safe_type.c_str(),
                  static_cast<int>(id(ma_track_titles_cache).size()),
                  id(selected_track_index),
                  id(pending_track_request_id).empty() ? "-" : id(pending_track_request_id).c_str(),
                  static_cast<unsigned>(esp_get_free_heap_size()));
                id(media_debug_last_event) = status;
                id(media_debug_status_text).publish_state(id(media_debug_last_event));
                ESP_LOGW(
                  "media_debug",
                  "#%lu phase=%s item=%s type=%s detail=%s page=%d mode=%d browser=%d tracks=%d uris=%d selected=%d loaded=%d total=%d has_more=%s inflight=%s pending=%s since_start=%lu since_track_request=%lu heap=%u min_heap=%u",
                  static_cast<unsigned long>(id(media_debug_event_seq)),
                  safe_phase.c_str(),
                  safe_item.c_str(),
                  safe_type.c_str(),
                  safe_detail.c_str(),
                  id(current_page),
                  id(control_mode),
                  id(media_browser_mode),
                  static_cast<int>(id(ma_track_titles_cache).size()),
                  static_cast<int>(id(ma_track_uris_cache).size()),
                  id(selected_track_index),
                  id(track_loaded_count),
                  id(track_total_available),
                  id(track_has_more) ? "true" : "false",
                  id(track_autoload_inflight) ? "true" : "false",
                  id(pending_track_request_id).empty() ? "-" : id(pending_track_request_id).c_str(),
                  static_cast<unsigned long>(id(media_debug_start_ms) == 0 ? 0 : now_ms - id(media_debug_start_ms)),
                  static_cast<unsigned long>(id(media_debug_track_request_ms) == 0 ? 0 : now_ms - id(media_debug_track_request_ms)),
                  static_cast<unsigned>(esp_get_free_heap_size()),
                  static_cast<unsigned>(esp_get_minimum_free_heap_size()));
  - id: media_debug_dump_state
