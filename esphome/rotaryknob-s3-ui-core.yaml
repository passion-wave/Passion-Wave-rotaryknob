          float volume = id(display_volume_level);
          if (isnan(volume)) volume = 0.0f;
          ui_next::framework.update_media(
            id(media_title_cache).c_str(), id(media_artist_cache).c_str(),
            static_cast<int>(lroundf(volume * 100.0f)),
            id(music_state_cache) == "playing",
            static_cast<int>(lroundf(id(media_position_seconds))),
