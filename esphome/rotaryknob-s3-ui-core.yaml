    # Automatischer Media-Cover-Fullscreen nach kurzer Inaktivitaet
    - id: page_6
      on_load:
        - lambda: |-
            id(current_page) = 6;
            id(control_mode) = 1;
            id(media_cover_fullscreen_active) = true;
            lv_label_set_long_mode(media_cover_title_label, LV_LABEL_LONG_CLIP);
            lv_label_set_long_mode(media_cover_artist_label, LV_LABEL_LONG_CLIP);
            lv_obj_set_style_text_align(media_cover_title_label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_align(media_cover_artist_label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN | LV_STATE_DEFAULT);
            if (media_cover_volume_host != nullptr) {
              lv_obj_clear_flag(media_cover_volume_host, LV_OBJ_FLAG_CLICKABLE);
            }
            if (id(media_cover_volume_arc) == nullptr && media_cover_volume_host != nullptr) {
              auto *arc = lv_arc_create(media_cover_volume_host);
              lv_obj_set_size(arc, 356, 356);
              lv_obj_center(arc);
              lv_obj_remove_style(arc, nullptr, LV_PART_SCROLLBAR);
