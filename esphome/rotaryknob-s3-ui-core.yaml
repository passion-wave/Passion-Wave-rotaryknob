esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "${project_name}"
    version: "${project_version}"
  build_path: build/passion_wave_rotaryknob
  includes:
    - <ArduinoJson.h>
    - <array>
    - <cctype>
    - <cmath>
    - <cstring>
    - <cstdlib>
    - <ctime>
    - <esp_system.h>
    - <src/misc/cache/instance/lv_image_cache.h>
    - <vector>
    - ec1_pcnt_encoder.h
    - dual_mcu_link.h
    - dual_mcu_library_proxy.h
    - dual_mcu_radar_proxy.h
    - responsive_power_policy.h
    - scrollwheel_dynamic_targets.h
    - squareline_font_bridge.h
    - ui_next_framework.h
    - round_Temp/fonts/ui_font_Number.c
  platformio_options:
    lib_deps:
      - bblanchon/ArduinoJson@6.21.3
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L
    build_flags:
      # These widgets are created from C++ lambdas, so ESPHome cannot infer
      # their use from YAML. Keep their LVGL modules enabled explicitly.
      - -DLV_USE_ARC=1
      - -DLV_USE_LINE=1
  on_boot:
    - priority: 200
      then:
        - lambda: |-
            const bool encoder_ready = ec1_pcnt::encoder.setup(7, 8);
            id(ec1_encoder_ready).publish_state(encoder_ready);
            id(firmware_update_status).publish_state("idle");
            ESP_LOGI("ec1_encoder", "PCNT encoder %s on GPIO7/GPIO8",
                     encoder_ready ? "ready" : "setup failed");

    - priority: -100
      then:
        - lambda: |-
            auto reset_reason_to_text = [](esp_reset_reason_t reason) -> const char * {
              switch (reason) {
                case ESP_RST_POWERON: return "poweron";
                case ESP_RST_EXT: return "external";
                case ESP_RST_SW: return "software";
                case ESP_RST_PANIC: return "panic";
                case ESP_RST_INT_WDT: return "interrupt_watchdog";
                case ESP_RST_TASK_WDT: return "task_watchdog";
                case ESP_RST_WDT: return "watchdog";
                case ESP_RST_DEEPSLEEP: return "deepsleep";
                case ESP_RST_BROWNOUT: return "brownout";
                case ESP_RST_SDIO: return "sdio";
                default: return "unknown";
              }
            };
            const char *reason = reset_reason_to_text(esp_reset_reason());
            id(media_debug_reset_reason_text).publish_state(reason);
            id(media_debug_last_event) = std::string("boot reset=") + reason;
            id(media_debug_status_text).publish_state(id(media_debug_last_event));
            id(media_cover_boot_defer_until_ms) = millis() + 12000;
            ESP_LOGW("media_debug", "boot reset_reason=%s free_heap=%u min_free_heap=%u",
                     reason,
                     static_cast<unsigned>(esp_get_free_heap_size()),
                     static_cast<unsigned>(esp_get_minimum_free_heap_size()));
        - script.execute: refresh_media_target_runtime
        - script.execute: publish_configuration_snapshot
        - delay: 800ms
        - if:
            condition:
              lambda: 'return !id(ui_next_enabled);'
            then:
              - script.execute: show_weather_page
        - script.execute: refresh_weather_time
        - script.execute: refresh_weather_ui
        - delay: 5s
        - script.execute: sync_demo_mode_with_wifi
        - if:
            condition:
              lambda: |-
                return !id(dual_mcu_stage1_performance_enabled) &&
                       id(wifi_connected) && !id(demo_mode_active);
            then:
              - script.execute: fetch_weather
              - script.execute: fetch_rain_eta
        - delay: 10s
        - script.execute: sync_demo_mode_with_wifi
        - if:
            condition:
              lambda: |-
                return !id(dual_mcu_stage1_performance_enabled) &&
                       id(wifi_connected) && !id(demo_mode_active);
            then:
              - script.execute: fetch_weather
              - script.execute: fetch_rain_eta

dashboard_import:
  package_import_url: github://Passion-Wave/Passion-Wave-rotaryknob/esphome/factory-s3.yaml@main
  import_full_config: true

external_components:
  - source:
      type: git
      url: https://github.com/RAR/esphome-drv2605
      ref: 214077a1934e5a1f52488731bf45ab51048c3570
    components: [drv2605]
    refresh: 0s

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal

logger:
  level: WARN

api:
  reboot_timeout: 0s
  on_client_connected:
    - lambda: |-
        if (${factory_onboarding_guard} &&
            !id(factory_onboarding_completed)) {
          id(factory_onboarding_completed) = true;
        }
    - delay: 1200ms
    - if:
        condition:
          lambda: |-
            return !id(dual_mcu_ha_bridge_enabled) ||
                   id(dual_mcu_s3_rescue_mode_enabled);
        then:
          - script.execute: refresh_all_light_detail_catalogs
  services:
    - service: passion_wave_install_firmware
      variables:
        target_version: string
      then:
        - lambda: |-
            id(passion_wave_firmware_update).status_clear_error();
            id(firmware_update_status).publish_state(
                std::string("checking:") + target_version);
        - update.check: passion_wave_firmware_update
        - wait_until:
            condition:
              lambda: |-
                return id(passion_wave_firmware_update).status_has_error() ||
                       (id(passion_wave_firmware_update).state ==
                            update::UPDATE_STATE_AVAILABLE &&
                        id(passion_wave_firmware_update).update_info.latest_version ==
                            target_version);
            timeout: 60s
        - if:
            condition:
              lambda: |-
                return !id(passion_wave_firmware_update).status_has_error() &&
                       id(passion_wave_firmware_update).state ==
                           update::UPDATE_STATE_AVAILABLE &&
                       id(passion_wave_firmware_update).update_info.latest_version ==
                           target_version;
            then:
              - lambda: |-
                  id(firmware_update_status).publish_state(
                      std::string("manifest_ready:") + target_version);
              - update.perform: passion_wave_firmware_update
            else:
              - lambda: |-
                  if (id(passion_wave_firmware_update).status_has_error()) {
                    id(firmware_update_status).publish_state("manifest_error");
                  } else if (id(passion_wave_firmware_update).update_info.latest_version !=
                             target_version) {
                    id(firmware_update_status).publish_state(
                        std::string("manifest_mismatch:") +
                        id(passion_wave_firmware_update).update_info.latest_version);
                  } else {
                    id(firmware_update_status).publish_state(
                        "manifest_not_installable");
                  }
    - service: support_diagnostics_on
      then:
        - lambda: 'id(support_diagnostics_enabled) = true;'
        - switch.turn_on: media_latency_debug_enabled
        - delay: 100ms
        - script.execute: media_debug_dump_state
    - service: support_diagnostics_off
      then:
        - lambda: 'id(support_diagnostics_enabled) = false;'
        - switch.turn_off: media_latency_debug_enabled
    - service: media_debug_on
      then:
        - switch.turn_on: media_latency_debug_enabled
        - delay: 100ms
        - script.execute: media_debug_dump_state
    - service: media_debug_off
      then:
        - switch.turn_off: media_latency_debug_enabled
    - service: media_debug_dump
      then:
        - switch.turn_on: media_latency_debug_enabled
        - delay: 100ms
        - script.execute: media_debug_dump_state
    - service: radar_refresh
      then:
        - lambda: 'id(rain_radar_force_refresh) = true;'
        - script.execute: refresh_rain_radar_image
    - service: house_refresh
      then:
        - script.execute: refresh_house_image

http_request:
  verify_ssl: true
  timeout: 15s

safe_mode:
  num_attempts: 30
  boot_is_good_after: 90s
  reboot_timeout: 10min

wifi:
  power_save_mode: none
  reboot_timeout: 0s
  on_connect:
    then:
      - lambda: 'id(wifi_connected) = true;'
      - script.execute: disable_demo_mode
      - if:
          condition:
            lambda: 'return !id(dual_mcu_stage1_performance_enabled);'
          then:
            - script.execute: fetch_weather
            - script.execute: fetch_rain_eta
      - script.execute: refresh_settings_ui
  on_disconnect:
    then:
      - lambda: 'id(wifi_connected) = false;'
      - delay: 12s
      - script.execute: sync_demo_mode_with_wifi
  ap:
    ssid: "Passion-Wave-RotaryKnob"
    password: "passion-wave"

spi:
  id: display_qspi
  type: quad
  clk_pin: 13
  data_pins: [15, 16, 17, 18]

i2c:
  sda: 11
  scl: 12
  id: touchscreen_bus
  frequency: 400kHz

drv2605:
  id: haptic_driver
  i2c_id: touchscreen_bus
  address: 0x5A
  motor_type: LRA
  library: 6

deep_sleep:
  id: battery_deep_sleep
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - number: GPIO9
        allow_other_uses: true

