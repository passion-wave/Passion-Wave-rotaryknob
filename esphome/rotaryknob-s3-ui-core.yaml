                    return;
                  }

                  JsonObjectConst root = response["response"].as<JsonObjectConst>();
                  if (root.isNull()) {
                    root = response["service_response"].as<JsonObjectConst>();
                  }
                  if (root.isNull()) {
                    root = response;
                  }
                  JsonObjectConst weather = root["${ha_weather}"].as<JsonObjectConst>();
                  if (weather.isNull() && root.containsKey("forecast")) {
                    weather = root;
                  }
                  JsonArrayConst forecasts = weather["forecast"].as<JsonArrayConst>();
                  if (forecasts.isNull() || forecasts.size() == 0) {
                    id(weather_rain_minutes) = -1;
                    id(weather_rain_eta_text) = "Regen unklar";
                    id(weather_detail_text) = id(weather_rain_eta_text);
                    id(weather_ui_dirty) = true;
                    return;
                  }

                  auto read_float = [](JsonVariantConst value, float fallback) -> float {
                    if (value.isNull()) return fallback;
                    if (value.is<float>() || value.is<double>() || value.is<int>()) return value.as<float>();
                    const char *text = value.as<const char *>();
                    if (text == nullptr || text[0] == '\0') return fallback;
                    char *end = nullptr;
                    const float parsed = strtof(text, &end);
                    return end != text ? parsed : fallback;
                  };

                  auto forecast_epoch = [](const char *datetime) -> time_t {
                    if (datetime == nullptr || datetime[0] == '\0') return static_cast<time_t>(0);
                    int year = 0;
                    int month = 0;
                    int day = 0;
                    int hour = 0;
                    int minute = 0;
                    if (sscanf(datetime, "%d-%d-%dT%d:%d", &year, &month, &day, &hour, &minute) != 5) {
                      return static_cast<time_t>(0);
                    }
                    struct tm tm_value = {};
                    tm_value.tm_year = year - 1900;
                    tm_value.tm_mon = month - 1;
                    tm_value.tm_mday = day;
                    tm_value.tm_hour = hour;
                    tm_value.tm_min = minute;
                    tm_value.tm_sec = 0;
                    tm_value.tm_isdst = -1;
                    return mktime(&tm_value);
                  };

                  auto condition_for_slot = [](const std::string &condition, float probability, float precipitation) -> std::string {
                    if (condition == "lightning" || condition == "lightning-rainy" || condition == "exceptional") return condition;
                    if (condition == "rainy" || condition == "pouring" || condition == "hail" ||
                        condition == "snowy-rainy" || precipitation > 0.01f || probability >= 55.0f) {
                      return "rainy";
                    }
                    if (condition.empty()) return "partlycloudy";
                    return condition;
                  };

                  const std::string current = id(weather_condition_raw);
                  const bool raining_now = current == "rainy" || current == "pouring" ||
                                           current == "lightning-rainy" || current == "hail";
                  int eta_minutes = raining_now ? 0 : -1;
                  int eta_probability = id(weather_precipitation_probability);
                  const time_t now_epoch = static_cast<time_t>(now.timestamp);
                  const time_t day_start = now_epoch - (now.hour * 3600) - (now.minute * 60) - now.second;
                  const time_t targets[4] = {
                    day_start + 8 * 3600,
                    day_start + 13 * 3600,
                    day_start + 19 * 3600,
                    day_start + 23 * 3600
                  };
                  int best_slot_distance[4] = {
                    24 * 3600, 24 * 3600, 24 * 3600, 24 * 3600
                  };
                  std::string slot_conditions[4] = {current, current, current, current};
                  float slot_temperatures[4] = {
                    id(weather_temperature), id(weather_temperature),
                    id(weather_temperature), id(weather_temperature)
                  };

                  for (JsonObjectConst forecast : forecasts) {
                    const char *datetime = forecast["datetime"].as<const char *>();
                    const time_t entry_epoch = forecast_epoch(datetime);
                    if (entry_epoch == static_cast<time_t>(0)) {
                      continue;
                    }

                    const float probability = read_float(forecast["precipitation_probability"], -1.0f);
                    const float precipitation = read_float(forecast["precipitation"], 0.0f);
                    const char *condition = forecast["condition"].as<const char *>();
                    const std::string forecast_condition = condition == nullptr ? "" : condition;
                    const float forecast_temperature =
                      read_float(forecast["temperature"], id(weather_temperature));

                    for (int slot = 0; slot < 4; slot++) {
                      const int distance = static_cast<int>(labs(static_cast<long>(difftime(entry_epoch, targets[slot]))));
                      if (distance < best_slot_distance[slot]) {
                        best_slot_distance[slot] = distance;
                        slot_conditions[slot] = condition_for_slot(forecast_condition, probability, precipitation);
                        slot_temperatures[slot] = forecast_temperature;
                      }
                    }

                    if (!raining_now) {
                      int minutes = static_cast<int>(lroundf(difftime(entry_epoch, now_epoch) / 60.0f));
                      if (minutes < -15) {
                        continue;
                      }
                      if (minutes < 0) {
                        minutes = 0;
                      }

                      const bool wet_condition = forecast_condition == "rainy" ||
                                                 forecast_condition == "pouring" ||
                                                 forecast_condition == "lightning-rainy" ||
                                                 forecast_condition == "hail";
                      const bool likely_rain = wet_condition || precipitation > 0.01f || probability >= 30.0f;
                      if (likely_rain && eta_minutes < 0) {
                        eta_minutes = minutes;
                        if (probability >= 0.0f) {
                          eta_probability = static_cast<int>(lroundf(probability));
                          if (eta_probability < 0) eta_probability = 0;
                          if (eta_probability > 100) eta_probability = 100;
                        }
                      }
                    }
                  }

                  id(weather_morning_condition) = slot_conditions[0];
                  id(weather_noon_condition) = slot_conditions[1];
                  id(weather_evening_condition) = slot_conditions[2];
                  id(weather_overnight_condition) = slot_conditions[3];
                  id(weather_morning_temperature) = slot_temperatures[0];
                  id(weather_noon_temperature) = slot_temperatures[1];
                  id(weather_evening_temperature) = slot_temperatures[2];
                  id(weather_overnight_temperature) = slot_temperatures[3];
                  id(weather_rain_minutes) = eta_minutes;
                  id(weather_precipitation_probability) = eta_probability;
                  if (eta_minutes == 0) {
                    id(weather_rain_eta_text) = "Regnet jetzt";
                  } else if (eta_minutes > 0) {
                    char eta[48];
                    snprintf(eta, sizeof(eta), "Regen in %d min", eta_minutes);
                    id(weather_rain_eta_text) = eta;
                  } else {
                    id(weather_rain_eta_text) = "Kein Regen";
                  }
                  id(weather_detail_text) = id(weather_rain_eta_text);
                  id(weather_ui_dirty) = true;
            - script.execute: refresh_weather_ui_if_needed
            - script.execute: refresh_weather_screensaver
          on_error:
            - lambda: |-
                  id(weather_rain_minutes) = -1;
                  id(weather_rain_eta_text) = "Regen unklar";
                  id(weather_detail_text) = id(weather_rain_eta_text);
                  id(weather_ui_dirty) = true;
            - script.execute: refresh_weather_ui_if_needed
  - id: refresh_weather_ui_if_needed
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(current_page) == 4 && id(weather_ui_dirty);'
          then:
            - script.execute: refresh_weather_ui
  - id: refresh_weather_time
    mode: restart
    then:
      - lambda: |-
          if (id(ui_next_enabled)) return;
          auto now = id(ha_time).now();
          if (!now.is_valid()) {
            now = id(sntp_time).now();
          }
          if (!now.is_valid()) {
            lv_label_set_text(weather_time_label, "--:--");
            lv_label_set_text(weather_date_label, "--");
            return;
          }

          const char *weekdays[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
          const char *short_weekdays[] = {"So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"};
          const char *months[] = {"Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"};
          const int weekday_index = now.day_of_week >= 1 && now.day_of_week <= 7 ? now.day_of_week - 1 : 0;
          const int month_index = now.month >= 1 && now.month <= 12 ? now.month - 1 : 0;

          lv_label_set_text_fmt(weather_time_label, "%02d:%02d", now.hour, now.minute);
          lv_label_set_text_fmt(weather_date_label, "%s %02d.%s", weekdays[weekday_index], now.day_of_month, months[month_index]);

          if (id(weather_day_now_arc) != nullptr) {
            constexpr int day_start_minutes = 6 * 60;
            constexpr int day_end_minutes = 20 * 60;
            int minutes_now = now.hour * 60 + now.minute;
            if (minutes_now < day_start_minutes) minutes_now = day_start_minutes;
            if (minutes_now > day_end_minutes) minutes_now = day_end_minutes;
            const float ratio = static_cast<float>(minutes_now - day_start_minutes) /
                                static_cast<float>(day_end_minutes - day_start_minutes);
            // Right weather day arc: 06:00 at the upper start, 20:00 at the lower end.
            int tick_rotation = 275 + static_cast<int>(roundf(ratio * 159.0f));
            tick_rotation %= 360;
            lv_arc_set_rotation(id(weather_day_now_arc), tick_rotation);
            lv_arc_set_value(id(weather_day_now_arc), 100);
            lv_obj_invalidate(id(weather_day_now_arc));
            lv_obj_move_foreground(id(weather_day_now_arc));
          }

          lv_label_set_text(weather_day_0_label, short_weekdays[weekday_index]);
          for (int offset = 1; offset < 3; offset++) {
            ESPTime forecast_day = ESPTime::from_epoch_local(now.timestamp + (86400 * offset));
            int day_index = forecast_day.day_of_week >= 1 && forecast_day.day_of_week <= 7 ? forecast_day.day_of_week - 1 : weekday_index;
            const char *label = short_weekdays[day_index];
            switch (offset) {
              case 1:
                lv_label_set_text(weather_day_1_label, label);
                break;
              case 2:
                lv_label_set_text(weather_day_2_label, label);
                break;
            }
          }
  - id: refresh_second_dot
    mode: restart
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) {
            now = id(sntp_time).now();
          }
          const int second = now.is_valid() ? now.second : 0;
          const float angle = ((float) second * 6.0f - 90.0f) * 0.0174532925f;
          const int radius = 171;
          const int x = 180 + static_cast<int>(roundf(cosf(angle) * radius)) - 3;
          const int y = 180 + static_cast<int>(roundf(sinf(angle) * radius)) - 3;
          auto update_dot = [&](lv_obj_t *dot, bool active) {
            if (dot == nullptr) return;
            lv_obj_set_pos(dot, x, y);
            if (active) {
              lv_obj_clear_flag(dot, LV_OBJ_FLAG_HIDDEN);
              lv_obj_move_foreground(dot);
            } else {
              lv_obj_add_flag(dot, LV_OBJ_FLAG_HIDDEN);
            }
          };
          update_dot(light_second_dot, id(current_page) == 1);
          update_dot(media_second_dot, id(current_page) == 2);
          update_dot(settings_second_dot, id(current_page) == 5);
          update_dot(weather_second_dot, id(current_page) == 4);
          update_dot(screensaver_second_dot, id(current_page) == 7);
