binary_sensor:
  - platform: template
    name: "EC1 Encoder Ready"
    id: ec1_encoder_ready
    device_class: connectivity
    entity_category: diagnostic
    disabled_by_default: true

script:
  - id: refresh_all_light_detail_catalogs
    mode: restart
    then:
      - script.execute:
          id: refresh_light_detail_catalog
          slot: 0
          entity: !lambda 'return id(light_slot_1_entity_text).state;'
      - script.execute:
          id: refresh_light_detail_catalog
          slot: 1
          entity: !lambda 'return id(light_slot_2_entity_text).state;'
      - script.execute:
          id: refresh_light_detail_catalog
          slot: 2
          entity: !lambda 'return id(light_slot_3_entity_text).state;'
      - script.execute:
          id: refresh_light_detail_catalog
          slot: 3
          entity: !lambda 'return id(light_slot_4_entity_text).state;'

  - id: refresh_light_detail_catalog
    mode: queued
    max_runs: 4
    parameters:
      slot: int
      entity: std::string
    then:
      - lambda: |-
          if (slot < 0 || slot >= 4) return;
          id(light_detail_kinds)[slot] = 0;
          id(light_detail_labels)[slot].clear();
          id(light_detail_commands)[slot].clear();
          id(light_detail_targets)[slot].clear();
          id(light_detail_loaded_entities)[slot].clear();
          id(light_detail_selected)[slot] = -1;
      - if:
          condition:
            lambda: |-
              return id(dual_mcu_ha_bridge_enabled) &&
                     !id(dual_mcu_s3_rescue_mode_enabled);
          then:
            - script.stop: refresh_light_detail_catalog
      - if:
          condition:
            lambda: |-
              if (slot < 0 || slot >= 4 || entity.rfind("light.", 0) != 0)
                return false;
              for (char c : entity) {
                const bool valid =
                  std::isalnum(static_cast<unsigned char>(c)) ||
                  c == '_' || c == '.';
                if (!valid) return false;
              }
              return !id(demo_mode_active) && id(wifi_connected) &&
                     (!id(dual_mcu_ha_bridge_enabled) ||
                      id(dual_mcu_s3_rescue_mode_enabled));
          then:
            - homeassistant.action:
                action: weather.get_forecasts
                data:
                  entity_id: ${ha_weather}
                  type: daily
                capture_response: true
                response_template: !lambda |-
                  return std::string("{% set e = '") + entity + "' %}"
                    "{% set hue_entities = integration_entities('hue') %}"
                    "{% set wled_entities = integration_entities('wled') %}"
                    "{% set device = device_id(e) %}"
                    "{% set siblings = device_entities(device) if device else [] %}"
                    "{% set preset_candidates = siblings | select('match', 'select[.]') | select('search', 'preset') | list %}"
                    "{% set preset = preset_candidates | first | default('', true) %}"
                    "{% set ns = namespace(items=[]) %}"
                    "{% if e in wled_entities and preset %}"
                      "{% for option in (state_attr(preset, 'options') or [])[:32] %}"
                        "{% set ns.items = ns.items + [{'label': option, 'command': option}] %}"
                      "{% endfor %}"
                      "{{ {'entity_id': e, 'kind': 'wled', 'target': preset, 'selected': states(preset), 'items': ns.items} | to_json }}"
                    "{% elif e in hue_entities %}"
                      "{% set room = area_id(e) %}"
                      "{% set room_name = area_name(room) if room else '' %}"
                      "{% set room_entities = area_entities(room) if room else [] %}"
                      "{% for candidate in room_entities | sort %}"
                        "{% if candidate in hue_entities and candidate[0:6] == 'scene.' and (ns.items | count) < 32 %}"
                          "{% set label = state_attr(candidate, 'friendly_name') or candidate %}"
                          "{% if room_name and label[0:(room_name | length) + 1] == room_name ~ ' ' %}"
                            "{% set label = label[(room_name | length) + 1:] %}"
                          "{% endif %}"
                          "{% set ns.items = ns.items + [{'label': label, 'command': candidate}] %}"
                        "{% endif %}"
                      "{% endfor %}"
                      "{{ {'entity_id': e, 'kind': 'hue', 'target': '', 'selected': '', 'items': ns.items} | to_json }}"
                    "{% else %}"
                      "{{ {'entity_id': e, 'kind': 'none', 'target': '', 'selected': '', 'items': []} | to_json }}"
                    "{% endif %}";
                on_success:
                  - lambda: |-
                      if (slot < 0 || slot >= 4) return;

                      auto payload_has_catalog = [](JsonObjectConst object) -> bool {
                        return !object.isNull() &&
                               object["entity_id"].is<const char *>() &&
                               object["kind"].is<const char *>();
                      };
                      JsonDocument doc;
                      JsonObjectConst catalog;
                      if (payload_has_catalog(response)) {
                        catalog = response;
                      } else {
                        JsonVariantConst payload = response["response"];
                        if (payload.is<JsonObjectConst>() &&
                            payload_has_catalog(payload.as<JsonObjectConst>())) {
                          catalog = payload.as<JsonObjectConst>();
                        } else {
                          const char *raw = payload.as<const char *>();
                          if (raw == nullptr || raw[0] == '\0') {
                            payload = response["service_response"];
                            if (payload.is<JsonObjectConst>() &&
                                payload_has_catalog(payload.as<JsonObjectConst>())) {
                              catalog = payload.as<JsonObjectConst>();
                            } else {
                              raw = payload.as<const char *>();
                            }
                          }
                          if (catalog.isNull() && raw != nullptr && raw[0] != '\0') {
                            if (deserializeJson(doc, raw)) return;
                            catalog = doc.as<JsonObjectConst>();
                          }
                        }
                      }
                      if (!payload_has_catalog(catalog)) return;

                      const char *catalog_entity = catalog["entity_id"];
                      const char *kind_text = catalog["kind"];
                      const char *target = catalog["target"] | "";
                      if (catalog_entity == nullptr || kind_text == nullptr ||
                          entity != catalog_entity) return;
                      const std::string current_entity =
                        slot == 0 ? id(light_slot_1_entity_text).state :
                        slot == 1 ? id(light_slot_2_entity_text).state :
                        slot == 2 ? id(light_slot_3_entity_text).state :
                                    id(light_slot_4_entity_text).state;
                      if (current_entity != entity) return;

                      uint8_t kind = 0;
                      if (strcmp(kind_text, "wled") == 0) kind = 1;
                      else if (strcmp(kind_text, "hue") == 0) kind = 2;

                      auto &labels = id(light_detail_labels)[slot];
                      auto &commands = id(light_detail_commands)[slot];
                      labels.clear();
                      commands.clear();
                      JsonArrayConst items = catalog["items"].as<JsonArrayConst>();
                      if (!items.isNull()) {
                        for (JsonObjectConst item : items) {
                          if (labels.size() >= ui_next::kLightDetailMaxItems) break;
                          const char *label = item["label"];
                          const char *command = item["command"];
                          if (label == nullptr || command == nullptr ||
                              label[0] == '\0' || command[0] == '\0') continue;
                          labels.emplace_back(label);
                          commands.emplace_back(command);
                        }
                      }
                      if (labels.empty()) kind = 0;
                      id(light_detail_kinds)[slot] = kind;
                      id(light_detail_targets)[slot] = target;
                      id(light_detail_loaded_entities)[slot] = entity;
                      id(light_detail_selected)[slot] = -1;
                      const char *selected = catalog["selected"] | "";
                      if (selected[0] != '\0') {
                        for (size_t i = 0; i < commands.size(); i++) {
                          if (commands[i] == selected) {
                            id(light_detail_selected)[slot] = static_cast<int>(i);
                            break;
                          }
                        }
                      }
                      id(light_ui_dirty) = true;
                  - script.execute: refresh_light_ui_if_needed
                on_error:
                  - lambda: |-
                      if (slot < 0 || slot >= 4) return;
                      id(light_detail_loaded_entities)[slot] = entity;
                      id(light_ui_dirty) = true;
                  - script.execute: refresh_light_ui_if_needed

  - id: activate_light_detail
    mode: restart
    parameters:
      slot: int
      option: int
    then:
      - if:
          condition:
            lambda: |-
              return slot >= 0 && slot < 4 && option >= 0 &&
                     option < static_cast<int>(id(light_detail_labels)[slot].size()) &&
                     ((id(dual_mcu_ha_bridge_enabled) &&
                       id(dual_mcu_ha_bridge_ready) &&
                       id(dual_mcu_ha_bridge_light_details) &&
                       !id(dual_mcu_s3_rescue_mode_enabled)) ||
                      option < static_cast<int>(
                        id(light_detail_commands)[slot].size()));
          then:
            - lambda: |-
                id(light_detail_selected)[slot] = option;
                id(light_ui_dirty) = true;
            - if:
                condition:
                  lambda: |-
                    return id(dual_mcu_ha_bridge_enabled) &&
                           id(dual_mcu_ha_bridge_ready) &&
                           id(dual_mcu_ha_bridge_light_details) &&
                           !id(dual_mcu_s3_rescue_mode_enabled);
                then:
                  - lambda: |-
                      dual_mcu::link.send_light_detail_activate(
                        static_cast<uint8_t>(slot),
                        static_cast<uint8_t>(option));
                  - script.stop: activate_light_detail
            - if:
                condition:
                  lambda: |-
                    return id(dual_mcu_ha_bridge_enabled) &&
                           id(dual_mcu_ha_bridge_ready) &&
                           id(light_detail_kinds)[slot] == 2;
                then:
                  - lambda: |-
                      dual_mcu::link.send_ha_action(
                        dual_mcu::HAAction::SCENE_ACTIVATE, 0,
                        id(light_detail_commands)[slot][option].c_str());
                  - script.stop: activate_light_detail
            - if:
                condition:
                  lambda: |-
                    return id(dual_mcu_ha_bridge_enabled) &&
                           id(dual_mcu_ha_bridge_ready) &&
                           id(light_detail_kinds)[slot] == 1;
                then:
                  - lambda: |-
                      dual_mcu::link.send_ha_text_action(
                        dual_mcu::HAAction::SELECT_OPTION,
                        id(light_detail_targets)[slot].c_str(),
                        id(light_detail_commands)[slot][option].c_str());
                  - script.stop: activate_light_detail

  - id: refresh_media_target_runtime
    mode: restart
    then:
      - lambda: |-
          auto trim = [](std::string value) -> std::string {
            while (!value.empty() && std::isspace(static_cast<unsigned char>(value.front()))) {
              value.erase(value.begin());
            }
            while (!value.empty() && std::isspace(static_cast<unsigned char>(value.back()))) {
              value.pop_back();
            }
            return value;
          };

          const std::string static_player = "${ha_player}";
          const std::string public_default = "media_player.passion_wave_media";
          std::string configured = trim(id(media_target_entity_text).state);
          if (configured.empty() || configured == public_default) {
            configured = static_player;
          }

          id(media_effective_entity_id) = configured;
          id(media_static_fallback_active) = configured == static_player;

          std::string configured_label = trim(id(media_target_label_text).state);
          const bool has_static_friendly_label =
            id(media_static_fallback_active) &&
            !id(media_effective_label).empty() &&
            id(media_effective_label) != "Media Player";

          if (!has_static_friendly_label || (!configured_label.empty() && configured_label != "Media Player")) {
            if (configured_label.empty()) {
              configured_label = configured;
            }
            id(media_effective_label) = configured_label;
          }

          id(media_ui_dirty) = true;
  - id: refresh_dynamic_media_snapshot
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              const std::string entity = id(media_effective_entity_id);
              return !id(demo_mode_active) &&
                     id(wifi_connected) &&
                     !id(dual_mcu_ha_bridge_enabled) &&
                     !id(media_static_fallback_active) &&
                     entity.rfind("media_player.", 0) == 0;
          then:
            - homeassistant.action:
                action: weather.get_forecasts
                data:
                  entity_id: ${ha_weather}
                  type: hourly
                capture_response: true
                response_template: !lambda |-
                  auto sanitize_entity = [](std::string entity) -> std::string {
                    if (entity.rfind("media_player.", 0) != 0) {
                      return "";
                    }
                    for (char c : entity) {
                      const bool valid =
                        std::isalnum(static_cast<unsigned char>(c)) ||
                        c == '_' ||
                        c == '.';
                      if (!valid) {
                        return "";
                      }
                    }
                    return entity;
                  };

                  const std::string entity = sanitize_entity(id(media_effective_entity_id));
                  if (entity.empty()) {
                    return std::string("{{ {} | to_json }}");
                  }
                  return std::string("{% set e = '") + entity + "' %}"
                    "{% set cover = state_attr(e, 'entity_picture') or state_attr(e, 'entity_picture_local') or state_attr(e, 'media_image_url') or state_attr(e, 'media_thumbnail') or state_attr(e, 'thumbnail') or '' %}"
                    "{{ {"
                    "'entity_id': e,"
                    "'label': state_attr(e, 'friendly_name') or e,"
                    "'state': states(e),"
                    "'title': state_attr(e, 'media_title') or '',"
                    "'artist': state_attr(e, 'media_artist') or state_attr(e, 'media_album_artist') or '',"
                    "'cover': cover,"
                    "'volume': state_attr(e, 'volume_level') or 0,"
                    "'position': state_attr(e, 'media_position') or 0,"
                    "'duration': state_attr(e, 'media_duration') or 0,"
                    "'shuffle': state_attr(e, 'shuffle') or false,"
                    "'repeat': state_attr(e, 'repeat') or ''"
                    "} | to_json }}";
                on_success:
                  - lambda: |-
                      auto read_string = [](JsonVariantConst value) -> std::string {
                        if (value.isNull()) {
                          return "";
                        }
                        const char *text = value.as<const char *>();
                        return text == nullptr ? "" : std::string(text);
                      };
                      auto read_float = [](JsonVariantConst value, float fallback) -> float {
                        if (value.isNull()) {
                          return fallback;
                        }
                        if (value.is<float>() || value.is<double>() || value.is<int>()) {
                          return value.as<float>();
                        }
                        const char *text = value.as<const char *>();
                        if (text == nullptr || text[0] == '\0') {
                          return fallback;
                        }
                        char *end = nullptr;
                        const float parsed = strtof(text, &end);
                        return end != text ? parsed : fallback;
                      };
                      auto read_bool = [](JsonVariantConst value) -> bool {
                        if (value.is<bool>()) {
                          return value.as<bool>();
                        }
                        const char *text = value.as<const char *>();
                        if (text == nullptr) {
                          return false;
                        }
                        return strcmp(text, "true") == 0 ||
                               strcmp(text, "on") == 0 ||
                               strcmp(text, "1") == 0;
                      };

                      auto has_snapshot_shape = [](JsonObjectConst object) -> bool {
                        if (object.isNull()) {
                          return false;
                        }
                        return object["entity_id"].is<const char *>() ||
                               object["state"].is<const char *>() ||
                               object["cover"].is<const char *>() ||
                               object["title"].is<const char *>();
                      };

                      DynamicJsonDocument doc(1536);
                      JsonObjectConst snapshot;
                      if (has_snapshot_shape(response)) {
                        snapshot = response;
                      } else {
                        JsonVariantConst payload = response["response"];
                        if (payload.is<JsonObjectConst>()) {
                          snapshot = payload.as<JsonObjectConst>();
                        } else if (payload.is<const char *>()) {
                          const char *raw = payload.as<const char *>();
                          if (raw == nullptr || raw[0] == '\0') {
                            return;
                          }
                          DeserializationError error = deserializeJson(doc, raw);
                          if (error) {
                            return;
                          }
                          snapshot = doc.as<JsonObjectConst>();
                        } else {
                          payload = response["service_response"];
                          if (payload.is<JsonObjectConst>() && has_snapshot_shape(payload.as<JsonObjectConst>())) {
                            snapshot = payload.as<JsonObjectConst>();
                          } else {
                            const char *raw = payload.as<const char *>();
                            if (raw == nullptr || raw[0] == '\0') {
                              return;
                            }
                            DeserializationError error = deserializeJson(doc, raw);
                            if (error) {
                              return;
                            }
                            snapshot = doc.as<JsonObjectConst>();
                          }
                        }
                      }
                      if (snapshot.isNull()) {
                        return;
                      }

                      const std::string entity = read_string(snapshot["entity_id"]);
                      if (!entity.empty() && entity != id(media_effective_entity_id)) {
                        return;
                      }

                      const std::string label = read_string(snapshot["label"]);
                      if (!label.empty()) {
                        id(media_effective_label) = label;
                      }

                      std::string state = read_string(snapshot["state"]);
                      for (char &c : state) {
                        c = static_cast<char>(tolower(static_cast<unsigned char>(c)));
                      }
                      if (!state.empty() && state != "unknown" && state != "unavailable") {
                        id(music_state_cache) = state;
                        id(media_runtime_state_text).publish_state(state);
                        id(media_is_playing) = state == "playing";
                        if (id(media_is_playing)) {
                          id(media_cover_fullscreen_active) = false;
                          if (id(media_cover_fullscreen_due_ms) == 0) {
                            id(media_cover_fullscreen_due_ms) = millis() + 10000;
                          }
                        } else {
                          id(media_cover_fullscreen_active) = false;
                          id(media_cover_fullscreen_due_ms) = 0;
                        }
                      }

                      const std::string title = read_string(snapshot["title"]);
                      id(media_title_cache) = title;
                      id(media_runtime_title_text).publish_state(title);
                      if (!title.empty()) {
                        id(current_media_label) = title;
                      }
                      const std::string artist = read_string(snapshot["artist"]);
                      id(media_artist_cache) = artist;
                      id(media_runtime_artist_text).publish_state(artist);
                      const std::string cover = read_string(snapshot["cover"]);
                      id(media_entity_picture_cache) = cover;
                      id(media_runtime_cover_url_text).publish_state(cover);
                      id(media_entity_picture_local_cache).clear();
                      id(media_image_url_cache).clear();

                      const float volume = read_float(snapshot["volume"], id(display_volume_level));
                      // RuntimeState is the only volume authority while the
                      // bridge is active. A slower metadata response may have
                      // been requested before the latest encoder command and
                      // must not replace its already confirmed target.
                      const bool bridge_owns_volume =
                        id(dual_mcu_ha_bridge_ready) &&
                        id(dual_mcu_runtime_authoritative);
                      const bool local_volume_pending =
                        id(volume_override_active) ||
                        id(media_pending_volume_sync) ||
                        id(media_volume_confirmation_pending);
                      if (!bridge_owns_volume &&
                          !local_volume_pending &&
                          !isnan(volume)) {
                        id(display_volume_level) = volume;
                      }
                      const float snapshot_position =
                        read_float(snapshot["position"], id(media_position_seconds));
                      const bool position_hold =
                        id(media_track_change_position_hold_until_ms) != 0 &&
                        static_cast<int32_t>(
                          millis() - id(media_track_change_position_hold_until_ms)) < 0;
                      if (!position_hold || snapshot_position <= 2.0f) {
                        id(media_position_seconds) = snapshot_position;
                        if (snapshot_position <= 2.0f)
                          id(media_track_change_position_hold_until_ms) = 0;
                      }
                      id(media_duration_seconds) = read_float(snapshot["duration"], id(media_duration_seconds));
                      id(media_shuffle_enabled) = read_bool(snapshot["shuffle"]);
                      const std::string repeat = read_string(snapshot["repeat"]);
                      id(media_repeat_single_enabled) = repeat == "one" || repeat == "repeat_one";
                      id(media_ui_dirty) = true;
                  - script.execute: refresh_media_cover_url
                  - script.execute: refresh_settings_ui
                  - if:
                      condition:
                        lambda: 'return id(current_page) == 6 && id(music_state_cache) != "playing";'
                      then:
                        - script.execute: return_from_media_cover
                on_error:
                  - lambda: |-
                      id(media_runtime_state_text).publish_state("snapshot_error");
                      id(media_ui_dirty) = true;
                  - logger.log:
                      level: WARN
                      format: "Dynamic media snapshot failed"
                  - script.execute: refresh_media_ui_if_needed
