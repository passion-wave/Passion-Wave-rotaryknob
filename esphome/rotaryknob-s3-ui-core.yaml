  - id: refresh_timer_ui
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(current_page) == 11;'
          then:
            - lambda: |-
                if (id(timer_duration_seconds) < 10) id(timer_duration_seconds) = 10;
                if (id(timer_duration_seconds) > 5999) id(timer_duration_seconds) = 5999;
                if (!id(timer_running) && !id(timer_finished)) {
                  id(timer_remaining_seconds) = id(timer_duration_seconds);
                }
                if (id(timer_remaining_seconds) < 0) id(timer_remaining_seconds) = 0;
                if (id(timer_remaining_seconds) > 5999) id(timer_remaining_seconds) = 5999;

                const int duration = id(timer_duration_seconds);
                const int remaining = id(timer_remaining_seconds);
                static const int preset_seconds[] = {10, 30, 60, 120, 300, 600, 900, 1800, 2700, 3600};
                static const char *preset_labels[] = {"10 Sek", "30 Sek", "1 Min", "2 Min", "5 Min", "10 Min", "15 Min", "30 Min", "45 Min", "60 Min"};
                bool preset_match = false;
                for (int i = 0; i < 10; i++) {
                  if (duration == preset_seconds[i]) {
                    id(timer_preset_index) = i;
                    lv_label_set_text(timer_duration_label, preset_labels[i]);
                    preset_match = true;
                    break;
                  }
                }
                if (!preset_match) {
                  if (duration >= 60 && duration % 60 == 0) {
                    lv_label_set_text_fmt(timer_duration_label, "%d Min", duration / 60);
                  } else if (duration >= 60) {
                    lv_label_set_text_fmt(timer_duration_label, "%02d:%02d", duration / 60, duration % 60);
                  } else {
                    lv_label_set_text_fmt(timer_duration_label, "%d Sek", duration);
                  }
                }
                if (id(timer_edit_field) < 0 || id(timer_edit_field) > 1) id(timer_edit_field) = 0;
                lv_label_set_text_fmt(timer_time_label, "%02d", remaining / 60);
                lv_label_set_text(timer_colon_label, ":");
                lv_label_set_text_fmt(timer_seconds_label, "%02d", remaining % 60);
                lv_obj_set_style_text_color(timer_time_label, lv_color_hex(!id(timer_running) && id(timer_edit_field) == 0 ? 0xF59E0B : 0xFFFFFF), LV_PART_MAIN | LV_STATE_DEFAULT);
                lv_obj_set_style_text_color(timer_seconds_label, lv_color_hex(!id(timer_running) && id(timer_edit_field) == 1 ? 0xF59E0B : 0xFFFFFF), LV_PART_MAIN | LV_STATE_DEFAULT);
                lv_obj_set_style_text_color(timer_colon_label, lv_color_hex(0xCBD5E1), LV_PART_MAIN | LV_STATE_DEFAULT);
                lv_label_set_text(timer_state_label, id(timer_finished) ? "Fertig" : (id(timer_running) ? "Laeuft" : "Bereit"));
                lv_label_set_text(timer_start_icon_label, id(timer_running) ? "\U0000E034" : "\U0000E037");
                lv_obj_set_style_bg_color(timer_start_button, lv_color_hex(id(timer_running) ? 0x1F2937 : 0xF59E0B), LV_PART_MAIN | LV_STATE_DEFAULT);
                lv_obj_set_style_text_color(timer_start_icon_label, lv_color_hex(id(timer_running) ? 0xF59E0B : 0x111827), LV_PART_MAIN | LV_STATE_DEFAULT);
                lv_obj_set_style_bg_color(timer_reset_button, lv_color_hex(id(timer_finished) ? 0xF59E0B : 0x1F2937), LV_PART_MAIN | LV_STATE_DEFAULT);
                lv_obj_set_style_text_color(timer_reset_icon_label, lv_color_hex(id(timer_finished) ? 0x111827 : 0xCBD5E1), LV_PART_MAIN | LV_STATE_DEFAULT);
                if (id(timer_ring_arc) != nullptr) {
                  int value = 0;
                  if (id(timer_finished)) {
                    value = 100;
                  } else if (duration > 0) {
                    value = ((duration - remaining) * 100) / duration;
                  }
                  if (value < 0) value = 0;
                  if (value > 100) value = 100;
                  lv_arc_set_value(id(timer_ring_arc), value);
                  lv_obj_invalidate(id(timer_ring_arc));
                }
