          lv_label_set_text_fmt(weather_wind_value_label, "%d km/h", rounded_int(id(weather_wind_speed)));
          lv_label_set_text_fmt(weather_humidity_value_label, "%d%%", id(weather_humidity));
          lv_label_set_text_fmt(weather_max_value_label, "%d°", rounded_int(id(weather_maximum)));
          lv_label_set_text_fmt(weather_max_label, "%d°", rounded_int(id(weather_maximum)));
          lv_label_set_text_fmt(weather_min_label, "%d°", rounded_int(id(weather_minimum)));
          lv_label_set_text(weather_morning_label, morning_visual.icon);
          lv_label_set_text(weather_noon_label, noon_visual.icon);
          lv_label_set_text(weather_evening_label, evening_visual.icon);
          lv_obj_set_style_text_color(weather_morning_label, lv_color_hex(morning_color), LV_PART_MAIN | LV_STATE_DEFAULT);
          lv_obj_set_style_text_color(weather_noon_label, lv_color_hex(noon_color), LV_PART_MAIN | LV_STATE_DEFAULT);
          lv_obj_set_style_text_color(weather_evening_label, lv_color_hex(evening_color), LV_PART_MAIN | LV_STATE_DEFAULT);
          lv_obj_t *morning_text[] = {
            weather_morning_text_v,
            weather_morning_text_o,
            weather_morning_text_r,
            weather_morning_text_m,
            weather_morning_text_i,
            weather_morning_text_t1,
            weather_morning_text_t2,
            weather_morning_text_a,
            weather_morning_text_g,
          };
          lv_obj_t *evening_text[] = {
            weather_evening_text_a,
            weather_evening_text_b,
            weather_evening_text_e,
            weather_evening_text_n,
            weather_evening_text_d,
