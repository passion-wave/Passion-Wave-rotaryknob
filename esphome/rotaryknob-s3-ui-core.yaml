    # Wetter-Screensaver nach HA_esp32s3Ball-Dock-Szene
    - id: page_7
      on_load:
        - lambda: |-
            id(current_page) = 7;
            auto lock_screensaver_object = [](lv_obj_t *obj) {
              if (obj == nullptr) return;
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_SCROLLABLE);
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_SCROLL_ELASTIC);
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_SCROLL_MOMENTUM);
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_SCROLL_CHAIN);
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_SCROLL_ON_FOCUS);
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_SCROLL_WITH_ARROW);
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_SNAPPABLE);
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_GESTURE_BUBBLE);
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_EVENT_BUBBLE);
              lv_obj_set_scroll_dir(obj, LV_DIR_NONE);
              lv_obj_scroll_to(obj, 0, 0, LV_ANIM_OFF);
            };
            lv_obj_t *screensaver_root = screensaver_bg != nullptr ? lv_obj_get_parent(screensaver_bg) : lv_scr_act();
            if (screensaver_root != nullptr) {
              std::vector<lv_obj_t *> stack;
              stack.push_back(screensaver_root);
              while (!stack.empty()) {
                lv_obj_t *obj = stack.back();
                stack.pop_back();
                lock_screensaver_object(obj);
                const uint32_t child_count = lv_obj_get_child_cnt(obj);
                for (uint32_t child_index = 0; child_index < child_count; child_index++) {
                  stack.push_back(lv_obj_get_child(obj, child_index));
                }
              }
            }
            lv_obj_add_flag(screensaver_time_shadow_label, LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(screensaver_time_label, LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(screensaver_clock_host, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_clear_flag(screensaver_clock_center_dot, LV_OBJ_FLAG_CLICKABLE);
            if (id(screensaver_hour_hand) == nullptr) {
              auto *line = lv_line_create(screensaver_clock_host);
              lv_obj_set_style_line_color(line, lv_color_hex(0x334155), LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_line_width(line, 9, LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_line_opa(line, LV_OPA_COVER, LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_line_rounded(line, true, LV_PART_MAIN | LV_STATE_DEFAULT);
              id(screensaver_hour_hand) = line;
            }
            if (id(screensaver_minute_hand) == nullptr) {
              auto *line = lv_line_create(screensaver_clock_host);
              lv_obj_set_style_line_color(line, lv_color_hex(0x111827), LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_line_width(line, 6, LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_line_opa(line, LV_OPA_COVER, LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_line_rounded(line, true, LV_PART_MAIN | LV_STATE_DEFAULT);
              id(screensaver_minute_hand) = line;
            }
            lv_obj_move_foreground(screensaver_clock_host);
            lv_obj_set_style_text_align(screensaver_time_shadow_label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_opa(screensaver_time_shadow_label, LV_OPA_40, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_align(screensaver_time_label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_align(screensaver_date_label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_align(screensaver_summary_label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_align(screensaver_rain_label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_text_align(screensaver_temp_label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN | LV_STATE_DEFAULT);
            if (screensaver_exit_button != nullptr) {
              lock_screensaver_object(screensaver_exit_button);
              lv_obj_add_flag(screensaver_exit_button, LV_OBJ_FLAG_CLICKABLE);
              lv_obj_move_foreground(screensaver_exit_button);
              static bool screensaver_exit_press_handler_added = false;
              if (!screensaver_exit_press_handler_added) {
                lv_obj_add_event_cb(screensaver_exit_button, [](lv_event_t *event) {
                  id(return_from_screensaver).execute();
                }, LV_EVENT_PRESSED, nullptr);
                screensaver_exit_press_handler_added = true;
              }
            }
