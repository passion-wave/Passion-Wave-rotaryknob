          bool refresh_media = false;
          bool fast_media_volume = false;
          bool refresh_media_picker = false;
          bool request_more_tracks = false;
          bool request_more_playlists = false;

          if (id(current_page) == 8) {
            const int delta = steps > 0 ? 1 : -1;
            const int next =
              std::clamp(id(rain_radar_zoom_level) + delta, 0, 2);
            if (next != id(rain_radar_zoom_level)) {
              id(change_rain_radar_zoom).execute(delta);
              action_handled = true;
            }
          } else if (id(current_page) == 1 || id(current_page) == 21) {
            if (id(current_page) == 21 &&
                ui_next::framework.light_popup_visible()) {
              // The open modal owns the encoder. This keeps rotary input from
              // leaking through to brightness while a long Hue/WLED catalog
              // is being inspected.
              ui_next::framework.scroll_light_popup(steps);
              return;
            }
            if (id(light_source_index) != 0) {
              id(light_color_selected) = false;
              id(light_pending_color_sync) = false;
            }
            if (id(light_color_selected)) {
              int new_index = id(ambiente_scene_index) + steps;
              const int scene_count = scrollwheel_targets::scene_value_count(id(scene_slot_index));
              if (new_index < 0) new_index = 0;
              if (new_index >= scene_count) new_index = scene_count - 1;
              if (new_index != id(ambiente_scene_index)) {
                id(ambiente_scene_index) = new_index;
                id(ambiente_scene_name) = scrollwheel_targets::scene_value_name(id(scene_slot_index), id(ambiente_scene_index));
                action_handled = true;
              }
              if (action_handled) {
                id(light_color_timer) = 0;
                id(light_pending_color_sync) = true;
              }
            } else {
              int new_brightness = id(light_brightness_pct) + (steps * 5);
              if (new_brightness < 0) new_brightness = 0;
              if (new_brightness > 100) new_brightness = 100;
              if (new_brightness != id(light_brightness_pct)) {
                id(light_brightness_pct) = new_brightness;
                if (id(light_source_index) == 0) id(light_1_on) = new_brightness > 0;
                else if (id(light_source_index) == 1) id(light_2_on) = new_brightness > 0;
                else if (id(light_source_index) == 2) id(light_3_on) = new_brightness > 0;
                else id(light_4_on) = new_brightness > 0;
                id(light_pending_brightness_sync) = true;
                action_handled = true;
              }
            }
            if (action_handled) {
              id(light_sync_generation) += 1;
              id(light_local_change_deadline_ms) = millis() + 1200;
              id(light_sync_deadline_ms) = millis() + 150;
              id(light_ui_dirty) = true;
              refresh_light = true;
            }
          } else if (id(current_page) == 2 || id(current_page) == 6 || id(current_page) == 22) {
            id(media_last_activity_ms) = millis();
            if ((id(current_page) == 2 || id(current_page) == 22) &&
                id(media_picker_visible)) {
              // The modal owns input while an asynchronous start is pending.
              // Ignore rotary batches instead of letting them hit the page
              // below or queueing work behind Home Assistant.
              if (id(media_selection_loading)) return;
              id(media_list_last_activity_ms) = millis();
              const int tab = id(media_picker_tab);
              if (tab == 0) {
                id(track_select_last_activity_ms) = millis();
                id(track_select_active) = true;
                id(control_mode) = 4;
                const int size = static_cast<int>(id(ma_track_titles_cache).size());
                if (size > 0) {
                  int next = id(selected_track_index) + steps;
                  const bool wants_more = steps > 0 && next >= size - 5 && id(track_has_more);
                  if (next < 0) next = 0;
                  if (next >= size) next = size - 1;
                  if (next != id(selected_track_index)) {
                    id(selected_track_index) = next;
                    action_handled = true;
                  }
                  request_more_tracks =
                    wants_more &&
                    id(pending_track_request_id).empty() &&
                    !id(track_autoload_inflight);
                  if (request_more_tracks) {
                    action_handled = true;
                  }
                }
              } else {
                std::vector<std::string> *names = &id(ma_playlists_names_cache);
                int *idx = &id(selected_playlist_index);
                if (tab == 2) {
                  names = &id(ma_radios_names_cache);
                  idx = &id(selected_radio_index);
                } else if (tab == 3) {
                  names = &id(ma_podcasts_names_cache);
                  idx = &id(selected_podcast_index);
                }
                const int base_size = static_cast<int>(names->size());
                const int size = base_size;
                if (size > 0) {
                  int next = *idx + steps;
                  const bool wants_more =
                    tab == 1 &&
                    steps > 0 &&
                    next >= size - 5 &&
                    id(playlist_has_more);
                  if (next < 0) next = 0;
                  if (next >= size) next = size - 1;
                  if (next != *idx) {
                    *idx = next;
                    action_handled = true;
                  }
                  request_more_playlists =
                    wants_more &&
                    id(pending_playlist_request_id).empty() &&
                    !id(playlist_autoload_inflight);
                  if (request_more_playlists) {
                    action_handled = true;
                  }
                } else if (tab == 1 &&
                           steps > 0 &&
                           id(playlist_has_more) &&
                           id(pending_playlist_request_id).empty() &&
                           !id(playlist_autoload_inflight)) {
                  request_more_playlists = true;
                  action_handled = true;
                }
              }
              if (action_handled) {
                id(media_ui_dirty) = true;
                refresh_media = true;
                refresh_media_picker = true;
                id(media_picker_fast_refresh_requested) =
                  !request_more_tracks && !request_more_playlists;
              }
            } else if (id(control_mode) == 2) {
              id(media_list_last_activity_ms) = millis();
              std::vector<std::string> *names = &id(ma_playlists_names_cache);
              if (id(media_browser_mode) == 2) {
                names = &id(ma_radios_names_cache);
              } else if (id(media_browser_mode) == 3) {
                names = &id(ma_podcasts_names_cache);
              }
              const int size = static_cast<int>(names->size());
              if (size > 0) {
                int *idx =
                  (id(media_browser_mode) == 1) ? &id(selected_playlist_index) :
                  (id(media_browser_mode) == 2) ? &id(selected_radio_index) :
                                                  &id(selected_podcast_index);
                int raw_next = *idx + steps;
                int next = raw_next;
                if (id(media_browser_mode) == 1 && id(playlist_has_more)) {
                  if (next < 0) next = 0;
                  if (next >= size) next = size - 1;
                } else {
                  next = raw_next % size;
                  if (next < 0) next += size;
                }
                const bool wants_more =
                  id(media_browser_mode) == 1 &&
                  steps > 0 &&
                  raw_next >= size - 5 &&
                  id(playlist_has_more);
                if (next != *idx) {
                  *idx = next;
                  id(media_ui_dirty) = true;
                  refresh_media = true;
                  action_handled = true;
                }
                request_more_playlists =
                  wants_more &&
                  id(pending_playlist_request_id).empty() &&
                  !id(playlist_autoload_inflight);
                if (request_more_playlists) {
                  action_handled = true;
                }
              }
            } else if (id(control_mode) == 4) {
              id(track_select_last_activity_ms) = millis();
              id(track_select_active) = true;
              const int size = static_cast<int>(id(ma_track_titles_cache).size());
              if (size > 0) {
                int raw_next = id(selected_track_index) + steps;
                int next = raw_next;
                if (id(track_has_more)) {
                  if (next < 0) next = 0;
                  if (next >= size) next = size - 1;
                } else {
                  next = raw_next % size;
                  if (next < 0) next += size;
                }
                if (next != id(selected_track_index)) {
                  id(selected_track_index) = next;
                  id(media_ui_dirty) = true;
                  refresh_media = true;
                  action_handled = true;
                }
                request_more_tracks =
                  steps > 0 &&
                  (raw_next >= size || id(selected_track_index) >= size - 5) &&
                  id(track_has_more) &&
                  id(pending_track_request_id).empty() &&
                  !id(track_autoload_inflight);
                if (request_more_tracks) {
                  action_handled = true;
                }
              }
            } else {
              // During bridge operation display_volume_level is the
              // authoritative accumulator. Using a slightly older HA
              // callback as the next detent's base causes visible back-jumps.
              const bool bridge_owns_media =
                id(dual_mcu_ha_bridge_enabled) &&
                id(dual_mcu_ha_bridge_ready);
              float base = id(display_volume_level);
              if (isnan(base)) base = id(display_volume_level);
              if (isnan(base)) return;
              float target = base + (static_cast<float>(steps) * 0.02f);
              if (target < 0.0f) target = 0.0f;
              if (target > 1.0f) target = 1.0f;
              if (roundf(target * 100.0f) != roundf(base * 100.0f)) {
                id(display_volume_level) = target;
                id(volume_override_active) = true;
                id(volume_override_until_ms) =
                  bridge_owns_media ? millis() + 3000 : millis() + 350;
                if (bridge_owns_media) {
                  id(media_volume_confirmation_pending) = true;
                  id(media_volume_confirmation_target_pct) =
                    static_cast<uint8_t>(lroundf(target * 100.0f));
                  id(media_volume_confirmation_deadline_ms) = millis() + 3000;
                }
                id(displayed_media_volume_sensor).publish_state(
                  static_cast<int>(lroundf(target * 100.0f)));
                if (id(current_page) == 6) {
                  id(media_cover_volume_overlay_until_ms) = millis() + 1400;
                }
                id(media_pending_volume_sync) = true;
                id(media_volume_sync_deadline_ms) = millis();
                id(media_ui_dirty) = true;
                refresh_media = true;
                fast_media_volume = true;
                action_handled = true;
              }
            }
          } else if (id(current_page) == 11 || id(current_page) == 23) {
            if (!id(timer_running)) {
              if (id(timer_edit_field) < 0 || id(timer_edit_field) > 1) id(timer_edit_field) = 0;
              const int step_seconds = id(timer_edit_field) == 1 ? 10 : 60;
              int target = id(timer_duration_seconds) + (steps * step_seconds);
              if (target < 10) target = 10;
              if (target > 5999) target = 5999;
              if (target != id(timer_duration_seconds) || id(timer_finished)) {
                id(timer_duration_seconds) = target;
                id(timer_remaining_seconds) = target;
                id(timer_finished) = false;
                id(refresh_timer_ui).execute();
                action_handled = true;
              }
            }
          } else if (id(current_page) == 12) {
            const int old_hour = id(alarm_hour);
            const int old_minute = id(alarm_minute);
            if (id(alarm_edit_field) == 0) {
              int hour = (id(alarm_hour) + steps) % 24;
              if (hour < 0) hour += 24;
              id(alarm_hour) = hour;
            } else {
              int total = id(alarm_hour) * 60 + id(alarm_minute) + (steps * 5);
              total %= 1440;
              if (total < 0) total += 1440;
              id(alarm_hour) = total / 60;
              id(alarm_minute) = (total % 60 / 5) * 5;
            }
            if (id(alarm_hour) != old_hour || id(alarm_minute) != old_minute) {
              id(refresh_alarm_ui).execute();
              action_handled = true;
            }
          }

          if (!action_handled) {
            return;
          }
          // Paint the local response first. Haptics and network paging are
          // deliberately scheduled afterwards so they cannot delay feedback.
          if (refresh_light) {
            id(refresh_light_ui_if_needed).execute();
          }
          if (refresh_media) {
            if (fast_media_volume) {
              const int volume_pct = std::clamp(
                static_cast<int>(lroundf(id(display_volume_level) * 100.0f)),
                0, 100);
              ui_next::framework.update_media_volume(volume_pct);
              if (id(media_ring_arc) != nullptr)
                lv_arc_set_value(id(media_ring_arc), volume_pct);
              if (id(media_cover_volume_arc) != nullptr)
                lv_arc_set_value(id(media_cover_volume_arc), volume_pct);
              // Dispatch only after the changed pixels have been submitted
              // to LVGL. The network path never gates local feedback.
              id(media_sync_remote).execute();
            } else {
              id(refresh_media_ui_if_needed).execute();
            }
          }
          if (refresh_media_picker) {
            id(refresh_media_picker_popup).execute();
          }
          if (request_more_tracks) {
            id(request_more_playlist_tracks).execute();
          }
          if (request_more_playlists) {
            id(request_more_playlist_page).execute();
          }
          id(play_haptic_feedback).execute();
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: |-
              return id(media_selection_loading) &&
                     id(media_selection_started_ms) != 0 &&
                     millis() - id(media_selection_started_ms) >= 15000;
          then:
            - lambda: |-
                id(media_selection_loading) = false;
                id(media_selection_started_ms) = 0;
                id(media_selection_pending_kind) = -1;
                id(media_selection_pending_index) = -1;
                id(media_selection_bridge_accepted) = false;
                id(media_selection_feedback_text) = "START UNKLAR";
                id(media_selection_feedback_until_ms) = millis() + 5000;
                id(control_mode) = 2;
                id(media_picker_fast_refresh_requested) = false;
            - script.execute: refresh_media_picker_popup
  - interval: 50ms
    then:
      - if:
          condition:
            lambda: |-
              return id(media_volume_confirmation_pending) &&
                     static_cast<int32_t>(
                       millis() - id(media_volume_confirmation_deadline_ms)) >= 0;
          then:
            - lambda: |-
                id(media_volume_confirmation_pending) = false;
                id(volume_override_active) = false;
                id(media_ui_dirty) = true;
            - script.execute: refresh_media_ui_if_needed
      - if:
          condition:
            lambda: |-
              return (id(light_pending_brightness_sync) || id(light_pending_color_sync)) &&
                     !id(display_sleeping) &&
                     millis() >= id(light_sync_deadline_ms);
          then:
            - script.execute: light_sync_remote
      - if:
          condition:
            lambda: |-
              return id(media_pending_volume_sync) &&
                     !id(display_sleeping) &&
                     millis() >= id(media_volume_sync_deadline_ms);
          then:
            - script.execute: media_sync_remote
  - interval: 200ms
    then:
      - if:
          condition:
            lambda: |-
              if (id(display_sleeping) ||
                  (id(current_page) != 2 && id(current_page) != 22) ||
                  !id(media_picker_visible) ||
                  id(media_picker_tab) != 1 ||
                  media_picker_list == nullptr) {
                return false;
              }
              const int loaded =
                static_cast<int>(id(ma_playlists_names_cache).size());
              const int capacity = id(playlist_has_more) ? 15 : 16;
              const int start = std::max(0, id(media_picker_window_start));
              return loaded > start + capacity &&
                     lv_obj_get_scroll_bottom(media_picker_list) <= 8;
          then:
            - lambda: |-
                // The popup owns only 16 persistent LVGL rows. Move its
                // virtual window in ten-entry steps and retain five rows of
                // context. No allocation or network call occurs here.
                const int loaded =
                  static_cast<int>(id(ma_playlists_names_cache).size());
                const int capacity = id(playlist_has_more) ? 15 : 16;
                const int max_start = std::max(0, loaded - capacity);
                const int old_start =
                  std::clamp(id(media_picker_window_start), 0, max_start);
                const int next_start = std::min(max_start, old_start + 10);
                if (next_start <= old_start) return;
                id(media_picker_window_start) = next_start;
                id(selected_playlist_index) = std::min(
                  loaded - 1, next_start + 5);
                id(media_picker_scroll_reset_requested) = true;
                id(media_picker_fast_refresh_requested) = false;
                id(media_ui_dirty) = true;
            - script.execute: refresh_media_picker_popup
      - if:
          condition:
            lambda: |-
              if (id(display_sleeping) ||
                  (id(current_page) != 2 && id(current_page) != 22) ||
                  !id(media_picker_visible) ||
                  id(media_picker_tab) != 1 ||
                  !id(playlist_has_more) ||
                  !id(pending_playlist_request_id).empty() ||
                  id(playlist_autoload_inflight)) {
                return false;
              }
              const bool proxy_ready =
                id(dual_mcu_library_request_proxy_available) &&
                millis() >=
                  id(dual_mcu_library_response_proxy_failed_until_ms);
              const bool direct_ready =
                id(wifi_connected) &&
                (!id(dual_mcu_stage2_library_offload_enabled) ||
                 id(dual_mcu_s3_library_fallback_active));
              if (!proxy_ready && !direct_ready) return false;
              const int loaded = static_cast<int>(id(ma_playlists_names_cache).size());
              if (loaded <= 0) {
                return true;
              }
              // Five cached entries are enough to hide the HA/API/UART
              // round-trip without filling the whole catalog at startup.
              if (id(selected_playlist_index) >= loaded - 5) {
                return true;
              }
              if (media_picker_list != nullptr) {
                const int scroll_y =
                  std::max(0, static_cast<int>(lv_obj_get_scroll_y(media_picker_list)));
                const int last_visible =
                  std::max(0, id(media_picker_window_start)) +
                  (scroll_y / 44) + 3;
                if (last_visible >= loaded - 5) return true;
              }
              return false;
          then:
            - script.execute: request_more_playlist_page
      - if:
          condition:
            lambda: |-
              if (id(display_sleeping) ||
                  (id(current_page) != 2 && id(current_page) != 22) ||
                  !id(media_picker_visible) ||
                  id(media_picker_tab) != 1 ||
                  media_picker_list == nullptr) {
                return false;
              }
              const int loaded =
                static_cast<int>(id(ma_playlists_names_cache).size());
              if (loaded <= 0) return false;
              const int scroll_y =
                std::max(0, static_cast<int>(
                  lv_obj_get_scroll_y(media_picker_list)));
              if (std::abs(
                    scroll_y - id(media_picker_last_observed_scroll_y)) < 4) {
                return false;
              }
              const int visible_focus = std::clamp(
                id(media_picker_window_start) + (scroll_y / 44) + 2,
                0, loaded - 1);
              return visible_focus != id(selected_playlist_index);
          then:
            - lambda: |-
                // Touch scrolling owns the visual focus just like the encoder.
                // Follow the third visible row so the highlight cannot leave
                // the viewport and the five-items-ahead prefetch sees the
                // user's real position.
                const int loaded =
                  static_cast<int>(id(ma_playlists_names_cache).size());
                const int scroll_y =
                  std::max(0, static_cast<int>(
                    lv_obj_get_scroll_y(media_picker_list)));
                id(media_picker_last_observed_scroll_y) = scroll_y;
                id(selected_playlist_index) = std::clamp(
                  id(media_picker_window_start) + (scroll_y / 44) + 2,
                  0, loaded - 1);
                id(media_picker_fast_refresh_requested) = false;
                id(media_ui_dirty) = true;
            - script.execute: refresh_media_picker_popup
      - if:
          condition:
            lambda: 'return !id(display_sleeping) && id(volume_override_active) && !id(media_volume_confirmation_pending) && millis() >= id(volume_override_until_ms);'
          then:
            - lambda: |-
                id(volume_override_active) = false;
                id(media_ui_dirty) = true;
            - script.execute: refresh_media_ui_if_needed
  - interval: 5s
    then:
      - script.execute: refresh_dynamic_media_snapshot
  - interval: 15min
    then:
      - script.execute: publish_configuration_snapshot
      - if:
          condition:
            lambda: 'return !id(display_sleeping) || id(external_power_detected);'
          then:
            - script.execute: fetch_weather
            - script.execute: fetch_rain_eta

switch:
  - platform: template
    name: "scrollwheel Media Debug"
    id: media_latency_debug_enabled
    entity_category: diagnostic
    disabled_by_default: true
    icon: mdi:bug-check
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(media_debug_trace_id) = App.get_name() + "-manual-debug-" + std::to_string(millis());
          id(media_debug_start_ms) = millis();
          id(media_debug_event_seq) = 0;
          id(media_debug_last_event) = "debug enabled";
          id(media_debug_status_text).publish_state(id(media_debug_last_event));
          ESP_LOGW("media_debug", "enabled trace_id=%s heap=%u",
                   id(media_debug_trace_id).c_str(),
                   static_cast<unsigned>(esp_get_free_heap_size()));
    turn_off_action:
      - lambda: |-
          id(media_debug_last_event) = "debug disabled";
          id(media_debug_status_text).publish_state(id(media_debug_last_event));
          ESP_LOGW("media_debug", "disabled");
  - platform: template
    name: "scrollwheel Vibration"
    id: haptic_enabled_switch
    entity_category: config
    lambda: "return id(haptic_enabled);"
    turn_on_action:
      - lambda: 'id(haptic_enabled) = true;'
      - script.execute: play_haptic_feedback
      - script.execute: refresh_settings_ui
    turn_off_action:
      - lambda: 'id(haptic_enabled) = false;'
      - script.execute: refresh_settings_ui
  - platform: template
    name: "scrollwheel Demo"
    id: demo_mode_enabled_switch
    entity_category: config
    disabled_by_default: true
    lambda: "return id(demo_mode_enabled);"
    turn_on_action:
      - lambda: 'id(demo_mode_enabled) = true;'
      - script.execute: sync_demo_mode_with_wifi
      - script.execute: refresh_settings_ui
    turn_off_action:
      - lambda: 'id(demo_mode_enabled) = false;'
      - script.execute: disable_demo_mode
      - script.execute: refresh_settings_ui
  - platform: template
    name: "Wach halten"
    id: display_keep_awake_switch
    entity_category: config
    disabled_by_default: true
    icon: mdi:eye-outline
    lambda: "return id(display_keep_awake);"
    turn_on_action:
      - lambda: |-
          id(display_keep_awake) = true;
          id(ui_last_activity_ms) = millis();
          id(display_keep_awake_switch).publish_state(true);
      - script.execute: apply_display_keep_awake
    turn_off_action:
      - lambda: |-
          id(display_keep_awake) = false;
          id(ui_last_activity_ms) = millis();
          id(display_keep_awake_switch).publish_state(false);
      - script.execute: refresh_settings_ui

number:
  - platform: template
    name: "scrollwheel Rotary Haptic Effect"
    id: haptic_effect_number
    entity_category: config
    disabled_by_default: true
    lambda: "return id(haptic_effect_index);"
    update_interval: never
    min_value: 1
    max_value: 123
    step: 1
    mode: box
    set_action:
      - lambda: |-
          int effect = static_cast<int>(roundf(x));
          if (effect < 1) effect = 1;
          if (effect > 123) effect = 123;
          id(haptic_effect_index) = effect;
          id(haptic_effect_number).publish_state(effect);
      - script.execute: play_haptic_feedback
      - script.execute: refresh_settings_ui
  - platform: template
    name: "scrollwheel Timer Done Haptic Effect"
    id: timer_done_haptic_effect_number
    entity_category: config
    disabled_by_default: true
    lambda: "return id(timer_done_haptic_effect_index);"
    update_interval: never
    min_value: 1
    max_value: 123
    step: 1
    mode: box
    set_action:
      - lambda: |-
          int effect = static_cast<int>(roundf(x));
          if (effect < 1) effect = 1;
          if (effect > 123) effect = 123;
          id(timer_done_haptic_effect_index) = effect;
          id(timer_done_haptic_effect_number).publish_state(effect);
