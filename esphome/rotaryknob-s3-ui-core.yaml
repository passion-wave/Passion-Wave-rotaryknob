  - id: enable_swipe_navigation_bubble
    mode: restart
    then:
      - lambda: |-
          auto *root = lv_scr_act();
          if (root == nullptr) return;
          std::vector<lv_obj_t *> stack;
          stack.push_back(root);
          while (!stack.empty()) {
            lv_obj_t *obj = stack.back();
            stack.pop_back();
            if (obj == nullptr) continue;
            #ifdef LV_OBJ_FLAG_GESTURE_BUBBLE
            lv_obj_add_flag(obj, LV_OBJ_FLAG_GESTURE_BUBBLE);
            #else
            lv_obj_add_flag(obj, LV_OBJ_FLAG_EVENT_BUBBLE);
            #endif
            const uint32_t child_count = lv_obj_get_child_cnt(obj);
            for (uint32_t child_index = 0; child_index < child_count; child_index++) {
              stack.push_back(lv_obj_get_child(obj, child_index));
            }
          }
  - id: handle_fast_touch_swipe
    mode: restart
    then:
      - lambda: |-
          if (id(touch_swipe_handled) || id(touch_swipe_started_sleeping) || id(display_sleeping)) {
