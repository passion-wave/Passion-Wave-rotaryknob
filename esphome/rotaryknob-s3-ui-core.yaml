          const int source_page = id(current_page);
          if (id(current_page) != 7) {
            // Radar and settings are transient workspaces. Once idle mode has
            // started they are considered closed and wake returns to weather.
            if (id(current_page) == 5 || id(current_page) == 8) {
              id(screensaver_return_page) = id(ui_next_enabled) ? 20 : 4;
            } else {
              id(screensaver_return_page) = id(current_page);
            }
          }
          if (id(ui_next_enabled) && ui_next::framework.built()) {
            // The screensaver is an intentional legacy full-screen page. Hide
            // UI Next before exposing it, otherwise the visible UI Next page
            // keeps current_page outside 7 and retriggers this script every
            // second, including its immediate 100 % backlight command.
            ui_next::framework.show_legacy(ui_next::framework.view());
            ui_next::framework.set_suspended(true);
          }
          // Close the scheduler re-entry window immediately. LVGL's on_load
          // callback confirms this value once page_7 has actually loaded.
          id(current_page) = 7;
          ESP_LOGW("screensaver",
                   "enter source_page=%d return_page=%d ui_next=%s",
                   source_page, id(screensaver_return_page),
                   id(ui_next_enabled) ? "true" : "false");
