text:
  - platform: template
    name: "RotaryKnob Media Entity ID"
    id: media_target_entity_text
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "media_player.passion_wave_media"
    min_length: 0
    max_length: 128
    mode: text
    set_action:
      - lambda: |-
          auto trim = [](std::string value) -> std::string {
            while (!value.empty() &&
                   std::isspace(static_cast<unsigned char>(value.front())))
              value.erase(value.begin());
            while (!value.empty() &&
                   std::isspace(static_cast<unsigned char>(value.back())))
              value.pop_back();
            return value;
          };
          std::string next_target = trim(x);
          if (next_target.empty() ||
              next_target == "media_player.passion_wave_media")
            next_target = "${ha_player}";
          // Home Assistant periodically reasserts the selected target. An
          // idempotent write must not erase a newer UART runtime title.
          if (next_target == id(media_effective_entity_id)) {
            id(media_ui_dirty) = true;
            return;
          }
          id(music_state_cache).clear();
          id(media_title_cache).clear();
          id(media_artist_cache).clear();
          id(media_entity_picture_cache).clear();
          id(media_entity_picture_local_cache).clear();
          id(media_image_url_cache).clear();
          id(media_cover_url_cache).clear();
          id(media_cover_update_pending) = false;
          id(media_cover_pipeline_state) = 0;
          id(media_cover_active_target) = 0;
          id(media_cover_active_url).clear();
          id(media_cover_backoff_until_ms) = 0;
          id(media_cover_failure_count) = 0;
          id(media_page_cover_loaded_url).clear();
          id(media_full_cover_loaded_url).clear();
          id(media_cover_ready) = false;
          id(media_page_cover_ready) = false;
          id(media_ui_dirty) = true;
      - script.execute: refresh_media_target_runtime
      - script.execute: refresh_settings_ui
      - script.execute: refresh_media_ui_if_needed
  - platform: template
    name: "RotaryKnob Media Label"
    id: media_target_label_text
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "Media Player"
    min_length: 0
    max_length: 64
    mode: text
    set_action:
      - lambda: |-
          id(media_ui_dirty) = true;
      - script.execute: refresh_media_target_runtime
      - script.execute: refresh_settings_ui
      - script.execute: refresh_media_ui_if_needed
  - platform: template
    name: "RotaryKnob Media Runtime State"
    id: media_runtime_state_text
    entity_category: diagnostic
    disabled_by_default: true
    optimistic: true
    restore_value: false
    initial_value: "idle"
    min_length: 0
    max_length: 32
    mode: text
    set_action:
      - lambda: |-
          std::string state = x;
          for (char &c : state) {
            c = static_cast<char>(tolower(static_cast<unsigned char>(c)));
          }
          id(music_state_cache) = state;
          id(media_is_playing) = state == "playing";
          if (id(media_is_playing)) {
            id(media_cover_fullscreen_active) = false;
            if (id(media_cover_fullscreen_due_ms) == 0) {
              id(media_cover_fullscreen_due_ms) = millis() + 10000;
            }
          } else {
            id(media_cover_fullscreen_active) = false;
            id(media_cover_fullscreen_due_ms) = 0;
          }
          id(media_ui_dirty) = true;
      - script.execute: refresh_media_ui_if_needed
      - if:
          condition:
            lambda: 'return id(current_page) == 6 && id(music_state_cache) != "playing";'
          then:
            - script.execute: return_from_media_cover
  - platform: template
    name: "RotaryKnob Media Runtime Title"
    id: media_runtime_title_text
    entity_category: diagnostic
    disabled_by_default: true
    optimistic: true
    restore_value: false
    initial_value: ""
    min_length: 0
    max_length: 160
    mode: text
    set_action:
      - lambda: |-
          id(media_title_cache) = x;
          if (!x.empty()) id(current_media_label) = x;
          id(media_ui_dirty) = true;
      - script.execute: refresh_media_ui_if_needed
