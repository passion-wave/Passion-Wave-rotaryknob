              }
            }
            if (incoming.size() > 12288 || (first_non_ws != '[' && first_non_ws != '{')) {
              id(track_autoload_inflight) = false;
              id(publish_media_debug).execute(
                "esp_tracks_response_rejected",
                "payload",
                "playlist_tracks",
                std::string("bytes=") + std::to_string(incoming.size()) +
                  " first=" + std::string(first_non_ws == '\0' ? "none" : std::string(1, first_non_ws)));
              return;
            }

            DynamicJsonDocument doc(12288);
            if (deserializeJson(doc, incoming)) {
              id(track_autoload_inflight) = false;
              id(publish_media_debug).execute(
                "esp_tracks_response_parse_error",
                "payload",
                "playlist_tracks",
                std::string("bytes=") + std::to_string(incoming.size()));
              return;
            }

            auto sanitize_media_label = [](std::string text, const std::string &fallback, size_t limit) -> std::string {
              std::string out;
              out.reserve(text.size() < limit ? text.size() : limit);
              bool last_space = false;
              for (unsigned char c : text) {
                char next = '\0';
                if (c >= 32 && c <= 126) {
                  next = static_cast<char>(c);
                } else if (c == '\n' || c == '\r' || c == '\t' || c >= 127) {
                  next = ' ';
                }
                if (next == '\0') continue;
                if (next == ' ') {
                  if (last_space) continue;
                  last_space = true;
                } else {
                  last_space = false;
                }
                out.push_back(next);
                if (out.size() >= limit) break;
              }
              while (!out.empty() && out.back() == ' ') out.pop_back();
              return out.empty() ? fallback : out;
            };

            auto append_track = [&](JsonObject track, int fallback_index) {
              const char *title = track["title"] | track["name"] | "";
              const char *artist = track["artist"] | "";
              const char *uri = track["uri"] | "";
              const char *track_id = track["id"] | track["item_id"] | "";
              const char *url = track["url"] | "";

              std::string title_s = sanitize_media_label(
                title == nullptr ? std::string("") : std::string(title),
                "Titel " + std::to_string(fallback_index),
                96);
              std::string artist_s = sanitize_media_label(
                artist == nullptr ? std::string("") : std::string(artist),
                "",
                64);

              std::string uri_s = uri == nullptr ? "" : std::string(uri);
              if (uri_s.empty() && track_id != nullptr && track_id[0] != '\0') {
                uri_s = "spotify://track/";
                uri_s += track_id;
              }
              if (uri_s.empty() && url != nullptr) {
                uri_s = url;
              }

              id(ma_track_titles_cache).push_back(title_s);
              id(ma_track_artists_cache).push_back(artist_s);
              id(ma_track_uris_cache).push_back(uri_s);
            };

            if (doc.is<JsonObject>()) {
              std::string response_request_id = std::string(doc["request_id"] | "");
              if (!id(pending_track_request_id).empty()) {
                if (response_request_id.empty() || response_request_id != id(pending_track_request_id)) {
                  id(track_autoload_inflight) = false;
                  id(publish_media_debug).execute(
                    "esp_tracks_response_request_mismatch",
                    response_request_id.empty() ? std::string("-") : response_request_id,
                    "playlist_tracks",
                    std::string("pending=") + id(pending_track_request_id));
                  return;
                }
              } else if (!response_request_id.empty() && response_request_id.rfind(App.get_name(), 0) != 0) {
                id(publish_media_debug).execute(
                  "esp_tracks_response_other_device",
                  response_request_id,
                  "playlist_tracks",
                  "ignored");
                return;
              }

              JsonArray arr = doc["tracks"].as<JsonArray>();
              if (arr.isNull()) {
                arr = doc["items"].as<JsonArray>();
              }
              if (arr.isNull()) {
                id(track_autoload_inflight) = false;
                id(publish_media_debug).execute(
                  "esp_tracks_response_no_array",
                  response_request_id.empty() ? std::string("-") : response_request_id,
                  "playlist_tracks",
                  "missing tracks/items");
                return;
              }

              const int response_offset = doc["offset"] | 0;
              if (response_offset <= 0) {
                id(ma_track_titles_cache).clear();
                id(ma_track_artists_cache).clear();
                id(ma_track_uris_cache).clear();
              }
              id(ma_track_titles_cache).reserve(id(ma_track_titles_cache).size() + arr.size());
              id(ma_track_artists_cache).reserve(id(ma_track_artists_cache).size() + arr.size());
              id(ma_track_uris_cache).reserve(id(ma_track_uris_cache).size() + arr.size());

              int fallback_index = static_cast<int>(id(ma_track_titles_cache).size()) + 1;
              for (JsonObject track : arr) {
                append_track(track, fallback_index);
                fallback_index++;
              }

              id(track_loaded_count) = static_cast<int>(id(ma_track_titles_cache).size());
              id(track_total_available) = doc["total"] | id(track_loaded_count);
              const bool response_has_more = doc["has_more"] | false;
              id(track_has_more) = response_has_more &&
                                   (id(track_total_available) == 0 || id(track_loaded_count) < id(track_total_available));
              id(track_autoload_inflight) = false;
              id(last_accepted_track_request_id) = response_request_id;
              id(pending_track_request_id).clear();
            } else if (doc.is<JsonArray>()) {
              if (!id(pending_track_request_id).empty()) {
                id(track_autoload_inflight) = false;
                id(publish_media_debug).execute(
                  "esp_tracks_response_array_while_pending",
                  id(pending_track_request_id),
                  "playlist_tracks",
                  "ignored");
                return;
              }
              JsonArray arr = doc.as<JsonArray>();
              id(ma_track_titles_cache).clear();
              id(ma_track_artists_cache).clear();
              id(ma_track_uris_cache).clear();
              id(ma_track_titles_cache).reserve(arr.size());
              id(ma_track_artists_cache).reserve(arr.size());
              id(ma_track_uris_cache).reserve(arr.size());
              int fallback_index = 1;
              for (JsonObject track : arr) {
                append_track(track, fallback_index);
                fallback_index++;
              }
              id(track_loaded_count) = static_cast<int>(id(ma_track_titles_cache).size());
              id(track_total_available) = id(track_loaded_count);
              id(track_has_more) = false;
              id(track_autoload_inflight) = false;
            }

            if (id(selected_track_index) >= static_cast<int>(id(ma_track_titles_cache).size())) {
              id(selected_track_index) = static_cast<int>(id(ma_track_titles_cache).size()) - 1;
            }
            if (id(selected_track_index) < 0) {
              id(selected_track_index) = 0;
            }
            id(publish_media_debug).execute(
              "esp_tracks_response_parsed",
              id(last_accepted_track_request_id),
              "playlist_tracks",
              std::string("bytes=") + std::to_string(incoming.size()) +
                " loaded=" + std::to_string(id(track_loaded_count)) +
                " total=" + std::to_string(id(track_total_available)));
            id(media_ui_dirty) = true;
            if (id(media_autoplay_first_track_pending)) {
              id(media_autoplay_first_track_pending) = false;
              if (!id(ma_track_titles_cache).empty() && !id(ma_track_uris_cache).empty()) {
                id(selected_track_index) = 0;
                id(start_selected_track).execute();
              }
            }
        - script.execute: refresh_media_picker_popup
        - script.execute: refresh_media_ui_if_needed
  - platform: homeassistant
    id: backend_light_4_preset
    entity_id: ${light_4_preset_select}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(dual_mcu_ha_bridge_ready)) return;
            id(light_4_preset_name) = x.empty() || x == "unknown" || x == "unavailable" ? std::string("Police") : x;
            if (id(light_4_preset_name) == "Warmwhite") {
              id(light_4_preset_index) = 1;
            } else {
              id(light_4_preset_index) = 0;
            }
            if (id(light_source_index) == 3) {
              id(light_ui_dirty) = true;
            }
        - script.execute: refresh_light_ui_if_needed
  - platform: homeassistant
    id: backend_light_rgb
    entity_id: ${light_4_entity}
    attribute: rgb_color
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(dual_mcu_ha_bridge_ready)) return;
            if (millis() < id(light_local_change_deadline_ms)) {
              return;
            }
            int red = 0;
            int green = 0;
            int blue = 0;

            if (sscanf(x.c_str(), "[%d, %d, %d]", &red, &green, &blue) != 3 &&
                sscanf(x.c_str(), "(%d, %d, %d)", &red, &green, &blue) != 3) {
              return;
            }

            id(light_rgb_red) = red;
            id(light_rgb_green) = green;
            id(light_rgb_blue) = blue;

            static const int color_values[] = {2200, 2700, 3000, 3200, 3500, 3700, 4000};
            int best_index = 0;
            float best_distance = 1000000000.0f;

            for (int index = 0; index < 7; index++) {
              const float kelvin = static_cast<float>(color_values[index]);
              const float temperature = kelvin / 100.0f;
              float candidate_red = 255.0f;
              float candidate_green = 0.0f;
              float candidate_blue = 0.0f;

              if (temperature <= 66.0f) {
                candidate_green = 99.4708025861f * logf(temperature) - 161.1195681661f;
                if (temperature <= 19.0f) {
                  candidate_blue = 0.0f;
                } else {
                  candidate_blue = 138.5177312231f * logf(temperature - 10.0f) - 305.0447927307f;
                }
              } else {
                candidate_red = 329.698727446f * powf(temperature - 60.0f, -0.1332047592f);
                candidate_green = 288.1221695283f * powf(temperature - 60.0f, -0.0755148492f);
                candidate_blue = 255.0f;
              }

              const float distance =
                  powf(candidate_red - red, 2.0f) +
                  powf(candidate_green - green, 2.0f) +
                  powf(candidate_blue - blue, 2.0f);
              if (distance < best_distance) {
                best_distance = distance;
                best_index = index;
              }
            }

            id(light_4_color_temp) = color_values[best_index];
            if (id(light_source_index) == 3 &&
                (id(light_color_index) != best_index || id(light_color_temp) != color_values[best_index])) {
              id(light_color_index) = best_index;
              id(light_color_temp) = color_values[best_index];
              id(light_ui_dirty) = true;
            }
        - script.execute: refresh_light_ui_if_needed

