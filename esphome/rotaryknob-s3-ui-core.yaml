          const auto encoder_batch = ec1_pcnt::encoder.take();
          const uint32_t pulse_count = encoder_batch.pulse_count();
          if (pulse_count == 0) {
            return;
          }
          const int steps = encoder_batch.signed_steps();
          // EC1 has one pulse output per direction. A batch containing both
          // directions is electrically ambiguous and must not count as user
          // activity: otherwise common-mode input can wake or briefly boost a
          // dimmed screensaver even though no detent was turned.
          if (steps == 0) {
            return;
          }
          id(ui_last_activity_ms) = millis();
          if (id(display_charge_dimmed)) {
            id(restore_display_from_charge_dim).execute();
          }
