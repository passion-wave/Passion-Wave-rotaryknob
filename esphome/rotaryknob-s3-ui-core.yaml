          for (auto *label : morning_text) {
            lv_obj_set_style_text_color(label, lv_color_hex(morning_color), LV_PART_MAIN | LV_STATE_DEFAULT);
          }
          for (auto *label : evening_text) {
            lv_obj_set_style_text_color(label, lv_color_hex(evening_color), LV_PART_MAIN | LV_STATE_DEFAULT);
          }
          lv_label_set_text_fmt(weather_forecast_0_range_label, "%d/%d°", rounded_int(id(weather_forecast_min_0)), rounded_int(id(weather_forecast_max_0)));
          lv_label_set_text_fmt(weather_forecast_1_range_label, "%d/%d°", rounded_int(id(weather_forecast_min_1)), rounded_int(id(weather_forecast_max_1)));
          lv_label_set_text_fmt(weather_forecast_2_range_label, "%d/%d°", rounded_int(id(weather_forecast_min_2)), rounded_int(id(weather_forecast_max_2)));
          id(weather_detail_text) = id(weather_rain_eta_text);
          lv_label_set_text(weather_summary_label, id(weather_condition_text).c_str());
