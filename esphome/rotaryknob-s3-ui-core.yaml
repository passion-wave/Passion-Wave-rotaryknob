              total_playlists > id(media_picker_window_start) ? total_playlists - id(media_picker_window_start) : 0;
            if (visible_playlist_rows > playlist_capacity) visible_playlist_rows = playlist_capacity;
            const bool load_more_selected = id(playlist_has_more) && item_index >= visible_playlist_rows;
            if (load_more_selected &&
                id(pending_playlist_request_id).empty() &&
