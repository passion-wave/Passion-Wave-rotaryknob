    type: int
    restore_value: no
    initial_value: '0'
  - id: touch_swipe_handled
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: touch_swipe_started_sleeping
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: touch_swipe_nav_suppress_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
touchscreen:
  platform: cst816
  id: my_touchscreen
  touch_timeout: 70ms
  interrupt_pin:
    number: GPIO9
    allow_other_uses: true
  reset_pin: GPIO10
  on_touch:
    - lambda: |-
        id(touch_swipe_start_x) = touch.x;
        id(touch_swipe_start_y) = touch.y;
        id(touch_swipe_last_x) = touch.x;
        id(touch_swipe_last_y) = touch.y;
        id(touch_swipe_start_ms) = millis();
        id(touch_swipe_direction) = 0;
        id(touch_swipe_handled) = false;
        id(touch_swipe_started_sleeping) = id(display_sleeping);
        if (id(ui_next_enabled) && !id(display_sleeping) &&
            id(current_page) >= 20 && id(current_page) <= 24 &&
            !id(media_picker_visible)) {
          ui_next::framework.handle_navigation_touch(touch.x, touch.y);
        }
        if (id(display_charge_dimmed)) {
          id(restore_display_from_charge_dim).execute();
        }
  on_update:
    - lambda: |-
        if (touches.empty() || id(touch_swipe_handled) || id(touch_swipe_start_ms) == 0) {
          return;
        }
        const auto &tp = touches.front();
        id(touch_swipe_last_x) = tp.x;
        id(touch_swipe_last_y) = tp.y;
        const int dx = id(touch_swipe_last_x) - id(touch_swipe_start_x);
        const int dy = id(touch_swipe_last_y) - id(touch_swipe_start_y);
        const int abs_dx = abs(dx);
        const int abs_dy = abs(dy);
        const uint32_t dt = millis() - id(touch_swipe_start_ms);
        if (dt > 550) {
          return;
        }
        if (abs_dx >= 58 && abs_dx > abs_dy + 18) {
          id(touch_swipe_direction) = dx < 0 ? 1 : 2;
          id(handle_fast_touch_swipe).execute();
        } else if (abs_dy >= 68 && abs_dy > abs_dx + 18) {
          id(touch_swipe_direction) = dy > 0 ? 3 : 4;
          id(handle_fast_touch_swipe).execute();
        }
  on_release:
    - if:
        condition:
          lambda: 'return id(display_sleeping);'
        then:
          - script.execute: wake_display
    - if:
        condition: lvgl.is_paused
        then:
          - lvgl.resume:
          - lvgl.widget.redraw:
          - light.turn_on: display_backlight
    - lambda: |-
        if (id(touch_swipe_handled) ||
            id(touch_swipe_started_sleeping) ||
            id(touch_swipe_start_ms) == 0) {
          id(touch_swipe_start_ms) = 0;
          return;
        }
        const int dx = id(touch_swipe_last_x) - id(touch_swipe_start_x);
        const int dy = id(touch_swipe_last_y) - id(touch_swipe_start_y);
        const int abs_dx = abs(dx);
        const int abs_dy = abs(dy);
        const uint32_t dt = millis() - id(touch_swipe_start_ms);
        bool recognized_swipe = false;
        if (dt <= 620 && abs_dx >= 50 && abs_dx > abs_dy + 16) {
          recognized_swipe = true;
          id(touch_swipe_direction) = dx < 0 ? 1 : 2;
          id(handle_fast_touch_swipe).execute();
        } else if (dt <= 620 && abs_dy >= 62 && abs_dy > abs_dx + 16) {
          recognized_swipe = true;
          id(touch_swipe_direction) = dy > 0 ? 3 : 4;
          id(handle_fast_touch_swipe).execute();
        }
        if (!recognized_swipe && id(ui_next_enabled) &&
            id(current_page) >= 20 && id(current_page) <= 24 &&
            !id(media_picker_visible) &&
            millis() >= id(touch_swipe_nav_suppress_until_ms)) {
          ui_next::framework.handle_touch(id(touch_swipe_last_x), id(touch_swipe_last_y));
        }
        id(touch_swipe_start_ms) = 0;

