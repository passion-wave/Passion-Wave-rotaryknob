          else:
            - script.execute: show_light_page
  - id: select_media_mode
    mode: restart
    then:
      - script.execute: show_media_page
  - id: select_settings_mode
    mode: restart
    then:
      - lambda: |-
          id(control_mode) = 3;
          id(light_ui_dirty) = true;
          id(media_ui_dirty) = true;
      - script.execute: refresh_settings_ui
  - id: control_prev_action
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(control_mode) == 0;'
