packages:
  application: !include dual-mcu-esp32-core.yaml
  remove_public_ota:
    ota: !remove
  private_ota:
    ota:
      - platform: esphome
        id: ota_esphome
        password: !secret ota_password

# Private test-device wrapper. Factory builds include the core directly.
substitutions:
  # Must match the S3 target so feedback and commands use the same player.
  ha_player: "media_player.wohnzimmer_2"
  light_1_entity: "light.hue_color_lamp_1_3"
  light_2_entity: "light.ambiente"
  light_3_entity: "light.hue_color_lamp_1_2"
  light_4_entity: "light.passion_wave_light_4"
  # The classic ESP32 owns every HTTP asset download in the dual-MCU
  # architecture. Keep these substitutions here as well as in the S3 wrapper;
  # otherwise the bridge silently falls back to homeassistant.local and the
  # obsolete static floorplan path.
  ha_base_url: !secret home_assistant_base_url
  rain_radar_image_url: !secret rain_radar_image_url
  photo_image_url_0: !secret photo_image_url_0
  photo_image_url_1: !secret photo_image_url_1
  photo_image_url_2: !secret photo_image_url_2
  house_floorplan_image_url: !secret house_floorplan_image_url

mqtt:
  id: bridge_mqtt_client
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password

api:
  id: esp32_api
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "Passion Wave Dual MCU Fallback"
    password: !secret fallback_ap_password
